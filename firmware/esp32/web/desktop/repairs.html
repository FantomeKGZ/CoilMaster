<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ремонты — CoilMaster</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:22px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar a{padding:12px 16px;border-radius:9px;text-decoration:none;font-weight:bold}.primary{background:#1769aa;color:#fff}.secondary{background:#e7eef5;color:#17324b}.card{background:#fff;border-radius:14px;padding:20px}.item{padding:14px 0;border-bottom:1px solid #e4eaf0}.item:last-child{border:0}.muted{color:#687580}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f7ee;color:#17683a;font-size:13px;font-weight:bold}.status.closed{background:#e8edf2;color:#53606b}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px}.links a{padding:8px 10px;border-radius:8px;background:#e8f1f8;color:#105b91;text-decoration:none;font-weight:bold}.filter{max-width:260px;margin-bottom:14px}select,button{box-sizing:border-box;padding:10px;border:1px solid #cbd5df;border-radius:9px;font-size:15px}.preflight{margin-top:10px;padding:10px;border-radius:9px;background:#f3f7fa}.preflight.ready{background:#e8f7ee;color:#17683a}.preflight.blocked{background:#fff4d6;color:#7a4b00}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.controls button{border:0;color:#fff;font-weight:bold;background:#5b6874}.controls .close{background:#8b2d2d}.controls button:disabled{opacity:.45}.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}.pager button{border:0;background:#5b6874;color:#fff;font-weight:bold}.pager span{min-width:140px;text-align:center}@media(max-width:900px){.layout{display:block}aside{display:none}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/clients.html">Клиенты</a><a href="/desktop/motors.html">Двигатели</a><a href="/desktop/costing.html">Калькуляция</a></aside><main><h1>Ремонты</h1><div class="toolbar"><a class="primary" href="/desktop/repair-new.html">+ Новый ремонт</a><a class="secondary" href="/desktop/client-new.html">+ Новый клиент</a><a class="secondary" href="/desktop/motor-new.html">+ Новый двигатель</a></div><section class="card"><div class="filter"><label for="repairFilter"><b>Показывать</b></label><select id="repairFilter"><option value="OPEN">Открытые</option><option value="CLOSED">Закрытые</option><option value="ALL">Все</option></select></div><div id="items" class="muted">Загрузка…</div><div class="pager"><button id="prevPage" type="button" disabled>← Назад</button><span id="pageInfo" class="muted">Страница 1</span><button id="nextPage" type="button" disabled>Далее →</button></div></section></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dateLabel=v=>{if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('ru-RU')};if(params.get('motor_id')||params.get('client_id')){const q=new URLSearchParams();if(params.get('motor_id'))q.set('motor_id',params.get('motor_id'));if(params.get('client_id'))q.set('client_id',params.get('client_id'));location.replace('/desktop/repair-new.html?'+q)}const saved=localStorage.getItem('cm-repair-filter')||'OPEN';$('repairFilter').value=['OPEN','CLOSED','ALL'].includes(saved)?saved:'OPEN';let cursor=0,next=0,more=false,history=[],page=1;function closeError(e){const m={repair_has_unfinished_winding_job:'Намотка ещё не завершена или требует ручной проверки.',repair_finalization_wire_writeoff_required:'Требуется подтверждённое ручное списание провода.',repair_finalization_wire_writeoff_storage_unavailable:'Хранилище списаний временно недоступно.',repair_finalization_wire_writeoff_integrity_failed:'Намотка и списание провода не прошли проверку целостности.',repair_finalization_costing_storage_unavailable:'Недоступны данные калькуляции.',repair_finalization_winding_storage_unavailable:'Недоступна история намотки.',repair_finalization_costing_integrity_failed:'Калькуляция или списания не прошли проверку целостности.',repair_finalization_winding_integrity_failed:'История намотки не прошла проверку целостности.'};return m[e]||e||'unknown'}async function finalization(id,box,closeBtn,checkBtn){checkBtn.disabled=true;box.className='preflight';box.textContent='Проверка…';try{const r=await fetch('/api/repairs/finalization?repair_id='+encodeURIComponent(id),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'finalization_failed');const ready=j.ready_to_close===true;box.className='preflight '+(ready?'ready':'blocked');box.textContent=ready?'Ремонт готов к закрытию.':'Не готов: '+closeError(j.reason);closeBtn.disabled=!ready}catch(e){box.className='preflight blocked';box.textContent='Не готов: '+closeError(e.message);closeBtn.disabled=true}finally{checkBtn.disabled=false}}async function closeRepair(id){if(!confirm('Закрыть ремонт №'+id+'?'))return;const body=new URLSearchParams({repair_id:String(id),closed_at:new Date().toISOString(),confirmed:'true'});const r=await fetch('/api/repairs/close',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok){alert(closeError(j.error));return}load(cursor,false)}function render(items){$('items').innerHTML='';if(!items.length){$('items').textContent='Ремонты не найдены.';return}for(const x of items){const id=x.repair_id,status=x.current_status||x.status||'OPEN',closed=status==='CLOSED',d=document.createElement('div');d.className='item';d.innerHTML='<b>Ремонт №'+esc(id)+'</b> <span class="status'+(closed?' closed':'')+'">'+(closed?'Закрыт':'Открыт')+'</span><div class="muted">Клиент ID '+esc(x.client_id)+' · Двигатель ID '+esc(x.motor_id)+' · принят '+esc(dateLabel(x.received_at))+'</div>'+(x.complaint?'<div>Жалоба: '+esc(x.complaint)+'</div>':'')+'<div class="links"><a href="/desktop/client-details.html?client_id='+encodeURIComponent(x.client_id)+'">Клиент</a><a href="/desktop/motor-details.html?motor_id='+encodeURIComponent(x.motor_id)+'">Двигатель</a><a href="/desktop/winding-history.html?repair_id='+encodeURIComponent(id)+'">История намотки</a><a href="/desktop/costing.html?repair_id='+encodeURIComponent(id)+'">'+(closed?'Итог ремонта':'Калькуляция')+'</a>'+(closed?'':'<a href="/desktop/winding-job.html?repair_id='+encodeURIComponent(id)+'">Намотка</a><a href="/desktop/writeoff.html?repair_id='+encodeURIComponent(id)+'">Списание провода</a>')+'</div>';if(!closed){const box=document.createElement('div'),controls=document.createElement('div'),check=document.createElement('button'),close=document.createElement('button');box.className='preflight';box.textContent='Готовность к закрытию ещё не проверена.';controls.className='controls';check.textContent='Проверить готовность';close.textContent='Закрыть ремонт';close.className='close';close.disabled=true;check.onclick=()=>finalization(id,box,close,check);close.onclick=()=>closeRepair(id);controls.append(check,close);d.append(box,controls)}$('items').appendChild(d)}}function pager(n){$('prevPage').disabled=!history.length;$('nextPage').disabled=!more;$('pageInfo').textContent='Страница '+page+' · '+n+' записей'}async function load(c=0,reset=false){if(reset){history=[];page=1;c=0}$('items').textContent='Загрузка…';try{const q=new URLSearchParams({limit:'20'});if($('repairFilter').value!=='ALL')q.set('status',$('repairFilter').value);if(c)q.set('cursor',String(c));const r=await fetch('/api/repairs?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'repair_catalog_unavailable');cursor=c;more=j.has_more===true;next=more?Number(j.next_cursor):0;if(more&&(!Number.isInteger(next)||next<=cursor))throw new Error('invalid_paging_cursor');render(j.items||[]);pager((j.items||[]).length)}catch(e){$('items').textContent='Ошибка: '+(e.message||'unknown');$('prevPage').disabled=true;$('nextPage').disabled=true}}$('repairFilter').onchange=()=>{localStorage.setItem('cm-repair-filter',$('repairFilter').value);load(0,true)};$('prevPage').onclick=()=>{if(!history.length)return;const c=history.pop();page--;load(c,false)};$('nextPage').onclick=()=>{if(!more)return;history.push(cursor);page++;load(next,false)};load(0,true);</script></body></html>
