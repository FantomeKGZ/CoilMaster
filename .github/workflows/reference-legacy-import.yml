name: Reference Legacy Import Check

on:
  workflow_dispatch:
  push:
    branches:
      - cmp-protocol-v1
    paths:
      - tools/import_legacy_winding_reference.py
      - tools/check_legacy_winding_reference.py
      - firmware/esp32/web/**
      - .github/workflows/reference-legacy-import.yml

permissions:
  contents: read

jobs:
  build-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CoilMaster
        uses: actions/checkout@v4
        with:
          path: coilmaster

      - name: Checkout legacy reference source
        uses: actions/checkout@v4
        with:
          repository: FantomeKGZ/motor-winding-reference
          ref: main
          path: legacy

      - name: Build SD-ready web bundle
        shell: bash
        run: |
          set -euo pipefail
          desktop_src="$GITHUB_WORKSPACE/legacy/sourse/desktop/Справочник от 09.12.2024 HTML"
          mobile_src="$GITHUB_WORKSPACE/legacy/sourse/mobile/Справочник от 09.12.2024 для мобильных устройств HTML"
          web_bundle="$RUNNER_TEMP/coilmaster-web"
          output="$web_bundle/sites/reference"

          mkdir -p "$web_bundle"
          cp -a "$GITHUB_WORKSPACE/coilmaster/firmware/esp32/web/." "$web_bundle/"

          python3 "$GITHUB_WORKSPACE/coilmaster/tools/import_legacy_winding_reference.py" \
            --desktop-source "$desktop_src" \
            --mobile-source "$mobile_src" \
            --output "$output"

          python3 "$GITHUB_WORKSPACE/coilmaster/tools/check_legacy_winding_reference.py" \
            --desktop-source "$desktop_src" \
            --mobile-source "$mobile_src" \
            --output "$output"

          export WEB_BUNDLE="$web_bundle"
          export REFERENCE_OUTPUT="$output"
          export LEGACY_SHA="$(git -C "$GITHUB_WORKSPACE/legacy" rev-parse HEAD)"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ["REFERENCE_OUTPUT"])
          catalog = json.loads(
              (output / "shared" / "catalog.json").read_text(encoding="utf-8")
          )
          manifest = {
              "schema_version": 1,
              "coilmaster_commit": os.environ["GITHUB_SHA"],
              "coilmaster_branch": os.environ["GITHUB_REF_NAME"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "legacy_repository": "FantomeKGZ/motor-winding-reference",
              "legacy_commit": os.environ["LEGACY_SHA"],
              "reference_catalog_entries": len(catalog),
              "generated_utc": datetime.now(timezone.utc)
                  .replace(microsecond=0).isoformat().replace("+00:00", "Z"),
          }
          target = Path(os.environ["WEB_BUNDLE"]) / "web-bundle-manifest.json"
          target.write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
              newline="\n",
          )
          if manifest["reference_catalog_entries"] != 926:
              raise SystemExit("unexpected reference catalog size in web manifest")
          print(f"web bundle manifest: {target}")
          PY

      - name: Report generated footprint
        shell: bash
        run: |
          set -euo pipefail
          web_bundle="$RUNNER_TEMP/coilmaster-web"
          output="$web_bundle/sites/reference"

          echo "Reference footprint:"
          du -sh "$output"
          echo "Full /web bundle footprint:"
          du -sh "$web_bundle"
          echo "Reference files: $(find "$output" -type f | wc -l)"
          echo "Reference HTML: $(find "$output" -type f \( -iname '*.html' -o -iname '*.htm' \) | wc -l)"
          echo "Shared assets: $(find "$output/shared/assets" -type f 2>/dev/null | wc -l)"
          echo "Desktop unique assets: $(find "$output/desktop/assets" -type f 2>/dev/null | wc -l)"
          echo "Mobile unique assets: $(find "$output/mobile/assets" -type f 2>/dev/null | wc -l)"
          echo "Full /web files: $(find "$web_bundle" -type f | wc -l)"
          echo "Web bundle manifest:"
          cat "$web_bundle/web-bundle-manifest.json"

          {
            echo "## Legacy reference SD bundle"
            echo
            echo "- Reference size: $(du -sh "$output" | cut -f1)"
            echo "- Full /web bundle size: $(du -sh "$web_bundle" | cut -f1)"
            echo "- Reference files: $(find "$output" -type f | wc -l)"
            echo "- Reference HTML pages: $(find "$output" -type f \( -iname '*.html' -o -iname '*.htm' \) | wc -l)"
            echo "- Shared assets: $(find "$output/shared/assets" -type f 2>/dev/null | wc -l)"
            echo "- Desktop unique assets: $(find "$output/desktop/assets" -type f 2>/dev/null | wc -l)"
            echo "- Mobile unique assets: $(find "$output/mobile/assets" -type f 2>/dev/null | wc -l)"
            echo "- Full /web files: $(find "$web_bundle" -type f | wc -l)"
            echo
            echo "Artifact content is ready to copy as the microSD /web directory."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SD-ready web bundle
        uses: actions/upload-artifact@v4
        with:
          name: coilmaster-web-sd-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/coilmaster-web
          if-no-files-found: error
          retention-days: 14
