<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Материалы ремонта</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:24px;max-width:1200px}.grid{display:grid;grid-template-columns:420px 1fr;gap:14px}.card{background:#fff;border-radius:15px;padding:20px}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid #e5ebf0}@media(max-width:850px){.layout{display:block}aside{display:none}.grid{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/warehouse.html">Склад</a><a href="/desktop/costing.html">Калькуляция</a></aside><main><h1>Материалы ремонта</h1><div class="grid"><section class="card"><p>Ремонт: <b id="repairLabel">не выбран</b></p><form id="usageForm"><label>Материал</label><select id="material" required><option value="">Загрузка…</option></select><label>Количество</label><input id="quantity" placeholder="1,5" required><label>Комментарий</label><input id="comment"><button>Списать материал</button></form><p id="result" class="muted"></p></section><section class="card"><h2>Каталог материалов</h2><div id="list" class="muted">Загрузка…</div></section></div></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),repairId=p.get('repair_id')||localStorage.getItem('cm-active-repair')||'',units={PIECE:'шт',GRAM:'г',MILLILITRE:'мл',METRE:'м',SQUARE_METRE:'м²'};if(repairId){localStorage.setItem('cm-active-repair',repairId);$('repairLabel').textContent='№'+repairId}else $('result').textContent='Откройте страницу из карточки ремонта.';const shown=v=>(v/1000).toLocaleString('ru-RU',{maximumFractionDigits:3}),milli=v=>Math.round(Number(String(v).replace(',','.'))*1000);async function load(){try{const r=await fetch('/api/materials',{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');$('material').innerHTML='<option value="">Выберите материал</option>'+j.items.map(x=>'<option value="'+x.material_id+'">'+x.name+' · '+shown(x.stock_quantity_milli)+' '+(units[x.unit]||x.unit)+'</option>').join('');$('list').innerHTML=j.items.length?j.items.map(x=>'<div class="item"><div><b>'+x.name+'</b><div class="muted">'+(x.comment||'')+'</div></div><div><b>'+shown(x.stock_quantity_milli)+' '+(units[x.unit]||x.unit)+'</b><div class="muted">'+(x.price_per_unit_minor/100).toFixed(2)+' '+x.currency+'</div></div></div>').join(''):'Материалы ещё не добавлены.'}catch(e){$('result').className='bad';$('result').textContent=e.message}}$('usageForm').onsubmit=async e=>{e.preventDefault();if(!repairId){$('result').className='bad';$('result').textContent='Ремонт не выбран.';return}const q=milli($('quantity').value);if(!q){$('result').className='bad';$('result').textContent='Введите количество.';return}const body=new URLSearchParams({repair_id:repairId,material_id:$('material').value,quantity_milli:String(q),timestamp:new Date().toISOString(),comment:$('comment').value});try{const r=await fetch('/api/materials/usage',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');$('result').className='ok';$('result').textContent='Материал списан. Стоимость: '+(j.line_cost_minor/100).toFixed(2)+' '+j.currency+'.';$('usageForm').reset();load()}catch(err){$('result').className='bad';$('result').textContent='Ошибка: '+err.message}};load();</script></body></html>
