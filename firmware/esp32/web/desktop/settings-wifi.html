<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wi‑Fi — CoilMaster</title><style>:root{--bg:#edf2f6;--card:#fff;--text:#17212b;--muted:#687580;--blue:#1769aa;--red:#b42318;--green:#18864b;--orange:#8a5300}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial;color:var(--text)}main{max-width:1050px;margin:auto;padding:22px}.card{background:var(--card);border-radius:14px;padding:20px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #e7edf2}label{display:block;margin-top:12px;font-weight:bold}input,select,button{width:100%;padding:12px;margin-top:7px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{border:0;background:var(--blue);color:#fff;font-weight:bold}.secondary{background:#526879}.danger{background:var(--red)}.check{display:flex;gap:10px;align-items:center}.check input{width:auto}.profile{padding:14px 0;border-bottom:1px solid #e7edf2}.actions{display:flex;gap:8px}.actions button{width:auto}.muted{color:var(--muted)}.note{padding:12px;border-radius:9px;background:#f3f7fa;margin-top:12px}.ok{color:var(--green)}.bad{color:var(--red)}.warn{background:#fff1d8;color:var(--orange)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><p><a href="/desktop/settings.html">← Настройки</a></p><h1>Wi‑Fi и точка доступа</h1><section class="card"><h2>Текущее состояние</h2><div id="runtime" class="note">Загрузка…</div><button id="reconnect" class="secondary">Повторить подключение</button><div class="note warn">Сервисная точка CoilMaster остаётся доступной на <b>192.168.4.1</b>. Подключение к роутеру выполняется неблокирующе и не управляет намоткой.</div></section><div class="grid"><section class="card"><h2>Сохранённые сети</h2><div id="profiles" class="muted">Загрузка…</div></section><section class="card"><h2 id="formTitle">Добавить сеть</h2><form id="form"><input id="id" type="hidden"><label>SSID</label><input id="ssid" maxlength="32" required><label>Новый пароль</label><input id="password" type="password" maxlength="63" autocomplete="new-password" placeholder="8–63 символа"><label>Приоритет</label><select id="priority"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><label class="check"><input id="enabled" type="checkbox" checked> Профиль включён</label><label class="check"><input id="hidden" type="checkbox"> Скрытая сеть</label><button>Сохранить профиль</button><button id="cancel" type="button" class="secondary">Очистить форму</button></form><div id="result" class="note">Пароли не отображаются после сохранения.</div></section></div></main><script src="/shared/settings-wifi.js"></script><script>CMWifiPage.start('desktop')</script></body></html>
