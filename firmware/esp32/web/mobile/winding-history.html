<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>История намотки</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}.event{padding:12px 0;border-bottom:1px solid #e5ebf0}.muted{color:#687580}.ok{color:#137333}.warn{color:#9a6700}.note{background:#f3f7fa;padding:10px;border-radius:10px}.success{background:#e8f7ee;border:1px solid #82c99f}.warning{background:#fff4d6;border:1px solid #e0bc55}.row{display:flex;justify-content:space-between;gap:12px}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea;z-index:3}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px} .pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}.pager button{padding:10px 14px}.pager span{min-width:130px;text-align:center}</style></head><body><header><a id="back" href="/mobile/repairs.html">← Ремонты</a><b style="float:right">История намотки</b></header><main><section class="card"><h2 id="title">Ремонт</h2><div id="completion" class="note muted">Проверка завершённых прогонов…</div><div id="summary" class="note muted" style="margin-top:10px">Загрузка…</div></section><section class="card"><h2>События</h2><div id="items" class="muted">Загрузка…</div><div class="pager"><button id="prevPage" type="button" disabled>← Назад</button><span id="pageInfo" class="muted">Страница 1</span><button id="nextPage" type="button" disabled>Далее →</button></div></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),repair=p.get('repair_id')||localStorage.getItem('cm-active-repair')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(repair){$('title').textContent='Ремонт №'+repair;$('back').href='/mobile/repairs.html?repair_id='+encodeURIComponent(repair);localStorage.setItem('cm-active-repair',repair)}
let historyCursor=0,historyNextCursor=0,historyHasMore=false,historyStack=[],historyPage=1;
function renderCompletion(events){const completed=events.filter(x=>x.event==='RUN_COMPLETED'),latest=completed.length?completed[completed.length-1]:null;if(latest){$('completion').className='note success';$('completion').innerHTML='<b>На этой странице есть завершение</b><div>RUN_COMPLETED на странице: '+esc(completed.length)+'</div><div>Последняя показанная сессия '+esc(latest.session_id)+' · проход №'+esc(latest.run_id)+' · задание '+esc(latest.job_id)+'</div>'+(historyHasMore?'<div class="muted">В архиве есть следующие страницы.</div>':'')}else{$('completion').className='note';$('completion').innerHTML='<b>На этой странице RUN_COMPLETED нет</b><div class="muted">'+(historyHasMore?'Проверьте следующие страницы архива.':'Это последняя страница доступного архива.')+'</div>'}}
function renderEvents(events){$('items').innerHTML='';events.forEach(x=>{const d=document.createElement('div');d.className='event';const done=x.event==='RUN_COMPLETED';d.innerHTML='<div class="row"><b>'+(done?'Завершение':'Запуск')+' · проход №'+esc(x.run_id)+'</b><span class="'+(done?'ok':'warn')+'">'+esc(x.event)+'</span></div><div>Сессия '+esc(x.session_id)+' · задание '+esc(x.job_id)+'</div><div class="muted">Завершено проходов: '+esc(x.completed_runs)+' · motor_id '+esc(x.motor_id)+'</div>';$('items').appendChild(d)});if(!events.length)$('items').textContent='На этой странице событий нет.'}
function updatePager(count){$('prevPage').disabled=historyStack.length===0;$('nextPage').disabled=!historyHasMore;$('pageInfo').textContent='Страница '+historyPage+' · '+count+' событий'}
async function loadPage(cursor=historyCursor,reset=false){if(reset){historyStack=[];historyPage=1;cursor=0}$('items').textContent='Загрузка…';try{const r=await fetch('/api/winding-history?repair_id='+encodeURIComponent(repair)+'&cursor='+cursor+'&limit=20',{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'history_read_failed');historyCursor=cursor;historyHasMore=j.has_more===true;historyNextCursor=historyHasMore?Number(j.next_cursor):0;if(historyHasMore&&(!Number.isSafeInteger(historyNextCursor)||historyNextCursor<=historyCursor))throw new Error('invalid_history_cursor');const events=Array.isArray(j.events)?j.events:[];renderCompletion(events);renderEvents(events);$('summary').className='note muted';$('summary').textContent='Загружена одна страница архива · событий: '+events.length;updatePager(events.length)}catch(e){$('completion').className='note warning';$('completion').textContent='Итог намотки не подтверждён этой страницей.';$('summary').className='note warning';$('summary').textContent='Не удалось загрузить страницу: '+(e.message||'unknown');$('items').textContent='История недоступна.';$('prevPage').disabled=true;$('nextPage').disabled=true}}
$('prevPage').onclick=()=>{if(!historyStack.length)return;const cursor=historyStack.pop();historyPage=Math.max(1,historyPage-1);loadPage(cursor,false)};$('nextPage').onclick=()=>{if(!historyHasMore)return;historyStack.push(historyCursor);historyPage+=1;loadPage(historyNextCursor,false)};
async function init(){if(!/^[1-9]\d*$/.test(repair)){$('completion').textContent='Не указан корректный repair_id.';$('summary').textContent='История недоступна.';$('items').textContent='История недоступна.';return}try{const s=await fetch('/api/status',{cache:'no-store'}),j=await s.json();if(!s.ok||!j.winding_history_ready)throw new Error('winding_history_unavailable');await loadPage(0,true)}catch(e){$('completion').className='note warning';$('completion').textContent='Итог намотки сейчас нельзя подтвердить.';$('summary').textContent='API истории намотки сейчас недоступен.';$('items').textContent='Нет данных.'}}init();</script><script src="/shared/winding-history-spools.js"></script></body></html>
