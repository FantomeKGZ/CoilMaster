<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Каталог материалов</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:24px;max-width:1400px}.grid{display:grid;grid-template-columns:420px 1fr;gap:14px}.card{background:#fff;border-radius:15px;padding:20px;margin-bottom:14px}input,select,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.secondary{background:#e8eef4;color:#17212b}.item{display:grid;grid-template-columns:1fr 360px;gap:16px;padding:14px 0;border-bottom:1px solid #e4eaf0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e4eaf0;text-align:left}th{color:#687580}.num{text-align:right}@media(max-width:900px){.layout{display:block}aside{display:none}.grid,.item{grid-template-columns:1fr}} .pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}.pager button{width:auto;margin:0}.pager span{min-width:130px;text-align:center}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/warehouse.html">Склад провода</a><a href="/desktop/material-catalog.html">Материалы</a><a href="/desktop/costing.html">Калькуляция</a></aside><main><h1>Каталог дополнительных материалов</h1><div class="grid"><section class="card"><h2>Новый материал</h2><form id="create"><input name="name" placeholder="Название" required><select name="unit"><option value="PIECE">Штуки</option><option value="GRAM">Граммы</option><option value="MILLILITRE">Миллилитры</option><option value="METRE">Метры</option><option value="SQUARE_METRE">Квадратные метры</option></select><input name="stock" placeholder="Начальный остаток" required><input name="price" placeholder="Цена за единицу, сом" required><textarea name="comment" placeholder="Комментарий"></textarea><button>Добавить материал</button></form><p id="createResult" class="muted"></p></section><section class="card"><h2>Текущие запасы</h2><div id="items" class="muted">Загрузка…</div><div class="pager"><button id="prevPage" type="button" disabled>← Назад</button><span id="pageInfo" class="muted">Страница 1</span><button id="nextPage" type="button" disabled>Далее →</button></div></section></div><section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2 id="historyTitle">Последние изменения</h2><button id="allHistory" class="secondary" style="width:auto">Общая история</button></div><div style="overflow:auto"><table><thead><tr><th>Дата</th><th>Материал</th><th class="num">Пополнение</th><th class="num">Остаток</th><th class="num">Цена</th><th>Комментарий</th></tr></thead><tbody id="history"><tr><td colspan="6" class="muted">Загрузка…</td></tr></tbody></table></div><div class="pager"><button id="historyPrev" type="button" disabled>← Назад</button><span id="historyPageInfo" class="muted">История · страница 1</span><button id="historyNext" type="button" disabled>Далее →</button></div></section></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),num=v=>Number(String(v).replace(',','.')),units={PIECE:'шт',GRAM:'г',MILLILITRE:'мл',METRE:'м',SQUARE_METRE:'м²'},qty=v=>(v/1000).toLocaleString('ru-RU',{maximumFractionDigits:3}),money=v=>(v/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}),date=v=>new Date(v).toLocaleString('ru-RU');let names={};let historyMaterialId=0,historyCursor=0,historyNextCursor=0,historyHasMore=false,historyStack=[],historyPage=1;
function updateHistoryPager(count){$('historyPrev').disabled=historyStack.length===0;$('historyNext').disabled=!historyHasMore;$('historyPageInfo').textContent='История · страница '+historyPage+' · '+count+' записей'}
async function loadHistory(materialId=historyMaterialId,cursor=historyCursor,reset=false){if(reset||materialId!==historyMaterialId){historyMaterialId=materialId;historyStack=[];historyPage=1;cursor=0}$('historyTitle').textContent=historyMaterialId?'История материала №'+historyMaterialId:'Последние изменения';const q=new URLSearchParams({limit:'20'});if(historyMaterialId)q.set('material_id',String(historyMaterialId));if(cursor)q.set('cursor',String(cursor));const r=await fetch('/api/materials/adjustments?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok){$('history').innerHTML='<tr><td colspan="6" class="muted">'+(j.error||'Ошибка')+'</td></tr>';return}historyCursor=cursor;historyHasMore=j.has_more===true;historyNextCursor=historyHasMore?Number(j.next_cursor):0;if(historyHasMore&&(!Number.isInteger(historyNextCursor)||historyNextCursor<=historyCursor))throw new Error('invalid_history_cursor');$('history').innerHTML=j.items&&j.items.length?j.items.map(x=>'<tr><td>'+date(x.timestamp)+'</td><td><b>'+(names[x.material_id]||'Материал №'+x.material_id)+'</b></td><td class="num">'+qty(x.added_quantity_milli)+'</td><td class="num">'+qty(x.stock_before_milli)+' → '+qty(x.stock_after_milli)+'</td><td class="num">'+money(x.price_before_minor)+' → '+money(x.price_after_minor)+' '+x.currency_after+'</td><td>'+(x.comment||'—')+'</td></tr>').join(''):'<tr><td colspan="6" class="muted">История на этой странице пуста.</td></tr>';updateHistoryPager((j.items||[]).length)}

let materialCursor=0,materialNextCursor=0,materialHasMore=false,materialHistory=[],materialPage=1;function updateMaterialPager(count){$('prevPage').disabled=materialHistory.length===0;$('nextPage').disabled=!materialHasMore;$('pageInfo').textContent='Страница '+materialPage+' · '+count+' записей'}async function load(cursor=materialCursor,reset=false){if(reset){materialHistory=[];materialPage=1;cursor=0}const q=new URLSearchParams({limit:'20'});if(cursor)q.set('cursor',String(cursor));const r=await fetch('/api/materials?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok){$('items').textContent=j.error||'Ошибка';$('prevPage').disabled=true;$('nextPage').disabled=true;return}materialCursor=cursor;materialHasMore=j.has_more===true;materialNextCursor=materialHasMore?Number(j.next_cursor):0;if(materialHasMore&&(!Number.isInteger(materialNextCursor)||materialNextCursor<=materialCursor)){$('items').textContent='invalid_paging_cursor';return}names={};$('items').innerHTML='';j.items.forEach(x=>{names[x.material_id]=x.name;const d=document.createElement('div');d.className='item';d.innerHTML='<div><b>'+x.name+'</b><div class="muted">Остаток: '+qty(x.stock_quantity_milli)+' '+units[x.unit]+'<br>Цена: '+money(x.price_per_unit_minor)+' '+x.currency+'</div><button class="secondary showHistory">История позиции</button></div><div><div class="row"><input class="add" placeholder="Пополнение"><input class="price" placeholder="Новая цена"></div><input class="comment" placeholder="Причина изменения"><button class="save">Сохранить изменения</button><p class="msg muted"></p></div>';d.querySelector('.save').onclick=async()=>{const add=num(d.querySelector('.add').value||0),price=num(d.querySelector('.price').value||0),body=new URLSearchParams({material_id:x.material_id,add_quantity_milli:String(Math.round(add*1000)),new_price_per_unit_minor:String(Math.round(price*100)),currency:x.currency||'KGS',timestamp:new Date().toISOString(),comment:d.querySelector('.comment').value});const rr=await fetch('/api/materials/adjust',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),jj=await rr.json();d.querySelector('.msg').className=rr.ok?'ok':'bad';d.querySelector('.msg').textContent=rr.ok?'Изменения сохранены. Операция №'+jj.adjustment_id:jj.error||'Ошибка';if(rr.ok){await load();loadHistory(x.material_id,0,true)}};d.querySelector('.showHistory').onclick=()=>loadHistory(x.material_id);$('items').appendChild(d)});if(!j.items.length)$('items').textContent='Материалов на этой странице нет.';updateMaterialPager(j.items.length);loadHistory()}$('prevPage').onclick=()=>{if(!materialHistory.length)return;const cursor=materialHistory.pop();materialPage=Math.max(1,materialPage-1);load(cursor,false)};$('nextPage').onclick=()=>{if(!materialHasMore)return;materialHistory.push(materialCursor);materialPage+=1;load(materialNextCursor,false)};$('allHistory').onclick=()=>loadHistory(0,0,true);$('create').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),stock=num(f.get('stock')),price=num(f.get('price'));f.delete('stock');f.delete('price');f.set('stock_quantity_milli',String(Math.round(stock*1000)));f.set('price_per_unit_minor',String(Math.round(price*100)));f.set('currency','KGS');const r=await fetch('/api/materials',{method:'POST',body:f}),j=await r.json();$('createResult').className=r.ok?'ok':'bad';$('createResult').textContent=r.ok?'Материал №'+j.material_id+' добавлен.':j.error||'Ошибка';if(r.ok){e.target.reset();load(0,true)}};load(0,true);</script></body></html>
