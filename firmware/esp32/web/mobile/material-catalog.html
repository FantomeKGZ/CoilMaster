fo" class="muted">Страница 1</span><button id="nextPage" type="button" disabled>Далее →</button></div></section><section class="card"><h2 id="historyTitle">Последние изменения</h2><button id="allHistory" type="button">Показать общую историю</button><div id="history" class="muted">Загрузка…</div><div class="pager"><button id="historyPrev" type="button" disabled>← Назад</button><span id="historyPageInfo" class="muted">История · страница 1</span><button id="historyNext" type="button" disabled>Далее →</button></div></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),units={PIECE:'шт',GRAM:'г',MILLILITRE:'мл',METRE:'м',SQUARE_METRE:'м²'},qty=v=>(v/1000).toLocaleString('ru-RU',{maximumFractionDigits:3}),money=v=>(v/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}),date=v=>{try{return new Date(v).toLocaleString('ru-RU')}catch(_){return v}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let names={},hMat=0,hCursor=0,hNext=0,hMore=false,hStack=[],hPage=1;function hpager(n){$('historyPrev').disabled=!hStack.length;$('historyNext').disabled=!hMore;$('historyPageInfo').textContent='История · страница '+hPage+' · '+n+' записей'}async function loadHistory(materialId=hMat,cursor=hCursor,reset=false){if(reset||materialId!==hMat){hMat=materialId;hStack=[];hPage=1;cursor=0}$('historyTitle').textContent=hMat?'История материала №'+hMat:'Последние изменения';$('history').textContent='Загрузка…';const q=new URLSearchParams({limit:'20'});if(hMat)q.set('material_id',String(hMat));if(cursor)q.set('cursor',String(cursor));const r=await fetch('/api/materials/adjustments?'+q,{cache:'no-store'}),j=await r. +'</div><div class="actions"><a href="/mobile/material-edit.html?material_id='+encodeURIComponent(x.material_id)+'">Изменить</a><button type="button">История</button></div>';d.querySelector('button').onclick=()=>loadHistory(x.material_id,0,true);$('items').appendChild(d)}if(!(j.items||[]).length)$('items').textContent='Материалов нет.';pager((j.items||[]).length);loadHistory(hMat,0,true)}$('prevPage').onclick=()=>{if(!stack.length)return;const c=stack.pop();page--;load(c,false)};$('nextPage').onclick=()=>{if(!more)return;stack.push(cursor);page++;load(next,false)};load(0,true);</script></body></html>
