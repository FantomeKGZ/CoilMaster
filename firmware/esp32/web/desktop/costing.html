<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калькуляция ремонта</title><style>body{font-family:Arial,sans-serif;margin:0;background:#eef2f6;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:24px;max-width:1200px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border-radius:15px;padding:20px}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5df;border-radius:9px;font-size:16px;margin-top:8px}button{background:#1769aa;color:#fff;border:0;font-weight:700}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf1f4}.total{font-size:25px;font-weight:700}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions a{padding:11px 15px;border-radius:9px;background:#e8f1f8;color:#1769aa;text-decoration:none;font-weight:bold}@media(max-width:850px){.layout{display:block}aside{display:none}.grid{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/warehouse.html">Склад</a><a href="/desktop/costing.html">Калькуляция</a></aside><main><h1>Калькуляция ремонта</h1><section class="card"><label>Номер ремонта</label><input id="repairId" type="number" min="1"><button id="load">Загрузить</button><p id="message" class="muted"></p><div class="actions"><a id="wireLink" href="#">Списать провод</a><a id="materialsLink" href="#">Списать дополнительные материалы</a></div></section><div class="grid" style="margin-top:14px"><section class="card"><h2>Себестоимость</h2><div class="row"><span>Провод</span><b id="wire">0,00</b></div><div class="row"><span>Дополнительные материалы</span><b id="materials">0,00</b></div><div class="row"><span>Работа мастера</span><b id="labour">0,00</b></div><div class="row total"><span>Итого</span><span id="total">0,00</span></div></section><section class="card"><h2>Цена клиенту</h2><form id="pricing"><label>Стоимость работы, сом</label><input id="labourInput" value="0,00"><label>Конечная цена, сом</label><input id="clientInput" value="0,00"><button>Сохранить калькуляцию</button></form><div class="row"><span>Маржа</span><b id="margin">0,00</b></div></section></div></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),money=v=>(Number(v)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' сом',minor=id=>Math.round(Number($(id).value.replace(',','.'))*100),params=new URLSearchParams(location.search);$('repairId').value=params.get('repair_id')||localStorage.getItem('cm-active-repair')||'';function currentId(){const id=$('repairId').value;if(id){localStorage.setItem('cm-active-repair',id);$('wireLink').href='/desktop/writeoff.html?repair_id='+id;$('materialsLink').href='/desktop/materials.html?repair_id='+id}return id}async function load(){const id=currentId();if(!id){$('message').textContent='Выберите ремонт в реестре.';return}const r=await fetch('/api/repairs/costing?repair_id='+id,{cache:'no-store'}),j=await r.json();if(!r.ok){$('message').className='bad';$('message').textContent=j.error||'Ошибка';return}$('wire').textContent=money(j.wire_cost_minor);$('materials').textContent=money(j.material_cost_minor);$('labour').textContent=money(j.labour_cost_minor);$('total').textContent=money(j.total_cost_minor);$('margin').textContent=money(j.margin_minor);$('labourInput').value=(j.labour_cost_minor/100).toFixed(2).replace('.',',');$('clientInput').value=(j.client_price_minor/100).toFixed(2).replace('.',',');$('message').className='muted';$('message').textContent='Провод: '+j.wire_line_count+', материалы: '+j.material_line_count+'.'}$('load').onclick=load;$('repairId').onchange=load;$('pricing').onsubmit=async e=>{e.preventDefault();const id=currentId();if(!id)return;const body=new URLSearchParams({repair_id:id,labour_cost_minor:String(minor('labourInput')),client_price_minor:String(minor('clientInput')),currency:'KGS',timestamp:new Date().toISOString()});const r=await fetch('/api/repairs/costing',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();$('message').className=r.ok?'ok':'bad';$('message').textContent=r.ok?'Калькуляция сохранена.':j.error||'Ошибка';if(r.ok)load()};load();</script></body></html>
