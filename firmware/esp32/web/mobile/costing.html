<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калькуляция ремонта</title><style>body{font-family:Arial,sans-serif;margin:0;background:#eef2f6;color:#17212b}main{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}input,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #cbd5df;border-radius:10px;font-size:16px;margin-top:8px}button{background:#1769aa;color:#fff;border:0;font-weight:700}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf1f4}.total{font-size:23px;font-weight:700}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}.warning{background:#fff4d6;border:1px solid #e0bc55;padding:10px;border-radius:10px;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions a{display:block;padding:12px;border-radius:10px;background:#e8f1f8;text-align:center;color:#1769aa;text-decoration:none;font-weight:bold}.breakdown{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}.breakdown div{background:#f3f7fa;border-radius:10px;padding:10px}.breakdown b{display:block;margin-top:4px}</style></head><body><main><p><a href="/mobile/repairs.html">← Ремонты</a></p><h1>Калькуляция ремонта</h1><section class="card"><label>Номер ремонта</label><input id="repairId" type="number" min="1"><button id="load">Загрузить калькуляцию</button><p id="message" class="muted"></p><div class="actions"><a id="wireLink" href="#">Списать провод</a><a id="materialsLink" href="#">Списать материалы</a></div></section><section class="card"><h2>Себестоимость</h2><div class="row"><span>Провод</span><b id="wire">0,00</b></div><div id="wireBreakdown" class="breakdown"><div><span class="muted">Медь</span><b>—</b></div><div><span class="muted">Алюминий</span><b>—</b></div><div><span class="muted">Без материала</span><b>—</b></div></div><div id="wireSource" class="muted">Источник: —</div><div class="row"><span>Доп. материалы</span><b id="materials">0,00</b></div><div class="row"><span>Работа мастера</span><b id="labour">0,00</b></div><div class="row total"><span>Итого</span><span id="total">0,00</span></div></section><section class="card"><h2>Цена клиенту</h2><form id="pricing"><label>Стоимость работы, сом</label><input id="labourInput" value="0,00"><label>Конечная цена клиенту, сом</label><input id="clientInput" value="0,00"><button>Сохранить</button></form><div class="row"><span>Маржа</span><b id="margin">0,00</b></div></section></main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),money=v=>(Number(v)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' сом',kg=v=>(Number(v)/1000).toLocaleString('ru-RU',{minimumFractionDigits:3,maximumFractionDigits:3})+' кг',minor=id=>Math.round(Number($(id).value.replace(',','.'))*100),params=new URLSearchParams(location.search);$('repairId').value=params.get('repair_id')||localStorage.getItem('cm-active-repair')||'';function currentId(){const id=$('repairId').value;if(id){localStorage.setItem('cm-active-repair',id);$('wireLink').href='/mobile/writeoff.html?repair_id='+id;$('materialsLink').href='/mobile/materials.html?repair_id='+id}return id}function renderWireMaterials(j){const groups=j.wire_materials||{},cu=groups.CU||{},al=groups.AL||{},un=groups.UNKNOWN||{};$('wireBreakdown').innerHTML=`<div><span class="muted">Медь · ${cu.line_count||0} операций · ${kg(cu.consumed_g||0)}</span><b>${money(cu.cost_minor||0)}</b></div><div><span class="muted">Алюминий · ${al.line_count||0} операций · ${kg(al.consumed_g||0)}</span><b>${money(al.cost_minor||0)}</b></div><div><span class="muted">Без материала · ${un.line_count||0} операций · ${kg(un.consumed_g||0)}</span><b>${money(un.cost_minor||0)}</b></div>`;const valid=j.wire_materials_source==='CONFIRMED_WRITE_OFFS'&&j.wire_material_costs_match_wire_cost===true&&j.wire_material_counts_match_wire_count===true;$('wireSource').className=valid?'muted':'warning';$('wireSource').textContent=valid?'Источник разбивки: подтверждённые списания ESP32.':'Предупреждение: разбивка стоимости провода не согласована с общим итогом.'}async function load(){const id=currentId();if(!id){$('message').textContent='Выберите ремонт в реестре.';return}const r=await fetch('/api/repairs/costing?repair_id='+id,{cache:'no-store'}),j=await r.json();if(!r.ok){$('message').className='bad';$('message').textContent=j.error||'Ошибка';return}$('wire').textContent=money(j.wire_cost_minor);renderWireMaterials(j);$('materials').textContent=money(j.material_cost_minor);$('labour').textContent=money(j.labour_cost_minor);$('total').textContent=money(j.total_cost_minor);$('margin').textContent=money(j.margin_minor);$('labourInput').value=(j.labour_cost_minor/100).toFixed(2).replace('.',',');$('clientInput').value=(j.client_price_minor/100).toFixed(2).replace('.',',');$('message').className='muted';$('message').textContent='Провод: '+j.wire_line_count+', материалы: '+j.material_line_count+'.'}$('load').onclick=load;$('repairId').onchange=load;$('pricing').onsubmit=async e=>{e.preventDefault();const id=currentId();if(!id)return;const body=new URLSearchParams({repair_id:id,labour_cost_minor:String(minor('labourInput')),client_price_minor:String(minor('clientInput')),currency:'KGS',timestamp:new Date().toISOString()});const r=await fetch('/api/repairs/costing',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();$('message').className=r.ok?'ok':'bad';$('message').textContent=r.ok?'Калькуляция сохранена.':j.error||'Ошибка';if(r.ok)load()};load();</script></body></html>
