<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Настройки — CoilMaster</title><style>:root{--bg:#eef2f6;--card:#fff;--text:#17212b;--muted:#687580;--blue:#1769aa;--green:#18864b;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text);padding-bottom:24px}header{position:sticky;top:0;background:#142536;color:#fff;padding:14px 16px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #17212b14}.muted{color:var(--muted)}label{display:block;margin-top:12px;font-weight:bold}input,select,button{width:100%;min-height:48px;padding:12px;border-radius:10px;border:1px solid #cbd5df;font-size:17px;margin-top:7px}button{background:var(--blue);color:#fff;border:0;font-weight:bold}.note{padding:12px;border-radius:10px;background:#f3f7fa;margin-top:12px}.ok{color:var(--green)}.bad{color:var(--red)}.check{display:flex;align-items:center;gap:10px;margin-top:14px}.check input{width:auto;min-height:auto;margin:0}</style></head><body><header><a href="/mobile/">← CoilMaster</a><b style="float:right">⚙️ Настройки</b></header><main><section class="card"><h2>Склад</h2><p class="muted">Общая цена провода за 1 кг.</p><form id="priceForm"><label>Цена, сом/кг</label><input id="price" inputmode="decimal" placeholder="1250,00" required><label>Валюта</label><select id="currency"><option value="KGS">KGS — сом</option></select><button>Сохранить цену</button></form><div id="priceResult" class="note">Загрузка…</div></section><section class="card"><h2>Калькулятор Al ↔ Cu</h2><p class="muted">Эти параметры применяются автоматически при каждом расчёте.</p><form id="calcForm"><label>Коэффициент алюминий → медь, ‰</label><input id="alcu" type="number" min="100" max="3000" required><label>Коэффициент медь → алюминий, ‰</label><input id="cual" type="number" min="100" max="3000" required><label>Допустимое отклонение, ‰</label><input id="deviation" type="number" min="1" max="500" required><label>Максимум целевых жил</label><input id="maxStrands" type="number" min="1" max="8" required><label class="check"><input id="mixed" type="checkbox">Разрешить смешанные диаметры</label><button>Сохранить настройки калькулятора</button></form><div id="calcResult" class="note">Загрузка…</div></section><section class="card"><b>История расчётов</b><p class="muted">Цена при списании фиксируется в ремонте. Изменение общей цены не меняет старую себестоимость.</p></section></main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),fromMinor=v=>(v/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});async function loadPrice(){try{const r=await fetch('/api/warehouse/price',{cache:'no-store'}),j=await r.json();if(j.configured){$('price').value=fromMinor(j.price_per_kg_minor);$('currency').value=j.currency||'KGS';$('priceResult').textContent='Текущая цена: '+fromMinor(j.price_per_kg_minor)+' сом/кг'}else $('priceResult').textContent='Цена ещё не установлена.'}catch(e){$('priceResult').className='note bad';$('priceResult').textContent='Не удалось загрузить цену.'}}async function loadCalc(){try{const r=await fetch('/api/calculator/settings',{cache:'no-store'}),j=await r.json();$('alcu').value=j.aluminium_to_copper_permille;$('cual').value=j.copper_to_aluminium_permille;$('deviation').value=j.allowed_deviation_permille;$('maxStrands').value=j.max_target_strands;$('mixed').checked=!!j.allow_mixed_diameters;$('calcResult').textContent=j.configured?'Настройки загружены.':'Используются значения по умолчанию.'}catch(e){$('calcResult').className='note bad';$('calcResult').textContent='Не удалось загрузить настройки.'}}$('priceForm').onsubmit=async e=>{e.preventDefault();const value=Number($('price').value.replace(',','.').trim());if(!Number.isFinite(value)||value<=0){$('priceResult').className='note bad';$('priceResult').textContent='Введите корректную цену.';return}const body=new URLSearchParams({price_per_kg_minor:String(Math.round(value*100)),currency:$('currency').value});try{const r=await fetch('/api/warehouse/price',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok)throw new Error(j.error||'unknown');$('priceResult').className='note ok';$('priceResult').textContent='Цена сохранена.'}catch(err){$('priceResult').className='note bad';$('priceResult').textContent='Ошибка: '+err.message}};$('calcForm').onsubmit=async e=>{e.preventDefault();const body=new URLSearchParams({aluminium_to_copper_permille:$('alcu').value,copper_to_aluminium_permille:$('cual').value,allowed_deviation_permille:$('deviation').value,max_target_strands:$('maxStrands').value,allow_mixed_diameters:$('mixed').checked?'1':'0'});try{const r=await fetch('/api/calculator/settings',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok)throw new Error(j.error||'unknown');$('calcResult').className='note ok';$('calcResult').textContent='Настройки калькулятора сохранены.'}catch(err){$('calcResult').className='note bad';$('calcResult').textContent='Ошибка: '+err.message}};loadPrice();loadCalc();</script></body></html>
