<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Материалы ремонта</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:24px;max-width:1200px}.grid{display:grid;grid-template-columns:420px 1fr;gap:14px}.card{background:#fff;border-radius:15px;padding:20px}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}button:disabled,input:disabled,select:disabled{opacity:.55}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}.warning{background:#fff4d6;border:1px solid #e0bc55;padding:11px;border-radius:9px;margin-top:10px}.info{background:#f3f7fa;padding:11px;border-radius:9px;margin-top:10px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid #e5ebf0}@media(max-width:850px){.layout{display:block}aside{display:none}.grid{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/warehouse.html">Склад</a><a href="/desktop/costing.html">Калькуляция</a></aside><main><h1>Материалы ремонта</h1><div class="grid"><section class="card"><p>Ремонт: <b id="repairLabel">не выбран</b></p><div id="lifecycle" class="info muted">Проверка состояния ремонта…</div><form id="usageForm"><label>Материал</label><select id="material" required><option value="">Загрузка…</option></select><div id="materialInfo" class="info muted">Выберите материал.</div><label>Количество</label><input id="quantity" placeholder="1,5" required><label>Комментарий</label><input id="comment"><button id="submitButton">Списать материал</button></form><p id="result" class="muted"></p></section><section class="card"><h2>Каталог материалов</h2><div id="list" class="muted">Загрузка…</div></section></div></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),repairId=p.get('repair_id')||localStorage.getItem('cm-active-repair')||'',units={PIECE:'шт',GRAM:'г',MILLILITRE:'мл',METRE:'м',SQUARE_METRE:'м²'};if(repairId){localStorage.setItem('cm-active-repair',repairId);$('repairLabel').textContent='№'+repairId}else $('result').textContent='Откройте страницу из карточки ремонта.';const shown=v=>(Number(v)/1000).toLocaleString('ru-RU',{maximumFractionDigits:3}),money=v=>(Number(v)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' сом',milli=v=>Math.round(Number(String(v).replace(',','.'))*1000),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let materials=[],repairWritable=false;function setWritable(value,text){repairWritable=value;['material','quantity','comment','submitButton'].forEach(id=>$(id).disabled=!value);$('lifecycle').className=value?'info':'warning';$('lifecycle').textContent=text}async function loadLifecycle(){if(!repairId){setWritable(false,'Ремонт не выбран.');return}try{const r=await fetch('/api/repairs',{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'repairs_unavailable');const repair=(j.items||[]).find(x=>String(x.repair_id)===String(repairId));if(!repair)throw new Error('repair_not_found');const closed=(repair.current_status||repair.status)==='CLOSED';setWritable(!closed,closed?'Ремонт закрыт. Новые списания материалов запрещены. Каталог доступен только для просмотра.':'Ремонт открыт. Списание материалов разрешено.')}catch(e){setWritable(false,'Не удалось подтвердить состояние ремонта. Списание заблокировано.')}}function selectedMaterial(){return materials.find(x=>String(x.material_id)===$('material').value)}function updateMaterialInfo(){const x=selectedMaterial();if(!x){$('materialInfo').className='info muted';$('materialInfo').textContent='Выберите материал.';return}const unit=units[x.unit]||x.unit;$('materialInfo').className='info';$('materialInfo').textContent='Остаток '+shown(x.stock_quantity_milli)+' '+unit+' · цена '+money(x.price_per_unit_minor)+' за '+unit+'.'}async function load(){try{const r=await fetch('/api/materials',{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');materials=j.items||[];$('material').innerHTML='<option value="">Выберите материал</option>'+materials.map(x=>'<option value="'+x.material_id+'">'+esc(x.name)+' · '+shown(x.stock_quantity_milli)+' '+esc(units[x.unit]||x.unit)+'</option>').join('');$('list').innerHTML=materials.length?materials.map(x=>'<div class="item"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.comment||'')+'</div></div><div><b>'+shown(x.stock_quantity_milli)+' '+esc(units[x.unit]||x.unit)+'</b><div class="muted">'+money(x.price_per_unit_minor)+'</div></div></div>').join(''):'Материалы ещё не добавлены.';updateMaterialInfo();if(!repairWritable)$('material').disabled=true}catch(e){$('result').className='bad';$('result').textContent='Не удалось загрузить материалы: '+e.message}}$('material').onchange=updateMaterialInfo;$('usageForm').onsubmit=async e=>{e.preventDefault();if(!repairWritable){$('result').className='warning';$('result').textContent='Ремонт закрыт или его состояние не подтверждено. Списание запрещено.';return}if(!repairId){$('result').className='bad';$('result').textContent='Ремонт не выбран.';return}const material=selectedMaterial();if(!material){$('result').className='bad';$('result').textContent='Выберите материал.';return}const q=milli($('quantity').value);if(!Number.isFinite(q)||q<=0){$('result').className='bad';$('result').textContent='Введите положительное количество.';return}if(q>Number(material.stock_quantity_milli)){$('result').className='bad';$('result').textContent='Недостаточно материала. Доступно '+shown(material.stock_quantity_milli)+' '+(units[material.unit]||material.unit)+'.';return}const body=new URLSearchParams({repair_id:repairId,material_id:String(material.material_id),quantity_milli:String(q),timestamp:new Date().toISOString(),comment:$('comment').value});const button=$('submitButton');button.disabled=true;$('result').className='muted';$('result').textContent='Сохранение…';try{const r=await fetch('/api/materials/usage',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(r.status===409&&j.error==='repair_closed'){$('result').className='warning';$('result').textContent='Ремонт уже закрыт. Материал не списан.';await loadLifecycle();return}if(r.status===404&&j.error==='repair_not_found'){$('result').className='bad';$('result').textContent='Ремонт №'+repairId+' не найден. Списание не выполнено.';return}if(!r.ok)throw new Error(j.error||'Ошибка');const trusted=j.repair_reference_validated===true&&String(j.repair_id)===String(repairId)&&String(j.material_id)===String(material.material_id)&&Number(j.quantity_milli)===q&&j.line_cost_source==='PERSISTED_USAGE_SNAPSHOT'&&j.value_rounding==='NEAREST_MINOR_UNIT';if(!trusted){$('result').className='warning';$('result').textContent='Списание выполнено, но сервер не подтвердил все поля происхождения стоимости. Обновите калькуляцию и проверьте запись.';$('quantity').value='';$('comment').value='';await load();return}$('result').className='ok';$('result').textContent='Материал списан. Стоимость '+money(j.line_cost_minor)+'. Остаток '+shown(j.remaining_quantity_milli)+' '+(units[material.unit]||material.unit)+'. Цена и стоимость сохранены в снимке операции ESP32.';$('quantity').value='';$('comment').value='';await load()}catch(err){$('result').className='bad';$('result').textContent='Ошибка: '+err.message}finally{button.disabled=!repairWritable}};(async()=>{await loadLifecycle();await load()})();</script></body></html>
