<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Новый материал — CoilMaster</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px}input,select,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}</style></head><body><header><a href="/mobile/material-catalog.html">← Материалы</a><b style="float:right">➕ Новый материал</b></header><main><section class="card"><form id="form"><input name="name" placeholder="Название" required><select name="unit"><option value="PIECE">Штуки</option><option value="GRAM">Граммы</option><option value="MILLILITRE">Миллилитры</option><option value="METRE">Метры</option><option value="SQUARE_METRE">Квадратные метры</option></select><input name="stock" inputmode="decimal" placeholder="Начальный остаток" required><input name="price" inputmode="decimal" placeholder="Цена за единицу, сом" required><textarea name="comment" placeholder="Комментарий"></textarea><button id="saveBtn">Добавить материал</button></form><p id="result" class="muted"></p></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),num=v=>Number(String(v).replace(',','.'));let sending=false;$('form').onsubmit=async e=>{e.preventDefault();if(sending)return;const f=new FormData(e.target),stock=num(f.get('stock')),price=num(f.get('price'));if(!Number.isFinite(stock)||stock<0||!Number.isFinite(price)||price<0){$('result').className='bad';$('result').textContent='Проверьте остаток и цену.';return}sending=true;$('saveBtn').disabled=true;$('result').className='muted';$('result').textContent='Сохранение…';f.delete('stock');f.delete('price');f.set('stock_quantity_milli',String(Math.round(stock*1000)));f.set('price_per_unit_minor',String(Math.round(price*100)));f.set('currency','KGS');try{const r=await fetch('/api/materials',{method:'POST',body:f}),j=await r.json();if(!r.ok)throw new Error(j.error||'material_create_failed');if(!j.material_id)throw new Error('material_id_missing');$('result').className='ok';$('result').textContent='Материал №'+j.material_id+' добавлен.';location.href='/mobile/material-catalog.html'}catch(err){$('result').className='bad';$('result').textContent=err.message||'Ошибка'}finally{sending=false;$('saveBtn').disabled=false}};</script></body></html>
