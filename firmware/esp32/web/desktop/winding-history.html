<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>История намотки</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:22px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px}.event{padding:14px 0;border-bottom:1px solid #e4eaf0}.muted{color:#687580}.ok{color:#137333}.warn{color:#9a6700}.note{background:#f3f7fa;padding:11px;border-radius:9px}.row{display:flex;justify-content:space-between;gap:16px}@media(max-width:900px){.layout{display:block}aside{display:none}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/clients.html">Клиенты</a><a href="/desktop/motors.html">Двигатели</a><a href="/desktop/costing.html">Калькуляция</a></aside><main><h1 id="title">История намотки</h1><section class="card"><div id="summary" class="note muted">Загрузка…</div></section><section class="card"><h2>События</h2><div id="items" class="muted">Загрузка…</div></section></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),repair=p.get('repair_id')||localStorage.getItem('cm-active-repair')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(repair){$('title').textContent='История намотки · ремонт №'+repair;localStorage.setItem('cm-active-repair',repair)}async function load(){if(!/^[1-9]\d*$/.test(repair)){$('summary').textContent='Не указан корректный repair_id.';$('items').textContent='История недоступна.';return}try{const s=await fetch('/api/status',{cache:'no-store'}),sj=await s.json();if(!sj.winding_history_ready){$('summary').textContent='API истории намотки сейчас недоступен.';$('items').textContent='Нет данных.';return}const r=await fetch('/api/winding-history?repair_id='+encodeURIComponent(repair)+'&limit=100',{cache:'no-store'}),j=await r.json();if(!r.ok){$('summary').textContent='Ошибка: '+(j.error||'unknown');$('items').textContent='История не загружена.';return}$('summary').textContent='Найдено событий: '+j.count;$('items').innerHTML='';(j.events||[]).forEach(x=>{const d=document.createElement('div');d.className='event';const done=x.event==='RUN_COMPLETED';d.innerHTML='<div class="row"><b>'+(done?'Завершение':'Запуск')+' · проход №'+esc(x.run_id)+'</b><span class="'+(done?'ok':'warn')+'">'+esc(x.event)+'</span></div><div>Сессия '+esc(x.session_id)+' · задание '+esc(x.job_id)+'</div><div class="muted">Завершено проходов: '+esc(x.completed_runs)+' · motor_id '+esc(x.motor_id)+'</div>';$('items').appendChild(d)});if(!(j.events||[]).length)$('items').textContent='По этому ремонту записей намотки пока нет.'}catch(e){$('summary').textContent='Нет связи с ESP32.';$('items').textContent='История не загружена.'}}load();</script></body></html>
