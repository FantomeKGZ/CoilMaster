<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wi‑Fi — CoilMaster</title><style>:root{--bg:#eef2f6;--card:#fff;--text:#17212b;--muted:#687580;--blue:#1769aa;--red:#b42318;--green:#18864b;--orange:#8a5300}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial;color:var(--text);padding-bottom:25px}header{background:#142536;color:#fff;padding:15px 16px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:var(--card);border-radius:15px;padding:16px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #e7edf2}label{display:block;margin-top:12px;font-weight:bold}input,select,button{width:100%;min-height:48px;padding:12px;margin-top:7px;border:1px solid #cbd5df;border-radius:10px;font-size:17px}button{border:0;background:var(--blue);color:#fff;font-weight:bold}.secondary{background:#526879}.danger{background:var(--red)}.check{display:flex;gap:10px;align-items:center}.check input{width:auto;min-height:auto}.profile{padding:13px 0;border-bottom:1px solid #e7edf2}.actions{display:flex;gap:7px}.actions button{font-size:14px}.muted{color:var(--muted)}.note{padding:12px;border-radius:10px;background:#f3f7fa;margin-top:10px}.ok{color:var(--green)}.bad{color:var(--red)}.warn{background:#fff1d8;color:var(--orange)}</style></head><body><header><a href="/mobile/settings.html">← Настройки</a><b style="float:right">📶 Wi‑Fi</b></header><main><section class="card"><h2>Состояние</h2><div id="runtime" class="note">Загрузка…</div><button id="reconnect" class="secondary">Повторить подключение</button><div class="note warn">Точка CoilMaster остаётся на <b>192.168.4.1</b>. Сеть не управляет START или SSR.</div></section><section class="card"><h2>Сети</h2><div id="profiles" class="muted">Загрузка…</div></section><section class="card"><h2 id="formTitle">Добавить сеть</h2><form id="form"><input id="id" type="hidden"><label>SSID</label><input id="ssid" maxlength="32" required><label>Новый пароль</label><input id="password" type="password" maxlength="63" autocomplete="new-password" placeholder="8–63 символа"><label>Приоритет</label><select id="priority"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><label class="check"><input id="enabled" type="checkbox" checked> Профиль включён</label><label class="check"><input id="hidden" type="checkbox"> Скрытая сеть</label><button>Сохранить</button><button id="cancel" type="button" class="secondary">Очистить</button></form><div id="result" class="note">Пароль после сохранения скрывается.</div></section></main><script src="/shared/settings-wifi.js"></script><script>CMWifiPage.start('mobile')</script></body></html>
