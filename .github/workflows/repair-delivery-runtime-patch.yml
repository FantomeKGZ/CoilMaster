name: One-shot repair delivery runtime patch

on:
  push:
    branches:
      - cmp-protocol-v1
    paths:
      - ".github/workflows/repair-delivery-runtime-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
          fetch-depth: 0
      - name: Guard and patch repair delivery runtime
        shell: bash
        run: |
          set -euo pipefail
          FILE=firmware/esp32/src/CM_RepairRegistryWeb.cpp
          EXPECTED=c4a42a8a75de7d959415b89beb3f2daba31a75f8
          ACTUAL=$(git hash-object "$FILE")
          test "$ACTUAL" = "$EXPECTED" || { echo "blob changed: $ACTUAL"; exit 1; }
          python3 -c "from pathlib import Path; p=Path('$FILE'); s=p.read_text(); a='#include \"CM_RepairRegistryLookupWeb.h\"\n'; b=a+'#include \"CM_RepairDeliveryStore.h\"\n#include \"CM_RepairDeliveryWeb.h\"\n'; assert a in s and 'CM_RepairDeliveryWeb.h' not in s; s=s.replace(a,b,1); a='    static RepairIntakeCoordinator repairIntake(SD, m_registry);\n'; b=a+'    static RepairDeliveryStore deliveryStore(SD);\n    static RepairDeliveryWeb deliveryWeb(m_server, m_registry, deliveryStore);\n'; assert a in s and 'static RepairDeliveryStore' not in s; s=s.replace(a,b,1); a='    beginMaterialRequestRuntime(m_server, m_registry);\n'; b=a+'    if (deliveryStore.begin()) deliveryWeb.begin();\n'; assert a in s; p.write_text(s.replace(a,b,1))"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'feat(crm): register repair delivery runtime API'
          git push origin HEAD:cmp-protocol-v1
