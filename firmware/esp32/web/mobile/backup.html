<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Резервная копия</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}.item{padding:12px 0;border-bottom:1px solid #e5ebf0}.item:last-child{border:0}.muted{color:#687580}.ok{color:#17683a}.bad{color:#b42318}.links a{display:inline-block;margin:8px 10px 0 0;padding:8px 10px;border-radius:9px;background:#1769aa;color:#fff;text-decoration:none;font-weight:bold}button{box-sizing:border-box;padding:11px 13px;margin:8px 8px 0 0;border:0;border-radius:10px;background:#1769aa;color:#fff;font-weight:bold}button:disabled{background:#9aa7b1}.warning{background:#fff4d6;border:1px solid #e0bc55;padding:10px;border-radius:10px}</style></head><body><header><a href="/mobile/more.html">← Разделы</a><b style="float:right">💾 Резервная копия</b></header><main><section class="card"><h2>Экспорт данных</h2><div class="warning">Только чтение. Эта страница не восстанавливает, не удаляет и не изменяет данные на microSD.</div><p id="state" class="muted">Загрузка manifest…</p></section><section class="card"><h2>Основные файлы</h2><div id="files" class="muted">Загрузка…</div></section><section class="card"><h2>Сессии намотки</h2><p class="muted">Immutable snapshot и последнее persisted runtime-state каждой сессии.</p><div id="sessions" class="muted">Загрузка…</div><button id="prev" disabled>← Назад</button><button id="next" disabled>Следующие →</button></section></main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sizeLabel=n=>{const v=Number(n)||0;if(v<1024)return v+' Б';if(v<1048576)return(v/1024).toFixed(1)+' КБ';return(v/1048576).toFixed(1)+' МБ'};let after=0,previous=[],hasMore=false,nextAfter=0;async function loadManifest(){try{const r=await fetch('/api/backup/manifest',{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'backup_manifest_unavailable');$('files').innerHTML='';(j.items||[]).forEach(x=>{const d=document.createElement('div');d.className='item';d.innerHTML='<b>'+esc(x.download_name||x.name)+'</b><div class="muted">'+(x.exists?sizeLabel(x.size_bytes):'Файл ещё не создан')+'</div>'+(x.exists?'<div class="links"><a href="/api/backup/file?name='+encodeURIComponent(x.name)+'">Скачать</a></div>':'');$('files').appendChild(d)});if(!(j.items||[]).length)$('files').textContent='Экспортируемых файлов пока нет.';$('state').className='ok';$('state').textContent='Read-only manifest загружен. Произвольные пути запрещены сервером.'}catch(e){$('state').className='bad';$('state').textContent='Экспорт недоступен: '+(e.message||'unknown');$('files').textContent='Нет подтверждённых данных.'}}async function loadSessions(){try{$('sessions').textContent='Загрузка…';const r=await fetch('/api/backup/sessions?after_session_id='+encodeURIComponent(after)+'&limit=20',{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'backup_sessions_unavailable');$('sessions').innerHTML='';(j.items||[]).forEach(x=>{const d=document.createElement('div');d.className='item';let links='';if(x.snapshot_exists)links+='<a href="/api/backup/session-file?kind=snapshot&session_id='+encodeURIComponent(x.session_id)+'">Snapshot</a>';if(x.state_exists)links+='<a href="/api/backup/session-file?kind=state&session_id='+encodeURIComponent(x.session_id)+'">Runtime state</a>';d.innerHTML='<b>Сессия №'+esc(x.session_id)+'</b><div class="muted">Snapshot: '+(x.snapshot_exists?sizeLabel(x.snapshot_size_bytes):'нет')+' · State: '+(x.state_exists?sizeLabel(x.state_size_bytes):'нет')+'</div>'+(links?'<div class="links">'+links+'</div>':'<div class="bad">Файлы сессии отсутствуют.</div>');$('sessions').appendChild(d)});if(!(j.items||[]).length)$('sessions').textContent=after?'Следующих сессий нет.':'Сессий пока нет.';hasMore=j.has_more===true;nextAfter=Number(j.next_after_session_id)||after;$('next').disabled=!hasMore;$('prev').disabled=previous.length===0}catch(e){$('sessions').innerHTML='<div class="bad">Список сессий недоступен: '+esc(e.message||'unknown')+'</div>';$('next').disabled=true;$('prev').disabled=previous.length===0}}$('next').onclick=()=>{if(!hasMore)return;previous.push(after);after=nextAfter;loadSessions()};$('prev').onclick=()=>{if(!previous.length)return;after=previous.pop();loadSessions()};loadManifest();loadSessions();</script></body></html>
