<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ремонты</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}input,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.item{padding:12px 0;border-bottom:1px solid #e5ebf0}.muted{color:#687580}.links a{display:inline-block;margin:8px 10px 0 0}</style></head><body><header><a href="/mobile/more.html">← Ещё</a><b style="float:right">🧰 Ремонты</b></header><main><section class="card"><h2>Новый ремонт</h2><form id="form"><input id="clientId" name="client_id" type="number" min="1" placeholder="ID клиента" required><input name="motor_name" placeholder="Название двигателя" required><input id="received" name="received_at" type="datetime-local" required><textarea name="complaint" placeholder="Жалоба клиента"></textarea><textarea name="comment" placeholder="Комментарий"></textarea><button>Создать ремонт</button></form><p id="result" class="muted"></p></section><section class="card"><h2>Ремонты</h2><div id="items" class="muted">Загрузка…</div></section></main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),fixedClient=params.get('client_id')||'';$('clientId').value=fixedClient;$('received').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);function selectRepair(id){localStorage.setItem('cm-active-repair',String(id))}async function load(){const q=fixedClient?'?client_id='+fixedClient:'';const r=await fetch('/api/repairs'+q,{cache:'no-store'}),j=await r.json();$('items').innerHTML='';j.items.forEach(x=>{const d=document.createElement('div');d.className='item';d.innerHTML='<b>Ремонт №'+x.repair_id+' — '+x.motor_name+'</b><div>Клиент ID: '+x.client_id+'</div><div class="muted">'+x.status+' · '+x.received_at+'</div><div class="links"><a data-id="'+x.repair_id+'" href="/mobile/costing.html?repair_id='+x.repair_id+'">Калькуляция</a><a data-id="'+x.repair_id+'" href="/mobile/writeoff.html?repair_id='+x.repair_id+'">Списание провода</a></div>';d.querySelectorAll('a[data-id]').forEach(a=>a.onclick=()=>selectRepair(a.dataset.id));$('items').appendChild(d)});if(!j.items.length)$('items').textContent='Ремонтов пока нет.'}$('form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);fd.set('received_at',new Date($('received').value).toISOString());const r=await fetch('/api/repairs',{method:'POST',body:fd}),j=await r.json();if(r.ok){selectRepair(j.repair_id);location.href='/mobile/costing.html?repair_id='+j.repair_id}else $('result').textContent=j.error||'Ошибка'};load();</script></body></html>
