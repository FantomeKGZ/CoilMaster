<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Автономные намотки Arduino</title><style>:root{--bg:#eef2f6;--card:#fff;--text:#17212b;--muted:#687580;--blue:#1769aa;--green:#18864b;--orange:#8a5300;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text);padding-bottom:82px}header{position:sticky;top:0;background:#142536;color:#fff;padding:14px 16px;z-index:2}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}.task{border:1px solid #dce5ec;border-radius:12px;padding:13px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #edf1f4}.row:last-child{border:0}.muted{color:var(--muted)}.program{font-size:22px;font-weight:bold}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8eef4;font-size:12px;margin-right:6px}.ok{background:#e8f7ee;color:#17683a}.warn{background:#fff1d8;color:#7a4b00}.note{padding:11px;border-radius:10px;background:#f3f7fa;margin-top:10px}input,select,button{width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:var(--blue);color:#fff;border:0;font-weight:bold}.secondary{background:#e8f1f8;color:#105b91}.assign{background:#18864b}.matches{margin-top:10px;padding-top:10px;border-top:1px dashed #cfd8df}.motor{padding:10px;border-radius:10px;background:#f5f8fa;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 110px;gap:8px}.create{margin-top:12px;padding-top:12px;border-top:1px dashed #cfd8df}.links a{display:inline-block;margin:8px 10px 0 0;color:#105b91;font-weight:bold;text-decoration:none}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea;z-index:3}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}</style></head><body><header><a href="/mobile/more.html">← Ещё</a><b style="float:right">🔌 Arduino</b></header><main><section class="card"><h2>Автономные намотки Arduino</h2><p class="muted">Здесь отображаются завершённые намотки, которые были введены и выполнены непосредственно на Arduino без задания ESP32.</p><div class="grid"><input id="program" placeholder="Программа, например 140/100/80/40"><input id="tolerance" type="number" min="0" max="50" value="20"></div><button id="search">Поиск по программе ± %</button><button id="all" class="secondary">Показать все</button><div id="state" class="note">Загрузка архива…</div></section><section class="card"><h2>Список выполненных задач</h2><div id="items" class="muted">Загрузка…</div></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let motors=[];let tasks=[];function parseProgram(p){const a=String(p||'').trim().split(/[\/,;]/).map(Number);return a.length&&a.every(x=>Number.isInteger(x)&&x>0)?a:null}function within(candidate,query,tol){const a=parseProgram(candidate),b=parseProgram(query);if(!a||!b||a.length!==b.length)return false;return a.every((v,i)=>Math.abs(v-b[i])*100<=b[i]*tol)}function motorLabel(m){return(m.name||'Двигатель №'+m.motor_id)+(m.model?' · '+m.model:'')+(m.manufacturer?' · '+m.manufacturer:'')+' · '+m.coil_program}async function loadMotors(){const r=await fetch('/api/motors',{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'motors_unavailable');motors=j.items||[]}function matchingMotors(program,tol){return motors.filter(m=>within(m.coil_program,program,tol))}async function assign(task,motorId,role){const body=new URLSearchParams({session_id:String(task.session_id),run_id:String(task.run_id),motor_id:String(motorId),role,confirmed:'true'}),r=await fetch('/api/autonomous-windings/assign',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok)throw new Error(j.error||'assignment_failed');await load()}async function createMotor(task,box){const name=box.querySelector('.new-name').value.trim();if(!name){alert('Введите название двигателя.');return}const body=new URLSearchParams({name,model:box.querySelector('.new-model').value,manufacturer:box.querySelector('.new-maker').value,tags:box.querySelector('.new-tags').value,coil_program:task.program,comment:'Создан из автономной намотки Arduino: session '+task.session_id+', run '+task.run_id}),r=await fetch('/api/motors',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok)throw new Error(j.error||'motor_create_failed');await assign(task,j.motor_id,box.querySelector('.new-role').value)}function render(){const tol=Math.max(0,Math.min(50,Number($('tolerance').value)||20));$('items').innerHTML='';tasks.forEach(task=>{const d=document.createElement('div');d.className='task';const assigned=task.assigned_motor_id?motors.find(m=>Number(m.motor_id)===Number(task.assigned_motor_id)):null;const matches=matchingMotors(task.program,tol);d.innerHTML='<div class="program">'+esc(task.program)+'</div><div><span class="badge">'+esc(task.winding_type)+'</span><span class="badge ok">RUN_COMPLETED</span></div><div class="row"><span class="muted">Arduino session / run</span><b>'+task.session_id+' / '+task.run_id+'</b></div><div class="row"><span class="muted">Число катушек</span><b>'+task.coil_count+'</b></div><div class="row"><span class="muted">Завершений</span><b>'+task.completed_runs+'</b></div>'+(assigned?'<div class="note ok">Привязано: <b>'+esc(motorLabel(assigned))+'</b><br>Роль: '+esc(task.assignment_role||'—')+'<div class="links"><a href="/mobile/repairs.html?motor_id='+assigned.motor_id+'">Использовать этот двигатель в ремонте</a></div></div>':'<div class="note warn">Пока не привязано к двигателю.</div>')+'<button class="secondary show-matches">Найти похожие двигатели ±'+tol+'%</button><div class="matches" hidden></div><div class="create"><b>Создать новый двигатель из этой намотки</b><input class="new-name" placeholder="Название двигателя"><input class="new-model" placeholder="Модель"><input class="new-maker" placeholder="Производитель"><input class="new-tags" placeholder="Теги"><select class="new-role"><option value="WORKING">Рабочая обмотка</option><option value="STARTING">Пусковая обмотка</option><option value="AUXILIARY">Дополнительная</option></select><button class="assign create-motor">Создать и привязать</button></div>';const matchBox=d.querySelector('.matches');d.querySelector('.show-matches').onclick=()=>{matchBox.hidden=!matchBox.hidden;if(matchBox.hidden)return;matchBox.innerHTML=matches.length?'<b>Найдено двигателей: '+matches.length+'</b>':'';matches.forEach(m=>{const x=document.createElement('div');x.className='motor';x.innerHTML='<b>'+esc(motorLabel(m))+'</b><select><option value="WORKING">Как рабочую</option><option value="STARTING">Как пусковую</option><option value="AUXILIARY">Как дополнительную</option></select><button class="assign">Привязать к этому двигателю</button><div class="links"><a href="/mobile/repairs.html?motor_id='+m.motor_id+'">Использовать двигатель</a></div>';x.querySelector('button').onclick=async()=>{try{await assign(task,m.motor_id,x.querySelector('select').value)}catch(e){alert(e.message)}};matchBox.appendChild(x)});if(!matches.length)matchBox.innerHTML='<div class="note">Похожих двигателей в пределах ±'+tol+'% не найдено.</div>'};d.querySelector('.create-motor').onclick=async()=>{try{await createMotor(task,d)}catch(e){alert(e.message)}};$('items').appendChild(d)});if(!tasks.length)$('items').textContent='Подходящих завершённых автономных намоток пока нет.'}async function load(){try{const program=$('program').value.trim(),tol=Math.max(0,Math.min(50,Number($('tolerance').value)||20)),q=new URLSearchParams({tolerance_percent:String(tol)});if(program)q.set('program',program);$('state').textContent='Загрузка…';await loadMotors();const r=await fetch('/api/autonomous-windings?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'archive_unavailable');tasks=j.items||[];$('state').className='note ok';$('state').textContent=program?'Найдено '+tasks.length+' завершённых намоток по программе '+program+' с допуском ±'+tol+'%.':'В архиве '+tasks.length+' завершённых автономных намоток.';render()}catch(e){$('state').className='note warn';$('state').textContent='Ошибка: '+e.message;$('items').textContent='Архив недоступен.'}}$('search').onclick=load;$('all').onclick=()=>{$('program').value='';load()};load();</script></body></html>
