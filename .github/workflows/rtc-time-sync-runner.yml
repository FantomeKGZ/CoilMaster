name: RTC time sync runner

on:
  push:
    branches: [cmp-protocol-v1]
    paths:
      - tools/rtc_time_sync_patch.py

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
          fetch-depth: 0

      - name: Apply RTC patch
        run: python3 tools/rtc_time_sync_patch.py

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check platformio

      - name: Build ESP32 firmware
        run: pio run -e esp32

      - name: Run web contract checks
        run: |
          node Tests/Web/check_web_assets.js
          node Tests/Web/check_release_contracts.js
          node Tests/Web/check_final_acceptance_contracts.js

      - name: Commit verified change and cleanup bootstrap files
        shell: bash
        run: |
          git rm .github/workflows/rtc-time-sync-runner.yml
          git rm .github/workflows/rtc-time-sync-hardening.yml
          git rm tools/rtc_time_sync_patch.py
          git add firmware/esp32/src/main.cpp docs/HARDWARE_REFERENCE/00_READ_FIRST.md docs/HARDWARE_REFERENCE/04_RTC_TIME_SYNC.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: synchronize DS3231 with Bishkek network time"
          git push origin HEAD:cmp-protocol-v1
