<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Новый клиент — CoilMaster</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px}.section{padding:14px 0;border-bottom:1px solid #e5ebf0}.section:first-child{padding-top:0}.section:last-of-type{border-bottom:0}.section h2{font-size:18px;margin:0 0 5px}.field{margin-top:13px}.field label{display:block;font-weight:bold;margin-bottom:5px}.required{color:#b42318}.hint,.muted{color:#687580;font-size:14px}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}textarea{min-height:90px;resize:vertical}button{margin-top:15px;background:#1769aa;color:#fff;border:0;font-weight:bold}button:disabled{background:#9aa7b1}.ok{background:#e8f7ee;border:1px solid #82c99f;padding:11px;border-radius:9px;color:#17683a}.bad{background:#fff0ee;border:1px solid #e6a19a;padding:11px;border-radius:9px;color:#b42318}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}</style></head><body><header><a href="/mobile/clients.html">← Клиенты</a><b style="float:right">👤 Новый клиент</b></header><main><section class="card"><form id="form"><div class="section"><h2>Обязательные данные</h2><div class="hint">Для создания карточки нужны только имя и телефон.</div><div class="field"><label for="clientName">Имя клиента <span class="required">*</span></label><input id="clientName" name="name" maxlength="96" autocomplete="name" placeholder="Имя клиента" required></div><div class="field"><label for="clientPhone">Телефон <span class="required">*</span></label><input id="clientPhone" name="phone" maxlength="48" inputmode="tel" autocomplete="tel" placeholder="+996 555 123 456" required><div class="hint">Не менее 7 цифр.</div></div></div><div class="section"><h2>Дополнительно</h2><div class="hint">Можно оставить пустым и добавить позже.</div><div class="field"><label for="clientComment">Комментарий</label><textarea id="clientComment" name="comment" maxlength="320" placeholder="Примечание о клиенте"></textarea></div></div><button id="save" type="submit">Сохранить клиента</button></form><p id="result" class="muted">Создание клиента не создаёт ремонт и не связывает двигатель.</p></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id);let sending=false;function clientError(code){const map={name_required:'Укажите имя клиента.',phone_required:'Укажите телефон клиента.',invalid_phone:'Телефон должен содержать не менее 7 цифр.',name_and_valid_phone_required:'Укажите имя и корректный телефон клиента.'};return map[code]||code||'unknown'}function validate(form){const name=form.elements.name.value.trim(),phone=form.elements.phone.value.trim();if(!name)throw new Error('name_required');if(!phone)throw new Error('phone_required');if(phone.replace(/\D/g,'').length<7)throw new Error('invalid_phone');form.elements.name.value=name;form.elements.phone.value=phone;form.elements.comment.value=form.elements.comment.value.trim()}$('form').onsubmit=async e=>{e.preventDefault();if(sending)return;$('result').className='muted';try{validate(e.target)}catch(err){$('result').className='bad';$('result').textContent=clientError(err.message);return}sending=true;$('save').disabled=true;$('result').textContent='Сохранение…';try{const r=await fetch('/api/clients',{method:'POST',body:new FormData(e.target)}),j=await r.json();if(!r.ok)throw new Error(j.error||'client_create_failed');if(!j.client_id)throw new Error('client_id_missing');localStorage.setItem('cm-selected-client',String(j.client_id));$('result').className='ok';$('result').textContent='Клиент создан, ID '+j.client_id+'.';location.href='/mobile/client-details.html?client_id='+encodeURIComponent(j.client_id)}catch(err){$('result').className='bad';$('result').textContent='Ошибка: '+clientError(err.message);sending=false;$('save').disabled=false}};</script></body></html>
