name: Finalize Bishkek RTC sync

on:
  push:
    branches: [cmp-protocol-v1]
    paths:
      - .github/workflows/rtc-bishkek-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
          fetch-depth: 0

      - name: Patch RTC API runtime and navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('firmware/esp32/src/main.cpp')
          text = main.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'CM::BackupActivityCheck backupRuntimeActivity()\n{\n',
              '''bool rtcAdjustmentSafe()\n{\n    // RTC changes do not depend on backup/microSD readiness. Block them only\n    // when a physical/runtime state makes a wall-clock jump unsafe.\n    return recoveryEvaluated &&\n           !manualReviewRequired() &&\n           !runActive &&\n           !autonomousRunActive &&\n           !jobAwaitingAck &&\n           !jobCancelAwaitingAck;\n}\n\nCM::BackupActivityCheck backupRuntimeActivity()\n{\n''',
              'RTC safe-state helper')

          canonical = '''bool parseCanonicalUint32(const String& source, uint32_t& value)\n{\n    value = 0UL;\n    if (source.length() == 0U) return false;\n    if (source.length() > 1U && source[0] == '0') return false;\n\n    uint32_t parsed = 0UL;\n    for (size_t index = 0U; index < source.length(); ++index)\n    {\n        const char ch = source[index];\n        if (!isDigit(ch)) return false;\n        const uint8_t digit = static_cast<uint8_t>(ch - '0');\n        if (parsed > (0xFFFFFFFFUL - digit) / 10UL) return false;\n        parsed = parsed * 10UL + digit;\n    }\n\n    value = parsed;\n    return true;\n}\n'''
          rtc_parser = canonical + '''\nbool parseRtcDecimal(const String& source, uint32_t& value)\n{\n    // Browser date/time fields are normally zero-padded (08, 05, 00).\n    // Keep strict canonical parsing for IDs; only RTC fields allow zeroes.\n    value = 0UL;\n    if (source.length() == 0U) return false;\n    uint32_t parsed = 0UL;\n    for (size_t index = 0U; index < source.length(); ++index)\n    {\n        const char ch = source[index];\n        if (!isDigit(ch)) return false;\n        const uint8_t digit = static_cast<uint8_t>(ch - '0');\n        if (parsed > (0xFFFFFFFFUL - digit) / 10UL) return false;\n        parsed = parsed * 10UL + digit;\n    }\n    value = parsed;\n    return true;\n}\n'''
          replace_once(canonical, rtc_parser, 'RTC decimal parser')

          replace_once(
              'response.reserve(180U);\n        response = F("{\\\"source\\\":\\\"DS3231\\\",\\\"detected\\\":");',
              'response.reserve(360U);\n        response = F("{\\\"source\\\":\\\"DS3231\\\",\\\"detected\\\":");',
              'RTC status reserve')

          replace_once(
              '        else response += F("null");\n        response += F(",\\\"timezone_configured\\\":false,\\\"scheduling_ready\\\":false}");\n',
              '''        else response += F("null");\n        response += F(",\\\"timezone_configured\\\":true,\\\"timezone\\\":\\\"");\n        response += rtcClock.timezoneName();\n        response += F("\\\",\\\"utc_offset_minutes\\\":360,\\\"ntp_configured\\\":");\n        response += rtcClock.networkSyncConfigured() ? F("true") : F("false");\n        response += F(",\\\"ntp_synced\\\":");\n        response += rtcClock.networkTimeSynced() ? F("true") : F("false");\n        response += F(",\\\"ntp_status\\\":\\\"");\n        response += rtcClock.lastNetworkSyncResult();\n        response += F("\\\",\\\"last_ntp_sync_ms\\\":");\n        response += rtcClock.lastNetworkSyncMs();\n        response += F(",\\\"scheduling_ready\\\":");\n        response += valid ? F("true") : F("false");\n        response += F("}");\n''',
              'RTC GET status')

          old_gate = '''        const CM::BackupActivityCheck activity = backupRuntimeActivity();\n        if (activity != CM::BackupActivityCheck::Safe)\n        {\n            webServer.send(activity == CM::BackupActivityCheck::Busy ? 409 : 503,\n                           "application/json",\n                           activity == CM::BackupActivityCheck::Busy\n                               ? "{\\\"error\\\":\\\"machine_must_be_safely_idle\\\"}"\n                               : "{\\\"error\\\":\\\"activity_state_unavailable\\\"}");\n            return;\n        }\n'''
          replace_once(old_gate,
              '''        if (!rtcAdjustmentSafe())\n        {\n            webServer.send(409, "application/json",\n                           "{\\\"error\\\":\\\"machine_must_be_safely_idle\\\"}");\n            return;\n        }\n''',
              'RTC POST activity gate')

          replace_once(
              '!parseCanonicalUint32(webServer.arg(fields[i]), parsed[i]))',
              '!parseRtcDecimal(webServer.arg(fields[i]), parsed[i]))',
              'RTC POST parser')

          replace_once(
              '{\\\"saved\\\":true,\\\"verified\\\":true,\\\"source\\\":\\\"BROWSER_LOCAL_TIME\\\"}',
              '{\\\"saved\\\":true,\\\"verified\\\":true,\\\"source\\\":\\\"MANUAL_BISHKEK_TIME\\\"}',
              'RTC POST source')

          replace_once(
              '    networkManager.update(nowMs);\n    webServer.handleClient();',
              '''    networkManager.update(nowMs);\n    rtcClock.updateNetworkSync(nowMs,\n                               WiFi.status() == WL_CONNECTED,\n                               rtcAdjustmentSafe());\n    webServer.handleClient();''',
              'RTC network update')

          main.write_text(text, encoding='utf-8')

          for path, anchor, replacement in [
              ('firmware/esp32/web/desktop/settings.html',
               '<a class="settings-link" href="/desktop/settings-ftp.html">',
               '<a class="settings-link" href="/desktop/settings-time.html"><b>🕒 Время и RTC</b><span>DS3231, ручная установка и автоматическая NTP-синхронизация Asia/Bishkek.</span></a><a class="settings-link" href="/desktop/settings-ftp.html">'),
              ('firmware/esp32/web/mobile/settings.html',
               '<a class="settings-link" href="/mobile/settings-ftp.html">',
               '<a class="settings-link" href="/mobile/settings-time.html"><b>🕒 Время и RTC</b><span>DS3231, ручная установка и автоматическая NTP-синхронизация Бишкек.</span></a><a class="settings-link" href="/mobile/settings-ftp.html">')]:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if 'settings-time.html' not in s:
                  if anchor not in s:
                      raise SystemExit(f'navigation anchor not found: {path}')
                  s = s.replace(anchor, replacement, 1)
                  p.write_text(s, encoding='utf-8')

          doc = Path('docs/HARDWARE_REFERENCE/04_RTC_TIME_SYNC.md')
          if not doc.exists():
              doc.write_text('''# DS3231 — время и автоматическая синхронизация Бишкек\n\nДата: **2026-08-18**  \nSource of truth: `cmp-protocol-v1`\n\n## Подключение\n\n```text\nDS3231 SDA -> ESP32 GPIO21\nDS3231 SCL -> ESP32 GPIO22\nI2C address: 0x68\n```\n\n## Время CoilMaster\n\nЛокальный часовой пояс: `Asia/Bishkek`, UTC+6. DS3231 хранит локальное время Бишкек.\n\n## Автоматическая синхронизация\n\nESP32 настраивает NTP (`pool.ntp.org`, `time.google.com`, `time.cloudflare.com`). После появления интернет-подключения валидное сетевое время автоматически записывается в DS3231 в безопасном idle-состоянии. При неудаче попытка повторяется; после успешной синхронизации RTC освежается примерно каждые 6 часов. Без интернета DS3231 продолжает работать автономно.\n\n## Исправление ручной установки\n\n`POST /api/system/time` теперь использует отдельный RTC parser, который принимает нормальные zero-padded поля (`08`, `05`, `00`). Строгий canonical parser для ID не изменён. Ранее именно запрет ведущих нулей мог давать `invalid_rtc_datetime_fields`.\n\nРучная установка больше не зависит от backup/microSD readiness, но остаётся заблокированной при активной намотке, pending UART job/cancel или manual recovery uncertainty.\n\n## Диагностика\n\n`GET /api/system/time` сообщает DS3231 time, `timezone`, `ntp_configured`, `ntp_synced`, `ntp_status`, `last_ntp_sync_ms`.\n''', encoding='utf-8')

          index = Path('docs/HARDWARE_REFERENCE/00_READ_FIRST.md')
          s = index.read_text(encoding='utf-8')
          if '04_RTC_TIME_SYNC.md' not in s:
              anchor = '- `03_KEYS_AND_HIDDEN_COMMANDS.md` — клавиши 4×4, START и скрытые/аварийные команды.\n'
              if anchor not in s:
                  raise SystemExit('hardware reference index anchor not found')
              s = s.replace(anchor, anchor + '- `04_RTC_TIME_SYNC.md` — DS3231, ручная установка и автоматическая NTP-синхронизация времени Бишкек.\n', 1)
              index.write_text(s, encoding='utf-8')
          PY

      - name: Install PlatformIO
        run: python3 -m pip install --disable-pip-version-check platformio

      - name: Build ESP32 firmware
        run: pio run -e esp32

      - name: Run web contract checks
        run: |
          node Tests/Web/check_web_assets.js
          node Tests/Web/check_release_contracts.js
          node Tests/Web/check_final_acceptance_contracts.js

      - name: Commit verified result and remove helper
        run: |
          rm -f .github/workflows/rtc-bishkek-finalize.yml
          rm -f .github/workflows/rtc-time-sync-hardening.yml
          rm -f tools/patch_rtc_time_sync.py tools/rtc_time_sync_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair RTC setting and add Bishkek NTP sync"
          git push origin HEAD:cmp-protocol-v1
