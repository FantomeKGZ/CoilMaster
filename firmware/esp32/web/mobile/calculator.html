<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калькулятор проводника</title><style>body{font-family:Arial,sans-serif;margin:0;background:#eef2f6;color:#17212b}main{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #17212b14}h1{font-size:24px}label{display:block;margin:12px 0 5px;font-weight:700}input,select,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #c8d0d8;border-radius:10px;font-size:16px}button{margin-top:16px;background:#1769aa;color:#fff;border:0;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{border:1px solid #d8e0e7;border-radius:12px;padding:13px;margin-top:10px}.stock{color:#167a3b;font-weight:700}.buy{color:#a45c00;font-weight:700}.muted{color:#63707c;font-size:14px}.note{background:#f3f7fa;padding:11px;border-radius:10px}a{color:#1769aa;text-decoration:none}</style></head><body><main><p><a href="/mobile/">← CoilMaster</a></p><h1>Конвертация обмотки</h1><section class="card"><div class="row"><div><label>Исходный материал</label><select id="sourceMaterial"><option value="AL">Алюминий</option><option value="CU">Медь</option></select></div><div><label>Целевой материал</label><select id="targetMaterial"><option value="CU">Медь</option><option value="AL">Алюминий</option></select></div></div><div class="row"><div><label>Диаметр жилы, мм</label><input id="diameter" inputmode="decimal" value="0.80"></div><div><label>Количество жил</label><input id="strands" inputmode="numeric" type="number" min="1" max="12" value="3"></div></div><button id="calculate">Рассчитать</button><p id="settingsInfo" class="note muted">Загрузка настроек калькулятора…</p><p id="message" class="muted"></p></section><section class="card"><h2>Рекомендации</h2><div id="results"><p class="muted">Введите исходные данные и нажмите «Рассчитать».</p></div></section></main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id);let settingsConfigured=false;function diameterHundredths(v){return Math.round(Number(String(v).replace(',','.'))*100)}function mm(v){return(v/100).toFixed(2).replace('.',',')}function syncMaterials(){if($('sourceMaterial').value===$('targetMaterial').value)$('targetMaterial').value=$('sourceMaterial').value==='AL'?'CU':'AL'}async function loadSettings(){settingsConfigured=false;try{const r=await fetch('/api/calculator/settings',{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');if(!j.configured){$('settingsInfo').innerHTML='Калькулятор ещё не настроен. <a href="/mobile/settings.html">Открыть настройки</a>.';return false}settingsConfigured=true;$('settingsInfo').textContent='Настройки: допуск '+(j.allowed_deviation_permille/10).toFixed(1).replace('.',',')+' %, до '+j.max_target_strands+' жил, смешанные диаметры '+(j.allow_mixed_diameters?'разрешены':'выключены')+'.';return true}catch(e){$('settingsInfo').textContent='Настройки недоступны. Откройте раздел «Настройки».';return false}}$('sourceMaterial').onchange=syncMaterials;$('targetMaterial').onchange=syncMaterials;$('calculate').onclick=async()=>{syncMaterials();if(!settingsConfigured&&!(await loadSettings()))return;const d=diameterHundredths($('diameter').value);if(!d){$('message').textContent='Проверьте диаметр.';return}const q=new URLSearchParams({source_material:$('sourceMaterial').value,target_material:$('targetMaterial').value,source_diameter_hundredths_mm:d,source_parallel_strands:$('strands').value});$('message').textContent='Расчёт...';try{const r=await fetch('/api/calculator/conductor?'+q),data=await r.json();if(!r.ok){if(data.error==='calculator_not_configured'){settingsConfigured=false;$('settingsInfo').innerHTML='Калькулятор ещё не настроен. <a href="/mobile/settings.html">Открыть настройки</a>.';throw new Error('Сначала сохраните настройки калькулятора.')}throw new Error(data.error||'Ошибка расчёта')}$('message').textContent='Учтено диаметров из базы: '+data.catalogue_diameter_count;const box=$('results');box.innerHTML='';if(!data.recommendations.length){box.innerHTML='<p class="muted">Подходящих вариантов в заданном допуске нет.</p>';return}data.recommendations.forEach(o=>{const div=document.createElement('div');div.className='result';const available=o.availability==='IN_STOCK';const parts=(o.components||[]).map(c=>c.parallel_strands+' × '+mm(c.diameter_hundredths_mm)+' мм').join(' + ')||o.parallel_strands+' × '+mm(o.diameter_hundredths_mm)+' мм';div.innerHTML='<strong>'+o.rank+'. '+parts+'</strong><p>Отклонение: '+(o.deviation_permille/10).toFixed(1).replace('.',',')+' %</p><p class="'+(available?'stock':'buy')+'">'+(available?'Есть на складе':'Требуется закупить')+'</p>';box.appendChild(div)})}catch(e){$('message').textContent=e.message}};loadSettings();</script></body></html>
