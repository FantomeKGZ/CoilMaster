[platformio]
default_envs = uno
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

build_src_filter =
    -<*>
    +<Core/*.cpp>
    +<Arduino/*.cpp>
    +<firmware/arduino/src/main.cpp>

build_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
    -flto
    -mcall-prologues
    -Wl,--relax
    -D_SS_MAX_RX_BUFF=32
    -DSERIAL_RX_BUFFER_SIZE=8
    -DSERIAL_TX_BUFFER_SIZE=8


; Temporary USB diagnostic image for reset-loop investigation. Production
; remains [env:uno] with diagnostics disabled.
[env:uno_diagnostic]
extends = env:uno
build_unflags =
    -DSERIAL_RX_BUFFER_SIZE=8
    -DSERIAL_TX_BUFFER_SIZE=8
build_flags =
    ${env:uno.build_flags}
    -DSERIAL_RX_BUFFER_SIZE=4
    -DSERIAL_TX_BUFFER_SIZE=4
    -DCM_FEATURE_BOOT_DIAGNOSTICS=1

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
extra_scripts = pre:scripts/platformio_build_id.py

build_src_filter =
    -<*>
    +<firmware/esp32/src/*.cpp>

build_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
