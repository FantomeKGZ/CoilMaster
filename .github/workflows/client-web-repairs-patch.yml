name: Guarded Repair Client Form Cleanup

on:
  push:
    branches: [cmp-protocol-v1]
    paths:
      - '.github/workflows/client-web-repairs-patch.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
      - name: Guard current repairs blob
        run: test "$(git hash-object firmware/esp32/web/desktop/repairs.html)" = "78cbbd1aaee2fc86e997c7b2b5ffcb2b709ae20d"
      - name: Inspect client-form references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('firmware/esp32/web/desktop/repairs.html').read_text()
          needle='clientForm'
          start=0
          found=False
          while True:
              i=s.find(needle,start)
              if i<0: break
              found=True
              print('--- occurrence ---')
              print(s[max(0,i-350):min(len(s),i+1200)])
              start=i+len(needle)
          assert found
          PY
