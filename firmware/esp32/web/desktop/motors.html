<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Двигатели — CoilMaster</title>
<style>
body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:22px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}.toolbar a{display:inline-block;padding:11px 15px;border-radius:9px;text-decoration:none;font-weight:bold}.primary{background:#1769aa;color:#fff}.secondary{background:#e7eef5;color:#17324b}.card{background:#fff;border-radius:14px;padding:20px}.catalog-head{display:grid;grid-template-columns:minmax(180px,1.5fr) 90px minmax(170px,1fr) minmax(170px,1fr) minmax(180px,1.2fr) 190px;gap:10px;padding:0 10px 10px;color:#687580;font-size:13px;font-weight:bold}.item{display:grid;grid-template-columns:minmax(180px,1.5fr) 90px minmax(170px,1fr) minmax(170px,1fr) minmax(180px,1.2fr) 190px;gap:10px;align-items:center;padding:14px 10px;border-top:1px solid #e4eaf0}.muted{color:#687580}.role{background:#f3f7fa;border-radius:9px;padding:9px}.role small{display:block;color:#687580;margin-bottom:4px}.actions{display:grid;grid-template-columns:1fr;gap:7px}.actions a,.actions button{box-sizing:border-box;width:100%;padding:9px;border-radius:8px;text-decoration:none;border:0;font-size:14px;font-weight:bold;text-align:center}.details{background:#e7eef5;color:#17324b}.repair{background:#1769aa;color:#fff}.legacy{display:inline-block;background:#fff3d8;border:1px solid #efc86a;border-radius:999px;padding:3px 7px;font-size:11px;margin-top:5px}.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}.pager button{width:auto;padding:10px 14px;border:0;border-radius:9px;background:#5b6874;color:#fff;font-weight:bold}.pager button:disabled{opacity:.45}.pager span{min-width:130px;text-align:center}input{box-sizing:border-box;width:100%;padding:12px;margin:0 0 14px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}@media(max-width:1100px){.catalog-head{display:none}.item{grid-template-columns:1fr 1fr}.item>div:first-child,.item>.actions{grid-column:1/-1}}@media(max-width:900px){.layout{display:block}aside{display:none}}@media(max-width:600px){.item{grid-template-columns:1fr}}
</style>
</head>
<body><div class="layout">
<aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/clients.html">Клиенты</a><a href="/desktop/motors.html">Двигатели</a></aside>
<main>
<h1>Каталог двигателей</h1>
<div class="toolbar"><a class="primary" href="/desktop/motor-new.html">+ Новый двигатель</a><a class="secondary" href="/desktop/motor-import.html">Импорт двигателей</a></div>
<section class="card">
<input id="search" placeholder="Поиск: производитель, модель, обозначение, программа, фазы, пазы">
<div class="catalog-head"><span>Двигатель</span><span>Фазы</span><span>WORKING</span><span>STARTING</span><span>Провод</span><span>Действия</span></div>
<div id="items" class="muted">Загрузка…</div>
<div class="pager"><button id="prevPage" type="button" disabled>← Назад</button><span id="pageInfo" class="muted">Страница 1</span><button id="nextPage" type="button" disabled>Далее →</button></div>
</section>
</main></div>
<script>
localStorage.setItem('cm-ui-version','desktop');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function titleOf(x){return [x.manufacturer,x.model].filter(Boolean).join(' ').trim()||x.name||('Двигатель '+x.motor_id)}
function roleHtml(label,program,repeats){return '<div class="role"><small>'+label+'</small><b>'+esc(program||'—')+'</b><div class="muted">повторов: '+esc(repeats||'—')+'</div></div>'}
function conductorText(version,motor){if(version){const values=[];if(version.working_conductors)values.push('W '+version.working_conductors);if(version.starting_present&&version.starting_conductors)values.push('S '+version.starting_conductors);return values.join(' · ')||'—'}if(motor.wire_diameter_hundredths_mm){const d=(Number(motor.wire_diameter_hundredths_mm)/100).toLocaleString('ru-RU');return esc((motor.wire_material||'')+' '+d+' мм'+(motor.parallel_strands?' × '+motor.parallel_strands:''))}return '—'}
async function latestFor(motor){try{const r=await fetch('/api/motors/winding/latest?motor_id='+encodeURIComponent(motor.motor_id),{cache:'no-store'});if(!r.ok)return null;const j=await r.json();return j.versioned&&j.item?j.item:null}catch(_){return null}}
let currentCursor=0,nextCursor=0,hasMore=false,cursorHistory=[],currentQuery='',pageNumber=1;
async function render(items){$('items').innerHTML='';if(!items.length){$('items').textContent='Двигатели не найдены.';return}const versions=await Promise.all(items.map(latestFor));items.forEach((x,i)=>{const v=versions[i],workingProgram=v?v.working_program:x.coil_program,workingRepeat=v?v.working_repeat_target:x.repeat_target,startingProgram=v&&v.starting_present?v.starting_program:null,startingRepeat=v&&v.starting_present?v.starting_repeat_target:null;const d=document.createElement('div');d.className='item';d.innerHTML='<div><b>'+esc(titleOf(x))+'</b><div class="muted">ID '+esc(x.motor_id)+(x.slot_count?' · пазов '+esc(x.slot_count):'')+'</div>'+(v?'':'<span class="legacy">legacy WORKING</span>')+'</div><div><b>'+esc(x.phase_count||x.phases||'—')+'</b></div><div>'+roleHtml('WORKING',workingProgram,workingRepeat)+'</div><div>'+roleHtml('STARTING',startingProgram,startingRepeat)+'</div><div>'+conductorText(v,x)+'</div><div class="actions"><a class="details" href="/desktop/motor-details.html?motor_id='+encodeURIComponent(x.motor_id)+'">Открыть карточку</a><button class="repair" type="button">Выбрать для ремонта</button></div>';d.querySelector('button').onclick=()=>{localStorage.setItem('cm-selected-motor',String(x.motor_id));location.href='/desktop/repairs.html?motor_id='+encodeURIComponent(x.motor_id)};$('items').appendChild(d)})}
function updatePager(count){$('prevPage').disabled=cursorHistory.length===0;$('nextPage').disabled=!hasMore;$('pageInfo').textContent='Страница '+pageNumber+' · '+count+' записей'}
async function load(cursor=0,reset=false){if(reset){cursorHistory=[];pageNumber=1;currentQuery=$('search').value.trim();cursor=0}$('items').textContent='Загрузка…';try{const q=new URLSearchParams({limit:'20'});if(currentQuery)q.set('q',currentQuery);if(cursor)q.set('cursor',String(cursor));const r=await fetch('/api/motors?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Каталог двигателей недоступен.');currentCursor=cursor;hasMore=j.has_more===true;nextCursor=hasMore?Number(j.next_cursor):0;if(hasMore&&(!Number.isInteger(nextCursor)||nextCursor<=currentCursor))throw new Error('invalid_paging_cursor');await render(j.items||[]);updatePager((j.items||[]).length)}catch(e){$('items').textContent=e.message||'Каталог двигателей недоступен.';$('prevPage').disabled=true;$('nextPage').disabled=true}}
$('prevPage').onclick=()=>{if(!cursorHistory.length)return;const cursor=cursorHistory.pop();pageNumber=Math.max(1,pageNumber-1);load(cursor,false)};
$('nextPage').onclick=()=>{if(!hasMore)return;cursorHistory.push(currentCursor);pageNumber+=1;load(nextCursor,false)};
$('search').oninput=()=>{clearTimeout(window.cmSearch);window.cmSearch=setTimeout(()=>load(0,true),250)};
load(0,true);
</script></body></html>
