<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ремонты</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}input,select,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.secondary{background:#5b6874}.item{padding:12px 0;border-bottom:1px solid #e5ebf0}.muted{color:#687580}.links a{display:inline-block;margin:8px 10px 0 0}.note{background:#f3f7fa;padding:10px;border-radius:10px;margin-top:10px}.catalog-link{display:block;margin-top:10px}</style></head><body><header><a href="/mobile/more.html">← Ещё</a><b style="float:right">🧰 Ремонты</b></header><main><section class="card"><h2>Новый ремонт</h2><form id="form"><input id="clientId" name="client_id" type="number" min="1" placeholder="ID клиента" required><label>Двигатель из каталога</label><select id="motorId" name="motor_id" required><option value="">Загрузка двигателей…</option></select><a class="catalog-link" href="/mobile/motors.html">Открыть каталог двигателей</a><input id="received" name="received_at" type="datetime-local" required><textarea name="complaint" placeholder="Жалоба клиента"></textarea><textarea name="comment" placeholder="Комментарий"></textarea><button>Создать ремонт</button></form><p id="result" class="muted"></p></section><section class="card"><h2>Быстро добавить двигатель</h2><form id="motorForm"><input name="name" placeholder="Название двигателя" required><input name="coil_program" placeholder="Программа витков, например 140/100/80/40" required><input name="manufacturer" placeholder="Производитель"><input name="model" placeholder="Модель"><input name="tags" placeholder="Теги через запятую"><textarea name="comment" placeholder="Комментарий"></textarea><button class="secondary">Добавить в каталог</button></form><div id="motorResult" class="note muted">После добавления двигатель автоматически выберется в ремонте.</div></section><section class="card"><h2>Ремонты</h2><div id="items" class="muted">Загрузка…</div></section></main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),fixedClient=params.get('client_id')||'',requestedMotor=params.get('motor_id')||localStorage.getItem('cm-selected-motor')||'';$('clientId').value=fixedClient;$('received').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);let motors=[];function selectRepair(id){localStorage.setItem('cm-active-repair',String(id))}function motorLabel(x){return(x.name||'Двигатель')+(x.model?' · '+x.model:'')+(x.manufacturer?' · '+x.manufacturer:'')+' · '+(x.coil_program||'без программы')}async function loadMotors(selected){try{const r=await fetch('/api/motors',{cache:'no-store'}),j=await r.json();motors=j.items||[];$('motorId').innerHTML='<option value="">Выберите двигатель</option>';motors.forEach(x=>{const o=document.createElement('option');o.value=x.motor_id;o.textContent=motorLabel(x);$('motorId').appendChild(o)});const chosen=selected||requestedMotor;if(chosen&&motors.some(x=>String(x.motor_id)===String(chosen))){$('motorId').value=String(chosen);localStorage.setItem('cm-selected-motor',String(chosen))}if(!motors.length)$('motorId').innerHTML='<option value="">Сначала добавьте двигатель</option>'}catch(e){$('motorId').innerHTML='<option value="">Каталог недоступен</option>'}}$('motorId').onchange=()=>{if($('motorId').value)localStorage.setItem('cm-selected-motor',$('motorId').value);else localStorage.removeItem('cm-selected-motor')};async function load(){const q=fixedClient?'?client_id='+fixedClient:'';const r=await fetch('/api/repairs'+q,{cache:'no-store'}),j=await r.json();$('items').innerHTML='';(j.items||[]).forEach(x=>{const motor=motors.find(m=>Number(m.motor_id)===Number(x.motor_id));const d=document.createElement('div');d.className='item';d.innerHTML='<b>Ремонт №'+x.repair_id+' — '+(motor?motorLabel(motor):'Двигатель ID '+x.motor_id)+'</b><div>Клиент ID: '+x.client_id+'</div><div class="muted">'+x.status+' · '+x.received_at+'</div><div class="links"><a data-id="'+x.repair_id+'" href="/mobile/costing.html?repair_id='+x.repair_id+'">Калькуляция</a><a data-id="'+x.repair_id+'" href="/mobile/writeoff.html?repair_id='+x.repair_id+'">Списание провода</a></div>';d.querySelectorAll('a[data-id]').forEach(a=>a.onclick=()=>selectRepair(a.dataset.id));$('items').appendChild(d)});if(!(j.items||[]).length)$('items').textContent='Ремонтов пока нет.'}$('motorForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/motors',{method:'POST',body:new FormData(e.target)}),j=await r.json();if(r.ok){$('motorResult').textContent='Двигатель добавлен, ID '+j.motor_id;localStorage.setItem('cm-selected-motor',String(j.motor_id));await loadMotors(j.motor_id);e.target.reset()}else $('motorResult').textContent=j.error||'Ошибка добавления двигателя'};$('form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);fd.set('received_at',new Date($('received').value).toISOString());const r=await fetch('/api/repairs',{method:'POST',body:fd}),j=await r.json();if(r.ok){selectRepair(j.repair_id);localStorage.setItem('cm-selected-motor',String(j.motor_id));location.href='/mobile/costing.html?repair_id='+j.repair_id}else $('result').textContent=j.error||'Ошибка'};(async()=>{await loadMotors();await load()})();</script></body></html>
