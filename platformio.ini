[platformio]
default_envs = uno
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

lib_deps =
    chris--a/Keypad @ ^3.1.1
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

build_src_filter =
    -<*>
    +<Core/*.cpp>
    +<Arduino/*.cpp>
    +<firmware/arduino/src/main.cpp>

build_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wconversion

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_src_filter =
    -<*>
    +<firmware/esp32/src/*.cpp>

build_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
