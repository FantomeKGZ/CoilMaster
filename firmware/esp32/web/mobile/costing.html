<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калькуляция ремонта</title><style>body{font-family:Arial,sans-serif;margin:0;background:#eef2f6;color:#17212b}main{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #17212b14}input,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #cbd5df;border-radius:10px;font-size:16px;margin-top:8px}button{background:#1769aa;color:#fff;border:0;font-weight:700}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf1f4}.row:last-child{border:0}.total{font-size:23px;font-weight:700}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}a{color:#1769aa;text-decoration:none}</style></head><body><main><p><a href="/mobile/">← CoilMaster</a></p><h1>Калькуляция ремонта</h1><section class="card"><label>Номер ремонта</label><input id="repairId" type="number" min="1" placeholder="42"><button id="load">Загрузить калькуляцию</button><p id="message" class="muted">Укажите номер ремонта.</p></section><section class="card"><h2>Себестоимость</h2><div class="row"><span>Провод</span><b id="wire">0,00</b></div><div class="row"><span>Доп. материалы</span><b id="materials">0,00</b></div><div class="row"><span>Работа мастера</span><b id="labour">0,00</b></div><div class="row total"><span>Итого</span><span id="total">0,00</span></div></section><section class="card"><h2>Цена клиенту</h2><form id="pricing"><label>Стоимость работы, сом</label><input id="labourInput" inputmode="decimal" value="0,00"><label>Конечная цена клиенту, сом</label><input id="clientInput" inputmode="decimal" value="0,00"><button>Сохранить</button></form><div class="row"><span>Маржа</span><b id="margin">0,00</b></div></section></main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),money=v=>(Number(v)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' сом',minor=id=>Math.round(Number($(id).value.replace(',','.'))*100);async function load(){const id=$('repairId').value;if(!id)return;$('message').textContent='Загрузка…';try{const r=await fetch('/api/repairs/costing?repair_id='+encodeURIComponent(id),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');$('wire').textContent=money(j.wire_cost_minor);$('materials').textContent=money(j.material_cost_minor);$('labour').textContent=money(j.labour_cost_minor);$('total').textContent=money(j.total_cost_minor);$('margin').textContent=money(j.margin_minor);$('labourInput').value=(j.labour_cost_minor/100).toFixed(2).replace('.',',');$('clientInput').value=(j.client_price_minor/100).toFixed(2).replace('.',',');$('message').textContent='Провод: '+j.wire_line_count+' списаний, материалы: '+j.material_line_count+' позиций.'}catch(e){$('message').className='bad';$('message').textContent=e.message}}$('load').onclick=load;$('pricing').onsubmit=async e=>{e.preventDefault();const id=$('repairId').value;if(!id)return;const body=new URLSearchParams({repair_id:id,labour_cost_minor:String(minor('labourInput')),client_price_minor:String(minor('clientInput')),currency:'KGS',timestamp:new Date().toISOString()});try{const r=await fetch('/api/repairs/costing',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');$('message').className='ok';$('message').textContent='Калькуляция сохранена.';load()}catch(err){$('message').className='bad';$('message').textContent=err.message}};</script></body></html>
