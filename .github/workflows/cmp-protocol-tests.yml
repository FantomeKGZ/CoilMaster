name: CMP Protocol Tests

on:
  workflow_dispatch:
  push:
    branches:
      - cmp-protocol-v1
      - arduino-ru-lcd-experiment
  pull_request:
    paths:
      - "Shared/**"
      - "Tests/Protocol/**"
      - "Tests/Web/**"
      - "Arduino/**"
      - "Core/**"
      - "firmware/arduino/**"
      - "firmware/esp32/src/**"
      - "firmware/esp32/web/**"
      - ".github/workflows/cmp-protocol-tests.yml"

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S Tests/Protocol -B build/cmp-protocol

      - name: Build
        run: cmake --build build/cmp-protocol --parallel

      - name: Test
        run: ctest --test-dir build/cmp-protocol --output-on-failure

      - name: Audit CI trigger coverage
        if: always()
        run: node Tests/Web/check_ci_trigger_contracts.js

      - name: Audit Arduino JOB parser contracts
        if: always()
        run: node Tests/Protocol/check_arduino_job_parser_contracts.js

      - name: Audit authoritative Arduino entrypoint
        if: always()
        run: node Tests/Protocol/check_arduino_entrypoint_cleanup.js

      - name: Audit Arduino LCD layout contracts
        if: always()
        run: node Tests/Protocol/check_arduino_lcd_contracts.js

      - name: Audit late RUN_STARTED recovery contracts
        if: always()
        run: node Tests/Protocol/check_job_state_late_run_recovery_contract.js

      - name: Audit web JavaScript and navigation
        if: always()
        run: node Tests/Web/check_web_assets.js

      - name: Audit shared app shell contracts
        if: always()
        run: node Tests/Web/check_shared_app_shell_contracts.js

      - name: Audit permanent reference release contracts
        if: always()
        run: node Tests/Web/check_reference_release_contracts.js

      - name: Audit reference catalog search contracts
        if: always()
        run: node Tests/Web/check_reference_search_contracts.js

      - name: Audit calculator source wire input
        if: always()
        run: node Tests/Web/check_calculator_source_wire_input.js

      - name: Audit repeat target UI contracts
        if: always()
        run: node Tests/Web/check_repeat_target_ui.js

      - name: Audit motor schema UI contracts
        if: always()
        run: node Tests/Web/check_motor_schema_ui.js

      - name: Audit motor winding version schema contracts
        if: always()
        run: node Tests/Web/check_motor_winding_version_schema.js

      - name: Audit repair as-received snapshot contracts
        if: always()
        run: node Tests/Web/check_repair_as_received_snapshot_contract.js

      - name: Audit CRM winding/as-received lookup API
        if: always()
        run: node Tests/Web/check_crm_winding_lookup_api.js

      - name: Audit repair intake pending recovery
        if: always()
        run: node Tests/Web/check_repair_intake_pending_contract.js

      - name: Audit transactional repair intake integration
        if: always()
        run: node Tests/Web/check_repair_intake_transaction_integration.js

      - name: Audit material request schema contracts
