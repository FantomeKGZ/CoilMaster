name: Guarded Linked Job Role Patch

on:
  push:
    branches: [cmp-protocol-v1]
    paths:
      - '.github/workflows/linked-job-role-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
      - name: Guard current main blob
        run: test "$(git hash-object firmware/esp32/src/main.cpp)" = "c7bac1a41c29cc382afb1e580968ff39ca5d5349"
      - name: Patch linked job role resolution
        run: |
          python3 -c 'from pathlib import Path; p=Path("firmware/esp32/src/main.cpp"); s=p.read_text(); old="jobLinkageResolver.resolveWithProgram(linkage.repairId,\n                                                   linkage.motorId,\n                                                   resolved,\n                                                   catalogProgram)"; new="jobLinkageResolver.resolveWithProgram(linkage.repairId,\n                                                   linkage.motorId,\n                                                   job.type,\n                                                   resolved,\n                                                   catalogProgram)"; assert old in s; p.write_text(s.replace(old,new,1))'
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add firmware/esp32/src/main.cpp
          git commit -m "feat(job): validate linked job against selected winding role"
          git push origin HEAD:cmp-protocol-v1
