name: Guarded Client Details Contract Patch

on:
  push:
    branches: [cmp-protocol-v1]
    paths:
      - '.github/workflows/client-details-contract-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
      - name: Guard current client details blob
        run: test "$(git hash-object firmware/esp32/web/desktop/client-details.html)" = "fa827a54352c218b2753bfa76fb691c8c11a0834"
      - name: Align delivery and cash response contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('firmware/esp32/web/desktop/client-details.html')
          s=p.read_text()
          old="const item=j.item||j.delivery||null;if(item&&item.delivered_at)return'<span class=\"status closed\">Выдан '+esc(dateLabel(item.delivered_at))+'</span>';if(j.delivered===true)return'<span class=\"status closed\">Выдан</span>';return'<span class=\"status closed\">Закрыт, не выдан</span>'"
          new="const item=j.item||j.delivery||j;if(item&&item.delivered_at)return'<span class=\"status closed\">Выдан '+esc(dateLabel(item.delivered_at))+'</span>';return'<span class=\"status closed\">Закрыт, не выдан</span>'"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old2="x.event_type||x.type||'PAYMENT'"
          new2="x.kind||x.event_type||x.type||'PAYMENT'"
          assert s.count(old2)==1
          s=s.replace(old2,new2,1)
          old3="function paymentAmount(x){return money(x.amount_minor??x.amount_minor_units??x.amount,btoa?x.currency:'')}"
          assert s.count(old3)==1
          s=s.replace(old3,'',1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add firmware/esp32/web/desktop/client-details.html
          git commit -m "fix(web): align client card with cash and delivery API"
          git push origin HEAD:cmp-protocol-v1
