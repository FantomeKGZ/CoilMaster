name: One-shot material request movement audit patch

on:
  push:
    branches:
      - cmp-protocol-v1
    paths:
      - ".github/workflows/material-request-movement-audit-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
          fetch-depth: 0
      - name: Guard and fix CRM movement audit escaping
        shell: bash
        run: |
          set -euo pipefail
          FILE=firmware/esp32/src/CM_CrmPersistenceIntegrityAudit.cpp
          EXPECTED=a9a74f231da1e87e841e3ecc1eabb6758e947861
          ACTUAL=$(git hash-object "$FILE")
          test "$ACTUAL" = "$EXPECTED" || { echo "blob changed: $ACTUAL"; exit 1; }
          python3 -c "from pathlib import Path; p=Path('$FILE'); s=p.read_text(); old='else if (line.indexOf(F(\"\"correction_direction\":\")) >= 0)'; new='else if (line.indexOf(F(\"\\\\\\\"correction_direction\\\\\\\":\")) >= 0)'; assert old in s, 'escaping anchor missing'; p.write_text(s.replace(old,new,1))"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/esp32/src/CM_CrmPersistenceIntegrityAudit.cpp
          git commit -m 'fix(integrity): correct movement direction marker escaping'
          git push origin HEAD:cmp-protocol-v1
