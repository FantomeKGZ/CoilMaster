<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Двигатели</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{position:sticky;top:0;z-index:2;background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}input,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.secondary{background:#5b6874}.item{padding:12px 0;border-bottom:1px solid #e5ebf0}.muted{color:#687580}.warn{background:#fff3d8;border:1px solid #efc86a;padding:12px;border-radius:10px;margin-top:10px}.badge{display:inline-block;background:#e7eef5;border-radius:999px;padding:4px 8px;margin:5px 5px 0 0;font-size:13px}.hidden{display:none}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea;z-index:3}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px} .pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}.pager button{width:auto;margin:0}.pager span{min-width:120px;text-align:center}</style></head><body><header><a href="/mobile/repairs.html">← Ремонты</a><b style="float:right">⚙️ Двигатели</b></header><main><p><a href="/mobile/motor-import.html">Импортировать двигатели и обмоточные данные →</a></p><section class="card"><h2>Добавить двигатель</h2><form id="form"><input name="name" placeholder="Название двигателя" required><input name="model" placeholder="Модель"><input name="manufacturer" placeholder="Производитель"><input name="coil_program" placeholder="Программа витков: 140/100/80/40" required><div class="muted">1–10 катушек, 1–9999 витков. Разделители: / , ;</div><input name="tags" placeholder="Теги: насос, 2.2 кВт, 24 паза"><textarea name="comment" placeholder="Комментарий"></textarea><button>Проверить и сохранить</button></form><div id="similar" class="warn hidden"></div><button id="confirm" class="secondary hidden" type="button">Всё равно создать отдельный двигатель</button><p id="result" class="muted"></p></section><section class="card"><h2>Каталог</h2><input id="search" placeholder="Поиск по названию, модели, производителю, тегам или программе"><div id="items" class="muted">Загрузка…</div><div class="pager"><button id="prevPage" type="button" disabled>← Назад</button><span id="pageInfo" class="muted">Страница 1</span><button id="nextPage" type="button" disabled>Далее →</button></div></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),form=$('form');let pending=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function canonicalProgram(raw){const normalized=String(raw??'').trim().replace(/ /g,'');if(!normalized)return null;const parts=normalized.split(/[\/,;]/);if(!parts.length||parts.length>10||parts.some(x=>x===''||!/^\d+$/.test(x)||(x.length>1&&x[0]==='0')))return null;const values=parts.map(Number);if(values.some(x=>!Number.isSafeInteger(x)||x<1||x>9999))return null;return values.join('/')}function errorText(error){if(error==='invalid_coil_program')return 'Некорректная программа витков. Проверьте количество катушек и значения 1–9999.';if(error==='repair_registry_unavailable')return 'Каталог на microSD сейчас недоступен.';return error||'Ошибка сохранения'}function motorTitle(x){return esc(x.name)+(x.model?' · '+esc(x.model):'')}function motorDetails(x){const parts=[];if(x.rated_power_w)parts.push((x.rated_power_w/1000).toLocaleString('ru-RU')+' кВт');if(x.rated_voltage_v)parts.push(x.rated_voltage_v+' В');if(x.rated_speed_rpm)parts.push(x.rated_speed_rpm+' об/мин');if(x.slot_count)parts.push(x.slot_count+' пазов');if(x.pole_count)parts.push(x.pole_count+' полюсов');if(x.wire_diameter_hundredths_mm)parts.push('провод '+(x.wire_diameter_hundredths_mm/100).toLocaleString('ru-RU')+' мм'+(x.parallel_strands?' × '+x.parallel_strands:''));let h=parts.length?'<div>'+parts.map(esc).join(' · ')+'</div>':'';if(x.source_type||x.confidence)h+='<div class="muted">Источник: '+esc(x.source_type||'—')+' · доверие: '+esc(x.confidence||'—')+(x.source_title?' · '+esc(x.source_title):'')+'</div>';if(x.calculated_fields)h+='<div class="warn">Запись содержит расчётные поля.</div>';return h}let currentCursor=0,nextCursor=0,hasMore=false,cursorHistory=[],currentQuery='',pageNumber=1;
function render(j){$('items').innerHTML='';(j.items||[]).forEach(x=>{const d=document.createElement('div');d.className='item';const tags=(x.tags||'').split(',').filter(Boolean).map(t=>'<span class="badge">'+esc(t.trim())+'</span>').join('');d.innerHTML='<b>'+motorTitle(x)+'</b><div class="muted">ID '+x.motor_id+(x.manufacturer?' · '+esc(x.manufacturer):'')+'</div><div>Программа: '+esc(x.coil_program)+'</div>'+motorDetails(x)+'<div>'+tags+'</div><button type="button">Выбрать для ремонта</button>';d.querySelector('button').onclick=()=>{localStorage.setItem('cm-selected-motor',String(x.motor_id));location.href='/mobile/repairs.html?motor_id='+x.motor_id};$('items').appendChild(d)});if(!(j.items||[]).length)$('items').textContent='Двигатели не найдены.'}function updatePager(count){$('prevPage').disabled=cursorHistory.length===0;$('nextPage').disabled=!hasMore;$('pageInfo').textContent='Страница '+pageNumber+' · '+count+' записей'}
async function load(cursor=0,reset=false){if(reset){cursorHistory=[];pageNumber=1;currentQuery=$('search').value.trim();cursor=0}$('items').textContent='Загрузка…';try{const q=new URLSearchParams({limit:'20'});if(currentQuery)q.set('q',currentQuery);if(cursor)q.set('cursor',String(cursor));const r=await fetch('/api/motors?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Каталог двигателей недоступен.');currentCursor=cursor;hasMore=j.has_more===true;nextCursor=hasMore?Number(j.next_cursor):0;if(hasMore&&(!Number.isInteger(nextCursor)||nextCursor<=currentCursor))throw new Error('invalid_paging_cursor');render(j);updatePager((j.items||[]).length)}catch(e){$('items').textContent=e.message||'Каталог двигателей недоступен.';$('prevPage').disabled=true;$('nextPage').disabled=true}}
$('prevPage').onclick=()=>{if(!cursorHistory.length)return;const cursor=cursorHistory.pop();pageNumber=Math.max(1,pageNumber-1);load(cursor,false)};
$('nextPage').onclick=()=>{if(!hasMore)return;cursorHistory.push(currentCursor);pageNumber+=1;load(nextCursor,false)};
async function create(fd){const r=await fetch('/api/motors',{method:'POST',body:fd}),j=await r.json();if(r.ok){$('result').textContent='Двигатель сохранён, ID '+j.motor_id;form.reset();pending=null;$('similar').classList.add('hidden');$('confirm').classList.add('hidden');load(0,true)}else $('result').textContent=errorText(j.error)}function similarityHtml(j){let h='<b>Найдены похожие карточки</b><div>Та же программа: '+(j.same_program_count||0)+'</div><div>Совпадения по названию/модели/производителю: '+(j.identity_match_count||0)+'</div>';(j.items||[]).forEach(x=>{h+='<div class="item"><b>'+motorTitle(x)+'</b><div>'+esc(x.coil_program||'')+'</div><div class="muted">'+esc(x.match_level||'SAME_PROGRAM_ONLY')+'</div></div>'});if(j.items_truncated)h+='<div class="muted">Показаны первые '+Number(j.returned_count||0)+' из '+Number(j.same_program_count||0)+' совпадений. Уточните название, модель или производителя.</div>';h+='<div class="muted">Это предупреждение. Создание новой карточки не блокируется.</div>';return h}form.onsubmit=async e=>{e.preventDefault();const programInput=form.elements.coil_program,canonical=canonicalProgram(programInput.value);if(!canonical){$('result').textContent='Программа витков должна содержать 1–10 значений от 1 до 9999 без пустых сегментов и ведущих нулей.';programInput.focus();return}programInput.value=canonical;$('result').textContent='Проверка похожих двигателей…';const fd=new FormData(form),q=new URLSearchParams();['coil_program','name','model','manufacturer'].forEach(k=>q.set(k,fd.get(k)||''));try{const r=await fetch('/api/motors/similar?'+q.toString(),{cache:'no-store'}),j=await r.json();if(!r.ok){$('result').textContent=errorText(j.error);return}if((j.same_program_count||0)>0){pending=fd;$('similar').innerHTML=similarityHtml(j);$('similar').classList.remove('hidden');$('confirm').classList.remove('hidden');$('result').textContent='Проверьте найденные совпадения.'}else await create(fd)}catch(err){$('result').textContent='Не удалось проверить похожие двигатели.'}};$('confirm').onclick=()=>pending&&create(pending);$('search').oninput=()=>{clearTimeout(window.cmSearch);window.cmSearch=setTimeout(()=>load(0,true),250)};load(0,true);</script></body></html>
