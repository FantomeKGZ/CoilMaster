<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новый ремонт — CoilMaster</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:22px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar a{padding:11px 15px;border-radius:9px;text-decoration:none;font-weight:bold;background:#e7eef5;color:#17324b}.card{max-width:760px;background:#fff;border-radius:14px;padding:20px}label{display:block;font-weight:bold;margin-top:12px}select,input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pick a{padding:9px 12px;border-radius:8px;background:#e8f1f8;color:#105b91;text-decoration:none;font-weight:bold}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}@media(max-width:900px){.layout{display:block}aside{display:none}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/clients.html">Клиенты</a><a href="/desktop/motors.html">Двигатели</a></aside><main><div class="toolbar"><a href="/desktop/repairs.html">← Ремонты</a><a href="/desktop/client-new.html">+ Новый клиент</a><a href="/desktop/motor-new.html">+ Новый двигатель</a></div><h1>Новый ремонт</h1><section class="card"><form id="form"><label>Клиент</label><select id="clientId" name="client_id" required><option value="">Выберите клиента</option></select><div class="pick"><a href="/desktop/clients.html">Выбрать из каталога</a><a href="/desktop/client-new.html">Создать клиента</a></div><label>Двигатель</label><select id="motorId" name="motor_id" required><option value="">Выберите двигатель</option></select><div class="pick"><a href="/desktop/motors.html">Выбрать из каталога</a><a href="/desktop/motor-new.html">Создать двигатель</a></div><label>Дата приёмки</label><input id="received" name="received_at" type="datetime-local" required><textarea name="complaint" placeholder="Жалоба клиента"></textarea><textarea name="comment" placeholder="Комментарий"></textarea><button>Создать ремонт</button></form><p id="result" class="muted"></p></section></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),p=new URLSearchParams(location.search);const clientId=p.get('client_id')||localStorage.getItem('cm-selected-client')||'',motorId=p.get('motor_id')||localStorage.getItem('cm-selected-motor')||'';$('received').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);async function exact(path,key,id){if(!id)return null;const r=await fetch(path+'?'+new URLSearchParams({[key]:id}),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'catalog_unavailable');return j.item||null}async function loadPick(select,path,key,id,label){select.innerHTML='<option value="">Выберите</option>';if(!id)return;try{const x=await exact(path,key,id);if(!x)return;const o=document.createElement('option');o.value=id;o.textContent=label(x);select.appendChild(o);select.value=id}catch(_){select.innerHTML='<option value="">Выбранная запись недоступна</option>'}}loadPick($('clientId'),'/api/clients/by-id','client_id',clientId,x=>(x.name||'Клиент')+' · '+(x.phone||'без телефона'));loadPick($('motorId'),'/api/motors/by-id','motor_id',motorId,x=>[x.manufacturer,x.model].filter(Boolean).join(' ')||x.name||('Двигатель '+x.motor_id));$('form').onsubmit=async e=>{e.preventDefault();$('result').className='muted';$('result').textContent='Создание…';try{const r=await fetch('/api/repairs',{method:'POST',body:new FormData(e.target)}),j=await r.json();if(!r.ok)throw new Error(j.error||'repair_create_failed');localStorage.setItem('cm-active-repair',String(j.repair_id));$('result').className='ok';$('result').textContent='Ремонт №'+j.repair_id+' создан. Открываю список…';location.href='/desktop/repairs.html'}catch(err){$('result').className='bad';$('result').textContent=err.message}};</script></body></html>
