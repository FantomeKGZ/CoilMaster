<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калькуляция ремонта</title><style>body{font-family:Arial,sans-serif;margin:0;background:#eef2f6;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:24px;max-width:1200px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 2px 13px #17212b14}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5df;border-radius:9px;font-size:16px;margin-top:8px}button{background:#1769aa;color:#fff;border:0;font-weight:700}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf1f4}.total{font-size:25px;font-weight:700}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}@media(max-width:850px){.layout{display:block}aside{display:none}.grid{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/warehouse.html">Склад</a><a href="/desktop/calculator.html">Калькулятор</a><a href="/desktop/costing.html">Калькуляция ремонта</a><a href="/desktop/settings.html">Настройки</a></aside><main><h1>Калькуляция ремонта</h1><section class="card"><label>Номер ремонта</label><input id="repairId" type="number" min="1" placeholder="42"><button id="load">Загрузить</button><p id="message" class="muted">Укажите ремонт.</p></section><div class="grid" style="margin-top:14px"><section class="card"><h2>Себестоимость</h2><div class="row"><span>Провод</span><b id="wire">0,00</b></div><div class="row"><span>Дополнительные материалы</span><b id="materials">0,00</b></div><div class="row"><span>Работа мастера</span><b id="labour">0,00</b></div><div class="row total"><span>Итого</span><span id="total">0,00</span></div></section><section class="card"><h2>Цена клиенту</h2><form id="pricing"><label>Стоимость работы, сом</label><input id="labourInput" value="0,00"><label>Конечная цена, сом</label><input id="clientInput" value="0,00"><button>Сохранить калькуляцию</button></form><div class="row"><span>Маржа</span><b id="margin">0,00</b></div></section></div></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),money=v=>(Number(v)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' сом',minor=id=>Math.round(Number($(id).value.replace(',','.'))*100);async function load(){const id=$('repairId').value;if(!id)return;$('message').textContent='Загрузка…';try{const r=await fetch('/api/repairs/costing?repair_id='+encodeURIComponent(id),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');$('wire').textContent=money(j.wire_cost_minor);$('materials').textContent=money(j.material_cost_minor);$('labour').textContent=money(j.labour_cost_minor);$('total').textContent=money(j.total_cost_minor);$('margin').textContent=money(j.margin_minor);$('labourInput').value=(j.labour_cost_minor/100).toFixed(2).replace('.',',');$('clientInput').value=(j.client_price_minor/100).toFixed(2).replace('.',',');$('message').className='muted';$('message').textContent='Провод: '+j.wire_line_count+' списаний. Материалы: '+j.material_line_count+' позиций.'}catch(e){$('message').className='bad';$('message').textContent=e.message}}$('load').onclick=load;$('pricing').onsubmit=async e=>{e.preventDefault();const id=$('repairId').value;if(!id)return;const body=new URLSearchParams({repair_id:id,labour_cost_minor:String(minor('labourInput')),client_price_minor:String(minor('clientInput')),currency:'KGS',timestamp:new Date().toISOString()});try{const r=await fetch('/api/repairs/costing',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');$('message').className='ok';$('message').textContent='Калькуляция сохранена.';load()}catch(err){$('message').className='bad';$('message').textContent=err.message}};</script></body></html>
