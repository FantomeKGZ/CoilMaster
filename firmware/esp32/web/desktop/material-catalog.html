<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Каталог материалов</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:24px;max-width:1300px}.grid{display:grid;grid-template-columns:420px 1fr;gap:14px}.card{background:#fff;border-radius:15px;padding:20px}input,select,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.item{display:grid;grid-template-columns:1fr 360px;gap:16px;padding:14px 0;border-bottom:1px solid #e4eaf0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}@media(max-width:900px){.layout{display:block}aside{display:none}.grid,.item{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/warehouse.html">Склад провода</a><a href="/desktop/material-catalog.html">Материалы</a><a href="/desktop/costing.html">Калькуляция</a></aside><main><h1>Каталог дополнительных материалов</h1><div class="grid"><section class="card"><h2>Новый материал</h2><form id="create"><input name="name" placeholder="Название" required><select name="unit"><option value="PIECE">Штуки</option><option value="GRAM">Граммы</option><option value="MILLILITRE">Миллилитры</option><option value="METRE">Метры</option><option value="SQUARE_METRE">Квадратные метры</option></select><input name="stock" placeholder="Начальный остаток" required><input name="price" placeholder="Цена за единицу, сом" required><textarea name="comment" placeholder="Комментарий"></textarea><button>Добавить материал</button></form><p id="createResult" class="muted"></p></section><section class="card"><h2>Текущие запасы</h2><div id="items" class="muted">Загрузка…</div></section></div></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),num=v=>Number(String(v).replace(',','.')),units={PIECE:'шт',GRAM:'г',MILLILITRE:'мл',METRE:'м',SQUARE_METRE:'м²'},qty=v=>(v/1000).toLocaleString('ru-RU',{maximumFractionDigits:3}),money=v=>(v/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});async function load(){const r=await fetch('/api/materials',{cache:'no-store'}),j=await r.json();$('items').innerHTML='';j.items.forEach(x=>{const d=document.createElement('div');d.className='item';d.innerHTML='<div><b>'+x.name+'</b><div class="muted">Остаток: '+qty(x.stock_quantity_milli)+' '+units[x.unit]+'<br>Цена: '+money(x.price_per_unit_minor)+' '+x.currency+'</div></div><div><div class="row"><input class="add" placeholder="Пополнение"><input class="price" placeholder="Новая цена"></div><input class="comment" placeholder="Причина изменения"><button>Сохранить изменения</button><p class="msg muted"></p></div>';d.querySelector('button').onclick=async()=>{const add=num(d.querySelector('.add').value||0),price=num(d.querySelector('.price').value||0),body=new URLSearchParams({material_id:x.material_id,add_quantity_milli:String(Math.round(add*1000)),new_price_per_unit_minor:String(Math.round(price*100)),currency:x.currency||'KGS',timestamp:new Date().toISOString(),comment:d.querySelector('.comment').value});const rr=await fetch('/api/materials/adjust',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),jj=await rr.json();d.querySelector('.msg').className=rr.ok?'ok':'bad';d.querySelector('.msg').textContent=rr.ok?'Изменения сохранены. Операция №'+jj.adjustment_id:jj.error||'Ошибка';if(rr.ok)load()};$('items').appendChild(d)});if(!j.items.length)$('items').textContent='Материалов пока нет.'}$('create').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),stock=num(f.get('stock')),price=num(f.get('price'));f.delete('stock');f.delete('price');f.set('stock_quantity_milli',String(Math.round(stock*1000)));f.set('price_per_unit_minor',String(Math.round(price*100)));f.set('currency','KGS');const r=await fetch('/api/materials',{method:'POST',body:f}),j=await r.json();$('createResult').className=r.ok?'ok':'bad';$('createResult').textContent=r.ok?'Материал №'+j.material_id+' добавлен.':j.error||'Ошибка';if(r.ok){e.target.reset();load()}};load();</script></body></html>
