[platformio]
default_envs = uno
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

lib_deps =

build_src_filter =
    -<*>
    +<Core/*.cpp>
    +<Arduino/*.cpp>
    +<firmware/arduino/src/main.cpp>

build_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
    -flto
    -mcall-prologues
    -Wl,--relax
    -D_SS_MAX_RX_BUFF=32
    -DSERIAL_RX_BUFFER_SIZE=8
    -DSERIAL_TX_BUFFER_SIZE=8

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
extra_scripts = pre:scripts/platformio_build_id.py

; CM_LcdCompat intentionally shadows Wire.h only so Uno can stay bufferless.
; Declare the framework Wire library explicitly on ESP32 so include_next in the
; compatibility shim resolves the real TwoWire owner used by RTC/network code.
lib_deps =
    Wire

build_src_filter =
    -<*>
    +<firmware/esp32/src/*.cpp>

build_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
