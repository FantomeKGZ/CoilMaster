<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новый материал — CoilMaster</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:24px}.card{max-width:700px;background:#fff;border-radius:15px;padding:20px}input,select,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}@media(max-width:900px){.layout{display:block}aside{display:none}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/material-catalog.html">Материалы</a><a href="/desktop/warehouse.html">Склад</a></aside><main><p><a href="/desktop/material-catalog.html">← Каталог материалов</a></p><h1>Новый материал</h1><section class="card"><form id="form"><input name="name" placeholder="Название" required><select name="unit"><option value="PIECE">Штуки</option><option value="GRAM">Граммы</option><option value="MILLILITRE">Миллилитры</option><option value="METRE">Метры</option><option value="SQUARE_METRE">Квадратные метры</option></select><input name="stock" placeholder="Начальный остаток" required><input name="price" placeholder="Цена за единицу, сом" required><textarea name="comment" placeholder="Комментарий"></textarea><button>Добавить материал</button></form><p id="result" class="muted"></p></section></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),num=v=>Number(String(v).replace(',','.'));$('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),stock=num(f.get('stock')),price=num(f.get('price'));if(!Number.isFinite(stock)||stock<0||!Number.isFinite(price)||price<0){$('result').className='bad';$('result').textContent='Проверьте остаток и цену.';return}f.delete('stock');f.delete('price');f.set('stock_quantity_milli',String(Math.round(stock*1000)));f.set('price_per_unit_minor',String(Math.round(price*100)));f.set('currency','KGS');const r=await fetch('/api/materials',{method:'POST',body:f}),j=await r.json();$('result').className=r.ok?'ok':'bad';$('result').textContent=r.ok?'Материал №'+j.material_id+' добавлен.':j.error||'Ошибка';if(r.ok)location.href='/desktop/material-catalog.html'};</script></body></html>
