name: Hall calibration foundation finalize

on:
  push:
    branches: [cmp-protocol-v1]
    paths:
      - '.github/workflows/hall-calibration-foundation-finalize.yml'
      - 'Arduino/CM_HallCalibrationService.h'
      - 'Arduino/CM_HallCalibrationService.cpp'
      - 'Arduino/CM_SsrController.h'
      - 'Arduino/CM_SsrController.cpp'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
          fetch-depth: 0

      - name: Guard and integrate calibration foundation
        shell: bash
        run: |
          set -euo pipefail
          expected='5061d627b5393033c5feca128c4ad4299199f66b'
          actual="$(git hash-object firmware/arduino/src/main.cpp)"
          test "$actual" = "$expected" || {
            echo "Arduino main.cpp blob changed: expected $expected actual $actual"
            exit 1
          }
          python3 - <<'PY'
          from pathlib import Path

          path = Path('firmware/arduino/src/main.cpp')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '#include "../../../Arduino/CM_HallTelemetry.h"\n',
                  '#include "../../../Arduino/CM_HallTelemetry.h"\n#include "../../../Arduino/CM_HallCalibrationService.h"\n'
              ),
              (
                  'CM::HallTelemetryService hallTelemetry(hall);\n',
                  'CM::HallTelemetryService hallTelemetry(hall);\nCM::HallCalibrationService hallCalibration(hall);\n'
              ),
              (
                  'bool simulationMode()\n{\n#if CM_FEATURE_SIMULATION\n    return true;\n#else\n    return false;\n#endif\n}\n',
                  'bool simulationMode()\n{\n#if CM_FEATURE_SIMULATION\n    return true;\n#else\n    return false;\n#endif\n}\n\nbool hallCalibrationEnvironmentSafe()\n{\n    return machine.state() == CM::MachineState::EnterCoilCount &&\n           !machine.job().isValid();\n}\n'
              ),
              (
                  '    const char key = keypad.getKey();\n    if (key == NO_KEY) return;\n    if (processEmergencyJobClearKey(key)) return;\n',
                  '    const char key = keypad.getKey();\n    if (key == NO_KEY) return;\n    if (hallCalibration.active())\n    {\n        hallCalibration.abort();\n        ssr.forceOff();\n        Serial.println(F("CM_HALL_CAL abort=KEYPAD_INPUT"));\n        return;\n    }\n    if (processEmergencyJobClearKey(key)) return;\n'
              ),
              (
                  'void processExternalStart(uint32_t nowMs)\n{\n#if CM_FEATURE_EXTERNAL_START\n    if (startButton.pollPressed(nowMs))\n    {\n        CM::KeyEvent event;\n        event.action = CM::InputAction::StartOrResume;\n        input.handleEvent(event);\n    }\n#else\n    (void)nowMs;\n#endif\n}\n',
                  'void processExternalStart(uint32_t nowMs)\n{\n#if CM_FEATURE_EXTERNAL_START\n    if (startButton.pollPressed(nowMs))\n    {\n        if (hallCalibration.state() == CM::HallCalibrationState::ArmedWaitingPhysicalStart)\n        {\n            const bool started = hallCalibration.physicalStart(nowMs);\n            Serial.println(started ? F("CM_HALL_CAL physical_start=ACCEPTED")\n                                   : F("CM_HALL_CAL physical_start=BASELINE_NOT_READY"));\n            return;\n        }\n        if (hallCalibration.state() == CM::HallCalibrationState::Running)\n        {\n            hallCalibration.abort();\n            ssr.forceOff();\n            Serial.println(F("CM_HALL_CAL abort=PHYSICAL_START_PRESSED_AGAIN"));\n            return;\n        }\n        CM::KeyEvent event;\n        event.action = CM::InputAction::StartOrResume;\n        input.handleEvent(event);\n    }\n#else\n    (void)nowMs;\n#endif\n}\n'
              ),
              (
                  '    while (espTransport.takeRemoteJob(remoteJob))\n    {\n        const bool accepted = machine.loadRemoteJob(remoteJob);\n',
                  '    while (espTransport.takeRemoteJob(remoteJob))\n    {\n        if (hallCalibration.active())\n        {\n            espTransport.sendJobResult(remoteJob.jobId, false, "BUSY_CALIBRATION");\n            continue;\n        }\n        const bool accepted = machine.loadRemoteJob(remoteJob);\n'
              ),
              (
                  'void updateOutputs()\n{\n#if CM_FEATURE_SSR\n    ssr.update(machine.state(), simulationMode());\n#endif\n',
                  'void processHallCalibration(uint32_t nowMs)\n{\n    if (!hallCalibration.active()) return;\n    if (hallTelemetry.enabled()) hallTelemetry.setEnabled(false, nowMs);\n\n    hallCalibration.update(nowMs, hallCalibrationEnvironmentSafe());\n    if (hallCalibration.state() == CM::HallCalibrationState::Aborted ||\n        hallCalibration.state() == CM::HallCalibrationState::Completed)\n    {\n        ssr.forceOff();\n    }\n}\n\nvoid updateOutputs()\n{\n#if CM_FEATURE_SSR\n    ssr.update(machine.state(), simulationMode(), hallCalibration.motorPermit());\n#endif\n'
              ),
              (
                  '    updateOutputs();\n    processAliveReport(nowMs);\n',
                  '    processHallCalibration(nowMs);\n    updateOutputs();\n    processAliveReport(nowMs);\n'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'anchor count {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit integration locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/arduino/src/main.cpp
          git commit -m 'feat: integrate physical-start Hall calibration foundation'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Arduino Uno
        run: pio run -e uno

      - name: Build ESP32 regression
        run: pio run -e esp32

      - name: Finalize and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hall-calibration-foundation-finalize.yml
          git add -A
          git commit -m 'chore: finalize verified Hall calibration foundation'
          git push origin HEAD:cmp-protocol-v1
