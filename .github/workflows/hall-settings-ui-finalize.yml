name: Hall settings UI finalize

on:
  push:
    branches: [cmp-protocol-v1]
    paths:
      - '.github/workflows/hall-settings-ui-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
          fetch-depth: 0

      - name: Guard and link Hall pages from Settings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object firmware/esp32/web/desktop/settings.html)" = '2c47e3d6dec7a2f201d21ab7fe95803d37596558'
          test "$(git hash-object firmware/esp32/web/mobile/settings.html)" = '1a410fcc81ae1886927fb4b0bf8d22d8254d4f46'
          python3 - <<'PY'
          from pathlib import Path

          changes = [
              (
                  Path('firmware/esp32/web/desktop/settings.html'),
                  '<a class="settings-link" href="/desktop/settings-ftp.html">',
                  '<a class="settings-link" href="/desktop/settings-hall.html"><b>🧲 Датчик Холла / оборудование</b><span>Порог, гистерезис, направление сигнала и безопасная живая телеметрия Arduino.</span></a><a class="settings-link" href="/desktop/settings-ftp.html">'
              ),
              (
                  Path('firmware/esp32/web/mobile/settings.html'),
                  '<a class="settings-link" href="/mobile/settings-ftp.html">',
                  '<a class="settings-link" href="/mobile/settings-hall.html"><b>🧲 Датчик Холла</b><span>Порог, гистерезис и безопасная живая проверка сигнала Arduino.</span></a><a class="settings-link" href="/mobile/settings-ftp.html">'
              ),
          ]

          for path, old, new in changes:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: anchor count {text.count(old)}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit Settings links locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/esp32/web/desktop/settings.html firmware/esp32/web/mobile/settings.html
          git commit -m 'feat: link Hall controls from settings'

      - name: Verify Hall UI contracts
        shell: bash
        run: |
          set -euo pipefail
          for page in firmware/esp32/web/desktop/settings-hall.html firmware/esp32/web/mobile/settings-hall.html; do
            test -s "$page"
            grep -q '/api/hardware/hall/settings' "$page"
            grep -q '/api/hardware/hall/telemetry/start' "$page"
            grep -q '/api/hardware/hall/telemetry/stop' "$page"
            grep -q 'physical\|физичес' "$page"
          done
          grep -q '/desktop/settings-hall.html' firmware/esp32/web/desktop/settings.html
          grep -q '/mobile/settings-hall.html' firmware/esp32/web/mobile/settings.html
          node Tests/Web/check_web_assets.js
          node Tests/Web/check_release_contracts.js
          node Tests/Web/check_final_acceptance_contracts.js

      - name: Finalize and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hall-settings-ui-finalize.yml
          git add -A
          git commit -m 'chore: finalize verified Hall settings UI'
          git push origin HEAD:cmp-protocol-v1
