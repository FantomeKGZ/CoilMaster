<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Новая бухта — CoilMaster</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}details{margin-top:12px}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}</style></head><body><header><a href="/mobile/warehouse.html">← Склад</a><b style="float:right">➕ Новая бухта</b></header><main><section class="card"><form id="form"><label>Материал провода</label><select name="wire_type" required><option value="CU">Медь (CU)</option><option value="AL">Алюминий (AL)</option></select><label>Диаметр, мм</label><input name="diameter_mm" inputmode="decimal" placeholder="0,80" required><label>Текущий вес, кг</label><input name="weight_kg" inputmode="decimal" placeholder="13,420" required><details><summary>Дополнительные данные</summary><input name="manufacturer" placeholder="Производитель"><input name="supplier" placeholder="Поставщик"><input name="batch" placeholder="Номер партии"><input name="storage_location" placeholder="Место хранения"><textarea name="comment" placeholder="Комментарий"></textarea></details><button id="saveBtn">Сохранить бухту</button></form><p id="result" class="muted">Материал обязателен: медь или алюминий.</p></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),num=v=>Number(String(v).trim().replace(',','.'));let sending=false;$('form').onsubmit=async e=>{e.preventDefault();if(sending)return;const f=new FormData(e.target),d=num(f.get('diameter_mm')),w=num(f.get('weight_kg'));if(!Number.isFinite(d)||d<=0||!Number.isFinite(w)||w<=0){$('result').className='bad';$('result').textContent='Проверьте диаметр и вес.';return}sending=true;$('saveBtn').disabled=true;f.delete('diameter_mm');f.delete('weight_kg');f.set('diameter_hundredths_mm',String(Math.round(d*100)));f.set('current_weight_g',String(Math.round(w*1000)));$('result').className='muted';$('result').textContent='Сохранение…';try{const r=await fetch('/api/warehouse/spools',{method:'POST',body:f}),j=await r.json();if(!r.ok)throw new Error(j.error||'spool_create_failed');if(!j.spool_id)throw new Error('spool_id_missing');$('result').className='ok';$('result').textContent='Бухта №'+j.spool_id+' сохранена.';location.href='/mobile/warehouse.html'}catch(err){$('result').className='bad';$('result').textContent='Ошибка: '+(err.message||'unknown')}finally{sending=false;$('saveBtn').disabled=false}};</script></body></html>
