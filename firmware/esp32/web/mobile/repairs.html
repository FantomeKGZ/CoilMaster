<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ремонты — CoilMaster</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{position:sticky;top:0;background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.toolbar a{padding:12px 8px;border-radius:10px;background:#e8f1f8;color:#105b91;text-decoration:none;text-align:center;font-weight:bold}.toolbar a:first-child{background:#1769aa;color:#fff}.card{background:#fff;border-radius:15px;padding:16px}.item{padding:14px 0;border-bottom:1px solid #e5ebf0}.item:last-child{border:0}.muted{color:#687580}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f7ee;color:#17683a;font-size:13px;font-weight:bold}.status.closed{background:#e8edf2;color:#53606b}.links{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.links a{padding:9px;border-radius:8px;background:#e8f1f8;color:#105b91;text-decoration:none;text-align:center;font-weight:bold;font-size:13px}select,button{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd5df;border-radius:9px;font-size:15px}.preflight{margin-top:9px;padding:10px;border-radius:9px;background:#f3f7fa}.preflight.ready{background:#e8f7ee;color:#17683a}.preflight.blocked{background:#fff4d6;color:#7a4b00}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.controls button{border:0;color:#fff;font-weight:bold;background:#5b6874}.controls .close{background:#8b2d2d}.controls button:disabled{opacity:.45}.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}.pager button{width:auto}.pager span{min-width:125px;text-align:center}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}@media(max-width:430px){.toolbar{grid-template-columns:1fr}.links{grid-template-columns:1fr}}</style></head><body><header><a href="/mobile/">← Главная</a><b style="float:right">🧰 Ремонты</b></header><main><div class="toolbar"><a href="/mobile/repair-new.html">+ Новый ремонт</a><a href="/mobile/client-new.html">+ Новый клиент</a><a href="/mobile/motor-new.html">+ Новый двигатель</a></div><section class="card"><label for="repairFilter"><b>Показывать</b></label><select id="repairFilter"><option value="OPEN">Открытые</option><option value="CLOSED">Закрытые</option><option value="ALL">Все</option></select><div id="items" class="muted">Загрузка…</div><div class="pager"><button id="prevPage" type="button" disabled>← Назад</button><span id="pageInfo" class="muted">Страница 1</span><button id="nextPage" type="button" disabled>Далее →</button></div></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dateLabel=v=>{if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('ru-RU')};const saved=localStorage.getItem('cm-repair-filter')||'OPEN';$('repairFilter').value=['OPEN','CLOSED','ALL'].includes(saved)?saved:'OPEN';let cursor=0,next=0,more=false,history=[],page=1;function reason(e){const m={repair_has_unfinished_winding_job:'Намотка ещё не завершена.',repair_finalization_wire_writeoff_required:'Требуется ручное списание провода.',repair_finalization_wire_writeoff_storage_unavailable:'Хранилище списаний недоступно.',repair_finalization_wire_writeoff_integrity_failed:'Ошибка целостности списания.',repair_finalization_costing_storage_unavailable:'Калькуляция недоступна.',repair_finalization_winding_storage_unavailable:'История намотки недоступна.',repair_finalization_costing_integrity_failed:'Ошибка целостности калькуляции.',repair_finalization_winding_integrity_failed:'Ошибка целостности истории намотки.'};return m[e]||e||'unknown'}async function check(id,box,closeBtn,checkBtn){checkBtn.disabled=true;box.className='preflight';box.textContent='Проверка…';try{const r=await fetch('/api/repairs/finalization?repair_id='+encodeURIComponent(id),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'finalization_failed');const ready=j.ready_to_close===true;box.className='preflight '+(ready?'ready':'blocked');box.textContent=ready?'Ремонт готов к закрытию.':'Не готов: '+reason(j.reason);closeBtn.disabled=!ready}catch(e){box.className='preflight blocked';box.textContent='Не готов: '+reason(e.message);closeBtn.disabled=true}finally{checkBtn.disabled=false}}async function closeRepair(id){if(!confirm('Закрыть ремонт №'+id+'?'))return;const body=new URLSearchParams({repair_id:String(id),closed_at:new Date().toISOString(),confirmed:'true'}),r=await fetch('/api/repairs/close',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok){alert(reason(j.error));return}load(cursor,false)}function render(items){$('items').innerHTML='';if(!items.length){$('items').textContent='Ремонты не найдены.';return}for(const x of items){const id=x.repair_id,status=x.current_status||x.status||'OPEN',closed=status==='CLOSED',d=document.createElement('div');d.className='item';d.innerHTML='<b>Ремонт №'+esc(id)+'</b> <span class="status'+(closed?' closed':'')+'">'+(closed?'Закрыт':'Открыт')+'</span><div class="muted">Клиент ID '+esc(x.client_id)+' · Двигатель ID '+esc(x.motor_id)+'</div><div class="muted">Принят: '+esc(dateLabel(x.received_at))+'</div>'+(x.complaint?'<div>Жалоба: '+esc(x.complaint)+'</div>':'')+'<div class="links"><a href="/mobile/client-details.html?client_id='+encodeURIComponent(x.client_id)+'">Клиент</a><a href="/mobile/motor-details.html?motor_id='+encodeURIComponent(x.motor_id)+'">Двигатель</a><a href="/mobile/winding-history.html?repair_id='+encodeURIComponent(id)+'">История намотки</a><a href="/mobile/costing.html?repair_id='+encodeURIComponent(id)+'">'+(closed?'Итог ремонта':'Калькуляция')+'</a>'+(closed?'':'<a href="/mobile/winding-job.html?repair_id='+encodeURIComponent(id)+'">Намотка</a><a href="/mobile/writeoff.html?repair_id='+encodeURIComponent(id)+'">Списание провода</a>')+'</div>';if(!closed){const box=document.createElement('div'),controls=document.createElement('div'),checkBtn=document.createElement('button'),closeBtn=document.createElement('button');box.className='preflight';box.textContent='Готовность к закрытию ещё не проверена.';controls.className='controls';checkBtn.textContent='Проверить';closeBtn.textContent='Закрыть ремонт';closeBtn.className='close';closeBtn.disabled=true;checkBtn.onclick=()=>check(id,box,closeBtn,checkBtn);closeBtn.onclick=()=>closeRepair(id);controls.append(checkBtn,closeBtn);d.append(box,controls)}$('items').appendChild(d)}}function pager(n){$('prevPage').disabled=!history.length;$('nextPage').disabled=!more;$('pageInfo').textContent='Страница '+page+' · '+n+' записей'}async function load(c=0,reset=false){if(reset){history=[];page=1;c=0}$('items').textContent='Загрузка…';try{const q=new URLSearchParams({limit:'20'});if(params.get('client_id'))q.set('client_id',params.get('client_id'));if($('repairFilter').value!=='ALL')q.set('status',$('repairFilter').value);if(c)q.set('cursor',String(c));const r=await fetch('/api/repairs?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'repair_catalog_unavailable');cursor=c;more=j.has_more===true;next=more?Number(j.next_cursor):0;if(more&&(!Number.isInteger(next)||next<=cursor))throw new Error('invalid_paging_cursor');render(j.items||[]);pager((j.items||[]).length)}catch(e){$('items').textContent='Ошибка: '+(e.message||'unknown');$('prevPage').disabled=true;$('nextPage').disabled=true}}$('repairFilter').onchange=()=>{localStorage.setItem('cm-repair-filter',$('repairFilter').value);load(0,true)};$('prevPage').onclick=()=>{if(!history.length)return;const c=history.pop();page--;load(c,false)};$('nextPage').onclick=()=>{if(!more)return;history.push(cursor);page++;load(next,false)};load(0,true);</script></body></html>
