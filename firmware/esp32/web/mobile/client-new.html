<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Новый клиент — CoilMaster</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}button:disabled{background:#9aa7b1}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}</style></head><body><header><a href="/mobile/clients.html">← Клиенты</a><b style="float:right">👤 Новый клиент</b></header><main><section class="card"><form id="form"><input name="name" maxlength="96" placeholder="Имя клиента" required><input name="phone" maxlength="48" inputmode="tel" placeholder="Телефон" required><textarea name="comment" maxlength="320" placeholder="Комментарий"></textarea><button id="save">Сохранить клиента</button></form><p id="result" class="muted"></p></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id);let sending=false;$('form').onsubmit=async e=>{e.preventDefault();if(sending)return;sending=true;$('save').disabled=true;$('result').className='muted';$('result').textContent='Сохранение…';try{const r=await fetch('/api/clients',{method:'POST',body:new FormData(e.target)}),j=await r.json();if(!r.ok)throw new Error(j.error||'client_create_failed');if(!j.client_id)throw new Error('client_id_missing');localStorage.setItem('cm-selected-client',String(j.client_id));$('result').className='ok';$('result').textContent='Клиент создан, ID '+j.client_id+'.';location.href='/mobile/clients.html'}catch(err){$('result').className='bad';$('result').textContent='Ошибка: '+(err.message||'unknown');sending=false;$('save').disabled=false}};</script></body></html>
