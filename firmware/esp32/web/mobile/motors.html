<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Двигатели — CoilMaster</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{position:sticky;top:0;background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.toolbar a{padding:12px 8px;border-radius:10px;background:#e8f1f8;color:#105b91;text-decoration:none;text-align:center;font-weight:bold}.toolbar a:first-child{background:#1769aa;color:#fff}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.item{padding:12px 0;border-bottom:1px solid #e5ebf0}.item:last-child{border:0}.muted{color:#687580}.badge{display:inline-block;background:#e7eef5;border-radius:999px;padding:4px 8px;margin:5px 5px 0 0;font-size:13px}.spec{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}.spec span{background:#f3f7fa;padding:8px;border-radius:8px}.row-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.row-actions a,.row-actions button{box-sizing:border-box;width:100%;padding:11px;border-radius:10px;font-size:15px;font-weight:bold;text-align:center;text-decoration:none}.row-actions button{grid-column:1/-1}.details-link{background:#e7eef5;color:#17324b}.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}.pager button{width:auto;margin:0}.pager span{min-width:120px;text-align:center}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:# n render(items){$('items').innerHTML='';if(!items.length){$('items').textContent='Двигатели не найдены.';return}for(const x of items){const d=document.createElement('div');d.className='item';const tags=(x.tags||'').split(',').filter(Boolean).map(t=>'<span class="badge">'+esc(t.trim())+'</span>').join('');d.innerHTML='<b>'+esc(title(x))+'</b><div class="muted">ID '+esc(x.motor_id)+'</div>'+details(x)+'<div>'+tags+'</div><div class="row-actions"><a class="details-link" href="/mobile/motor-details.html?motor_id='+encodeURIComponent(x.motor_id)+'">Подробнее</a><a class="details-link" href="/mobile/motor-edit.html?motor_id='+encodeURIComponent(x.motor_id)+'">Редактировать</a><button type="button">Выбрать для ремонта</button></div>';d.querySelector('button').onclick=()=>{localStorage.setItem('cm-selected-motor',String(x.motor_id));location.href='/mobile/repair-new.html?motor_id='+encodeURIComponent(x.motor_id)};$('items').appendChild(d)}}function pager(n){$('prevPage').disabled=!history.length;$('nextPage').disabled=!more;$('pageInfo').textContent='Страница '+page+' · '+n+' записей'}async function load(c=0,reset=false){if(reset){history=[];page=1;query=$('search').value.trim();c=0}$('items').textContent='Загрузка…';try{const q=new URLSearchParams({limit:'20'});if(query)q.set('q',query);if(c)q.set('cursor',String(c));const r=await fetch('/api/motors?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'motor_catalog_unavailable');cursor=c;more=j.has_more===true;next=more?Number(j.next_cursor):0;if(more&&(!Number.isInteger(next)||next<=cursor))throw new Error('invalid_paging_cursor');render(j.items||[]);pager((j.items||[]).length)}catch(e){$('items').textContent='Ошибка: '+(e.message||'unknown');$('prevPage').disabled=true;$('nextPage').disabled=true}}$('prevPage').onclick=()=>{if(!history.length)return;const c=history.pop();page--;load(c,false)};$('nextPage').onclick=()=>{if(!more)return;history.push(cursor);page++;load(next,false)};$('search').oninput=()=>{clearTimeout(window.cmSearch);window.cmSearch=setTimeout(()=>load(0,true),250)};load(0,true);</script></body></html>
