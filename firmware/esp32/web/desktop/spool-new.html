<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новая бухта — CoilMaster</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:24px}.card{max-width:760px;background:#fff;border-radius:15px;padding:20px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}details{margin-top:12px}@media(max-width:900px){.layout{display:block}aside{display:none}.row{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/warehouse.html">Склад</a><a href="/desktop/material-catalog.html">Материалы</a></aside><main><p><a href="/desktop/warehouse.html">← Склад провода</a></p><h1>Новая бухта</h1><section class="card"><form id="form"><label>Материал провода</label><select name="wire_type" required><option value="CU">Медь (CU)</option><option value="AL">Алюминий (AL)</option></select><div class="row"><div><label>Диаметр, мм</label><input name="diameter_mm" placeholder="0,80" required></div><div><label>Текущий вес, кг</label><input name="weight_kg" placeholder="13,420" required></div></div><details><summary>Дополнительные данные</summary><input name="manufacturer" placeholder="Производитель"><input name="supplier" placeholder="Поставщик"><input name="batch" placeholder="Номер партии"><input name="storage_location" placeholder="Место хранения"><textarea name="comment" placeholder="Комментарий"></textarea></details><button>Сохранить бухту</button></form><p id="result" class="muted">Материал обязателен: медь или алюминий.</p></section></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),num=v=>Number(String(v).trim().replace(',','.'));$('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),d=num(f.get('diameter_mm')),w=num(f.get('weight_kg'));if(!Number.isFinite(d)||d<=0||!Number.isFinite(w)||w<=0){$('result').className='bad';$('result').textContent='Проверьте диаметр и вес.';return}f.delete('diameter_mm');f.delete('weight_kg');f.set('diameter_hundredths_mm',String(Math.round(d*100)));f.set('current_weight_g',String(Math.round(w*1000)));$('result').className='muted';$('result').textContent='Сохранение…';try{const r=await fetch('/api/warehouse/spools',{method:'POST',body:f}),j=await r.json();if(!r.ok)throw new Error(j.error||'spool_create_failed');$('result').className='ok';$('result').textContent='Бухта №'+j.spool_id+' сохранена.';location.href='/desktop/warehouse.html'}catch(err){$('result').className='bad';$('result').textContent='Ошибка: '+err.message}};</script></body></html>
