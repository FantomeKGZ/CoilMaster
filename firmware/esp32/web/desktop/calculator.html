<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калькулятор проводника</title><style>body{font-family:Arial,sans-serif;margin:0;background:#eef2f6;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#17212b;color:#fff;padding:24px}aside a{display:block;color:#fff;text-decoration:none;padding:11px 0}main{padding:28px;max-width:1100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 14px #17212b14}label{display:block;margin:12px 0 5px;font-weight:700}input,select,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #c8d0d8;border-radius:9px;font-size:15px}button{margin-top:18px;background:#1769aa;color:#fff;border:0;font-weight:700}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{display:grid;grid-template-columns:80px 1fr 180px;align-items:center;border-bottom:1px solid #e0e6eb;padding:14px 0}.rank{font-size:25px;font-weight:700}.stock{color:#167a3b;font-weight:700}.buy{color:#a45c00;font-weight:700}.muted{color:#63707c}.note{background:#f3f7fa;padding:12px;border-radius:9px}.note a{color:#1769aa}@media(max-width:800px){.layout{display:block}aside{display:none}.grid{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/warehouse.html">Склад</a><a href="/desktop/calculator.html">Калькулятор</a><a href="/desktop/settings.html">Настройки</a></aside><main><h1>Конвертация алюминий ↔ медь</h1><div class="grid"><section class="card"><div class="fields"><div><label>Исходный материал</label><select id="sourceMaterial"><option value="AL">Алюминий</option><option value="CU">Медь</option></select></div><div><label>Целевой материал</label><select id="targetMaterial"><option value="CU">Медь</option><option value="AL">Алюминий</option></select></div><div><label>Диаметр одной жилы, мм</label><input id="diameter" value="0.80"></div><div><label>Параллельных жил</label><input id="strands" type="number" min="1" max="12" value="3"></div></div><button id="calculate">Получить рекомендации</button><p id="settingsInfo" class="note muted">Загрузка настроек калькулятора…</p><p id="message" class="muted"></p></section><section class="card"><h2>Рекомендуемые варианты</h2><div id="results"><p class="muted">Результаты появятся после расчёта.</p></div></section></div></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id);let settingsConfigured=false;const hundredths=v=>Math.round(Number(String(v).replace(',','.'))*100),mm=v=>(v/100).toFixed(2).replace('.',',');function sync(){if($('sourceMaterial').value===$('targetMaterial').value)$('targetMaterial').value=$('sourceMaterial').value==='AL'?'CU':'AL'}async function loadSettings(){settingsConfigured=false;try{const r=await fetch('/api/calculator/settings',{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');if(!j.configured){$('settingsInfo').innerHTML='Калькулятор ещё не настроен. <a href="/desktop/settings.html">Открыть настройки</a>.';return false}settingsConfigured=true;$('settingsInfo').textContent='Методика: Al→Cu '+j.aluminium_to_copper_permille+' ‰, Cu→Al '+j.copper_to_aluminium_permille+' ‰, допуск '+(j.allowed_deviation_permille/10).toFixed(1).replace('.',',')+' %, до '+j.max_target_strands+' жил, смешанные диаметры '+(j.allow_mixed_diameters?'разрешены':'выключены')+'.';return true}catch(e){$('settingsInfo').textContent='Настройки недоступны. Откройте раздел «Настройки».';return false}}$('sourceMaterial').onchange=sync;$('targetMaterial').onchange=sync;$('calculate').onclick=async()=>{sync();if(!settingsConfigured&&!(await loadSettings()))return;const d=hundredths($('diameter').value);if(!d){$('message').textContent='Неверный диаметр';return}const q=new URLSearchParams({source_material:$('sourceMaterial').value,target_material:$('targetMaterial').value,source_diameter_hundredths_mm:d,source_parallel_strands:$('strands').value});$('message').textContent='Выполняется расчёт...';try{const r=await fetch('/api/calculator/conductor?'+q),data=await r.json();if(!r.ok){if(data.error==='calculator_not_configured'){settingsConfigured=false;$('settingsInfo').innerHTML='Калькулятор ещё не настроен. <a href="/desktop/settings.html">Открыть настройки</a>.';throw new Error('Сначала сохраните настройки калькулятора.')}throw new Error(data.error||'Ошибка')}$('message').textContent='Каталог: '+data.catalogue_diameter_count+' диаметров. Найдено: '+data.recommendation_count;const box=$('results');box.innerHTML='';if(!data.recommendations.length){box.innerHTML='<p class="muted">Нет подходящих вариантов в заданном допуске.</p>';return}data.recommendations.forEach(o=>{const stock=o.availability==='IN_STOCK',row=document.createElement('div');row.className='result';const parts=(o.components||[]).map(c=>c.parallel_strands+' × '+mm(c.diameter_hundredths_mm)+' мм').join(' + ')||o.parallel_strands+' × '+mm(o.diameter_hundredths_mm)+' мм';row.innerHTML='<div class="rank">№'+o.rank+'</div><div><strong>'+parts+'</strong><br><span class="muted">Отклонение '+(o.deviation_permille/10).toFixed(1).replace('.',',')+' %</span></div><div class="'+(stock?'stock':'buy')+'">'+(stock?'Есть на складе':'Закупить')+'</div>';box.appendChild(row)})}catch(e){$('message').textContent=e.message}};loadSettings();</script></body></html>
