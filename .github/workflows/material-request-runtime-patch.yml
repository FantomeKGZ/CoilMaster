name: One-shot material request runtime patch

on:
  push:
    branches:
      - cmp-protocol-v1
    paths:
      - ".github/workflows/material-request-runtime-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
          fetch-depth: 0
      - name: Guard and patch RepairRegistryWeb runtime bootstrap
        shell: bash
        run: |
          set -euo pipefail
          FILE=firmware/esp32/src/CM_RepairRegistryWeb.cpp
          EXPECTED=907a4adfb5e8e0c19bbcbbc5cf1ffc0ebd2d4ace
          ACTUAL=$(git hash-object "$FILE")
          test "$ACTUAL" = "$EXPECTED" || { echo "blob changed: $ACTUAL"; exit 1; }
          python3 -c "from pathlib import Path; p=Path('$FILE'); s=p.read_text(); a='#include \"CM_RepairRegistryLookupWeb.h\"\n'; b=a+'#include \"CM_MaterialRequestRuntime.h\"\n'; assert a in s and b not in s; s=s.replace(a,b,1); a='    m_intake->begin();\n'; b=a+'    beginMaterialRequestRuntime(m_server, m_registry);\n'; assert a in s and b not in s; p.write_text(s.replace(a,b,1))"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'feat(crm): start material request runtime with repair registry'
          git push origin HEAD:cmp-protocol-v1
