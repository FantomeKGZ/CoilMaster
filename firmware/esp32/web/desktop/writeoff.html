<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Списание провода</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:24px;max-width:900px}.card{background:#fff;border-radius:15px;padding:20px}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}button:disabled{opacity:.55}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}.warning{background:#fff4d6;border:1px solid #e0bc55;padding:11px;border-radius:9px;margin-top:10px}.info{background:#f3f7fa;padding:11px;border-radius:9px;margin-top:10px}.filters{display:flex;gap:8px;margin-bottom:10px}.filters button{width:auto;margin:0;padding:9px 16px;background:#e8eef4;color:#33414d}.filters button.active{background:#1769aa;color:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.layout{display:block}aside{display:none}.formgrid{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/warehouse.html">Склад</a><a href="/desktop/costing.html">Калькуляция</a></aside><main><h1>Списание провода</h1><section class="card"><p>Ремонт: <b id="repairLabel">не выбран</b></p><div class="filters"><button type="button" data-material="ALL" class="active">Все</button><button type="button" data-material="CU">Медь</button><button type="button" data-material="AL">Алюминий</button></div><form id="form"><label>Бухта</label><select id="spool" required><option value="">Загрузка…</option></select><div id="spoolInfo" class="info muted">Выберите бухту.</div><div class="formgrid"><div><label>Вес до работы, кг</label><input id="before" required></div><div><label>Вес после работы, кг</label><input id="after" required></div></div><label>Комментарий</label><input id="comment"><button id="submitButton">Подтвердить списание</button></form><p id="result" class="muted"></p></section></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),repairId=p.get('repair_id')||localStorage.getItem('cm-active-repair')||'';if(repairId){localStorage.setItem('cm-active-repair',repairId);$('repairLabel').textContent='№'+repairId}else $('result').textContent='Откройте списание из карточки ремонта.';const grams=v=>Math.round(Number(String(v).replace(',','.'))*1000),kg=v=>(v/1000).toFixed(3).replace('.',','),diameter=v=>(v/100).toFixed(2).replace('.',','),materialLabel=v=>v==='CU'?'Медь':v==='AL'?'Алюминий':'Материал не указан';let material='ALL',spools=[];function selectedSpool(){return spools.find(x=>String(x.spool_id)===$('spool').value)}function updateSelected(){const x=selectedSpool();if(!x){$('spoolInfo').className='info muted';$('spoolInfo').textContent='Выберите бухту.';return}$('before').value=kg(Number(x.current_weight_g));$('spoolInfo').className=x.material_class==='UNKNOWN'?'warning':'info';$('spoolInfo').textContent=materialLabel(x.material_class)+' · '+diameter(x.diameter_hundredths_mm)+' мм · текущий остаток '+kg(x.current_weight_g)+' кг.'+(x.material_class==='UNKNOWN'?' Назначьте материал на странице склада до списания.':'')}async function loadSpools(selectedId=''){try{const r=await fetch('/api/warehouse/spools?material='+material,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');spools=j.items||[];$('spool').innerHTML='<option value="">Выберите бухту</option>'+spools.map(x=>'<option value="'+x.spool_id+'">№'+x.spool_id+' · '+materialLabel(x.material_class)+' · '+diameter(x.diameter_hundredths_mm)+' мм · '+kg(x.current_weight_g)+' кг</option>').join('');if(selectedId&&spools.some(x=>String(x.spool_id)===String(selectedId)))$('spool').value=String(selectedId);updateSelected()}catch(e){$('result').className='bad';$('result').textContent='Не удалось загрузить бухты: '+e.message}}$('spool').onchange=updateSelected;document.querySelectorAll('[data-material]').forEach(b=>b.onclick=()=>{material=b.dataset.material;document.querySelectorAll('[data-material]').forEach(x=>x.classList.toggle('active',x===b));loadSpools()});$('form').onsubmit=async e=>{e.preventDefault();if(!repairId){$('result').className='bad';$('result').textContent='Ремонт не выбран.';return}const spool=selectedSpool();if(!spool){$('result').className='bad';$('result').textContent='Выберите бухту.';return}if(spool.material_class==='UNKNOWN'){$('result').className='bad';$('result').textContent='У бухты не указан материал. Назначьте его на странице склада.';return}const before=grams($('before').value),after=grams($('after').value);if(!Number.isFinite(before)||!Number.isFinite(after)||before<=0||after<0||after>=before){$('result').className='bad';$('result').textContent='Проверьте вес: после работы он должен быть меньше веса до работы.';return}if(before!==Number(spool.current_weight_g)){$('result').className='bad';$('result').textContent='Вес до работы должен совпадать с текущим остатком бухты: '+kg(spool.current_weight_g)+' кг.';return}const body=new URLSearchParams({repair_id:repairId,spool_id:String(spool.spool_id),weight_before_g:String(before),weight_after_g:String(after),timestamp:new Date().toISOString(),comment:$('comment').value});$('submitButton').disabled=true;$('result').className='muted';$('result').textContent='Сохранение…';try{const r=await fetch('/api/warehouse/write-offs',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');const used=j.wire_type?materialLabel(j.wire_type):'Материал не указан';$('result').className='ok';$('result').textContent='Списано '+kg(j.consumed_g)+' кг. '+used+'. Остаток '+kg(j.current_weight_g)+' кг.';$('after').value='';$('comment').value='';await loadSpools(spool.spool_id)}catch(err){$('result').className='bad';$('result').textContent='Ошибка: '+err.message}finally{$('submitButton').disabled=false}};loadSpools();</script></body></html>
