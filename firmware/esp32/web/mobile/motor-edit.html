<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактирование двигателя — CoilMaster</title>
<style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}main{padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}.field label{font-size:13px;color:#5d6973;font-weight:bold}.field input,.field textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #c9d4de;border-radius:9px;background:#fff;font:inherit}.field textarea{min-height:80px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;padding:11px 14px;border-radius:9px;text-decoration:none;border:0;font-size:15px;font-weight:bold}.primary{background:#1769aa;color:#fff}.secondary{background:#e7eef5;color:#17324b}.muted{color:#687580}.ok{background:#e8f7ee;border:1px solid #82c99f;padding:11px;border-radius:9px}.warn{background:#fff3d8;border:1px solid #efc86a;padding:11px;border-radius:9px}.hidden{display:none}.rolebox{margin-top:14px;padding:13px;border:1px solid #d8e2ea;border-radius:11px;background:#f8fbfd}.versionbar{margin:12px 0;padding:10px;background:#eef5fa;border-radius:9px}</style></head>
<body><main><div class="actions"><a id="back" class="btn secondary" href="/mobile/motors.html">← Карточка</a></div><h1>Редактировать двигатель</h1><p id="identity" class="muted"></p><form id="form">
<section class="card"><h2>Основные данные</h2><div class="field"><label>Производитель</label><input id="manufacturer"></div><div class="field"><label>Модель</label><input id="model"></div><div class="field"><label>Внутреннее обозначение</label><input id="name" required></div><div class="field"><label>Теги</label><input id="tags"></div><div class="field"><label>Мощность, Вт</label><input id="rated_power_w"></div><div class="field"><label>Напряжение, В</label><input id="rated_voltage_v"></div><div class="field"><label>Ток, А</label><input id="rated_current_a" type="number" step="0.001" min="0"></div><div class="field"><label>Обороты, об/мин</label><input id="rated_speed_rpm"></div><div class="field"><label>Частота, Гц</label><input id="frequency_hz"></div><div class="field"><label>Фазы</label><input id="phase_count"></div><div class="field"><label>Пазы</label><input id="slot_count"></div><div class="field"><label>Полюсы</label><input id="pole_count"></div><div class="field"><label>Соединение</label><input id="connection"></div></section>
<section class="card"><h2>Обмотка</h2><p class="muted">WORKING/STARTING сохраняются как новые версии; история не перезаписывается.</p><div class="field"><label>Программа витков карточки</label><input id="coil_program" required></div><div class="field"><label>Повторы карточки</label><input id="repeat_target" value="1"></div><div class="field"><label>Шаг катушки карточки</label><input id="coil_pitch"></div><div class="field"><label>Витков на катушку</label><input id="turns_per_coil"></div><div class="field"><label>Диаметр провода, мм</label><input id="wire_diameter_mm" type="number" step="0.01" min="0"></div><div class="field"><label>Параллельных жил</label><input id="parallel_strands"></div><div class="field"><label>Материал провода</label><input id="wire_material"></div><div class="field"><label>Тип обмотки</label><input id="winding_type"></div>
<div id="windingVersion" class="versionbar muted">Версия обмотки: загрузка…</div>
<div class="rolebox"><h3>Рабочая обмотка</h3><div class="field"><label>Программа витков</label><input id="working_program"></div><div class="field"><label>Повторы</label><input id="working_repeat_target" value="1"></div><div class="field"><label>Шаг катушки</label><input id="working_coil_pitch"></div><div class="field"><label>Проводники (CU:95x1+CU:100x1)</label><input id="working_conductors"></div><div class="field"><label>Комментарий версии</label><input id="working_version_comment"></div><button id="saveWorking" class="btn primary" type="button">Сохранить рабочую</button></div>
<div class="rolebox"><h3>Пусковая обмотка</h3><div class="field"><label><input id="starting_present" type="checkbox" style="width:auto"> Пусковая используется</label></div><div class="field"><label>Программа витков</label><input id="starting_program"></div><div class="field"><label>Повторы</label><input id="starting_repeat_target" value="1"></div><div class="field"><label>Шаг катушки</label><input id="starting_coil_pitch"></div><div class="field"><label>Проводники (CU:80x2)</label><input id="starting_conductors"></div><div class="field"><label>Комментарий версии</label><input id="starting_version_comment"></div><button id="saveStarting" class="btn primary" type="button">Сохранить пусковую</button></div><p id="windingMessage" class="muted"></p></section>
<section class="card"><h2>Статор и источник</h2><div class="field"><label>Внутренний диаметр статора, мм</label><input id="stator_bore_mm"></div><div class="field"><label>Длина пакета, мм</label><input id="stator_core_length_mm"></div><div class="field"><label>Тип источника</label><input id="source_type"></div><div class="field"><label>Название источника</label><input id="source_title"></div><div class="field"><label>URL источника</label><input id="source_url"></div><div class="field"><label>Дата получения</label><input id="source_retrieved_at"></div><div class="field"><label>Достоверность</label><input id="confidence"></div><div class="field"><label><input id="calculated_fields" type="checkbox" style="width:auto"> Есть расчётные поля</label></div><div class="field"><label>Комментарий</label><textarea id="comment"></textarea></div></section>
<div class="actions"><button id="save" class="btn primary" type="submit">Сохранить данные двигателя</button><a id="cancel" class="btn secondary" href="/mobile/motors.html">Отмена</a></div></form><p id="message" class="muted"></p></main>
<script>
localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),motorId=new URLSearchParams(location.search).get('motor_id');const text=(id,v)=>$(id).value=v===undefined||v===null?'':String(v);const optional=(b,n,v)=>{v=String(v??'').trim();if(v!=='')b.set(n,v)};let currentWindingVersionId=0,legacyMotor=null;
const legacyConductors=m=>{const mat=String(m.wire_material||'').toUpperCase(),dia=Number(m.wire_diameter_hundredths_mm||0),strands=Number(m.parallel_strands||0);return ['CU','AL'].includes(mat)&&dia>0&&strands>0?`${mat}:${dia}x${strands}`:''};
function fill(m){legacyMotor=m;$('identity').textContent='motor_id: '+m.motor_id;text('manufacturer',m.manufacturer);text('model',m.model);text('name',m.name);text('tags',m.tags);text('rated_power_w',m.rated_power_w);text('rated_voltage_v',m.rated_voltage_v);text('rated_current_a',m.rated_current_ma?Number(m.rated_current_ma)/1000:'');text('rated_speed_rpm',m.rated_speed_rpm);text('frequency_hz',m.frequency_hz);text('phase_count',m.phase_count??m.phases);text('slot_count',m.slot_count);text('pole_count',m.pole_count);text('connection',m.connection);text('coil_program',m.coil_program);text('repeat_target',m.repeat_target||1);text('coil_pitch',m.coil_pitch);text('turns_per_coil',m.turns_per_coil);text('wire_diameter_mm',m.wire_diameter_hundredths_mm?Number(m.wire_diameter_hundredths_mm)/100:'');text('parallel_strands',m.parallel_strands);text('wire_material',m.wire_material);text('winding_type',m.winding_type);text('stator_bore_mm',m.stator_bore_mm);text('stator_core_length_mm',m.stator_core_length_mm);text('source_type',m.source_type);text('source_title',m.source_title);text('source_url',m.source_url);text('source_retrieved_at',m.source_retrieved_at);text('confidence',m.confidence);$('calculated_fields').checked=m.calculated_fields===true;text('comment',m.comment)}
function fillWinding(i){currentWindingVersionId=i?.winding_version_id||0;$('windingVersion').textContent=currentWindingVersionId?'Текущая версия: #'+currentWindingVersionId:'Истории пока нет. Первое сохранение WORKING создаст версию.';text('working_program',i?i.working_program:legacyMotor?.coil_program);text('working_repeat_target',i?(i.working_repeat_target||1):(legacyMotor?.repeat_target||1));text('working_coil_pitch',i?i.working_coil_pitch:legacyMotor?.coil_pitch);text('working_conductors',i?i.working_conductors:legacyConductors(legacyMotor||{}));const p=i?.starting_present===true;$('starting_present').checked=p;text('starting_program',p?i.starting_program:'');text('starting_repeat_target',p?(i.starting_repeat_target||1):1);text('starting_coil_pitch',p?i.starting_coil_pitch:'');text('starting_conductors',p?i.starting_conductors:'')}
async function loadWinding(){const r=await fetch('/api/motors/winding/latest?motor_id='+encodeURIComponent(motorId),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'winding_read_failed');fillWinding(j.item)}
async function saveRole(role){const p=role==='WORKING'?'working':'starting',btn=$(role==='WORKING'?'saveWorking':'saveStarting');btn.disabled=true;$('windingMessage').className='muted';$('windingMessage').textContent='Сохранение…';try{const b=new URLSearchParams();b.set('motor_id',motorId);b.set('role',role);b.set('expected_winding_version_id',String(currentWindingVersionId));const present=role==='WORKING'||$('starting_present').checked;b.set('present',present?'true':'false');if(present){b.set('coil_program',$(p+'_program').value.trim());b.set('repeat_target',$(p+'_repeat_target').value.trim()||'1');optional(b,'coil_pitch',$(p+'_coil_pitch').value);b.set('conductors',$(p+'_conductors').value.trim().toUpperCase())}b.set('version_comment',$(p+'_version_comment').value.trim());b.set('created_at',new Date().toISOString());const r=await fetch('/api/motors/winding/role',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:b}),j=await r.json();if(r.status===409){await loadWinding();throw new Error('Версия изменилась. Загружены свежие данные; проверьте и повторите сохранение.')}if(!r.ok)throw new Error(j.error||'winding_update_failed');await loadWinding();$(p+'_version_comment').value='';$('windingMessage').className='ok';$('windingMessage').textContent=(role==='WORKING'?'Рабочая':'Пусковая')+' обмотка сохранена новой версией #'+currentWindingVersionId}catch(e){$('windingMessage').className='warn';$('windingMessage').textContent='Ошибка: '+(e.message||'unknown')}finally{btn.disabled=false}}
async function load(){if(!motorId){$('message').className='warn';$('message').textContent='motor_id не указан';$('form').classList.add('hidden');return}$('back').href='/mobile/motor-details.html?motor_id='+encodeURIComponent(motorId);$('cancel').href=$('back').href;try{const r=await fetch('/api/motors/by-id?motor_id='+encodeURIComponent(motorId),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'motor_read_failed');fill(j.item);await loadWinding()}catch(e){$('message').className='warn';$('message').textContent='Ошибка загрузки: '+(e.message||'unknown');$('form').classList.add('hidden')}}
$('saveWorking').addEventListener('click',()=>saveRole('WORKING'));$('saveStarting').addEventListener('click',()=>saveRole('STARTING'));
$('form').addEventListener('submit',async e=>{e.preventDefault();$('save').disabled=true;$('message').className='muted';$('message').textContent='Сохранение…';try{const b=new URLSearchParams();b.set('motor_id',motorId);b.set('manufacturer',$('manufacturer').value.trim());b.set('model',$('model').value.trim());let legacy=$('name').value.trim();if(!legacy)legacy=[$('manufacturer').value.trim(),$('model').value.trim()].filter(Boolean).join(' ');b.set('name',legacy);b.set('tags',$('tags').value.trim());b.set('coil_program',$('coil_program').value.trim());b.set('repeat_target',$('repeat_target').value.trim()||'1');for(const id of ['rated_power_w','rated_voltage_v','rated_speed_rpm','frequency_hz','phase_count','slot_count','pole_count','coil_pitch','turns_per_coil','parallel_strands','stator_bore_mm','stator_core_length_mm'])optional(b,id,$(id).value);const amps=$('rated_current_a').value.trim();if(amps!=='')b.set('rated_current_ma',String(Math.round(Number(amps)*1000)));const dia=$('wire_diameter_mm').value.trim();if(dia!=='')b.set('wire_diameter_hundredths_mm',String(Math.round(Number(dia)*100)));for(const id of ['connection','winding_type','wire_material','source_type','source_url','source_title','source_retrieved_at','confidence','comment'])b.set(id,$(id).value.trim());b.set('calculated_fields',$('calculated_fields').checked?'true':'false');const r=await fetch('/api/motors/update',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:b}),j=await r.json();if(!r.ok)throw new Error(j.error||'motor_update_failed');$('message').className='ok';$('message').textContent='Данные двигателя сохранены. motor_id: '+j.motor_id}catch(err){$('message').className='warn';$('message').textContent='Ошибка сохранения: '+(err.message||'unknown')}finally{$('save').disabled=false}});load();
</script></body></html>
