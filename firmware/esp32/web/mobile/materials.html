<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Материалы ремонта</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}main{max-width:720px;margin:auto;padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}button.secondary{background:#e7eef5;color:#17324b}button:disabled,input:disabled,select:disabled{opacity:.55}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}.warning{background:#fff4d6;border:1px solid #e0bc55;padding:10px;border-radius:10px;margin-top:10px}.info{background:#f3f7fa;padding:10px;border-radius:10px;margin-top:10px}.item{padding:10px 0;border-bottom:1px solid #e5ebf0}.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}.pager button{width:auto;margin:0}.pager span{min-width:120px;text-align:center}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.summary b{font-size:19px}.search-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}a{color:#1769aa;text-decoration:none}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea;z-index:3}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}</style></head><body><main><p><a href="/mobile/repairs.html">← Ремонты</a></p><h1>Материалы ремонта</h1><section class="card"><div class="summary"><div>Ремонт<br><b id="repairLabel">не выбран</b></div><div>Материалы<br><b id="materialCost">—</b></div></div><div id="costingState" class="muted">Загрузка себестоимости…</div></section><section class="card"><div id="lifecycle" class="info muted">Проверка состояния ремонта…</div><form id="usageForm"><label>Материал</label><select id="material" required><option value="">Загрузка…</option></select><div id="materialInfo" class="info muted">Выберите материал.</div><label>Количество</label><input id="quantity" inputmode="decimal" placeholder="1,5" required><label>Комментарий</label><input id="comment"><button id="submitButton">Списать материал</button></form><p id="result" class="muted"></p></section><section class="card"><h2>Каталог материалов</h2><form id="searchForm"><label for="materialSearch">Поиск по названию, описанию, типу провода или диаметру</label><input id="materialSearch" maxlength="48" placeholder="Например: подшипник, лак, CU, 0.95"><div class="search-actions"><button type="submit">Найти</button><button id="clearSearch" type="button" class="secondary">Сбросить</button></div></form><div id="searchState" class="muted"></div><div id="list" class="muted">Загрузка…</div><div class="pager"><button id="prevPage" type="button" disabled>← Назад</button><span id="pageInfo" class="muted">Страница 1</span><button id="nextPage" type="button" disabled>Далее →</button></div></section><section class="card"><h2>Подтверждённые списания</h2><div id="usageHistory" class="muted">Загрузка…</div><div class="pager"><button id="historyPrev" type="button" disabled>← Назад</button><span id="historyPageInfo" class="muted">Страница 1</span><button id="historyNext" type="button" disabled>Далее →</button></div></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),repairId=p.get('repair_id')||localStorage.getItem('cm-active-repair')||'',units={PIECE:'шт',GRAM:'г',MILLILITRE:'мл',METRE:'м',SQUARE_METRE:'м²'};if(repairId){localStorage.setItem('cm-active-repair',repairId);$('repairLabel').textContent='№'+repairId}else $('result').textContent='Откройте страницу из карточки ремонта.';const shown=v=>(Number(v)/1000).toLocaleString('ru-RU',{maximumFractionDigits:3}),money=v=>(Number(v)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' сом',milli=v=>Math.round(Number(String(v).replace(',','.'))*1000),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dateLabel=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?String(v||'—'):d.toLocaleString('ru-RU')},cleanUsageComment=v=>String(v||'').replace(/^MU_TX=[A-Za-z0-9_-]+;\s*/,''),newOperationId=()=>{const a=new Uint32Array(4);if(globalThis.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*0x100000000);return'mu-'+Array.from(a,x=>x.toString(16).padStart(8,'0')).join('')};let materials=[],repairWritable=false,materialCursor=0,materialNextCursor=0,materialHasMore=false,materialHistory=[],materialPage=1,materialSearch='',usageCursor=0,usageNextCursor=0,usageHasMore=false,usageCursorHistory=[],usagePage=1,pendingOperationId='';const resetOperationId=()=>{pendingOperationId=''};function setWritable(value,text){repairWritable=value;['material','quantity','comment','submitButton'].forEach(id=>$(id).disabled=!value);$('lifecycle').className=value?'info':'warning';$('lifecycle').textContent=text}async function loadLifecycle(){if(!repairId){setWritable(false,'Ремонт не выбран.');return}try{const r=await fetch('/api/repairs/by-id?repair_id='+encodeURIComponent(repairId),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'repair_lookup_unavailable');const repair=j.item;if(!repair||String(repair.repair_id)!==String(repairId))throw new Error('repair_not_found');const closed=(repair.current_status||repair.status)==='CLOSED';setWritable(!closed,closed?'Ремонт закрыт. Новые списания материалов запрещены. История доступна для просмотра.':'Ремонт открыт. Списание материалов разрешено.')}catch(e){setWritable(false,'Не удалось подтвердить состояние ремонта. Списание заблокировано.')}}async function loadCosting(){if(!repairId){$('costingState').textContent='Ремонт не выбран.';return}try{const r=await fetch('/api/repairs/costing?repair_id='+encodeURIComponent(repairId),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'costing_read_failed');$('materialCost').textContent=money(j.material_cost_minor);$('costingState').textContent='Источник: подтверждённые snapshots MaterialLedger.'}catch(e){$('materialCost').textContent='—';$('costingState').textContent='Не удалось загрузить себестоимость: '+e.message}}function selectedMaterial(){return materials.find(x=>String(x.material_id)===$('material').value)}function updateMaterialInfo(){const x=selectedMaterial();if(!x){$('materialInfo').className='info muted';$('materialInfo').textContent='Выберите материал.';return}const unit=units[x.unit]||x.unit;$('materialInfo').className='info';$('materialInfo').textContent='Остаток '+shown(x.stock_quantity_milli)+' '+unit+' · цена '+money(x.price_per_unit_minor)+' за '+unit+'.'}function updatePager(count){$('prevPage').disabled=materialHistory.length===0;$('nextPage').disabled=!materialHasMore;$('pageInfo').textContent='Страница '+materialPage+' · '+count+' записей'}async function load(cursor=materialCursor,reset=false){if(reset){materialHistory=[];materialPage=1;cursor=0}try{const q=new URLSearchParams({limit:'20'});if(materialSearch)q.set('search',materialSearch);if(cursor)q.set('cursor',String(cursor));const r=await fetch('/api/materials?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');materialCursor=cursor;materialHasMore=j.has_more===true;materialNextCursor=materialHasMore?Number(j.next_cursor):0;if(materialHasMore&&(!Number.isInteger(materialNextCursor)||materialNextCursor<=materialCursor))throw new Error('invalid_paging_cursor');materials=j.items||[];$('material').innerHTML='<option value="">Выберите материал на странице '+materialPage+'</option>'+materials.map(x=>'<option value="'+x.material_id+'">'+esc(x.name)+' · '+shown(x.stock_quantity_milli)+' '+esc(units[x.unit]||x.unit)+'</option>').join('');$('list').innerHTML=materials.length?materials.map(x=>'<div class="item"><b>'+esc(x.name)+'</b><div>Остаток: '+shown(x.stock_quantity_milli)+' '+esc(units[x.unit]||x.unit)+'</div><div class="muted">Цена: '+money(x.price_per_unit_minor)+' / '+esc(units[x.unit]||x.unit)+(x.wire_type?' · '+esc(x.wire_type)+' '+(Number(x.diameter_hundredths_mm)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' мм':'')+'</div></div>').join(''):(materialSearch?'По запросу ничего не найдено.':'Материалов на этой странице нет.');$('searchState').textContent=materialSearch?'Поиск: «'+materialSearch+'»':'Показан весь активный каталог.';updateMaterialInfo();updatePager(materials.length);if(!repairWritable)$('material').disabled=true}catch(e){$('result').className='bad';$('result').textContent='Не удалось загрузить материалы: '+e.message;$('prevPage').disabled=true;$('nextPage').disabled=true}}function updateHistoryPager(count){$('historyPrev').disabled=usageCursorHistory.length===0;$('historyNext').disabled=!usageHasMore;$('historyPageInfo').textContent='Страница '+usagePage+' · '+count+' записей'}async function loadUsageHistory(cursor=usageCursor,reset=false){if(!repairId){$('usageHistory').textContent='Ремонт не выбран.';return}if(reset){usageCursorHistory=[];usagePage=1;cursor=0}try{const q=new URLSearchParams({repair_id:repairId,limit:'20'});if(cursor)q.set('cursor',String(cursor));const r=await fetch('/api/materials/usage?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'usage_history_read_failed');usageCursor=cursor;usageHasMore=j.has_more===true;usageNextCursor=usageHasMore?Number(j.next_cursor):0;if(usageHasMore&&(!Number.isInteger(usageNextCursor)||usageNextCursor<=usageCursor))throw new Error('invalid_usage_cursor');const rows=j.items||[];$('usageHistory').innerHTML=rows.length?rows.map(x=>'<div class="item"><b>Материал ID '+esc(x.material_id)+' · '+money(x.line_cost_minor)+'</b><div>'+shown(x.quantity_milli)+' · snapshot '+money(x.price_per_unit_minor)+'</div><div class="muted">'+esc(dateLabel(x.timestamp))+(cleanUsageComment(x.comment)?' · '+esc(cleanUsageComment(x.comment)):'')+' · usage #'+esc(x.usage_id)+'</div></div>').join(''):'Подтверждённых списаний пока нет.';updateHistoryPager(rows.length)}catch(e){$('usageHistory').textContent='Не удалось загрузить историю: '+e.message;$('historyPrev').disabled=true;$('historyNext').disabled=true}}$('searchForm').onsubmit=e=>{e.preventDefault();const value=$('materialSearch').value.trim();if(value.length>48){$('result').className='bad';$('result').textContent='Поиск не должен превышать 48 символов.';return}materialSearch=value;load(0,true)};$('clearSearch').onclick=()=>{$('materialSearch').value='';materialSearch='';load(0,true)};$('prevPage').onclick=()=>{if(!materialHistory.length)return;const cursor=materialHistory.pop();materialPage=Math.max(1,materialPage-1);load(cursor,false)};$('nextPage').onclick=()=>{if(!materialHasMore)return;materialHistory.push(materialCursor);materialPage+=1;load(materialNextCursor,false)};$('historyPrev').onclick=()=>{if(!usageCursorHistory.length)return;const cursor=usageCursorHistory.pop();usagePage=Math.max(1,usagePage-1);loadUsageHistory(cursor,false)};$('historyNext').onclick=()=>{if(!usageHasMore)return;usageCursorHistory.push(usageCursor);usagePage+=1;loadUsageHistory(usageNextCursor,false)};$('material').onchange=()=>{resetOperationId();updateMaterialInfo()};$('quantity').oninput=resetOperationId;$('comment').oninput=resetOperationId;$('usageForm').onsubmit=async e=>{e.preventDefault();if(!repairWritable){$('result').className='warning';$('result').textContent='Ремонт закрыт или его состояние не подтверждено. Списание запрещено.';return}if(!repairId){$('result').className='bad';$('result').textContent='Ремонт не выбран.';return}const material=selectedMaterial();if(!material){$('result').className='bad';$('result').textContent='Выберите материал.';return}const q=milli($('quantity').value);if(!Number.isFinite(q)||q<=0){$('result').className='bad';$('result').textContent='Введите положительное количество.';return}if(q>Number(material.stock_quantity_milli)){$('result').className='bad';$('result').textContent='Недостаточно материала. Доступно '+shown(material.stock_quantity_milli)+' '+(units[material.unit]||material.unit)+'.';return}if(!pendingOperationId)pendingOperationId=newOperationId();const body=new URLSearchParams({repair_id:repairId,material_id:String(material.material_id),quantity_milli:String(q),timestamp:new Date().toISOString(),comment:$('comment').value,operation_id:pendingOperationId});const button=$('submitButton');button.disabled=true;$('result').className='muted';$('result').textContent='Сохранение…';try{const r=await fetch('/api/materials/usage',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(r.status===409&&j.error==='repair_closed'){$('result').className='warning';$('result').textContent='Ремонт уже закрыт. Материал не списан.';await loadLifecycle();return}if(r.status===409&&j.error==='operation_id_conflict'){$('result').className='bad';$('result').textContent='Конфликт идентификатора операции. Измените строку материала и повторите.';resetOperationId();return}if(r.status===404&&j.error==='repair_not_found'){$('result').className='bad';$('result').textContent='Ремонт №'+repairId+' не найден. Списание не выполнено.';return}if(!r.ok)throw new Error(j.error||'Ошибка');const trusted=j.repair_reference_validated===true&&String(j.repair_id)===String(repairId)&&String(j.material_id)===String(material.material_id)&&Number(j.quantity_milli)===q&&j.line_cost_source==='PERSISTED_USAGE_SNAPSHOT'&&j.value_rounding==='NEAREST_MINOR_UNIT';if(!trusted){$('result').className='warning';$('result').textContent='Сервер не подтвердил все поля операции. Повтор использует тот же идентификатор и не должен списать материал второй раз.';await Promise.all([load(0,true),loadUsageHistory(0,true),loadCosting()]);return}$('result').className='ok';$('result').textContent=(j.duplicate_replay===true?'Операция уже была сохранена ранее. Повторное списание не выполнено. ':'Материал списан. ')+'Стоимость '+money(j.line_cost_minor)+'. Текущий остаток '+shown(j.remaining_quantity_milli)+' '+(units[material.unit]||material.unit)+'.';resetOperationId();$('quantity').value='';$('comment').value='';await Promise.all([load(0,true),loadUsageHistory(0,true),loadCosting()])}catch(err){$('result').className='bad';$('result').textContent='Ошибка: '+err.message+'. Повтор отправит тот же operation_id и не должен создать второе списание.'}finally{button.disabled=!repairWritable}};(async()=>{await loadLifecycle();await Promise.all([load(0,true),loadUsageHistory(0,true),loadCosting()])})();</script></body></html>
