<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Клиент — CoilMaster</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.actions a{padding:12px;border-radius:10px;text-decoration:none;text-align:center;font-weight:bold;background:#e8f1f8;color:#105b91}.actions .primary{background:#1769aa;color:#fff}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}.kv{background:#f3f7fa;padding:11px;border-radius:9px;margin-bottom:8px}.muted{color:#687580}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}</style></head><body><header><a href="/mobile/clients.html">← Клиенты</a><b style="float:right">👤 Карточка</b></header><main><div class="actions"><a href="/mobile/clients.html">Каталог клиентов</a><a id="repairLink" class="primary" href="/mobile/repair-new.html">+ Новый ремонт</a></div><h1 id="title">Клиент</h1><section class="card"><div id="content" class="muted">Загрузка…</div></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('client_id'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!/^[1-9]\d*$/.test(String(id||''))){$('content').textContent='Некорректный client_id.';return}try{const r=await fetch('/api/clients/by-id?client_id='+encodeURIComponent(id),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'client_lookup_failed');const x=j.item;if(!x)throw new Error('client_not_found');localStorage.setItem('cm-selected-client',String(x.client_id));$('title').textContent=x.name||('Клиент '+x.client_id);$('repairLink').href='/mobile/repair-new.html?client_id='+encodeURIComponent(x.client_id);$('content').innerHTML='<div class="kv"><b>'+esc(x.name||'Клиент')+'</b></div><div class="kv">Телефон: <b>'+esc(x.phone||'не указан')+'</b></div><div class="kv">ID клиента: <b>'+esc(x.client_id)+'</b></div><div class="kv">Комментарий: '+esc(x.comment||'не указан')+'</div>'}catch(e){$('content').textContent='Ошибка: '+e.message}}load();</script></body></html>
