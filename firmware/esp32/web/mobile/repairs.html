<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ремонты — CoilMaster</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--text:#17212b;--muted:#687580;--blue:#1769aa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text);padding-bottom:80px}header{position:sticky;top:0;z-index:2;background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:var(--card);border-radius:15px;padding:16px;margin-bottom:12px}input,select,button,textarea{width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:var(--blue);color:#fff;border:0;font-weight:bold}button:disabled{background:#9aa7b1}.secondary{background:#5b6874}.close-repair{background:#8b2d2d}.item{padding:14px 0;border-bottom:1px solid #e5ebf0}.item:last-child{border:0}.muted{color:var(--muted)}.links a{display:inline-block;margin:9px 12px 0 0;color:#105b91;font-weight:bold}.picker-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.picker-links a{display:block;padding:13px;border-radius:10px;background:#e8f1f8;color:#105b91;text-decoration:none;text-align:center;font-weight:bold}.note{background:#f3f7fa;padding:10px;border-radius:10px;margin-top:10px}.warning{background:#fff4d6;border:1px solid #e0bc55}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:13px;font-weight:bold;background:#e8f7ee;color:#17683a}.status.closed{background:#e8edf2;color:#53606b}.filter-label{display:block;margin-top:6px;font-weight:bold}.preflight{margin-top:9px;padding:10px;border-radius:9px;background:#f3f7fa}.preflight.ready{background:#e8f7ee;color:#17683a}.preflight.blocked{background:#fff4d6;color:#7a4b00}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea;z-index:3}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}@media(max-width:440px){.picker-links{grid-template-columns:1fr}}
 .pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}.pager button{width:auto;margin:0;padding:10px}.pager span{min-width:125px;text-align:center}</style>
</head>
<body>
<header><a href="/mobile/">← Главная</a><b style="float:right">🧰 Ремонты</b></header>
<main>
<section class="card"><h2>Новый ремонт</h2><div class="picker-links"><a href="/mobile/clients.html">👤 Добавить / выбрать клиента</a><a href="/mobile/motors.html">⚙️ Добавить / выбрать двигатель</a></div><form id="form"><label>Клиент</label><select id="clientId" name="client_id" required><option value="">Загрузка клиентов…</option></select><label>Двигатель</label><select id="motorId" name="motor_id" required><option value="">Загрузка двигателей…</option></select><label>Дата приёмки</label><input id="received" name="received_at" type="datetime-local" required><textarea name="complaint" placeholder="Жалоба клиента"></textarea><textarea name="comment" placeholder="Комментарий"></textarea><button>Создать ремонт</button></form><p id="result" class="muted"></p></section>
<section class="card"><h2>Ремонты</h2><label class="filter-label" for="repairFilter">Показывать</label><select id="repairFilter"><option value="OPEN">Открытые</option><option value="CLOSED">Закрытые</option><option value="ALL">Все</option></select><div id="items" class="muted">Загрузка…</div><div class="pager"><button id="prevPage" type="button" disabled>← Назад</button><span id="pageInfo" class="muted">Страница 1</span><button id="nextPage" type="button" disabled>Далее →</button></div></section>
</main>
<nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav>
<script>
localStorage.setItem('cm-ui-version','mobile');
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const requestedClient=params.get('client_id')||localStorage.getItem('cm-selected-client')||'';
const requestedMotor=params.get('motor_id')||localStorage.getItem('cm-selected-motor')||'';
$('received').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
const savedRepairFilter=localStorage.getItem('cm-repair-filter')||'OPEN';
$('repairFilter').value=['OPEN','CLOSED','ALL'].includes(savedRepairFilter)?savedRepairFilter:'OPEN';
$('repairFilter').onchange=()=>{localStorage.setItem('cm-repair-filter',$('repairFilter').value);loadRepairs(0,true)};
let clients=[],motors=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLabel=v=>{if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('ru-RU')};
function clientLabel(x){return(x.name||'Клиент')+' · '+(x.phone||'без телефона')}
function motorLabel(x){return(x.name||'Двигатель')+(x.model?' · '+x.model:'')+(x.manufacturer?' · '+x.manufacturer:'')+' · '+(x.coil_program||'без программы')}
async function exactLookup(path,key,id){
  if(!id)return null;
  const q=new URLSearchParams({[key]:String(id)}),r=await fetch(path+'?'+q,{cache:'no-store'}),j=await r.json();
  if(!r.ok)throw new Error(j.error||'catalog_unavailable');
  return j.item||null;
}
async function loadClients(selected){
  const chosen=String(selected||requestedClient||localStorage.getItem('cm-selected-client')||'');clients=[];$('clientId').innerHTML='<option value="">Выберите клиента в каталоге</option>';if(!chosen)return;
  try{const item=await exactLookup('/api/clients/by-id','client_id',chosen);if(!item)throw new Error('client_not_found');clients=[item];const o=document.createElement('option');o.value=item.client_id;o.textContent=clientLabel(item);$('clientId').appendChild(o);$('clientId').value=String(item.client_id);localStorage.setItem('cm-selected-client',String(item.client_id))}catch(e){$('clientId').innerHTML='<option value="">Выбранный клиент недоступен — откройте каталог</option>'}
}
async function loadMotors(selected){
  const chosen=String(selected||requestedMotor||localStorage.getItem('cm-selected-motor')||'');motors=[];$('motorId').innerHTML='<option value="">Выберите двигатель в каталоге</option>';if(!chosen)return;
  try{const item=await exactLookup('/api/motors/by-id','motor_id',chosen);if(!item)throw new Error('motor_not_found');motors=[item];const o=document.createElement('option');o.value=item.motor_id;o.textContent=motorLabel(item);$('motorId').appendChild(o);$('motorId').value=String(item.motor_id);localStorage.setItem('cm-selected-motor',String(item.motor_id))}catch(e){$('motorId').innerHTML='<option value="">Выбранный двигатель недоступен — откройте каталог</option>'}
}
$('clientId').onchange=()=>{$('clientId').value?localStorage.setItem('cm-selected-client',$('clientId').value):localStorage.removeItem('cm-selected-client')};
$('motorId').onchange=()=>{$('motorId').value?localStorage.setItem('cm-selected-motor',$('motorId').value):localStorage.removeItem('cm-selected-motor')};
function closeErrorMessage(error){if(error==='repair_has_unfinished_winding_job')return'Нельзя закрыть ремонт: намотка ещё не завершена или требует ручной проверки.';if(error==='repair_finalization_wire_writeoff_required')return'Нельзя закрыть ремонт: завершённая намотка ещё не покрыта ручным списанием провода.';if(error==='repair_finalization_wire_writeoff_storage_unavailable')return'Нельзя проверить списание провода: хранилище временно недоступно.';if(error==='repair_finalization_wire_writeoff_integrity_failed')return'Связь завершённой намотки и списания провода не прошла проверку целостности.';if(error==='repair_finalization_costing_storage_unavailable')return'Недоступны данные склада, материалов или калькуляции.';if(error==='repair_finalization_winding_storage_unavailable')return'История намотки временно недоступна.';if(error==='repair_finalization_costing_integrity_failed')return'Калькуляция или списания не прошли проверку целостности.';if(error==='repair_finalization_winding_integrity_failed')return'История намотки не прошла проверку целостности.';if(error==='repair_closure_state_unavailable')return'Нельзя проверить состояние последней намотки.';return'Не удалось закрыть ремонт: '+(error||'unknown')}
function preflightMessage(reason){if(!reason)return'Проверка пройдена. Ремонт готов к закрытию.';if(reason==='repair_has_unfinished_winding_job')return'Не готов: намотка ещё не завершена или требует ручной проверки.';if(reason==='repair_finalization_wire_writeoff_required')return'Не готов: требуется подтверждённое ручное списание провода.';if(reason==='repair_finalization_wire_writeoff_storage_unavailable')return'Не готов: хранилище списаний временно недоступно.';if(reason==='repair_finalization_wire_writeoff_integrity_failed')return'Не готов: намотка и списание провода не прошли проверку целостности.';if(reason==='repair_finalization_costing_storage_unavailable')return'Не готов: недоступны данные калькуляции.';if(reason==='repair_finalization_winding_storage_unavailable')return'Не готов: недоступна история намотки.';if(reason==='repair_finalization_costing_integrity_failed')return'Не готов: калькуляция или списания не прошли проверку целостности.';if(reason==='repair_finalization_winding_integrity_failed')return'Не готов: история намотки не прошла проверку целостности.';if(reason==='already_closed')return'Ремонт уже закрыт.';return'Готовность не подтверждена: '+reason}
async function checkFinalization(id,box,closeButton,checkButton){checkButton.disabled=true;box.className='preflight';box.textContent='Проверка итогов…';try{const r=await fetch('/api/repairs/finalization?repair_id='+encodeURIComponent(id),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(closeErrorMessage(j.error));const ready=j.ready_to_close===true;box.className='preflight '+(ready?'ready':'blocked');box.textContent=preflightMessage(j.reason);closeButton.disabled=!ready}catch(e){box.className='preflight blocked';box.textContent=e.message||'Не удалось проверить готовность.';closeButton.disabled=true}finally{checkButton.disabled=false}}
async function closeRepair(id){if(!confirm('Закрыть ремонт №'+id+'? ESP32 повторно проверит намотку, списания и калькуляцию.'))return;try{const body=new URLSearchParams({repair_id:String(id),closed_at:new Date().toISOString(),confirmed:'true'}),r=await fetch('/api/repairs/close',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok)throw new Error(closeErrorMessage(j.error));await loadRepairs()}catch(e){alert(e.message||'Не удалось закрыть ремонт.')}}
let repairCursor=0,repairNextCursor=0,repairHasMore=false,repairHistory=[],repairPage=1;function updateRepairPager(total,visible){$('prevPage').disabled=repairHistory.length===0;$('nextPage').disabled=!repairHasMore;$('pageInfo').textContent='Страница '+repairPage+' · '+visible+'/'+total+' записей'}async function loadRepairs(cursor=repairCursor,reset=false){if(reset){repairHistory=[];repairPage=1;cursor=0}$('items').textContent='Загрузка…';try{const q=new URLSearchParams({limit:'20'});if(params.get('client_id'))q.set('client_id',params.get('client_id'));if(cursor)q.set('cursor',String(cursor));const r=await fetch('/api/repairs?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'catalog_unavailable');repairCursor=cursor;repairHasMore=j.has_more===true;repairNextCursor=repairHasMore?Number(j.next_cursor):0;if(repairHasMore&&(!Number.isInteger(repairNextCursor)||repairNextCursor<=repairCursor))throw new Error('invalid_paging_cursor');const all=j.items||[],filter=$('repairFilter').value,visible=all.filter(x=>{const s=x.current_status||x.status||'OPEN';return filter==='ALL'||s===filter});$('items').innerHTML='';visible.forEach(x=>{const m=motors.find(v=>Number(v.motor_id)===Number(x.motor_id)),c=clients.find(v=>Number(v.client_id)===Number(x.client_id));const status=x.current_status||x.status||'OPEN',closed=status==='CLOSED',id=x.repair_id,d=document.createElement('div');d.className='item';const mutable=closed?'':'<a data-id="'+esc(id)+'" href="/mobile/winding-job.html?repair_id='+encodeURIComponent(id)+'">Намотка</a><a data-id="'+esc(id)+'" href="/mobile/writeoff.html?repair_id='+encodeURIComponent(id)+'">Списание провода</a>';const costingLabel=closed?'Итог ремонта':'Калькуляция';const controls=closed?'':'<div class="preflight" data-preflight-id="'+esc(id)+'">Готовность к закрытию ещё не проверена.</div><button class="secondary" type="button" data-check-id="'+esc(id)+'">Проверить готовность</button><button class="close-repair" type="button" data-close-id="'+esc(id)+'" disabled>Закрыть ремонт</button>';d.innerHTML='<b>Ремонт №'+esc(id)+' — '+esc(m?motorLabel(m):'Двигатель ID '+x.motor_id)+'</b><div>'+esc(c?clientLabel(c):'Клиент ID '+x.client_id)+'</div><div><span class="status'+(closed?' closed':'')+'">'+(closed?'Закрыт':'Открыт')+'</span> <span class="muted">· принят '+esc(dateLabel(x.received_at))+(closed&&x.closed_at?' · закрыт '+esc(dateLabel(x.closed_at)):'')+'</span></div><div class="links">'+mutable+'<a data-id="'+esc(id)+'" href="/mobile/costing.html?repair_id='+encodeURIComponent(id)+'">'+costingLabel+'</a><a data-id="'+esc(id)+'" href="/mobile/winding-history.html?repair_id='+encodeURIComponent(id)+'">История намотки</a></div>'+controls;d.querySelectorAll('a[data-id]').forEach(a=>a.onclick=()=>localStorage.setItem('cm-active-repair',String(a.dataset.id)));const close=d.querySelector('[data-close-id]'),check=d.querySelector('[data-check-id]'),box=d.querySelector('[data-preflight-id]');if(close)close.onclick=()=>closeRepair(close.dataset.closeId);if(check&&close&&box)check.onclick=()=>checkFinalization(check.dataset.checkId,box,close,check);$('items').appendChild(d)});if(!visible.length)$('items').textContent=filter==='OPEN'?'На этой странице открытых ремонтов нет.':filter==='CLOSED'?'На этой странице закрытых ремонтов нет.':'На этой странице ремонтов нет.';updateRepairPager(all.length,visible.length)}catch(e){$('items').textContent='Каталог ремонтов недоступен: '+(e.message||'unknown');$('prevPage').disabled=true;$('nextPage').disabled=true}}$('prevPage').onclick=()=>{if(!repairHistory.length)return;const cursor=repairHistory.pop();repairPage=Math.max(1,repairPage-1);loadRepairs(cursor,false)};$('nextPage').onclick=()=>{if(!repairHasMore)return;repairHistory.push(repairCursor);repairPage+=1;loadRepairs(repairNextCursor,false)};
$('form').onsubmit=async e=>{e.preventDefault();const received=new Date($('received').value);if(Number.isNaN(received.getTime())){$('result').textContent='Укажите корректную дату приёмки.';return}const fd=new FormData(e.target);fd.set('received_at',received.toISOString());try{const r=await fetch('/api/repairs',{method:'POST',body:fd}),j=await r.json();if(r.ok){localStorage.setItem('cm-active-repair',j.repair_id);localStorage.setItem('cm-selected-client',j.client_id);localStorage.setItem('cm-selected-motor',j.motor_id);location.href='/mobile/costing.html?repair_id='+encodeURIComponent(j.repair_id)}else $('result').textContent=j.error||'Ошибка создания ремонта'}catch(err){$('result').textContent='Нет связи с ESP32'}};
(async()=>{await loadClients();await loadMotors();await loadRepairs(0,true)})();
</script>
</body>
</html>
