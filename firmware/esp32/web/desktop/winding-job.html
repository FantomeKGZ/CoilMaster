<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Намотка ремонта</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:22px;max-width:980px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e4eaf0}.muted{color:#687580}.note{background:#f3f7fa;padding:12px;border-radius:9px;margin-top:10px}.warning{background:#fff4d6;border:1px solid #e0bc55}.ok{background:#e8f7ee;border:1px solid #82c99f}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}button:disabled{background:#9aa7b1}@media(max-width:900px){.layout{display:block}aside{display:none}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/motors.html">Двигатели</a><a href="/desktop/costing.html">Калькуляция</a></aside><main><p><a href="/desktop/repairs.html">← Ремонты</a></p><h1 id="title">Намотка ремонта</h1><section class="card"><h2>Контекст задания</h2><div class="row"><span class="muted">Ремонт</span><b id="repair">—</b></div><div class="row"><span class="muted">Двигатель</span><b id="motor">—</b></div><div class="row"><span class="muted">Программа из карточки</span><b id="catalogProgram">—</b></div><div id="context" class="note">Проверка связки repair_id + motor_id.</div></section><section class="card"><h2>Отправить задание</h2><form id="jobForm"><label>Тип обмотки</label><select name="type"><option value="working">Рабочая</option><option value="starting">Пусковая</option></select><label>Программа витков</label><input id="turns" name="turns" placeholder="140/100/80/40" required><input id="repairId" name="repair_id" type="hidden"><input id="motorId" name="motor_id" type="hidden"><button id="send" disabled>Отправить на Arduino</button></form><div id="result" class="note">Автоматический запуск запрещён. После передачи запуск выполняется физической кнопкой START.</div></section></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),repairId=params.get('repair_id')||'';let ready=false;const canonical=v=>/^[1-9][0-9]*$/.test(String(v));async function loadContext(){if(!canonical(repairId)){fail('Некорректный repair_id.');return}try{const [rr,mr]=await Promise.all([fetch('/api/repairs',{cache:'no-store'}),fetch('/api/motors',{cache:'no-store'})]),rj=await rr.json(),mj=await mr.json();if(!rr.ok||!mr.ok)throw new Error('Каталог недоступен');const repair=(rj.items||[]).find(x=>String(x.repair_id)===String(repairId));if(!repair)throw new Error('Ремонт не найден');const motor=(mj.items||[]).find(x=>Number(x.motor_id)===Number(repair.motor_id));if(!motor)throw new Error('Двигатель ремонта не найден');if(!canonical(repair.motor_id))throw new Error('Некорректный motor_id');const program=String(motor.coil_program||'').trim();if(!program)throw new Error('В карточке двигателя нет программы витков');$('repair').textContent='№'+repair.repair_id;$('motor').textContent=(motor.name||'Двигатель')+' · ID '+motor.motor_id;$('catalogProgram').textContent=program;$('turns').value=program;$('repairId').value=String(repair.repair_id);$('motorId').value=String(motor.motor_id);$('title').textContent='Намотка ремонта №'+repair.repair_id;$('context').className='note ok';$('context').textContent='Связка загружена. ESP32 повторно проверит принадлежность двигателя ремонту перед созданием задания.';$('send').disabled=false;ready=true;localStorage.setItem('cm-active-repair',String(repair.repair_id));localStorage.setItem('cm-selected-motor',String(motor.motor_id))}catch(e){fail(e.message||'Не удалось загрузить ремонт')}}function fail(text){ready=false;$('send').disabled=true;$('context').className='note warning';$('context').textContent=text+' Отправка без проверенной привязки с этой страницы запрещена.'}$('jobForm').onsubmit=async e=>{e.preventDefault();if(!ready){fail('Контекст ремонта не готов.');return}$('send').disabled=true;$('result').className='note';$('result').textContent='Отправка…';try{const r=await fetch('/api/jobs',{method:'POST',body:new FormData(e.target)}),j=await r.json();if(r.ok){$('result').className='note ok';$('result').textContent='Связанное задание №'+j.job_id+' передано. Сессия '+j.session_id+'.'}else{$('result').className='note warning';$('result').textContent='Ошибка: '+(j.error||'unknown')}}catch(e){$('result').className='note warning';$('result').textContent='Нет связи с ESP32'}finally{$('send').disabled=!ready}};loadContext();</script></body></html>
