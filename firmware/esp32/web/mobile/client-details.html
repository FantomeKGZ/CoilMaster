<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Клиент — CoilMaster</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.actions a{padding:12px;border-radius:10px;text-decoration:none;text-align:center;font-weight:bold;background:#e8f1f8;color:#105b91}.actions .primary{background:#1769aa;color:#fff}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}.kv{background:#f3f7fa;padding:11px;border-radius:9px;margin-bottom:8px}.muted{color:#687580}.ok{color:#17683a}.bad{color:#a4261d}.field{margin-bottom:10px}.field label{display:block;font-size:13px;color:#687580;margin-bottom:5px}.field input,.field select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5df;border-radius:9px;background:#fff}button{width:100%;padding:12px;border:0;border-radius:10px;background:#1769aa;color:#fff;font-weight:bold}.payment{padding:10px 0;border-bottom:1px solid #e4eaf0}.payment:last-child{border:0}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}</style></head><body><header><a href="/mobile/clients.html">← Клиенты</a><b style="float:right">👤 Карточка</b></header><main><div class="actions"><a href="/mobile/clients.html">Каталог клиентов</a><a id="repairLink" class="primary" href="/mobile/repair-new.html">+ Новый ремонт</a></div><h1 id="title">Клиент</h1><section class="card"><h2>Контакты</h2><div id="content" class="muted">Загрузка…</div><h3>Редактировать</h3><form id="editForm"><div class="field"><label for="editName">Имя</label><input id="editName" required maxlength="120"></div><div class="field"><label for="editPhone">Телефон</label><input id="editPhone" required maxlength="40"></div><div class="field"><label for="editComment">Комментарий</label><input id="editComment" maxlength="500"></div><button id="saveClient" type="submit">Сохранить изменения</button></form><p id="editStatus" class="muted"></p></section><section class="card"><h2>Баланс</h2><div id="balance" class="muted">Загрузка…</div><p class="muted">Предоплата хранится отдельно и автоматически не засчитывается в ремонт.</p><h3>Зачислить предоплату</h3><form id="prepayForm"><div class="field"><label for="prepayAmount">Сумма, сом</label><input id="prepayAmount" inputmode="decimal" placeholder="0.00" required></div><div class="field"><label for="prepayMethod">Способ</label><select id="prepayMethod"><option value="CASH">Наличные</option><option value="CARD">Карта</option><option value="TRANSFER">Перевод</option><option value="OTHER">Другое</option></select></div><div class="field"><label for="prepayComment">Комментарий</label><input id="prepayComment" maxlength="500" placeholder="Предоплата"></div><button id="prepayButton" type="submit">Зачислить предоплату</button></form><p id="prepayStatus" class="muted"></p></section><section class="card"><h2>История платежей</h2><div id="payments" class="muted">Загрузка…</div></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('client_id'),validId=v=>/^[1-9]\d*$/.test(String(v||'')),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=(minor,currency)=>{const n=Number(minor);return Number.isFinite(n)?(n/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+(currency||''): '—'},toMinor=value=>{const v=String(value||'').trim().replace(',','.');if(!/^\d+(?:\.\d{1,2})?$/.test(v))return 0;const [w,f='']=v.split('.'),n=Number(w)*100+Number((f+'00').slice(0,2));return Number.isSafeInteger(n)&&n>0?n:0};async function loadClient(){if(!validId(id))throw new Error('invalid_client_id');const r=await fetch('/api/clients/by-id?client_id='+encodeURIComponent(id),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'client_lookup_failed');const x=j.item;if(!x)throw new Error('client_not_found');localStorage.setItem('cm-selected-client',String(x.client_id));$('title').textContent=x.name||('Клиент '+x.client_id);$('repairLink').href='/mobile/repair-new.html?client_id='+encodeURIComponent(x.client_id);$('content').innerHTML='<div class="kv"><b>'+esc(x.name||'Клиент')+'</b></div><div class="kv">Телефон: <b>'+esc(x.phone||'не указан')+'</b></div><div class="kv">ID клиента: <b>'+esc(x.client_id)+'</b></div><div class="kv">Комментарий: '+esc(x.comment||'не указан')+'</div>';$('editName').value=x.name||'';$('editPhone').value=x.phone||'';$('editComment').value=x.comment||''}async function loadBalance(){try{const r=await fetch('/api/payments/balance?client_id='+encodeURIComponent(id),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'balance_unavailable');$('balance').innerHTML='<div class="kv">Оплачено по ремонтам: <b>'+esc(money(j.paid_minor,j.currency))+'</b></div><div class="kv">Долг: <b>'+esc(money(j.debt_minor,j.currency))+'</b></div><div class="kv">Предоплата: <b>'+esc(money(j.prepayment_minor||0,j.currency))+'</b></div>'}catch(e){$('balance').textContent='Баланс недоступен: '+e.message}}async function loadPayments(){try{const r=await fetch('/api/payments?client_id='+encodeURIComponent(id)+'&limit=20',{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'payment_history_unavailable');$('payments').innerHTML='';for(const x of j.items||[]){const d=document.createElement('div');d.className='payment';const kind=x.kind==='PREPAYMENT'?'Предоплата':(x.kind||'PAYMENT'),scope=x.kind==='PREPAYMENT'?'Без ремонта':'Ремонт №'+(x.repair_id||'—');d.innerHTML='<b>'+esc(kind)+' · '+esc(money(x.amount_minor,x.currency))+'</b><div class="muted">'+esc(scope)+'</div>'+(x.comment?'<div>'+esc(x.comment)+'</div>':'');$('payments').appendChild(d)}if(!(j.items||[]).length)$('payments').textContent='Платежей ещё нет.'}catch(e){$('payments').textContent='История недоступна: '+e.message}}$('editForm').onsubmit=async e=>{e.preventDefault();const b=$('saveClient');b.disabled=true;$('editStatus').className='muted';$('editStatus').textContent='Сохранение…';try{const body=new URLSearchParams({client_id:String(id),name:$('editName').value.trim(),phone:$('editPhone').value.trim(),comment:$('editComment').value.trim()});const r=await fetch('/api/clients/update',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body}),j=await r.json();if(!r.ok||j.updated!==true||j.write_performed!==true)throw new Error(j.error||'client_update_failed');$('editStatus').className='ok';$('editStatus').textContent='Изменения сохранены.';await loadClient()}catch(err){$('editStatus').className='bad';$('editStatus').textContent='Ошибка: '+err.message}finally{b.disabled=false}};$('prepayForm').onsubmit=async e=>{e.preventDefault();const amount=toMinor($('prepayAmount').value);if(!amount){$('prepayStatus').className='bad';$('prepayStatus').textContent='Укажите корректную сумму.';return}const b=$('prepayButton');b.disabled=true;$('prepayStatus').className='muted';$('prepayStatus').textContent='Зачисление…';try{const body=new URLSearchParams({confirmed:'true',kind:'PREPAYMENT',client_id:String(id),amount_minor:String(amount),currency:'KGS',occurred_at:new Date().toISOString(),method:$('prepayMethod').value,comment:$('prepayComment').value.trim()});const r=await fetch('/api/payments',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body}),j=await r.json();if(!r.ok||j.kind!=='PREPAYMENT'||Number(j.repair_id)!==0)throw new Error(j.error||'prepayment_failed');$('prepayAmount').value='';$('prepayComment').value='';$('prepayStatus').className='ok';$('prepayStatus').textContent='Предоплата зачислена.';await Promise.all([loadBalance(),loadPayments()])}catch(err){$('prepayStatus').className='bad';$('prepayStatus').textContent='Ошибка: '+err.message}finally{b.disabled=false}};(async()=>{try{await loadClient();await Promise.all([loadBalance(),loadPayments()])}catch(e){$('content').textContent='Ошибка: '+e.message}})();</script></body></html>
