<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Настройки — CoilMaster</title>
<style>:root{--bg:#eef2f6;--card:#fff;--text:#17212b;--muted:#687580;--blue:#1769aa;--green:#18864b;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text);padding-bottom:24px}header{position:sticky;top:0;background:#142536;color:#fff;padding:14px 16px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #17212b14}.muted{color:var(--muted)}label{display:block;margin-top:12px;font-weight:bold}input,select,button{width:100%;min-height:48px;padding:12px;border-radius:10px;border:1px solid #cbd5df;font-size:17px;margin-top:7px}button{background:var(--blue);color:#fff;border:0;font-weight:bold}.note{padding:12px;border-radius:10px;background:#f3f7fa;margin-top:12px}.ok{color:var(--green)}.bad{color:var(--red)}</style></head>
<body><header><a href="/mobile/">← CoilMaster</a><b style="float:right">⚙️ Настройки</b></header><main>
<section class="card"><h2>Склад</h2><p class="muted">Общая цена применяется ко всем бухтам и используется для расчёта стоимости остатка и расхода.</p>
<form id="priceForm"><label>Цена за 1 кг, сом</label><input id="price" inputmode="decimal" placeholder="1250,00" required><label>Валюта</label><select id="currency"><option value="KGS">KGS — сом</option></select><button type="submit">Сохранить цену</button></form><div id="result" class="note">Загрузка текущей цены…</div></section>
<section class="card"><b>Важно</b><p class="muted">Изменение общей цены не должно изменять стоимость уже завершённых ремонтов. При списании цена будет сохраняться в записи ремонта отдельно.</p></section>
</main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id);const fromMinor=v=>(v/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});async function load(){try{const r=await fetch('/api/warehouse/price',{cache:'no-store'}),j=await r.json();if(j.configured){$('price').value=fromMinor(j.price_per_kg_minor);$('currency').value=j.currency||'KGS';$('result').textContent='Текущая цена: '+fromMinor(j.price_per_kg_minor)+' сом/кг';}else $('result').textContent='Цена ещё не установлена.';}catch(e){$('result').className='note bad';$('result').textContent='Не удалось загрузить цену.';}}$('priceForm').addEventListener('submit',async e=>{e.preventDefault();const normalized=$('price').value.replace(',','.').trim(),value=Number(normalized);if(!Number.isFinite(value)||value<=0){$('result').className='note bad';$('result').textContent='Введите корректную цену.';return;}const body=new URLSearchParams({price_per_kg_minor:String(Math.round(value*100)),currency:$('currency').value});$('result').className='note';$('result').textContent='Сохранение…';try{const r=await fetch('/api/warehouse/price',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok)throw new Error(j.error||'unknown');$('result').className='note ok';$('result').textContent='Цена сохранена: '+fromMinor(j.price_per_kg_minor)+' сом/кг';}catch(err){$('result').className='note bad';$('result').textContent='Ошибка сохранения: '+err.message;}});load();</script></body></html>
