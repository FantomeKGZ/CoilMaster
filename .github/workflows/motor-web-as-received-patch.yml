name: Guarded Motor AS_RECEIVED UI Patch

on:
  push:
    branches: [cmp-protocol-v1]
    paths:
      - '.github/workflows/motor-web-as-received-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
      - name: Guard current motor details blob
        run: test "$(git hash-object firmware/esp32/web/desktop/motor-details.html)" = "486c8b707776e09429cd1a92142fa43dae349fe0"
      - name: Patch AS_RECEIVED comparison UI
        run: |
          python3 -c 'from pathlib import Path; p=Path("firmware/esp32/web/desktop/motor-details.html"); s=p.read_text(); marker="function appendRepairs(items){"; insert="""function windingLine(label,program,repeats,conductors,present=true){if(!present)return \"<div><b>\"+esc(label)+\":</b> —</div>\";return \"<div><b>\"+esc(label)+\":</b> \"+esc(program||\"—\")+\" × \"+esc(repeats||\"—\")+(conductors?\" · \"+esc(conductors):\"\")+\"</div>\"}\nasync function findVersionForRepair(repairId){let cursor=0;for(let page=0;page<100;page++){const q=new URLSearchParams({motor_id:String(motorId),limit:\"24\"});if(cursor)q.set(\"cursor\",String(cursor));const r=await fetch(\"/api/motors/winding/versions?\"+q,{cache:\"no-store\"}),j=await r.json();if(!r.ok)throw new Error(j.error||\"motor_winding_version_read_failed\");const hit=(j.items||[]).find(v=>String(v.source_repair_id||\"\")===String(repairId));if(hit)return hit;if(j.has_more!==true)return null;const next=Number(j.next_cursor);if(!Number.isInteger(next)||next<=cursor)throw new Error(\"invalid_paging_cursor\");cursor=next}throw new Error(\"version_history_limit\")}\nasync function loadRepairComparison(repairId,panel,button){button.disabled=true;panel.className=\"muted\";panel.textContent=\"Загрузка состояния при поступлении…\";try{const sr=await fetch(\"/api/repairs/as-received?repair_id=\"+encodeURIComponent(repairId),{cache:\"no-store\"}),sj=await sr.json();if(!sr.ok)throw new Error(sj.error||\"repair_as_received_read_failed\");const after=await findVersionForRepair(repairId);let before;if(sj.snapshot_present&&sj.item){const s=sj.item;before=\"<div class=\\\"role\\\"><h3>При поступлении</h3>\"+windingLine(\"WORKING\",s.working_program,s.working_repeat_target,s.working_conductors,true)+windingLine(\"STARTING\",s.starting_program,s.starting_repeat_target,s.starting_conductors,s.starting_present===true)+\"<div class=\\\"muted\\\">Снимок №\"+esc(s.snapshot_id)+\" · \"+esc(dateLabel(s.captured_at))+\"</div></div>\"}else{before=\"<div class=\\\"role warn\\\"><h3>При поступлении</h3><div>Legacy-ремонт: immutable AS_RECEIVED snapshot отсутствует.</div></div>\"}let afterHtml;if(after){afterHtml=\"<div class=\\\"role\\\"><h3>После ремонта</h3>\"+windingLine(\"WORKING\",after.working_program,after.working_repeat_target,after.working_conductors,true)+windingLine(\"STARTING\",after.starting_program,after.starting_repeat_target,after.starting_conductors,after.starting_present===true)+\"<div class=\\\"muted\\\">Версия №\"+esc(after.winding_version_id)+\" · \"+esc(dateLabel(after.created_at))+\"</div></div>\"}else{afterHtml=\"<div class=\\\"role\\\"><h3>После ремонта</h3><div class=\\\"muted\\\">Связанная версия с source_repair_id пока не зарегистрирована. Текущая карточка выше не подменяет исторический результат ремонта.</div></div>\"}panel.className=\"roles\";panel.innerHTML=before+afterHtml}catch(e){panel.className=\"warn\";panel.textContent=\"Сравнение недоступно: \"+(e.message||\"unknown\")}finally{button.disabled=false}}\n"""; assert marker in s; s=s.replace(marker,insert+marker,1); old="$('\''repairs'\'').appendChild(d);repairLoaded++"; new="const compare=document.createElement('\''button'\'');compare.type='\''button'\'';compare.className='\''more'\'';compare.textContent='\''При поступлении / после ремонта'\'';const panel=document.createElement('\''div'\'');panel.className='\''hidden'\'';panel.style.marginTop='\''10px'\'';compare.onclick=()=>loadRepairComparison(x.repair_id,panel,compare);d.appendChild(compare);d.appendChild(panel);$('\''repairs'\'').appendChild(d);repairLoaded++"; assert old in s; s=s.replace(old,new,1); p.write_text(s)'
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add firmware/esp32/web/desktop/motor-details.html
          git commit -m "feat(web): compare motor winding before and after repair"
          git push origin HEAD:cmp-protocol-v1
