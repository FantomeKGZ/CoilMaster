<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Калькулятор провода</title><style>:root{--bg:#eef2f6;--card:#fff;--text:#17212b;--muted:#687580;--blue:#1769aa;--green:#18864b;--orange:#b86d00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text);padding-bottom:76px}header{background:#142536;color:#fff;padding:15px 16px;position:sticky;top:0;z-index:2}header a{color:#fff;text-decoration:none;margin-right:10px}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #17212b14}label{display:block;margin-top:11px;font-weight:bold}input,select,button{width:100%;min-height:48px;padding:12px;margin-top:6px;border:1px solid #cbd5df;border-radius:10px;font-size:17px}button{border:0;background:var(--blue);color:#fff;font-weight:bold}.result{border:1px solid #dce5ec;border-radius:12px;padding:13px;margin-top:10px}.rank{font-size:20px;font-weight:bold}.stock{color:var(--green);font-weight:bold}.buy{color:var(--orange);font-weight:bold}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:11px 4px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}</style></head><body><header><a href="/mobile/">‹</a><b>Конвертация провода</b></header><main><section class="card"><form id="form"><label>Исходный материал</label><select name="source_material" id="source"><option value="AL">Алюминий</option><option value="CU">Медь</option></select><label>Целевой материал</label><select name="target_material" id="target"><option value="CU">Медь</option><option value="AL">Алюминий</option></select><label>Диаметр одной исходной жилы, мм</label><input id="diameter" inputmode="decimal" placeholder="0,80" required><label>Количество параллельных жил</label><input name="source_parallel_strands" type="number" min="1" max="12" value="1" required><label>Максимум целевых жил</label><input name="max_target_strands" type="number" min="1" max="8" value="4"><label>Допустимое отклонение, %</label><input id="deviation" inputmode="decimal" value="8"><button type="submit">Рассчитать</button></form><p class="muted">В расчёте участвуют все диаметры, когда-либо внесённые в склад. Отсутствующие позиции показываются как рекомендация для закупки.</p></section><section class="card"><h2>Рекомендации</h2><div id="results" class="muted">Введите исходные данные.</div></section></main><nav><a href="/mobile/"><b>⚙️</b>Намотка</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/conductor-calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/settings.html"><b>☰</b>Настройки</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const form=document.getElementById('form'),results=document.getElementById('results');document.getElementById('source').addEventListener('change',e=>document.getElementById('target').value=e.target.value==='AL'?'CU':'AL');form.addEventListener('submit',async e=>{e.preventDefault();results.textContent='Расчёт…';const fd=new FormData(form),d=parseFloat(document.getElementById('diameter').value.replace(',','.')),dev=parseFloat(document.getElementById('deviation').value.replace(',','.'));if(!(d>0)||!(dev>0)){results.textContent='Проверьте диаметр и отклонение.';return}const p=new URLSearchParams(fd);p.set('source_diameter_hundredths_mm',String(Math.round(d*100)));p.set('allowed_deviation_permille',String(Math.round(dev*10)));p.set('al_to_cu_permille','1000');p.set('cu_to_al_permille','1000');try{const r=await fetch('/api/calculator/conductor?'+p.toString(),{cache:'no-store'}),j=await r.json();if(!r.ok){results.textContent='Ошибка: '+(j.error||'unknown');return}if(!j.recommendations.length){results.textContent='Подходящих вариантов в заданном отклонении нет.';return}results.innerHTML=j.recommendations.map(x=>`<div class="result"><div class="rank">${x.rank}. ${x.parallel_strands} × ${(x.diameter_hundredths_mm/100).toFixed(2)} мм</div><div class="row"><span>Отклонение</span><b>${(x.deviation_permille/10).toFixed(1)} %</b></div><div class="row"><span>Остаток</span><b>${(x.available_g/1000).toFixed(3)} кг</b></div><div class="${x.availability==='IN_STOCK'?'stock':'buy'}">${x.availability==='IN_STOCK'?'Есть на складе':'Рекомендуется закупить'}</div></div>`).join('')}catch(err){results.textContent='Нет связи с ESP32'}});</script></body></html>
