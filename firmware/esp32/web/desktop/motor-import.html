<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Импорт двигателей</title>
<style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b}main{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border-radius:15px;padding:18px;margin-bottom:14px}textarea,input,button{box-sizing:border-box;width:100%;padding:11px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:15px}textarea{min-height:240px;font-family:monospace}button{background:#1769aa;color:#fff;border:0;font-weight:bold}button.secondary{background:#e8eef4;color:#17212b}button:disabled{opacity:.55}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.item{padding:12px 0;border-bottom:1px solid #e3e9ef}.item label{display:flex;gap:9px;align-items:flex-start}.item input{width:auto;margin:3px 0}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}.warning{color:#8a5b00}.badge{display:inline-block;padding:3px 7px;border-radius:8px;background:#e8eef4;margin:3px}.progress{white-space:pre-wrap}@media(max-width:650px){main{padding:10px}.actions{grid-template-columns:1fr}textarea{min-height:300px}}</style></head>
<body><main><p><a href="motors.html">← Каталог двигателей</a></p><h1>Импорт двигателей и обмоток</h1>
<section class="card"><p>Загрузите JSON-массив. Предпросмотр ничего не записывает.</p><input id="file" type="file" accept=".json,application/json"><textarea id="source" placeholder="Вставьте JSON-массив"></textarea><div class="actions"><button id="example" class="secondary" type="button">Вставить пример</button><button id="preview" type="button">Проверить пакет</button><button id="import" type="button" disabled>Импортировать выбранные</button></div><p id="status" class="muted">Не более 50 записей.</p></section>
<section class="card"><h2>Предпросмотр</h2><div id="items" class="muted">Пакет ещё не проверен.</div></section><section class="card"><h2>Результат</h2><div id="result" class="progress muted">Импорт ещё не запускался.</div></section>
</main><script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sourceTypes=['MANUFACTURER','TECHNICAL_REFERENCE','REPAIR_RECORD','CALCULATED','UNVERIFIED'];
const confidences=['VERIFIED','CORROBORATED','CALCULATED','UNVERIFIED'];
const numeric={rated_power_w:[1,100000000],rated_voltage_v:[1,50000],rated_current_ma:[1,100000000],rated_speed_rpm:[1,60000],frequency_hz:[1,1000],phases:[1,3],slot_count:[1,1000],pole_count:[1,128],coil_pitch:[1,1000],turns_per_coil:[1,9999],wire_diameter_hundredths_mm:[1,10000],parallel_strands:[1,255],stator_bore_mm:[1,10000],stator_core_length_mm:[1,10000]};
const textLimits={name:120,model:80,manufacturer:80,tags:240,comment:500,coil_program:50,connection:16,winding_type:80,wire_material:8,source_type:32,source_url:300,source_title:200,source_retrieved_at:10,confidence:32};
const allowedFields=new Set([...Object.keys(textLimits),...Object.keys(numeric),'calculated_fields']);
const example=[{name:'АИР 80A2',model:'80A2',manufacturer:'пример',coil_program:'120/120/120',rated_power_w:1500,rated_voltage_v:380,rated_current_ma:3400,rated_speed_rpm:2850,frequency_hz:50,phases:3,connection:'Y/DELTA',slot_count:24,pole_count:2,coil_pitch:10,turns_per_coil:120,wire_diameter_hundredths_mm:71,parallel_strands:1,wire_material:'CU',source_type:'UNVERIFIED',source_title:'Демонстрационная запись',source_retrieved_at:'2026-08-12',confidence:'UNVERIFIED',calculated_fields:false}];
let prepared=[];
function canonical(raw){const p=String(raw??'').trim().replace(/ /g,'').split(/[\/,;]/);if(!p.length||p.length>10||p.some(x=>!/^\d+$/.test(x)||(x.length>1&&x[0]==='0')||Number(x)<1||Number(x)>9999))return null;return p.join('/')}
function validDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const [y,m,d]=v.split('-').map(Number),dt=new Date(Date.UTC(y,m-1,d));return y>=2000&&y<=2199&&dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d}
function validate(x){const e=[];if(!x||typeof x!=='object'||Array.isArray(x))return ['Запись должна быть объектом'];for(const k of Object.keys(x)){if(!allowedFields.has(k))e.push('неизвестное поле '+k)}for(const [k,max] of Object.entries(textLimits)){if(x[k]===undefined||x[k]===null)continue;if(typeof x[k]!=='string'){e.push(k+' должен быть строкой');continue}x[k]=x[k].trim();if(x[k].length>max)e.push(k+' слишком длинное')}['name','coil_program','source_type','source_title','confidence'].forEach(k=>{if(!x[k])e.push('обязательно поле '+k)});const cp=canonical(x.coil_program);if(!cp)e.push('некорректное coil_program');else x.coil_program=cp;x.source_type=String(x.source_type||'').toUpperCase();x.confidence=String(x.confidence||'').toUpperCase();x.connection=String(x.connection||'').toUpperCase();x.wire_material=String(x.wire_material||'').toUpperCase();if(!sourceTypes.includes(x.source_type))e.push('некорректное source_type');if(!confidences.includes(x.confidence))e.push('некорректное confidence');if(x.connection&&!['Y','DELTA','Y/DELTA'].includes(x.connection))e.push('некорректное connection');if(x.wire_material&&!['CU','AL'].includes(x.wire_material))e.push('некорректное wire_material');for(const [k,range] of Object.entries(numeric)){if(x[k]===undefined||x[k]===null||x[k]==='')continue;const v=Number(x[k]);if(!Number.isInteger(v)||v<range[0]||v>range[1])e.push(k+' вне диапазона');else x[k]=v}if(x.calculated_fields!==undefined&&typeof x.calculated_fields!=='boolean')e.push('calculated_fields должен быть true/false');const calculated=x.source_type==='CALCULATED'||x.confidence==='CALCULATED';if(calculated!==!!x.calculated_fields)e.push('calculated_fields не соответствует классификации');if(x.source_retrieved_at&&!validDate(x.source_retrieved_at))e.push('source_retrieved_at должен быть действительной датой YYYY-MM-DD');if(x.source_url){try{const u=new URL(x.source_url);if(!['http:','https:'].includes(u.protocol))throw new Error()}catch(_){e.push('source_url должен быть HTTP(S) адресом')}}return e}
const identityText=v=>String(v||'').trim().toLowerCase();
function packageIdentityMatch(a,b){if(a.coil_program!==b.coil_program)return false;return ['name','model','manufacturer'].some(k=>identityText(a[k])&&identityText(a[k])===identityText(b[k]))}
async function similarity(x){const q=new URLSearchParams();['coil_program','name','model','manufacturer'].forEach(k=>q.set(k,x[k]||''));const r=await fetch('/api/motors/similar?'+q,{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||'similarity_failed');return j}
function rowHtml(p,i){let note;if(p.imported)note='<div class="ok">Импортировано в текущем запуске.</div>';else if(p.errors.length)note='<div class="bad">'+p.errors.map(esc).join('; ')+'</div>';else if(p.similar.identity_match_count)note='<div class="warning">Совпадений по идентичности: '+p.similar.identity_match_count+'. По умолчанию пропущено.</div>';else if(p.similar.same_program_count)note='<div class="warning">Такая программа встречается '+p.similar.same_program_count+' раз.</div>';else note='<div class="ok">Точных совпадений не найдено.</div>';return '<div class="item"><label><input class="pick" data-i="'+i+'" type="checkbox" '+(p.selected?'checked':'')+' '+(p.errors.length||p.imported?'disabled':'')+'><span><b>'+(i+1)+'. '+esc(p.data.name||'Без названия')+'</b><div>'+esc(p.data.manufacturer||'—')+' · '+esc(p.data.model||'—')+' · '+esc(p.data.coil_program||'—')+'</div><span class="badge">'+esc(p.data.source_type||'—')+'</span><span class="badge">'+esc(p.data.confidence||'—')+'</span>'+note+'</span></label></div>'}
function updateImport(){const n=prepared.filter(x=>x.selected&&!x.errors.length).length;$('import').disabled=n===0;$('import').textContent='Импортировать выбранные ('+n+')'}
function render(){$('items').innerHTML=prepared.map(rowHtml).join('')||'Нет записей.';document.querySelectorAll('.pick').forEach(x=>x.onchange=()=>{prepared[Number(x.dataset.i)].selected=x.checked;updateImport()});updateImport()}
$('file').onchange=async e=>{const f=e.target.files[0];if(f)$('source').value=await f.text()};
$('example').onclick=()=>{$('source').value=JSON.stringify(example,null,2)};
$('preview').onclick=async()=>{prepared=[];$('import').disabled=true;$('status').className='muted';$('status').textContent='Проверка…';let rows;try{rows=JSON.parse($('source').value)}catch(e){$('status').className='bad';$('status').textContent='JSON не читается: '+e.message;return}if(!Array.isArray(rows)||rows.length<1||rows.length>50){$('status').className='bad';$('status').textContent='Нужен JSON-массив от 1 до 50 записей.';return}for(let i=0;i<rows.length;i++){const original=rows[i],data=original&&typeof original==='object'&&!Array.isArray(original)?{...original}:original;const errors=validate(data);let similar={same_program_count:0,identity_match_count:0};if(!errors.length){const duplicate=prepared.findIndex(p=>!p.errors.length&&packageIdentityMatch(data,p.data));if(duplicate>=0)errors.push('дубликат внутри пакета: строка '+(duplicate+1))}if(!errors.length){try{similar=await similarity(data)}catch(e){errors.push('не удалось проверить дубли: '+e.message)}}prepared.push({data:original&&typeof original==='object'?data:{},errors,similar,selected:!errors.length&&!similar.identity_match_count,imported:false});$('status').textContent='Проверено '+(i+1)+' из '+rows.length}render();$('status').className=prepared.some(x=>x.errors.length)?'warning':'ok';$('status').textContent='Предпросмотр готов. Ошибок: '+prepared.filter(x=>x.errors.length).length};
$('import').onclick=async()=>{const selected=prepared.filter(x=>x.selected&&!x.errors.length&&!x.imported);if(!selected.length||!confirm('Создать '+selected.length+' карточек?'))return;$('import').disabled=true;$('preview').disabled=true;const log=[];for(const p of selected){const fd=new FormData();for(const [k,v] of Object.entries(p.data)){if(v===undefined||v===null||v==='')continue;fd.set(k,typeof v==='boolean'?(v?'true':'false'):String(v))}try{const r=await fetch('/api/motors',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error||'write_failed');p.imported=true;p.selected=false;log.push('OK · '+p.data.name+' → ID '+j.motor_id)}catch(e){log.push('ОШИБКА · '+p.data.name+' → '+e.message)}$('result').className='progress';$('result').textContent=log.join('\n')}$('preview').disabled=false;render();$('result').className=log.some(x=>x.startsWith('ОШИБКА'))?'progress warning':'progress ok'};
</script></body></html>
