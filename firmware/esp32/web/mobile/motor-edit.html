<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактирование двигателя — CoilMaster</title>
<style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}main{padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}.field label{font-size:13px;color:#5d6973;font-weight:bold}.field input,.field textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #c9d4de;border-radius:9px;background:#fff;font:inherit}.field textarea{min-height:80px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;padding:11px 14px;border-radius:9px;text-decoration:none;border:0;font-size:15px;font-weight:bold}.primary{background:#1769aa;color:#fff}.secondary{background:#e7eef5;color:#17324b}.muted{color:#687580}.ok{background:#e8f7ee;border:1px solid #82c99f;padding:11px;border-radius:9px}.warn{background:#fff3d8;border:1px solid #efc86a;padding:11px;border-radius:9px}.hidden{display:none}</style></head>
<body><main><div class="actions"><a id="back" class="btn secondary" href="/mobile/motors.html">← Карточка</a></div><h1>Редактировать двигатель</h1><p id="identity" class="muted"></p><form id="form">
<section class="card"><h2>Основные данные</h2><div class="field"><label>Производитель</label><input id="manufacturer"></div><div class="field"><label>Модель</label><input id="model"></div><div class="field"><label>Внутреннее обозначение</label><input id="name" required></div><div class="field"><label>Теги</label><input id="tags"></div><div class="field"><label>Мощность, Вт</label><input id="rated_power_w"></div><div class="field"><label>Напряжение, В</label><input id="rated_voltage_v"></div><div class="field"><label>Ток, А</label><input id="rated_current_a" type="number" step="0.001" min="0"></div><div class="field"><label>Обороты, об/мин</label><input id="rated_speed_rpm"></div><div class="field"><label>Частота, Гц</label><input id="frequency_hz"></div><div class="field"><label>Фазы</label><input id="phase_count"></div><div class="field"><label>Пазы</label><input id="slot_count"></div><div class="field"><label>Полюсы</label><input id="pole_count"></div><div class="field"><label>Соединение</label><input id="connection"></div></section>
<section class="card"><h2>Обмотка</h2><div class="field"><label>Программа витков</label><input id="coil_program" required></div><div class="field"><label>Повторы</label><input id="repeat_target" value="1"></div><div class="field"><label>Шаг катушки</label><input id="coil_pitch"></div><div class="field"><label>Витков на катушку</label><input id="turns_per_coil"></div><div class="field"><label>Диаметр провода, мм</label><input id="wire_diameter_mm" type="number" step="0.01" min="0"></div><div class="field"><label>Параллельных жил</label><input id="parallel_strands"></div><div class="field"><label>Материал провода</label><input id="wire_material"></div><div class="field"><label>Тип обмотки</label><input id="winding_type"></div></section>
<section class="card"><h2>Статор и источник</h2><div class="field"><label>Внутренний диаметр статора, мм</label><input id="stator_bore_mm"></div><div class="field"><label>Длина пакета, мм</label><input id="stator_core_length_mm"></div><div class="field"><label>Тип источника</label><input id="source_type"></div><div class="field"><label>Название источника</label><input id="source_title"></div><div class="field"><label>URL источника</label><input id="source_url"></div><div class="field"><label>Дата получения</label><input id="source_retrieved_at"></div><div class="field"><label>Достоверность</label><input id="confidence"></div><div class="field"><label><input id="calculated_fields" type="checkbox" style="width:auto"> Есть расчётные поля</label></div><div class="field"><label>Комментарий</label><textarea id="comment"></textarea></div></section>
<div class="actions"><button id="save" class="btn primary" type="submit">Сохранить</button><a id="cancel" class="btn secondary" href="/mobile/motors.html">Отмена</a></div></form><p id="message" class="muted"></p></main>
<script>
localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),motorId=new URLSearchParams(location.search).get('motor_id');const text=(id,v)=>$(id).value=v===undefined||v===null?'':String(v);const optional=(b,n,v)=>{v=String(v??'').trim();if(v!=='')b.set(n,v)};
function fill(m){$('identity').textContent='motor_id: '+m.motor_id;text('manufacturer',m.manufacturer);text('model',m.model);text('name',m.name);text('tags',m.tags);text('rated_power_w',m.rated_power_w);text('rated_voltage_v',m.rated_voltage_v);text('rated_current_a',m.rated_current_ma?Number(m.rated_current_ma)/1000:'');text('rated_speed_rpm',m.rated_speed_rpm);text('frequency_hz',m.frequency_hz);text('phase_count',m.phase_count??m.phases);text('slot_count',m.slot_count);text('pole_count',m.pole_count);text('connection',m.connection);text('coil_program',m.coil_program);text('repeat_target',m.repeat_target||1);text('coil_pitch',m.coil_pitch);text('turns_per_coil',m.turns_per_coil);text('wire_diameter_mm',m.wire_diameter_hundredths_mm?Number(m.wire_diameter_hundredths_mm)/100:'');text('parallel_strands',m.parallel_strands);text('wire_material',m.wire_material);text('winding_type',m.winding_type);text('stator_bore_mm',m.stator_bore_mm);text('stator_core_length_mm',m.stator_core_length_mm);text('source_type',m.source_type);text('source_title',m.source_title);text('source_url',m.source_url);text('source_retrieved_at',m.source_retrieved_at);text('confidence',m.confidence);$('calculated_fields').checked=m.calculated_fields===true;text('comment',m.comment)}
async function load(){if(!motorId){$('message').className='warn';$('message').textContent='motor_id не указан';$('form').classList.add('hidden');return}$('back').href='/mobile/motor-details.html?motor_id='+encodeURIComponent(motorId);$('cancel').href=$('back').href;try{const r=await fetch('/api/motors/by-id?motor_id='+encodeURIComponent(motorId),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'motor_read_failed');fill(j.item)}catch(e){$('message').className='warn';$('message').textContent='Ошибка загрузки: '+(e.message||'unknown');$('form').classList.add('hidden')}}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('save').disabled=true;$('message').className='muted';$('message').textContent='Сохранение…';try{const b=new URLSearchParams();b.set('motor_id',motorId);b.set('manufacturer',$('manufacturer').value.trim());b.set('model',$('model').value.trim());let legacy=$('name').value.trim();if(!legacy)legacy=[$('manufacturer').value.trim(),$('model').value.trim()].filter(Boolean).join(' ');b.set('name',legacy);b.set('tags',$('tags').value.trim());b.set('coil_program',$('coil_program').value.trim());b.set('repeat_target',$('repeat_target').value.trim()||'1');for(const id of ['rated_power_w','rated_voltage_v','rated_speed_rpm','frequency_hz','phase_count','slot_count','pole_count','coil_pitch','turns_per_coil','parallel_strands','stator_bore_mm','stator_core_length_mm'])optional(b,id,$(id).value);const amps=$('rated_current_a').value.trim();if(amps!=='')b.set('rated_current_ma',String(Math.round(Number(amps)*1000)));const dia=$('wire_diameter_mm').value.trim();if(dia!=='')b.set('wire_diameter_hundredths_mm',String(Math.round(Number(dia)*100)));for(const id of ['connection','winding_type','wire_material','source_type','source_url','source_title','source_retrieved_at','confidence','comment'])b.set(id,$(id).value.trim());b.set('calculated_fields',$('calculated_fields').checked?'true':'false');const r=await fetch('/api/motors/update',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:b}),j=await r.json();if(!r.ok)throw new Error(j.error||'motor_update_failed');$('message').className='ok';$('message').textContent='Сохранено. motor_id: '+j.motor_id;setTimeout(()=>location.href=$('back').href,500)}catch(err){$('message').className='warn';$('message').textContent='Ошибка сохранения: '+(err.message||'unknown')}finally{$('save').disabled=false}});load();
</script></body></html>
