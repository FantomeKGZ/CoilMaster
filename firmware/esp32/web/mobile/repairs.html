<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ремонты</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}input,select,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.secondary{background:#5b6874}.item{padding:12px 0;border-bottom:1px solid #e5ebf0}.muted{color:#687580}.links a,.catalog-link{display:inline-block;margin:8px 10px 0 0}.note{background:#f3f7fa;padding:10px;border-radius:10px;margin-top:10px}.warning{background:#fff4d6;border:1px solid #e0bc55}.similar{padding:8px 0;border-bottom:1px solid #eadcae}</style></head><body><header><a href="/mobile/more.html">← Ещё</a><b style="float:right">🧰 Ремонты</b></header><main><section class="card"><h2>Новый ремонт</h2><form id="form"><label>Клиент</label><select id="clientId" name="client_id" required><option value="">Загрузка клиентов…</option></select><a class="catalog-link" href="/mobile/clients.html">Открыть каталог клиентов</a><label>Двигатель</label><select id="motorId" name="motor_id" required><option value="">Загрузка двигателей…</option></select><a class="catalog-link" href="/mobile/motors.html">Открыть каталог двигателей</a><input id="received" name="received_at" type="datetime-local" required><textarea name="complaint" placeholder="Жалоба клиента"></textarea><textarea name="comment" placeholder="Комментарий"></textarea><button>Создать ремонт</button></form><p id="result" class="muted"></p></section><section class="card"><h2>Быстро добавить клиента</h2><form id="clientForm"><input name="name" placeholder="Имя клиента" required><input name="phone" inputmode="tel" placeholder="Телефон" required><textarea name="comment" placeholder="Комментарий"></textarea><button class="secondary">Добавить клиента</button></form><div id="clientResult" class="note muted">После добавления клиент автоматически выберется.</div></section><section class="card"><h2>Быстро добавить двигатель</h2><form id="motorForm"><input name="name" placeholder="Название двигателя" required><input name="coil_program" placeholder="Программа витков, например 140/100/80/40" required><input name="manufacturer" placeholder="Производитель"><input name="model" placeholder="Модель"><input name="tags" placeholder="Теги через запятую"><textarea name="comment" placeholder="Комментарий"></textarea><button class="secondary">Проверить и добавить</button></form><div id="motorResult" class="note muted">Перед добавлением система проверит похожие карточки.</div><div id="similarBox" class="note warning" hidden><b>Найдены похожие двигатели</b><div id="similarItems"></div><button id="forceCreate" type="button">Всё равно создать отдельный двигатель</button></div></section><section class="card"><h2>Ремонты</h2><div id="items" class="muted">Загрузка…</div></section></main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),requestedClient=params.get('client_id')||localStorage.getItem('cm-selected-client')||'',requestedMotor=params.get('motor_id')||localStorage.getItem('cm-selected-motor')||'';$('received').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);let clients=[],motors=[],pendingMotor=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function clientLabel(x){return(x.name||'Клиент')+' · '+(x.phone||'без телефона')}function motorLabel(x){return(x.name||'Двигатель')+(x.model?' · '+x.model:'')+(x.manufacturer?' · '+x.manufacturer:'')+' · '+(x.coil_program||'без программы')}async function fill(url,items,select,idKey,label,selected){const r=await fetch(url,{cache:'no-store'}),j=await r.json();items.splice(0,items.length,...(j.items||[]));select.innerHTML='<option value="">Выберите</option>';items.forEach(x=>{const o=document.createElement('option');o.value=x[idKey];o.textContent=label(x);select.appendChild(o)});if(selected&&items.some(x=>String(x[idKey])===String(selected)))select.value=String(selected)}async function loadClients(selected){try{await fill('/api/clients',clients,$('clientId'),'client_id',clientLabel,selected||requestedClient)}catch(e){$('clientId').innerHTML='<option value="">Каталог клиентов недоступен</option>'}}async function loadMotors(selected){try{await fill('/api/motors',motors,$('motorId'),'motor_id',motorLabel,selected||requestedMotor)}catch(e){$('motorId').innerHTML='<option value="">Каталог двигателей недоступен</option>'}}$('clientId').onchange=()=>localStorage.setItem('cm-selected-client',$('clientId').value);$('motorId').onchange=()=>localStorage.setItem('cm-selected-motor',$('motorId').value);async function load(){const q=params.get('client_id')?'?client_id='+encodeURIComponent(params.get('client_id')):'';const r=await fetch('/api/repairs'+q,{cache:'no-store'}),j=await r.json();$('items').innerHTML='';(j.items||[]).forEach(x=>{const m=motors.find(v=>Number(v.motor_id)===Number(x.motor_id)),c=clients.find(v=>Number(v.client_id)===Number(x.client_id)),d=document.createElement('div');d.className='item';d.innerHTML='<b>Ремонт №'+x.repair_id+' — '+esc(m?motorLabel(m):'Двигатель ID '+x.motor_id)+'</b><div>'+esc(c?clientLabel(c):'Клиент ID '+x.client_id)+'</div><div class="muted">'+esc(x.status)+' · '+esc(x.received_at)+'</div><div class="links"><a href="/mobile/winding-job.html?repair_id='+x.repair_id+'">Намотка</a><a href="/mobile/costing.html?repair_id='+x.repair_id+'">Калькуляция</a><a href="/mobile/writeoff.html?repair_id='+x.repair_id+'">Списание провода</a><a href="/mobile/winding-history.html?repair_id='+x.repair_id+'">История намотки</a></div>';$('items').appendChild(d)});if(!(j.items||[]).length)$('items').textContent='Ремонтов пока нет.'}$('clientForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/clients',{method:'POST',body:new FormData(e.target)}),j=await r.json();if(r.ok){$('clientResult').textContent='Клиент добавлен, ID '+j.client_id;localStorage.setItem('cm-selected-client',j.client_id);await loadClients(j.client_id);e.target.reset()}else $('clientResult').textContent=j.error||'Ошибка добавления клиента'};async function createMotor(fd){const r=await fetch('/api/motors',{method:'POST',body:fd}),j=await r.json();if(!r.ok){$('motorResult').textContent=j.error||'Ошибка добавления двигателя';return}$('similarBox').hidden=true;$('motorResult').textContent='Двигатель добавлен, ID '+j.motor_id;localStorage.setItem('cm-selected-motor',j.motor_id);await loadMotors(j.motor_id);$('motorForm').reset();pendingMotor=null}async function checkMotor(fd){const q=new URLSearchParams();['name','model','manufacturer','coil_program'].forEach(k=>q.set(k,fd.get(k)||''));const r=await fetch('/api/motors/similar?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok){$('motorResult').textContent=j.error||'Ошибка проверки';return}if(!(j.items||[]).length){await createMotor(fd);return}pendingMotor=fd;$('similarItems').innerHTML='<div class="muted">Такая программа: '+j.same_program_count+'. Совпадений по данным: '+j.identity_match_count+'.</div>'+(j.items||[]).map(x=>'<div class="similar"><b>'+esc(x.name)+(x.model?' · '+esc(x.model):'')+'</b><div>'+esc(x.coil_program||'')+'</div><div class="muted">'+esc(x.match_level||'')+'</div></div>').join('');$('similarBox').hidden=false;$('motorResult').textContent='Проверьте совпадения.'}$('motorForm').onsubmit=e=>{e.preventDefault();$('similarBox').hidden=true;checkMotor(new FormData(e.target))};$('forceCreate').onclick=()=>pendingMotor&&createMotor(pendingMotor);$('form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);fd.set('received_at',new Date($('received').value).toISOString());const r=await fetch('/api/repairs',{method:'POST',body:fd}),j=await r.json();if(r.ok){localStorage.setItem('cm-active-repair',j.repair_id);localStorage.setItem('cm-selected-client',j.client_id);localStorage.setItem('cm-selected-motor',j.motor_id);location.href='/mobile/costing.html?repair_id='+j.repair_id}else $('result').textContent=j.error||'Ошибка'};(async()=>{await loadClients();await loadMotors();await load()})();</script></body></html>
