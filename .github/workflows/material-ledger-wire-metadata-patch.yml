name: Guarded Material Wire Metadata Patch

on:
  push:
    branches: [cmp-protocol-v1]
    paths:
      - .github/workflows/material-ledger-wire-metadata-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
          fetch-depth: 0
      - name: Verify exact target blob
        run: |
          test "$(git rev-parse HEAD:firmware/esp32/src/CM_MaterialLedger.cpp)" = "64eceb25d27365bc02570343fb3aa33ced52d07b"
      - name: Apply exact metadata patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('firmware/esp32/src/CM_MaterialLedger.cpp')
          s = p.read_text()

          anchor1 = '    if (!nextId(MaterialsPath, "material_id", assignedMaterialId)) return false;\n'
          insert1 = '''    if (material.hasWireMetadata)
    {
        if (material.unit != MaterialUnit::Gram ||
            (material.wireType != "CU" && material.wireType != "AL") ||
            material.diameterHundredthsMm == 0U)
        {
            return false;
        }
    }
    else if (material.wireType.length() != 0U || material.diameterHundredthsMm != 0U)
    {
        return false;
    }

'''
          if s.count(anchor1) != 1:
              raise SystemExit(f'nextId anchor count={s.count(anchor1)}')
          s = s.replace(anchor1, insert1 + anchor1, 1)

          anchor2 = '    line += F("\\\",\\\"status\\\":\\\"ACTIVE\\\"");\n'
          insert2 = '''    if (material.hasWireMetadata)
    {
        line += F(",\\\"wire_type\\\":\\\""); line += material.wireType; line += '\"';
        line += F(",\\\"diameter_hundredths_mm\\\":"); line += material.diameterHundredthsMm;
    }
'''
          if s.count(anchor2) != 1:
              raise SystemExit(f'ACTIVE serialization anchor count={s.count(anchor2)}')
          s = s.replace(anchor2, anchor2 + insert2, 1)

          anchor3 = '        if (status != "ACTIVE") continue;\n'
          insert3 = '''        const bool hasWireType = line.indexOf(F("\\\"wire_type\\\":")) >= 0;
        const bool hasDiameter = line.indexOf(F("\\\"diameter_hundredths_mm\\\":")) >= 0;
        if (hasWireType != hasDiameter)
        {
            file.close();
            return false;
        }
        if (hasWireType)
        {
            String wireType;
            uint32_t diameter = 0UL;
            if (unit != "GRAM" ||
                !findString(line, "wire_type", wireType) ||
                (wireType != "CU" && wireType != "AL") ||
                !findUnsigned(line, "diameter_hundredths_mm", diameter) ||
                diameter == 0UL || diameter > 65535UL)
            {
                file.close();
                return false;
            }
        }

'''
          if s.count(anchor3) != 1:
              raise SystemExit(f'ACTIVE list anchor count={s.count(anchor3)}')
          s = s.replace(anchor3, insert3 + anchor3, 1)

          p.write_text(s)
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/esp32/src/CM_MaterialLedger.cpp
          git diff --cached --quiet && exit 1
          git commit -m "feat(materials): persist structured wire metadata"
          git push origin HEAD:cmp-protocol-v1
