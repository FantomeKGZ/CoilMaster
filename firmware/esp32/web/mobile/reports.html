<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отчёт по ремонтам</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.metric{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf1f4}.metric:last-child{border:0}.big{font-size:22px}.muted{color:#687580}.ok{background:#e8f7ee;border:1px solid #82c99f;padding:10px;border-radius:10px}.warning{background:#fff4d6;border:1px solid #e0bc55;padding:10px;border-radius:10px}.bad{color:#b42318}.item{padding:12px 0;border-bottom:1px solid #e5ebf0}.item:last-child{border:0}.links a{display:inline-block;margin:7px 10px 0 0;color:#1769aa;font-weight:bold;text-decoration:none}</style></head><body><header><a href="/mobile/more.html">← Разделы</a><b style="float:right">📈 Отчёт</b></header><main><section class="card"><h2>Закрытые ремонты</h2><label>Месяц закрытия</label><input id="month" type="month"><button id="load">Обновить</button><p id="state" class="muted">Загрузка…</p></section><section class="card"><h2>Итоги за месяц</h2><div class="metric"><span>Закрыто ремонтов</span><b id="count">—</b></div><div class="metric"><span>Выручка</span><b id="revenue" class="big">—</b></div><div class="metric"><span>Себестоимость</span><b id="cost" class="big">—</b></div><div class="metric"><span>Маржа</span><b id="margin" class="big">—</b></div><div class="metric"><span>Убыток</span><b id="loss" class="big">—</b></div><div id="trust" class="warning">Итог ещё не подтверждён.</div></section><section class="card"><h2>Фильтр списка</h2><input id="search" placeholder="Клиент, телефон, двигатель, модель или № ремонта"><select id="outcome"><option value="ALL">Все результаты</option><option value="PROFIT">С прибылью</option><option value="LOSS">С убытком</option><option value="ZERO">Без прибыли/убытка</option><option value="ERROR">Неподтверждённые</option></select><p class="muted">Фильтр меняет только список ниже. Финансовые суммы выше всегда относятся ко всему выбранному месяцу.</p></section><section class="card"><h2>Ремонты</h2><div id="items" class="muted">Загрузка…</div></section></main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),money=v=>(Number(v)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' сом',dateLabel=v=>{if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('ru-RU')},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=new Date(),defaultMonth=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');$('month').value=localStorage.getItem('cm-report-month')||defaultMonth;$('search').value=localStorage.getItem('cm-report-search')||'';$('outcome').value=['ALL','PROFIT','LOSS','ZERO','ERROR'].includes(localStorage.getItem('cm-report-outcome'))?localStorage.getItem('cm-report-outcome'):'ALL';let reportRows=[];function safeMinor(v){const n=Number(v);return Number.isSafeInteger(n)&&n>=0?n:null}function addSafe(a,b){if(a===null||b===null||!Number.isSafeInteger(a+b))return null;return a+b}function matchesOutcome(row,filter){if(filter==='ALL')return true;if(filter==='ERROR')return !!row.error;if(row.error||!row.costing)return false;const margin=safeMinor(row.costing.margin_minor),loss=safeMinor(row.costing.loss_minor);if(margin===null||loss===null)return false;if(filter==='PROFIT')return margin>0&&loss===0;if(filter==='LOSS')return loss>0;if(filter==='ZERO')return margin===0&&loss===0;return true}function renderRows(){const query=$('search').value.trim().toLowerCase(),outcome=$('outcome').value;localStorage.setItem('cm-report-search',$('search').value);localStorage.setItem('cm-report-outcome',outcome);const visible=reportRows.filter(row=>{if(!matchesOutcome(row,outcome))return false;if(!query)return true;return row.searchText.includes(query)});$('items').innerHTML='';visible.forEach(row=>{const repair=row.repair,client=row.client,motor=row.motor,costing=row.costing,error=row.error,d=document.createElement('div');d.className='item';d.innerHTML='<b>Ремонт №'+esc(repair.repair_id)+' · '+esc(motor?.name||('Двигатель ID '+repair.motor_id))+'</b><div>'+esc(client?.name||('Клиент ID '+repair.client_id))+(client?.phone?' · '+esc(client.phone):'')+'</div><div class="muted">Закрыт: '+esc(dateLabel(repair.closed_at))+'</div>'+(costing&&!error?'<div>Цена: <b>'+money(costing.client_price_minor)+'</b> · себестоимость: <b>'+money(costing.total_cost_minor)+'</b></div><div>Маржа: <b>'+money(costing.margin_minor)+'</b> · убыток: <b>'+money(costing.loss_minor)+'</b></div>':'<div class="bad">Итог не подтверждён: '+esc(error||'unknown')+'</div>')+'<div class="links"><a href="/mobile/costing.html?repair_id='+encodeURIComponent(repair.repair_id)+'">Итог ремонта</a><a href="/mobile/winding-history.html?repair_id='+encodeURIComponent(repair.repair_id)+'">История намотки</a></div>';$('items').appendChild(d)});if(!visible.length)$('items').textContent=reportRows.length?'По выбранному фильтру ремонтов нет.':'В выбранном месяце закрытых ремонтов нет.'}async function load(){const month=$('month').value;if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)){$('state').className='bad';$('state').textContent='Выберите корректный месяц.';return}localStorage.setItem('cm-report-month',month);reportRows=[];$('state').className='muted';$('state').textContent='Загрузка реестров…';$('items').textContent='Загрузка…';$('count').textContent='—';$('revenue').textContent=$('cost').textContent=$('margin').textContent=$('loss').textContent='—';$('trust').className='warning';$('trust').textContent='Итог ещё не подтверждён.';try{const [rr,cr,mr]=await Promise.all([fetch('/api/repairs',{cache:'no-store'}),fetch('/api/clients',{cache:'no-store'}),fetch('/api/motors',{cache:'no-store'})]),[rj,cj,mj]=await Promise.all([rr.json(),cr.json(),mr.json()]);if(!rr.ok||!cr.ok||!mr.ok)throw new Error((!rr.ok&&rj.error)||(!cr.ok&&cj.error)||(!mr.ok&&mj.error)||'registry_unavailable');const clients=cj.items||[],motors=mj.items||[],repairs=(rj.items||[]).filter(x=>(x.current_status||x.status)==='CLOSED'&&String(x.closed_at||'').startsWith(month));$('count').textContent=repairs.length;let revenue=0,cost=0,margin=0,loss=0,trusted=true;for(let i=0;i<repairs.length;i++){const repair=repairs[i];$('state').textContent='Проверка калькуляций: '+(i+1)+' / '+repairs.length;let costing=null,error='';try{const r=await fetch('/api/repairs/costing?repair_id='+encodeURIComponent(repair.repair_id),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'costing_read_failed');costing=j}catch(e){trusted=false;error=e.message||'costing_read_failed'}const client=clients.find(x=>Number(x.client_id)===Number(repair.client_id)),motor=motors.find(x=>Number(x.motor_id)===Number(repair.motor_id));if(costing){const r=safeMinor(costing.client_price_minor),c=safeMinor(costing.total_cost_minor),m=safeMinor(costing.margin_minor),l=safeMinor(costing.loss_minor);if(r===null||c===null||m===null||l===null){trusted=false;error='unsafe_money_value'}else{revenue=addSafe(revenue,r);cost=addSafe(cost,c);margin=addSafe(margin,m);loss=addSafe(loss,l);if(revenue===null||cost===null||margin===null||loss===null){trusted=false;error='aggregate_overflow'}}}const searchText=[repair.repair_id,client?.name,client?.phone,motor?.name,motor?.model,motor?.manufacturer].filter(Boolean).join(' ').toLowerCase();reportRows.push({repair,client,motor,costing,error,searchText})}renderRows();if(trusted&&revenue!==null&&cost!==null&&margin!==null&&loss!==null){$('revenue').textContent=money(revenue);$('cost').textContent=money(cost);$('margin').textContent=money(margin);$('loss').textContent=money(loss);$('trust').className='ok';$('trust').textContent='Финансовый итог подтверждён: все закрытые ремонты месяца успешно прочитаны сервером.';$('state').className='muted';$('state').textContent='Отчёт загружен полностью.'}else{$('revenue').textContent=$('cost').textContent=$('margin').textContent=$('loss').textContent='не подтверждено';$('trust').className='warning';$('trust').textContent='Общий финансовый итог не показан: хотя бы один ремонт месяца не прошёл полную проверку калькуляции.';$('state').className='bad';$('state').textContent='Отчёт загружен не полностью.'}}catch(e){reportRows=[];$('state').className='bad';$('state').textContent='Отчёт недоступен: '+(e.message||'unknown');$('items').textContent='Нет подтверждённых данных.'}}$('load').onclick=load;$('month').onchange=load;$('search').oninput=renderRows;$('outcome').onchange=renderRows;load();</script></body></html>
