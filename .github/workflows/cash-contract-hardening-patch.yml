name: One-shot cash contract hardening patch

on:
  push:
    branches:
      - cmp-protocol-v1
    paths:
      - ".github/workflows/cash-contract-hardening-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
          fetch-depth: 0
      - name: Guard and patch cash store lookups
        shell: bash
        run: |
          set -euo pipefail
          FILE=firmware/esp32/src/CM_CashPaymentStore.cpp
          EXPECTED=edb3ccfd7b0030032357de98c27171dd08a09342
          test "$(git hash-object "$FILE")" = "$EXPECTED"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('firmware/esp32/src/CM_CashPaymentStore.cpp')
          s=p.read_text()
          anchor='''bool CashPaymentStore::totalsForRepair(uint32_t repairId, CashRepairTotals& totals) const
{'''
          assert anchor in s and 'eventBelongsToRepair' not in s
          addition=r'''bool CashPaymentStore::eventBelongsToRepair(uint32_t eventId,
                                                uint32_t repairId,
                                                uint32_t clientId,
                                                bool& found) const
{
    found = false;
    if (!ready() || eventId == 0UL || repairId == 0UL || clientId == 0UL)
        return false;
    if (!m_storage.exists(Path)) return true;
    File file = m_storage.open(Path, FILE_READ);
    if (!prepareNdjson(file)) { if (file) file.close(); return false; }
    uint32_t previous = 0UL;
    while (file.available())
    {
        const String line = file.readStringUntil('\n');
        if (line.length() == 0U) continue;
        uint32_t current = 0UL, currentRepair = 0UL, currentClient = 0UL;
        if (!FlatJsonObjectValidator::valid(line) ||
            !findUnsigned(line, "cash_event_id", current) || current == 0UL || current <= previous ||
            !findUnsigned(line, "repair_id", currentRepair) || currentRepair == 0UL ||
            !findUnsigned(line, "client_id", currentClient) || currentClient == 0UL)
        { file.close(); return false; }
        previous = current;
        if (current == eventId)
        {
            found = currentRepair == repairId && currentClient == clientId;
            file.close();
            return true;
        }
        if (current > eventId) break;
    }
    file.close();
    return true;
}

'''
          s=s.replace(anchor, addition+anchor, 1)
          anchor='''bool CashPaymentStore::appendRepairPageJson(String& json, uint32_t repairId,
'''
          assert anchor in s and 'totalsForClient' not in s
          addition=r'''bool CashPaymentStore::totalsForClient(uint32_t clientId, CashClientTotals& totals) const
{
    totals = CashClientTotals();
    if (!ready() || clientId == 0UL) return false;
    if (!m_storage.exists(Path)) return true;
    File file = m_storage.open(Path, FILE_READ);
    if (!prepareNdjson(file)) { if (file) file.close(); return false; }
    uint32_t previousId = 0UL;
    uint64_t added = 0ULL, subtracted = 0ULL;
    while (file.available())
    {
        const String line = file.readStringUntil('\n');
        if (line.length() == 0U) continue;
        uint32_t id = 0UL, lineClient = 0UL;
        uint64_t amount = 0ULL;
        String kind, direction, currency, occurredAt;
        if (!FlatJsonObjectValidator::valid(line) ||
            !findUnsigned(line, "cash_event_id", id) || id == 0UL || id <= previousId ||
            !findUnsigned(line, "client_id", lineClient) || lineClient == 0UL ||
            !findUnsigned64(line, "amount_minor", amount) || amount == 0ULL ||
            !findString(line, "kind", kind) || !findString(line, "direction", direction) ||
            !findString(line, "currency", currency) || currency.length() != 3U ||
            !findString(line, "occurred_at", occurredAt) || occurredAt.length() < 10U ||
            !validKindDirection(kind, direction))
        { file.close(); return false; }
        previousId = id;
        if (lineClient != clientId) continue;
        if (!totals.currencySet) { totals.currency = currency; totals.currencySet = true; }
        else if (totals.currency != currency) { file.close(); return false; }
        if (totals.eventCount == 0xFFFFFFFFUL) { file.close(); return false; }
        ++totals.eventCount;
        if (direction == "ADD") { if (!addChecked(added, amount)) { file.close(); return false; } }
        else { if (!addChecked(subtracted, amount)) { file.close(); return false; } }
    }
    file.close();
    if (subtracted > added) return false;
    totals.paidMinor = added - subtracted;
    return true;
}

'''
          s=s.replace(anchor, addition+anchor, 1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'feat(cash): enforce correction identity and client totals'
          git push origin HEAD:cmp-protocol-v1
