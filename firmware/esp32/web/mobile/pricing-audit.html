<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка калькуляции</title><style>body{font-family:Arial,sans-serif;margin:0;background:#eef2f6;color:#17212b}main{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}input,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #cbd5df;border-radius:10px;font-size:16px;margin-top:8px}button{background:#1769aa;color:#fff;border:0;font-weight:700}.check{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf1f4}.ok{color:#18864b}.bad{color:#b42318}.muted{color:#687580}.summary{font-size:20px;font-weight:700;padding:12px;border-radius:10px}.summary.ok{background:#e8f7ee}.summary.bad{background:#fff0ed}.value{word-break:break-word;text-align:right}</style></head><body><main><p><a href="/mobile/costing.html">← Калькуляция</a></p><h1>Проверка калькуляции</h1><section class="card"><label>Номер ремонта</label><input id="repairId" type="number" min="1" inputmode="numeric"><button id="run">Проверить</button><p id="message" class="muted"></p></section><section class="card"><div id="summary" class="summary muted">Проверка не выполнена.</div><div id="checks"></div></section><section class="card"><h2>Текущая цена</h2><div id="current" class="muted">—</div></section></main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),money=v=>(Number(v)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' сом',dateLabel=v=>{if(!v)return'не задана';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('ru-RU')};$('repairId').value=params.get('repair_id')||localStorage.getItem('cm-active-repair')||'';function row(name,pass,value){return`<div class="check"><span>${name}</span><span class="value ${pass?'ok':'bad'}">${pass?'OK':'ОШИБКА'}${value===undefined?'':' · '+value}</span></div>`}async function run(){const id=Number($('repairId').value);if(!Number.isInteger(id)||id<1){$('message').className='bad';$('message').textContent='Укажите корректный номер ремонта.';return}localStorage.setItem('cm-active-repair',String(id));$('message').className='muted';$('message').textContent='Чтение данных ESP32…';try{const [cr,hr]=await Promise.all([fetch('/api/repairs/costing?repair_id='+id,{cache:'no-store'}),fetch('/api/repairs/pricing-history?repair_id='+id,{cache:'no-store'})]);const c=await cr.json(),h=await hr.json();if(!cr.ok)throw new Error(c.error||'costing_unavailable');if(!hr.ok)throw new Error(h.error||'pricing_history_unavailable');const items=Array.isArray(h.items)?h.items:[];const tests=[['Составляющие себестоимости',c.cost_components_match_total===true],['Стоимость провода по материалам',c.wire_material_costs_match_wire_cost===true],['Количество списаний по материалам',c.wire_material_counts_match_wire_count===true],['Статус цены',c.pricing_status_source==='SERVER'&&c.pricing_delta_matches_price===true],['Источник истории',h.source==='APPEND_ONLY_LOG'],['Источник активной редакции',h.current_pricing_source==='LATEST_APPEND_ONLY_REVISION'],['Количество редакций',h.history_count_matches_current===true&&Number(h.count)===items.length],['Последние значения',h.history_latest_values_match_current===true],['Timestamp последней редакции',h.history_latest_timestamp_matches_current===true],['История подтверждает цену',h.history_matches_current_pricing===true]];const all=tests.every(x=>x[1]);$('summary').className='summary '+(all?'ok':'bad');$('summary').textContent=all?'Все серверные проверки пройдены.':'Обнаружено несоответствие калькуляции.';$('checks').innerHTML=tests.map(x=>row(x[0],x[1])).join('')+row('Текущая редакция',Number(c.pricing_revision_count)===Number(h.latest_revision),'№'+(c.pricing_revision_count||0));$('current').innerHTML=`<div class="check"><span>Работа</span><b>${money(c.labour_cost_minor)}</b></div><div class="check"><span>Цена клиенту</span><b>${money(c.client_price_minor)}</b></div><div class="check"><span>Себестоимость</span><b>${money(c.total_cost_minor)}</b></div><div class="check"><span>Статус</span><b>${c.pricing_status||'—'}</b></div><div class="check"><span>Обновлена</span><b>${dateLabel(c.pricing_updated_at)}</b></div>`;$('message').className=all?'ok':'bad';$('message').textContent=all?'Проверка завершена.':'Проверка завершена с ошибками.'}catch(e){$('summary').className='summary bad';$('summary').textContent='Данные проверить не удалось.';$('checks').innerHTML='';$('current').textContent='—';$('message').className='bad';$('message').textContent='Ошибка: '+e.message}}$('run').onclick=run;if($('repairId').value)run();</script></body></html>
