<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Двигатели</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:22px}.grid{display:grid;grid-template-columns:430px 1fr;gap:14px}.card{background:#fff;border-radius:14px;padding:20px}input,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.secondary{background:#5b6874}.item{padding:14px 0;border-bottom:1px solid #e4eaf0}.muted{color:#687580}.warn{background:#fff3d8;border:1px solid #efc86a;padding:12px;border-radius:10px;margin-top:10px}.badge{display:inline-block;background:#e7eef5;border-radius:999px;padding:4px 8px;margin:5px 5px 0 0;font-size:13px}.hidden{display:none}@media(max-width:900px){.layout{display:block}aside{display:none}.grid{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/clients.html">Клиенты</a><a href="/desktop/motors.html">Двигатели</a></aside><main><h1>Каталог двигателей</h1><div class="grid"><section class="card"><h2>Новый двигатель</h2><form id="form"><input name="name" placeholder="Название двигателя" required><input name="model" placeholder="Модель"><input name="manufacturer" placeholder="Производитель"><input name="coil_program" placeholder="Программа витков: 140/100/80/40" required><div class="muted">1–10 катушек, 1–9999 витков. Разделители: / , ;</div><input name="tags" placeholder="Теги: насос, 2.2 кВт, 24 паза"><textarea name="comment" placeholder="Комментарий"></textarea><button>Проверить и сохранить</button></form><div id="similar" class="warn hidden"></div><button id="confirm" class="secondary hidden" type="button">Всё равно создать отдельный двигатель</button><p id="result" class="muted"></p></section><section class="card"><h2>Двигатели</h2><input id="search" placeholder="Поиск по названию, модели, производителю, тегам или программе"><div id="items" class="muted">Загрузка…</div></section></div></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),form=$('form');let pending=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function canonicalProgram(raw){const normalized=String(raw??'').trim().replace(/ /g,'');if(!normalized)return null;const parts=normalized.split(/[\/,;]/);if(!parts.length||parts.length>10||parts.some(x=>x===''||!/^\d+$/.test(x)||(x.length>1&&x[0]==='0')))return null;const values=parts.map(Number);if(values.some(x=>!Number.isSafeInteger(x)||x<1||x>9999))return null;return values.join('/')}function errorText(error){if(error==='invalid_coil_program')return 'Некорректная программа витков. Проверьте количество катушек и значения 1–9999.';if(error==='repair_registry_unavailable')return 'Каталог на microSD сейчас недоступен.';return error||'Ошибка сохранения'}function motorTitle(x){return esc(x.name)+(x.model?' · '+esc(x.model):'')}async function fetchAllPaged(base,params=new URLSearchParams()){const items=[];let cursor=0;for(;;){const q=new URLSearchParams(params);q.set('limit','32');if(cursor)q.set('cursor',String(cursor));const r=await fetch(base+'?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(errorText(j.error));items.push(...(j.items||[]));if(!j.has_more)break;const next=Number(j.next_cursor);if(!Number.isInteger(next)||next<=cursor)throw new Error('invalid_paging_cursor');cursor=next}return items}function render(j){$('items').innerHTML='';(j.items||[]).forEach(x=>{const d=document.createElement('div');d.className='item';const tags=(x.tags||'').split(',').filter(Boolean).map(t=>'<span class="badge">'+esc(t.trim())+'</span>').join('');d.innerHTML='<b>'+motorTitle(x)+'</b><div class="muted">ID '+x.motor_id+(x.manufacturer?' · '+esc(x.manufacturer):'')+'</div><div>Программа: '+esc(x.coil_program)+'</div><div>'+tags+'</div><button type="button">Выбрать для ремонта</button>';d.querySelector('button').onclick=()=>{localStorage.setItem('cm-selected-motor',String(x.motor_id));location.href='/desktop/repairs.html?motor_id='+x.motor_id};$('items').appendChild(d)});if(!(j.items||[]).length)$('items').textContent='Двигатели не найдены.'}async function load(){try{const q=new URLSearchParams(),search=$('search').value.trim();if(search)q.set('q',search);render({items:await fetchAllPaged('/api/motors',q)})}catch(e){$('items').textContent=e.message||'Каталог двигателей недоступен.'}}async function create(fd){const r=await fetch('/api/motors',{method:'POST',body:fd}),j=await r.json();if(r.ok){$('result').textContent='Двигатель сохранён, ID '+j.motor_id;form.reset();pending=null;$('similar').classList.add('hidden');$('confirm').classList.add('hidden');load()}else $('result').textContent=errorText(j.error)}function similarityHtml(j){let h='<b>Найдены похожие карточки</b><div>Та же программа: '+(j.same_program_count||0)+'</div><div>Совпадения по названию/модели/производителю: '+(j.identity_match_count||0)+'</div>';(j.items||[]).forEach(x=>{h+='<div class="item"><b>'+motorTitle(x)+'</b><div>'+esc(x.coil_program||'')+'</div><div class="muted">'+esc(x.match_level||'SAME_PROGRAM_ONLY')+'</div></div>'});if(j.items_truncated)h+='<div class="muted">Показаны первые '+Number(j.returned_count||0)+' из '+Number(j.same_program_count||0)+' совпадений. Уточните название, модель или производителя.</div>';h+='<div class="muted">Это предупреждение. Создание новой карточки не блокируется.</div>';return h}form.onsubmit=async e=>{e.preventDefault();const programInput=form.elements.coil_program,canonical=canonicalProgram(programInput.value);if(!canonical){$('result').textContent='Программа витков должна содержать 1–10 значений от 1 до 9999 без пустых сегментов и ведущих нулей.';programInput.focus();return}programInput.value=canonical;$('result').textContent='Проверка похожих двигателей…';const fd=new FormData(form),q=new URLSearchParams();['coil_program','name','model','manufacturer'].forEach(k=>q.set(k,fd.get(k)||''));try{const r=await fetch('/api/motors/similar?'+q.toString(),{cache:'no-store'}),j=await r.json();if(!r.ok){$('result').textContent=errorText(j.error);return}if((j.same_program_count||0)>0){pending=fd;$('similar').innerHTML=similarityHtml(j);$('similar').classList.remove('hidden');$('confirm').classList.remove('hidden');$('result').textContent='Проверьте найденные совпадения.'}else await create(fd)}catch(err){$('result').textContent='Не удалось проверить похожие двигатели.'}};$('confirm').onclick=()=>pending&&create(pending);$('search').oninput=()=>{clearTimeout(window.cmSearch);window.cmSearch=setTimeout(load,250)};load();</script></body></html>
