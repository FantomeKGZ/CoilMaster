<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Новый двигатель — CoilMaster</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.secondary{background:#5b6874}.muted{color:#687580}.warn{background:#fff3d8;border:1px solid #efc86a;padding:11px;border-radius:10px;margin-top:10px}.hidden{display:none}.field-note{font-size:13px;color:#687580;margin-top:4px}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}</style></head><body><header><a href="/mobile/motors.html">← Двигатели</a><b style="float:right">⚙️ Новый двигатель</b></header><main><section class="card"><form id="form"><input name="manufacturer" placeholder="Производитель, например ABB"><input name="model" placeholder="Модель, например M3AA 160"><input name="name" placeholder="Доп. обозначение (необязательно)"><div class="field-note">Если обозначение пустое, оно формируется из производителя и модели.</div><input name="phase_count" type="number" min="1" max="255" step="1" placeholder="Число фаз"><input name="slot_count" type="number" min="1" max="1000" step="1" placeholder="Количество пазов"><input name="coil_program" placeholder="Программа витков: 38/38" required><input name="repeat_target" type="number" min="1" max="65535" step="1" value="1" required><div class="field-note">Каждый повтор программы запускается только локальной кнопкой A/START.</div><input name="tags" placeholder="Теги"><textarea name="comment" placeholder="Комментарий"></textarea><button>Проверить и сохранить</button></form><div id="similar" class="warn hidden"></div><button id="confirm" class="secondary hidden" type="button">Всё равно создать отдельный двигатель</button><p id="result" class="muted"></p></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),form=$('form');let pending=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function canonical(raw){const n=String(raw??'').trim().replace(/ /g,'');const p=n.split(/[\/,;]/);if(!n||!p.length||p.length>10||p.some(x=>!/^[1-9]\d{0,3}$/.test(x)||Number(x)>9999))return null;return p.map(Number).join('/')}function identity(x){return[x.manufacturer,x.model].filter(Boolean).join(' ').trim()||x.name||('Двигатель '+x.motor_id)}function prepare(){if(form.elements.name.value.trim())return true;const v=[form.elements.manufacturer.value.trim(),form.elements.model.value.trim()].filter(Boolean).join(' ');if(!v){$('result').textContent='Укажите производителя, модель или обозначение.';return false}form.elements.name.value=v;return true}async function create(fd){const r=await fetch('/api/motors',{method:'POST',body:fd}),j=await r.json();if(!r.ok){$('result').textContent=j.error||'motor_create_failed';return}localStorage.setItem('cm-selected-motor',String(j.motor_id));location.href='/mobile/motor-details.html?motor_id='+encodeURIComponent(j.motor_id)}function simHtml(j){let h='<b>Найдены похожие карточки</b>';(j.items||[]).forEach(x=>h+='<div style="padding:8px 0;border-top:1px solid #e4eaf0"><b>'+esc(identity(x))+'</b><div>'+esc(x.coil_program||'')+'</div></div>');return h}form.onsubmit=async e=>{e.preventDefault();if(!prepare())return;const c=canonical(form.elements.coil_program.value);if(!c){$('result').textContent='Некорректная программа витков.';return}form.elements.coil_program.value=c;const fd=new FormData(form),q=new URLSearchParams();['coil_program','name','model','manufacturer'].forEach(k=>q.set(k,fd.get(k)||''));$('result').textContent='Проверка похожих двигателей…';try{const r=await fetch('/api/motors/similar?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'similarity_failed');if((j.same_program_count||0)>0){pending=fd;$('similar').innerHTML=simHtml(j);$('similar').classList.remove('hidden');$('confirm').classList.remove('hidden');$('result').textContent='Проверьте совпадения.'}else await create(fd)}catch(err){$('result').textContent=err.message}};$('confirm').onclick=()=>pending&&create(pending);</script></body></html>
