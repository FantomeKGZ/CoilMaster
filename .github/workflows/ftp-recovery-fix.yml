name: Verify FTP recovery state and local access

on:
  push:
    branches: [cmp-protocol-v1]
    paths:
      - .github/workflows/ftp-recovery-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
          fetch-depth: 0

      - name: Patch FTP recovery and network access
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Recovery must be based on usable UI entry points, not on the mere
          # existence of /web (the recovery FTP itself may create /web).
          replace_once(
              'firmware/esp32/src/main.cpp',
              '    webRecoveryRequired = sdReady && !SD.exists("/web");',
              '    webRecoveryRequired = sdReady &&\n'
              '        (!SD.exists("/web/desktop/index.html") ||\n'
              '         !SD.exists("/web/mobile/index.html"));',
              'web recovery readiness')

          replace_once(
              'firmware/esp32/src/CM_WebRecoveryFtpServer.h',
              '    bool sameAccessPointSubnet(const IPAddress& address) const;\n    bool sendListEntry();',
              '    bool sameLocalSubnet(const IPAddress& address) const;\n'
              '    bool webRootUsable() const;\n'
              '    IPAddress passiveAddressFor(const IPAddress& remote) const;\n'
              '    bool sendListEntry();',
              'FTP header helpers')

          p = Path('firmware/esp32/src/CM_WebRecoveryFtpServer.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('!sameAccessPointSubnet(candidate.remoteIP())',
                        '!sameLocalSubnet(candidate.remoteIP())')
          if s.count('sameAccessPointSubnet') != 1:
              raise SystemExit('unexpected sameAccessPointSubnet references')

          old_update = '''void WebRecoveryFtpServer::update(uint32_t nowMs)\n{\n    if (!m_running) return;\n    if (!activitySafe())'''
          new_update = '''void WebRecoveryFtpServer::update(uint32_t nowMs)\n{\n    if (!m_running) return;\n\n    // Emergency FTP is only a bootstrap path. Once both production UI entry\n    // points exist, the site is usable and the emergency server must not stay\n    // advertised as an active recovery condition forever.\n    if (m_automaticRecovery && webRootUsable())\n    {\n        stop("automatic_recovery_complete");\n        return;\n    }\n\n    if (!activitySafe())'''
          if old_update not in s:
              raise SystemExit('FTP update anchor missing')
          s = s.replace(old_update, new_update, 1)

          old_reject = '''        candidate.print(F("421 Use CoilMaster access point\\r\\n"));\n        candidate.stop();\n        m_lastResult = "non_ap_client_rejected";'''
          new_reject = '''        candidate.print(F("421 Use CoilMaster AP or connected local network\\r\\n"));\n        candidate.stop();\n        m_lastResult = "non_local_client_rejected";'''
          if old_reject not in s:
              raise SystemExit('FTP reject anchor missing')
          s = s.replace(old_reject, new_reject, 1)

          old_subnet = '''bool WebRecoveryFtpServer::sameAccessPointSubnet(const IPAddress& address) const\n{\n    const IPAddress local = WiFi.softAPIP();\n    return address[0] == local[0] && address[1] == local[1] && address[2] == local[2];\n}\n'''
          new_subnet = '''bool WebRecoveryFtpServer::sameLocalSubnet(const IPAddress& address) const\n{\n    const IPAddress ap = WiFi.softAPIP();\n    if (address[0] == ap[0] && address[1] == ap[1] && address[2] == ap[2])\n        return true;\n\n    if (WiFi.status() != WL_CONNECTED) return false;\n    const IPAddress sta = WiFi.localIP();\n    const IPAddress mask = WiFi.subnetMask();\n    for (uint8_t i = 0U; i < 4U; ++i)\n    {\n        if ((address[i] & mask[i]) != (sta[i] & mask[i])) return false;\n    }\n    return true;\n}\n\nbool WebRecoveryFtpServer::webRootUsable() const\n{\n    return m_storage.exists("/web/desktop/index.html") &&\n           m_storage.exists("/web/mobile/index.html");\n}\n\nIPAddress WebRecoveryFtpServer::passiveAddressFor(const IPAddress& remote) const\n{\n    const IPAddress ap = WiFi.softAPIP();\n    if (remote[0] == ap[0] && remote[1] == ap[1] && remote[2] == ap[2])\n        return ap;\n    return WiFi.status() == WL_CONNECTED ? WiFi.localIP() : ap;\n}\n'''
          if old_subnet not in s:
              raise SystemExit('FTP subnet implementation anchor missing')
          s = s.replace(old_subnet, new_subnet, 1)

          old_pasv = '    const IPAddress address = WiFi.softAPIP();\n    String response = F("Entering Passive Mode (");'
          new_pasv = '    const IPAddress address = passiveAddressFor(m_controlClient.remoteIP());\n    String response = F("Entering Passive Mode (");'
          if old_pasv not in s:
              raise SystemExit('PASV address anchor missing')
          s = s.replace(old_pasv, new_pasv, 1)

          old_status = '''    response += F(",\\\"address\\\":\\\""); response += WiFi.softAPIP().toString();\n    response += F("\\\",\\\"port\\\":21,\\\"username\\\":\\\"CoilMaster\\\",\\\"root\\\":\\\"/web\\\",\\\"last_result\\\":\\\"");'''
          new_status = '''    response += F(",\\\"address\\\":\\\""); response += WiFi.softAPIP().toString();\n    response += F("\\\",\\\"ap_address\\\":\\\""); response += WiFi.softAPIP().toString();\n    response += F("\\\",\\\"sta_available\\\":");\n    response += WiFi.status() == WL_CONNECTED ? F("true") : F("false");\n    response += F(",\\\"sta_address\\\":\\\"");\n    if (WiFi.status() == WL_CONNECTED) response += WiFi.localIP().toString();\n    response += F("\\\",\\\"access_scope\\\":\\\"LOCAL_AP_OR_STA\\\"");\n    response += F(",\\\"web_root_usable\\\":"); response += webRootUsable() ? F("true") : F("false");\n    response += F(",\\\"port\\\":21,\\\"username\\\":\\\"CoilMaster\\\",\\\"root\\\":\\\"/web\\\",\\\"last_result\\\":\\\"");'''
          if old_status not in s:
              raise SystemExit('FTP status anchor missing')
          s = s.replace(old_status, new_status, 1)
          p.write_text(s, encoding='utf-8')

          # UI: show both valid addresses and stop claiming AP-only access.
          for path in ['firmware/esp32/web/desktop/settings-ftp.html',
                       'firmware/esp32/web/mobile/settings-ftp.html']:
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              t = t.replace('Подключение только через точку доступа CoilMaster. Сервер видит исключительно <code>/web</code>; незавершённые файлы не заменяют рабочие.',
                            'Подключение разрешено через точку доступа CoilMaster или через ту же локальную сеть, к которой ESP32 подключена как STA. Сервер видит исключительно <code>/web</code>.')
              t = t.replace('Подключение только через Wi‑Fi CoilMaster. Доступ ограничен папкой <code>/web</code>.',
                            'Подключение разрешено через Wi‑Fi CoilMaster или через ту же локальную сеть, где находится ESP32. Доступ ограничен папкой <code>/web</code>.')
              p.write_text(t, encoding='utf-8')

          p = Path('firmware/esp32/web/shared/settings-remote-backup.js')
          t = p.read_text(encoding='utf-8')
          old = "$('device').innerHTML='<div class=\"row\"><span>Сервер /web</span><b>'+(f.enabled?'включён':'выключен')+'</b></div><div class=\"row\"><span>Адрес</span><b>'+f.address+':'+f.port+'</b></div><div class=\"row\"><span>Клиент</span><b>'+(f.client_connected?'подключён':'нет')+'</b></div><div class=\"row\"><span>Режим</span><b>'+(f.automatic_recovery?'аварийный автозапуск':'ручной')+'</b></div><div class=\"row\"><span>Последний результат</span><b>'+f.last_result+'</b></div>';"
          new = "const addresses=[f.ap_address||f.address];if(f.sta_available&&f.sta_address)addresses.push(f.sta_address);$('device').innerHTML='<div class=\"row\"><span>Сервер /web</span><b>'+(f.enabled?'включён':'выключен')+'</b></div><div class=\"row\"><span>Адреса</span><b>'+addresses.map(a=>a+':'+f.port).join(' · ')+'</b></div><div class=\"row\"><span>/web готов</span><b>'+(f.web_root_usable?'да':'нет')+'</b></div><div class=\"row\"><span>Клиент</span><b>'+(f.client_connected?'подключён':'нет')+'</b></div><div class=\"row\"><span>Режим</span><b>'+(f.automatic_recovery?'аварийный автозапуск':'ручной')+'</b></div><div class=\"row\"><span>Последний результат</span><b>'+f.last_result+'</b></div>';"
          if old not in t:
              raise SystemExit('FTP web status anchor missing')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          doc = Path('docs/HARDWARE_REFERENCE/05_FTP_WEB_RECOVERY.md')
          doc.write_text('''# FTP /web recovery — ESP32\n\nДата: **2026-08-19**  \nSource of truth: `cmp-protocol-v1`\n\n## Назначение\n\nВстроенный FTP-сервер ESP32 предназначен только для обслуживания каталога `/web` на microSD. Он не предоставляет доступ к `/data` и производственным данным.\n\n## Когда включается аварийный режим\n\nАварийный FTP запускается автоматически только если после монтирования microSD отсутствует хотя бы одна рабочая точка входа:\n\n```text\n/web/desktop/index.html\n/web/mobile/index.html\n```\n\nПростого существования каталога `/web` недостаточно: FTP сам может создать этот каталог для восстановления.\n\nПосле появления обеих точек входа аварийный режим автоматически останавливается с `last_result=automatic_recovery_complete`. Оператор при необходимости может отдельно запустить FTP вручную.\n\n## Подключение\n\nПорт управления: `21`. Пассивный порт: `50009`.\n\nПодключаться можно:\n\n- через AP CoilMaster, обычно `192.168.4.1`;\n- через STA-IP ESP32 в той же локальной подсети, если ESP32 подключена к роутеру.\n\nКлиенты вне локальной AP/STA-подсети отвергаются. Для PASV сервер сообщает IP того интерфейса, через который пришло управляющее соединение.\n\n```text\nUser: CoilMaster\nPassword: CoilMaster123\nRoot: /web\n```\n\nFTP не шифрует трафик, поэтому использовать его следует только в доверенной локальной сети.\n''', encoding='utf-8')
          PY

      - name: Install PlatformIO
        run: python3 -m pip install --disable-pip-version-check platformio

      - name: Build ESP32
        run: pio run -e esp32

      - name: Web checks
        run: |
          node Tests/Web/check_web_assets.js
          node Tests/Web/check_release_contracts.js
          node Tests/Web/check_final_acceptance_contracts.js

      - name: Commit verified result
        run: |
          rm .github/workflows/ftp-recovery-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair FTP recovery state and local access"
          git pull --rebase origin cmp-protocol-v1
          git push origin HEAD:cmp-protocol-v1
