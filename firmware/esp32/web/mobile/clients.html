<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Клиенты</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}input,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.item{padding:12px 0;border-bottom:1px solid #e5ebf0}.item:last-child{border:0}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}</style></head><body><header><a href="/mobile/">← CoilMaster</a><b style="float:right">👤 Клиенты</b></header><main><section class="card"><h2>Новый клиент</h2><form id="form"><input name="name" placeholder="Имя клиента" required><input name="phone" inputmode="tel" placeholder="Телефон" required><textarea name="comment" placeholder="Комментарий"></textarea><button>Сохранить клиента</button></form><p id="result" class="muted"></p></section><section class="card"><h2>Поиск</h2><input id="search" inputmode="tel" placeholder="Телефон или его часть"><button id="find">Найти</button></section><section class="card"><h2>Клиенты</h2><div id="items" class="muted">Загрузка…</div></section></main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id);async function load(phone=''){try{const q=phone?'?phone='+encodeURIComponent(phone):'',r=await fetch('/api/clients'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');$('items').innerHTML='';if(!j.items.length){$('items').textContent='Клиенты не найдены.';return}j.items.forEach(c=>{const d=document.createElement('div');d.className='item';d.innerHTML='<b>'+c.name+'</b><div>'+c.phone+'</div><div class="muted">ID клиента: '+c.client_id+'</div><a href="/mobile/repairs.html?client_id='+c.client_id+'">Открыть ремонты</a>';$('items').appendChild(d)})}catch(e){$('items').textContent=e.message}}$('find').onclick=()=>load($('search').value);$('form').onsubmit=async e=>{e.preventDefault();$('result').textContent='Сохранение…';try{const r=await fetch('/api/clients',{method:'POST',body:new FormData(e.target)}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');$('result').className='ok';$('result').textContent='Клиент создан. ID: '+j.client_id;e.target.reset();load()}catch(err){$('result').className='bad';$('result').textContent=err.message}};load();</script></body></html>
