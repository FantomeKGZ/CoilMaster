name: Verify RTC manual set and Bishkek sync

on:
  push:
    branches: [cmp-protocol-v1]
    paths:
      - .github/workflows/rtc-manual-fix-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
          fetch-depth: 0

      - name: Patch RTC API and navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('firmware/esp32/src/main.cpp')
          s = p.read_text(encoding='utf-8')

          canonical = '''bool parseCanonicalUint32(const String& source, uint32_t& value)\n{\n    value = 0UL;\n    if (source.length() == 0U) return false;\n    if (source.length() > 1U && source[0] == '0') return false;\n\n    uint32_t parsed = 0UL;\n    for (size_t index = 0U; index < source.length(); ++index)\n    {\n        const char ch = source[index];\n        if (!isDigit(ch)) return false;\n        const uint8_t digit = static_cast<uint8_t>(ch - '0');\n        if (parsed > (0xFFFFFFFFUL - digit) / 10UL) return false;\n        parsed = parsed * 10UL + digit;\n    }\n\n    value = parsed;\n    return true;\n}\n'''
          rtc_parser = canonical + '''\nbool parseRtcDecimal(const String& source, uint32_t& value)\n{\n    // RTC fields from browser forms are commonly zero-padded (08/05/00).\n    // Keep parseCanonicalUint32 strict for IDs; only date/time fields differ.\n    value = 0UL;\n    if (source.length() == 0U) return false;\n    uint32_t parsed = 0UL;\n    for (size_t index = 0U; index < source.length(); ++index)\n    {\n        const char ch = source[index];\n        if (!isDigit(ch)) return false;\n        const uint8_t digit = static_cast<uint8_t>(ch - '0');\n        if (parsed > (0xFFFFFFFFUL - digit) / 10UL) return false;\n        parsed = parsed * 10UL + digit;\n    }\n    value = parsed;\n    return true;\n}\n'''
          if 'bool parseRtcDecimal(' not in s:
              assert s.count(canonical) == 1, 'canonical parser anchor mismatch'
              s = s.replace(canonical, rtc_parser, 1)

          old = '!parseCanonicalUint32(webServer.arg(fields[i]), parsed[i]))'
          if old in s:
              s = s.replace(old, '!parseRtcDecimal(webServer.arg(fields[i]), parsed[i]))', 1)
          assert '!parseRtcDecimal(webServer.arg(fields[i]), parsed[i]))' in s

          if 'response.reserve(180U);' in s:
              s = s.replace('response.reserve(180U);', 'response.reserve(360U);', 1)

          old_tail = '        else response += F("null");\n        response += F(",\\\"timezone_configured\\\":false,\\\"scheduling_ready\\\":false}");'
          new_tail = '''        else response += F("null");\n        response += F(",\\\"timezone_configured\\\":true,\\\"timezone\\\":\\\"");\n        response += rtcClock.timezoneName();\n        response += F("\\\",\\\"utc_offset_minutes\\\":360,\\\"ntp_configured\\\":");\n        response += rtcClock.networkSyncConfigured() ? F("true") : F("false");\n        response += F(",\\\"ntp_synced\\\":");\n        response += rtcClock.networkTimeSynced() ? F("true") : F("false");\n        response += F(",\\\"ntp_status\\\":\\\"");\n        response += rtcClock.lastNetworkSyncResult();\n        response += F("\\\",\\\"last_ntp_sync_ms\\\":");\n        response += rtcClock.lastNetworkSyncMs();\n        response += F(",\\\"rtc_last_set_result\\\":\\\"");\n        response += rtcClock.lastSetResult();\n        response += F("\\\",\\\"scheduling_ready\\\":");\n        response += valid ? F("true") : F("false");\n        response += F("}");'''
          if old_tail in s:
              s = s.replace(old_tail, new_tail, 1)
          assert '\\"timezone_configured\\\":true' in s

          old_error = '''        if (!rtcClock.set(value))\n        {\n            webServer.send(500, "application/json",\n                           "{\\\"error\\\":\\\"rtc_write_or_verify_failed\\\"}");\n            return;\n        }'''
          new_error = '''        if (!rtcClock.set(value))\n        {\n            String error = F("{\\\"error\\\":\\\"rtc_write_or_verify_failed\\\",\\\"detail\\\":\\\"");\n            error += rtcClock.lastSetResult();\n            error += F("\\\"}");\n            webServer.send(500, "application/json; charset=utf-8", error);\n            return;\n        }'''
          if old_error in s:
              s = s.replace(old_error, new_error, 1)

          p.write_text(s, encoding='utf-8')

          for path, anchor, addition in [
              ('firmware/esp32/web/desktop/settings.html', '<a class="settings-link" href="/desktop/settings-ftp.html">', '<a class="settings-link" href="/desktop/settings-time.html"><b>🕒 Время и RTC</b><span>DS3231, ручная установка и автоматическая NTP-синхронизация Asia/Bishkek.</span></a>'),
              ('firmware/esp32/web/mobile/settings.html', '<a class="settings-link" href="/mobile/settings-ftp.html">', '<a class="settings-link" href="/mobile/settings-time.html"><b>🕒 Время и RTC</b><span>DS3231, ручная установка и автоматическая NTP-синхронизация Бишкек.</span></a>')]:
              fp = Path(path)
              t = fp.read_text(encoding='utf-8')
              if 'settings-time.html' not in t:
                  assert anchor in t
                  fp.write_text(t.replace(anchor, addition + anchor, 1), encoding='utf-8')
          PY

      - name: Install PlatformIO
        run: python3 -m pip install --disable-pip-version-check platformio

      - name: Build ESP32
        run: pio run -e esp32

      - name: Web checks
        run: |
          node Tests/Web/check_web_assets.js
          node Tests/Web/check_release_contracts.js
          node Tests/Web/check_final_acceptance_contracts.js

      - name: Commit verified result
        run: |
          git pull --rebase origin cmp-protocol-v1
          rm .github/workflows/rtc-manual-fix-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair RTC manual setting and expose Bishkek sync"
          git push origin HEAD:cmp-protocol-v1
