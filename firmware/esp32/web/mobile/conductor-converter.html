<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пересчёт провода</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#17212b;font-family:Arial,sans-serif}header{background:#174f7a;color:#fff;padding:16px}main{max-width:680px;margin:auto;padding:14px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #17212b14}label{display:block;font-weight:700;margin:12px 0 6px}input,select,button{width:100%;min-height:46px;border-radius:10px;border:1px solid #b9c5cf;padding:10px;font-size:17px}button{margin-top:16px;background:#1769aa;color:#fff;border:0;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{border:1px solid #d7e0e7;border-radius:12px;padding:13px;margin-top:10px}.ok{color:#16803b}.buy{color:#a55a00}.hidden{display:none}.error{background:#ffe8e6;color:#9b1c14;border-radius:10px;padding:12px}.muted{color:#64717c;font-size:14px}</style></head><body><header><b>Пересчёт алюминия и меди</b></header><main><section class="card"><div class="row"><div><label>Исходный материал</label><select id="sm"><option value="AL">Алюминий</option><option value="CU">Медь</option></select></div><div><label>Целевой материал</label><select id="tm"><option value="CU">Медь</option><option value="AL">Алюминий</option></select></div></div><div class="row"><div><label>Диаметр жилы, мм</label><input id="d" inputmode="decimal" placeholder="0,80"></div><div><label>Количество жил</label><input id="n" type="number" min="1" max="12" value="1"></div></div><label>Допустимое отклонение, %</label><input id="dev" inputmode="decimal" value="5,0"><label>Максимум целевых жил</label><input id="max" type="number" min="1" max="8" value="4"><button id="go">Рассчитать</button></section><section id="err" class="error hidden"></section><section id="res" class="card hidden"><h2>Рекомендации</h2><div id="sum" class="muted"></div><div id="list"></div></section><p><a href="/mobile/">← На главную</a></p></main><script>const $=x=>document.getElementById(x);const h=v=>Math.round(Number(String(v).replace(',','.'))*100);const fd=v=>(v/100).toFixed(2).replace('.',',')+' мм';const fg=v=>(v/1000).toFixed(3).replace('.',',')+' кг';$('sm').onchange=()=>$('tm').value=$('sm').value==='AL'?'CU':'AL';$('tm').onchange=()=>$('sm').value=$('tm').value==='AL'?'CU':'AL';$('go').onclick=async()=>{try{$('err').classList.add('hidden');const q=new URLSearchParams({source_material:$('sm').value,target_material:$('tm').value,source_diameter_hundredths_mm:h($('d').value),source_parallel_strands:$('n').value,allowed_deviation_permille:Math.round(Number($('dev').value.replace(',','.'))*10),max_target_strands:$('max').value});const r=await fetch('/api/calculator/conductor?'+q),j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка расчёта');$('sum').textContent='Проверено диаметров: '+j.catalogue_diameter_count;$('list').innerHTML=(j.recommendations||[]).map(o=>'<div class="option"><b>'+o.rank+'. '+o.parallel_strands+' × '+fd(o.diameter_hundredths_mm)+'</b><div>Отклонение: '+(o.deviation_permille/10).toFixed(1).replace('.',',')+' %</div><div class="'+(o.availability==='IN_STOCK'?'ok':'buy')+'">'+(o.availability==='IN_STOCK'?'На складе: '+fg(o.available_g):'Требуется закупить')+'</div></div>').join('')||'<p>Подходящих вариантов нет.</p>';$('res').classList.remove('hidden')}catch(e){$('err').textContent=e.message;$('err').classList.remove('hidden')}};</script></body></html>
