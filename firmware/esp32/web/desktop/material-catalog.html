1>Каталог дополнительных материалов</h1><div class="toolbar"><a href="/desktop/material-new.html">+ Новый материал</a><a class="secondary" href="/desktop/warehouse.html">Склад провода</a></div><section class="card"><h2>Текущие запасы</h2><div id="items" class="muted">Загрузка…</div><div class="pager"><button id="prevPage" type="button" disabled>← Назад</button><span id="pageInfo" class="muted">Страница 1</span><button id="nextPage" type="button" disabled>Далее →</button></div></section><section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2 id="historyTitle">Последние изменения</h2><button id="allHistory" type="button">Общая история</button></div><div style="overflow:auto"><table><thead><tr><th>Дата</th><th>Материал</th><th class="num">Пополнение</th><th class="num">Остаток</th><th class="num">Цена</th><th>Комментарий</th></tr></thead><tbody id="history"><tr><td colspan="6" class="muted">Загрузка…</td></tr></tbody></table></div><div class="pager"><button id="historyPrev" type="button" disabled>← Назад</button><span id="historyPageInfo" class="muted">История · страница 1</span><button id="historyNext" type="button" disabled>Далее →</button></div></section></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),units={PIECE:'шт',GRAM:'г',MILLILITRE:'мл',METRE:'м',SQUARE_METRE:'м²'},qty=v=>(v/1000).toLocaleString('ru-RU',{maximumFractionDigits:3}),money=v=>(v/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}),date=v=>new Date(v).toLocaleString('ru-RU'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let names={},hMat=0,hCursor=0,hNext=0,hMore=false,hStack=[],hPage=1;function hpager(n){$('historyPrev').disabled=!hStack.length;$('historyNext').disabled=!hMore;$('historyPageInfo').textContent='История · страница '+hPage+' · '+n+' записей'}async function loadHistory(materialId=hM
