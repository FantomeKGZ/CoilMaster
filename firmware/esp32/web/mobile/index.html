<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CoilMaster Mobile</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--text:#17212b;--muted:#687580;--blue:#1769aa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text);padding-bottom:78px}header{position:sticky;top:0;background:#142536;color:#fff;padding:14px 16px}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric strong{display:block;font-size:25px}.muted{color:var(--muted)}input,select,button{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid #cbd5df;font-size:17px}button{background:var(--blue);color:#fff;border:0;font-weight:bold}button:disabled{background:#9aa7b1}.note{background:#f3f7fa;padding:12px;border-radius:10px;margin-top:10px}.context{padding:10px 12px;border-radius:10px;background:#e8f1f8;margin-top:10px}.context.unlinked{background:#fff1d8}.warning{background:#fff1d8}.ok{background:#e8f7ee}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}
</style>
</head>
<body>
<header><b>CoilMaster</b><span id="health" style="float:right">Проверка</span></header>
<main>
<div class="grid"><section class="card metric"><span class="muted">Станок</span><strong id="machine">—</strong></section><section class="card metric"><span class="muted">Повторов</span><strong id="runs">0</strong></section></div>
<section class="card"><h2>Намотка</h2><p id="program">Нет задания</p><div id="jobContext" class="context">Контекст задания: —</div><div id="hint" class="note">Ожидание данных ESP32.</div></section>
<section class="card"><h2>Быстрая отправка</h2><form id="jobForm"><select name="type"><option value="working">Рабочая</option><option value="starting">Пусковая</option></select><input name="turns" placeholder="140/100/80/40" required><button id="serviceSend" disabled>Отправить на Arduino</button></form><div id="serviceState" class="note">Проверка готовности сервисного режима.</div><div id="result" class="note">Сервисный режим без привязки к ремонту. Запуск выполняется физической кнопкой START.</div></section>
</main>
<nav><a href="/mobile/"><b>⚙️</b>Намотка</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav>
<script>
localStorage.setItem('cm-ui-version','mobile');
const $=id=>document.getElementById(id);
let serviceReady=false,sending=false;
function updateServiceButton(){ $('serviceSend').disabled=sending||!serviceReady }
function renderServiceState(s){
  serviceReady=s.job_creation_ready===true;
  const box=$('serviceState');
  if(serviceReady){
    box.className='note ok';
    box.textContent='ESP32 готова к сервисному заданию без привязки к ремонту.';
  }else{
    box.className='note warning';
    box.textContent=s.manual_review_required===true?'Требуется ручная проверка восстановления. Сервисная отправка заблокирована.':s.new_job_allowed!==true?'Новое задание сейчас не разрешено. Завершите текущее состояние станка.':'Журнал или persistent-хранилища ESP32 недоступны. Сервисная отправка заблокирована.';
  }
  updateServiceButton();
}
async function refresh(){
  try{
    const r=await fetch('/api/status',{cache:'no-store'}),s=await r.json();
    if(!r.ok)throw new Error('status unavailable');
    $('machine').textContent=s.machine_status;
    $('runs').textContent=s.completed_runs;
    $('program').textContent=s.program||'Нет задания';
    const context=$('jobContext');
    if(s.job_id&&s.linked){
      context.className='context';
      context.textContent='Ремонт №'+s.repair_id+' · Двигатель №'+s.motor_id;
    }else if(s.job_id){
      context.className='context unlinked';
      context.textContent='Сервисное задание · без привязки к ремонту';
    }else{
      context.className='context';
      context.textContent='Контекст задания: —';
    }
    $('hint').textContent=s.run_active?'Намотка выполняется.':s.job_status==='ACCEPTED_READY'?'Arduino готова. Нажмите A или START.':'Станок ожидает программу.';
    $('health').textContent=s.storage_ready?'Система: норма':'Внимание';
    renderServiceState(s);
  }catch(e){
    serviceReady=false;
    updateServiceButton();
    $('machine').textContent='Нет связи';
    $('jobContext').textContent='Контекст недоступен';
    $('serviceState').className='note warning';
    $('serviceState').textContent='Не удалось подтвердить готовность ESP32. Сервисная отправка заблокирована.';
  }
}
$('jobForm').onsubmit=async e=>{
  e.preventDefault();
  await refresh();
  if(!serviceReady){
    $('result').className='note warning';
    $('result').textContent='ESP32 сейчас не разрешает создание сервисного задания.';
    return;
  }
  sending=true;
  updateServiceButton();
  $('result').className='note';
  $('result').textContent='Отправка…';
  try{
    const r=await fetch('/api/jobs',{method:'POST',body:new FormData(e.target)}),j=await r.json();
    $('result').className=r.ok?'note ok':'note warning';
    $('result').textContent=r.ok?'Сервисное задание №'+j.job_id+' передано без привязки к ремонту.':'Ошибка: '+(j.error||'unknown');
  }catch(e){
    $('result').className='note warning';
    $('result').textContent='Нет связи с ESP32';
  }finally{
    sending=false;
    await refresh();
  }
};
refresh();
setInterval(refresh,1200);
</script>
</body>
</html>
