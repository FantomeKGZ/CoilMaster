name: ESP32 Build

on:
  workflow_dispatch:
  push:
    branches:
      - cmp-protocol-v1
    paths:
      - "firmware/esp32/**"
      - "Shared/**"
      - "scripts/platformio_build_id.py"
      - "platformio.ini"
      - ".github/workflows/esp32-build.yml"
  pull_request:
    paths:
      - "firmware/esp32/**"
      - "Shared/**"
      - "scripts/platformio_build_id.py"
      - "platformio.ini"
      - ".github/workflows/esp32-build.yml"

jobs:
  build-esp32:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ESP32 firmware
        shell: bash
        run: |
          set -o pipefail
          pio run -e esp32 2>&1 | tee esp32-build.log

      - name: Upload ESP32 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-build-log
          path: esp32-build.log
          if-no-files-found: warn
          retention-days: 7
