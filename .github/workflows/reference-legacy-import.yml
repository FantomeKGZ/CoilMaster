name: Reference Legacy Import Check

on:
  workflow_dispatch:
  push:
    branches:
      - cmp-protocol-v1
    paths:
      - tools/import_legacy_winding_reference.py
      - tools/check_legacy_winding_reference.py
      - tools/audit_legacy_winding_reference.py
      - Tests/Web/check_reference_migration_audit.py
      - Tests/Web/check_reference_import_asset_dedup.py
      - Tests/Web/check_web_bundle_manifest.py
      - tools/build_web_bundle_manifest.py
      - firmware/esp32/web/**
      - .github/workflows/reference-legacy-import.yml

permissions:
  contents: read

jobs:
  build-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CoilMaster
        uses: actions/checkout@v4
        with:
          path: coilmaster

      - name: Check migration audit contracts
        run: python3 coilmaster/Tests/Web/check_reference_migration_audit.py

      - name: Check import asset dedup contracts
        run: python3 coilmaster/Tests/Web/check_reference_import_asset_dedup.py

      - name: Check SD bundle manifest contracts
        run: python3 coilmaster/Tests/Web/check_web_bundle_manifest.py

      - name: Checkout legacy reference source
        uses: actions/checkout@v4
        with:
          repository: FantomeKGZ/motor-winding-reference
          ref: main
          path: legacy

      - name: Build SD-ready web bundle
        shell: bash
        run: |
          set -euo pipefail
          desktop_src="$GITHUB_WORKSPACE/legacy/sourse/desktop/Справочник от 09.12.2024 HTML"
          mobile_src="$GITHUB_WORKSPACE/legacy/sourse/mobile/Справочник от 09.12.2024 для мобильных устройств HTML"
          web_bundle="$RUNNER_TEMP/coilmaster-web"
          output="$web_bundle/sites/reference"

          mkdir -p "$web_bundle"
          cp -a "$GITHUB_WORKSPACE/coilmaster/firmware/esp32/web/." "$web_bundle/"

          python3 "$GITHUB_WORKSPACE/coilmaster/tools/import_legacy_winding_reference.py" \
            --desktop-source "$desktop_src" \
            --mobile-source "$mobile_src" \
            --output "$output"

          python3 "$GITHUB_WORKSPACE/coilmaster/tools/check_legacy_winding_reference.py" \
            --desktop-source "$desktop_src" \
            --mobile-source "$mobile_src" \
            --output "$output"

          python3 "$GITHUB_WORKSPACE/coilmaster/tools/audit_legacy_winding_reference.py" \
            --output "$output" \
            --report "$RUNNER_TEMP/reference-migration-audit.json"

          legacy_sha="$(git -C "$GITHUB_WORKSPACE/legacy" rev-parse HEAD)"
          python3 "$GITHUB_WORKSPACE/coilmaster/tools/build_web_bundle_manifest.py" \
            --web-bundle "$web_bundle" \
            --coilmaster-commit "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --legacy-commit "$legacy_sha"

          python3 "$GITHUB_WORKSPACE/coilmaster/tools/build_web_bundle_manifest.py" \
            --web-bundle "$web_bundle" \
            --verify

      - name: Report generated footprint
        shell: bash
        run: |
          set -euo pipefail
          web_bundle="$RUNNER_TEMP/coilmaster-web"
          output="$web_bundle/sites/reference"

          echo "Reference footprint:"
          du -sh "$output"
          echo "Full /web bundle footprint:"
          du -sh "$web_bundle"
          echo "Reference files: $(find "$output" -type f | wc -l)"
          echo "Reference HTML: $(find "$output" -type f \( -iname '*.html' -o -iname '*.htm' \) | wc -l)"
          echo "Shared assets: $(find "$output/shared/assets" -type f 2>/dev/null | wc -l)"
          echo "Desktop unique assets: $(find "$output/desktop/assets" -type f 2>/dev/null | wc -l)"
          echo "Mobile unique assets: $(find "$output/mobile/assets" -type f 2>/dev/null | wc -l)"
          echo "Full /web files: $(find "$web_bundle" -type f | wc -l)"
          echo "Web bundle manifest:"
          cat "$web_bundle/web-bundle-manifest.json"
          echo "Migration audit (report only):"
          cat "$RUNNER_TEMP/reference-migration-audit.json"

          {
            echo "## Legacy reference SD bundle"
            echo
            echo "- Reference size: $(du -sh "$output" | cut -f1)"
            echo "- Full /web bundle size: $(du -sh "$web_bundle" | cut -f1)"
            echo "- Reference files: $(find "$output" -type f | wc -l)"
            echo "- Reference HTML pages: $(find "$output" -type f \( -iname '*.html' -o -iname '*.htm' \) | wc -l)"
            echo "- Shared assets: $(find "$output/shared/assets" -type f 2>/dev/null | wc -l)"
            echo "- Desktop unique assets: $(find "$output/desktop/assets" -type f 2>/dev/null | wc -l)"
            echo "- Mobile unique assets: $(find "$output/mobile/assets" -type f 2>/dev/null | wc -l)"
            echo "- Full /web files: $(find "$web_bundle" -type f | wc -l)"
            echo
            echo "Artifact content is ready to copy as the microSD /web directory."
            echo "Migration cleanup candidates are published separately as a report-only audit; no files were removed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add exact bundle manifest summary
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/coilmaster-web/web-bundle-manifest.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          reference = manifest["reference"]
          payload = manifest["web_payload"]
          print()
          print("### Exact SD bundle manifest v2")
          print()
          print(f"- Reference: {reference['files']} files, {reference['bytes']} bytes")
          print(f"- Reference HTML: {reference['html_files']}")
          print(f"- Catalog entries: {reference['catalog_entries']}")
          print(f"- Shared assets: {reference['shared_assets']}")
          print(f"- Desktop assets: {reference['desktop_assets']}")
          print(f"- Mobile assets: {reference['mobile_assets']}")
          print(f"- /web payload: {payload['files']} files, {payload['bytes']} bytes")
          print(f"- /web payload SHA-256: `{payload['sha256']}`")
          print("- Manifest file is excluded from payload counts/hash to avoid self-reference")
          PY

      - name: Add migration audit summary
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/reference-migration-audit.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          unused = report["unreferenced_assets"]
          duplicates = report["duplicate_asset_groups"]
          identical = report["content_identical_page_groups"]
          print()
          print("### Report-only migration audit")
          print()
          print(f"- Unreferenced assets: {unused['count']} ({unused['bytes']} bytes)")
          for suffix, item in unused.get("by_extension", {}).items():
              print(f"  - {suffix}: {item['count']} files, {item['bytes']} bytes")
          print(f"- Duplicate asset groups: {duplicates['count']} ({duplicates['potential_savings_bytes']} potential bytes)")
          print(f"- Content-identical page groups within one mode: {identical['count']}")
          for mode, item in report["pages_without_legacy_incoming_links"].items():
              print(f"- {mode} pages without legacy incoming links: {item['count']}")
          print("- Policy: report only; no generated content was removed")
          PY

      - name: Upload migration audit
        uses: actions/upload-artifact@v4
        with:
          name: coilmaster-reference-migration-audit-${{ github.sha }}
          path: ${{ runner.temp }}/reference-migration-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload SD-ready web bundle
        uses: actions/upload-artifact@v4
        with:
          name: coilmaster-web-sd-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/coilmaster-web
          if-no-files-found: error
          retention-days: 14
