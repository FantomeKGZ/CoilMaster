<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Новый ремонт — CoilMaster</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{position:sticky;top:0;background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.toolbar a{padding:12px;border-radius:10px;background:#e8f1f8;color:#105b91;text-decoration:none;text-align:center;font-weight:bold}.card{background:#fff;border-radius:15px;padding:16px}label{display:block;font-weight:bold;margin-top:12px}select,input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.pick a{padding:10px;border-radius:9px;background:#e8f1f8;color:#105b91;text-decoration:none;text-align:center;font-weight:bold}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}@media(max-width:390px){.toolbar,.pick{grid-template-columns:1fr}}</style></head><body><header><a href="/mobile/repairs.html">← Ремонты</a><b style="float:right">🧰 Новый ремонт</b></header><main><div class="toolbar"><a href="/mobile/client-new.html">+ Новый клиент</a><a href="/mobile/motor-new.html">+ Новый двигатель</a></div><section class="card"><form id="form"><label>Клиент</label><select id="clientId" name="client_id" required><option value="">Выберите клиента</option></select><div class="pick"><a href="/mobile/clients.html">Каталог клиентов</a><a href="/mobile/client-new.html">Создать</a></div><label>Двигатель</label><select id="motorId" name="motor_id" required><option value="">Выберите двигатель</option></select><div class="pick"><a href="/mobile/motors.html">Каталог двигателей</a><a href="/mobile/motor-new.html">Создать</a></div><label>Дата приёмки</label><input id="received" name="received_at" type="datetime-local" required><textarea name="complaint" placeholder="Жалоба клиента"></textarea><textarea name="comment" placeholder="Комментарий"></textarea><button id="saveBtn">Создать ремонт</button></form><p id="result" class="muted"></p></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),p=new URLSearchParams(location.search);let sending=false;const clientId=p.get('client_id')||localStorage.getItem('cm-selected-client')||'',motorId=p.get('motor_id')||localStorage.getItem('cm-selected-motor')||'';$('received').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);async function exact(path,key,id){if(!id)return null;const r=await fetch(path+'?'+new URLSearchParams({[key]:id}),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'catalog_unavailable');return j.item||null}async function loadPick(select,path,key,id,label){select.innerHTML='<option value="">Выберите</option>';if(!id)return;try{const x=await exact(path,key,id);if(!x)return;const o=document.createElement('option');o.value=id;o.textContent=label(x);select.appendChild(o);select.value=id}catch(_){select.innerHTML='<option value="">Выбранная запись недоступна</option>'}}loadPick($('clientId'),'/api/clients/by-id','client_id',clientId,x=>(x.name||'Клиент')+' · '+(x.phone||'без телефона'));loadPick($('motorId'),'/api/motors/by-id','motor_id',motorId,x=>[x.manufacturer,x.model].filter(Boolean).join(' ')||x.name||('Двигатель '+x.motor_id));$('form').onsubmit=async e=>{e.preventDefault();if(sending)return;sending=true;$('saveBtn').disabled=true;$('result').className='muted';$('result').textContent='Создание…';try{const r=await fetch('/api/repairs',{method:'POST',body:new FormData(e.target)}),j=await r.json();if(!r.ok)throw new Error(j.error||'repair_create_failed');if(!j.repair_id)throw new Error('repair_id_missing');localStorage.setItem('cm-active-repair',String(j.repair_id));$('result').className='ok';$('result').textContent='Ремонт №'+j.repair_id+' создан.';location.href='/mobile/repairs.html'}catch(err){$('result').className='bad';$('result').textContent=err.message||'Ошибка'}finally{sending=false;$('saveBtn').disabled=false}};</script></body></html>
