<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ремонты</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:22px}.grid{display:grid;grid-template-columns:420px 1fr;gap:14px}.card{background:#fff;border-radius:14px;padding:20px}input,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.item{padding:14px 0;border-bottom:1px solid #e4eaf0}.muted{color:#687580}.links a{display:inline-block;margin:7px 12px 0 0}@media(max-width:900px){.layout{display:block}aside{display:none}.grid{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/clients.html">Клиенты</a><a href="/desktop/costing.html">Калькуляция</a></aside><main><h1>Ремонты</h1><div class="grid"><section class="card"><h2>Новый ремонт</h2><form id="form"><input id="clientId" name="client_id" type="number" min="1" placeholder="ID клиента" required><input name="motor_name" placeholder="Название двигателя" required><input id="received" name="received_at" type="datetime-local" required><textarea name="complaint" placeholder="Жалоба клиента"></textarea><textarea name="comment" placeholder="Комментарий"></textarea><button>Создать ремонт</button></form><p id="result" class="muted"></p></section><section class="card"><h2>Список ремонтов</h2><div id="items" class="muted">Загрузка…</div></section></div></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),fixedClient=params.get('client_id')||'';$('clientId').value=fixedClient;const nowLocal=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);$('received').value=nowLocal();function selectRepair(id){localStorage.setItem('cm-active-repair',String(id))}async function load(){const r=await fetch('/api/repairs'+(fixedClient?'?client_id='+fixedClient:''),j=await r.json();$('items').innerHTML='';j.items.forEach(x=>{const d=document.createElement('div');d.className='item';d.innerHTML='<b>№'+x.repair_id+' — '+x.motor_name+'</b><div>Клиент ID: '+x.client_id+'</div><div class="muted">'+x.status+' · '+x.received_at+'</div><div class="links"><a data-id="'+x.repair_id+'" href="/desktop/costing.html?repair_id='+x.repair_id+'">Калькуляция</a><a data-id="'+x.repair_id+'" href="/desktop/writeoff.html?repair_id='+x.repair_id+'">Списание провода</a></div>';d.querySelectorAll('a[data-id]').forEach(a=>a.onclick=()=>selectRepair(a.dataset.id));$('items').appendChild(d)});if(!j.items.length)$('items').textContent='Ремонтов пока нет.'}$('form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);fd.set('received_at',new Date($('received').value).toISOString());const r=await fetch('/api/repairs',{method:'POST',body:fd}),j=await r.json();if(r.ok){selectRepair(j.repair_id);location.href='/desktop/costing.html?repair_id='+j.repair_id}else $('result').textContent=j.error||'Ошибка'};load();</script></body></html>
