<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Клиенты</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px 14px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:12px 14px;border-radius:9px}main{padding:22px;max-width:1200px}.grid{display:grid;grid-template-columns:420px 1fr;gap:14px}.card{background:#fff;border-radius:14px;padding:20px}input,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.item{display:grid;grid-template-columns:1fr 190px;gap:12px;padding:13px 0;border-bottom:1px solid #e4eaf0}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}@media(max-width:850px){.layout{display:block}aside{display:none}.grid{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">🏠 Главная</a><a href="/desktop/repairs.html">🧰 Ремонты</a><a href="/desktop/clients.html">👤 Клиенты</a><a href="/desktop/costing.html">💰 Калькуляция</a></aside><main><h1>Клиенты</h1><div class="grid"><section class="card"><h2>Новый клиент</h2><form id="form"><input name="name" placeholder="Имя клиента" required><input name="phone" placeholder="Телефон" required><textarea name="comment" placeholder="Комментарий"></textarea><button>Сохранить</button></form><p id="result" class="muted"></p></section><section class="card"><h2>Список клиентов</h2><input id="search" placeholder="Поиск по телефону"><button id="find">Найти</button><div id="items" class="muted">Загрузка…</div></section></div></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id);function chooseClient(id){localStorage.setItem('cm-selected-client',String(id))}async function fetchAllPaged(base,params=new URLSearchParams()){const items=[];let cursor=0;for(;;){const q=new URLSearchParams(params);q.set('limit','32');if(cursor)q.set('cursor',String(cursor));const r=await fetch(base+'?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');items.push(...(j.items||[]));if(!j.has_more)break;const next=Number(j.next_cursor);if(!Number.isInteger(next)||next<=cursor)throw new Error('invalid_paging_cursor');cursor=next}return items}async function load(phone=''){try{const q=new URLSearchParams();if(phone)q.set('phone',phone);const items=await fetchAllPaged('/api/clients',q);$('items').innerHTML='';items.forEach(c=>{const d=document.createElement('div');d.className='item';d.innerHTML='<div><b>'+c.name+'</b><div>'+c.phone+'</div><div class="muted">ID '+c.client_id+'</div></div><div><a data-id="'+c.client_id+'" href="/desktop/repairs.html?client_id='+c.client_id+'">Выбрать и открыть ремонты</a></div>';d.querySelector('a').onclick=()=>chooseClient(c.client_id);$('items').appendChild(d)});if(!items.length)$('items').textContent='Ничего не найдено.'}catch(e){$('items').textContent=e.message}}$('find').onclick=()=>load($('search').value);$('form').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/clients',{method:'POST',body:new FormData(e.target)}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');chooseClient(j.client_id);$('result').className='ok';$('result').textContent='Клиент создан и выбран. ID '+j.client_id;e.target.reset();load()}catch(err){$('result').className='bad';$('result').textContent=err.message}};load();</script></body></html>
