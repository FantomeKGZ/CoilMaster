<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Списание провода</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:24px;max-width:900px}.card{background:#fff;border-radius:15px;padding:20px}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}@media(max-width:800px){.layout{display:block}aside{display:none}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/warehouse.html">Склад</a><a href="/desktop/costing.html">Калькуляция</a></aside><main><h1>Списание провода</h1><section class="card"><p>Ремонт: <b id="repairLabel">не выбран</b></p><form id="form"><label>Бухта</label><select id="spool" required><option value="">Загрузка…</option></select><label>Вес до работы, кг</label><input id="before" required><label>Вес после работы, кг</label><input id="after" required><label>Комментарий</label><input id="comment"><button>Подтвердить списание</button></form><p id="result" class="muted"></p></section></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),repairId=p.get('repair_id')||localStorage.getItem('cm-active-repair')||'';if(repairId){localStorage.setItem('cm-active-repair',repairId);$('repairLabel').textContent='№'+repairId}else $('result').textContent='Откройте списание из карточки ремонта.';const grams=v=>Math.round(Number(String(v).replace(',','.'))*1000),kg=v=>(v/1000).toFixed(3).replace('.',',');async function loadSpools(){try{const r=await fetch('/api/warehouse/spools',{cache:'no-store'}),j=await r.json();$('spool').innerHTML='<option value="">Выберите бухту</option>'+j.items.map(x=>'<option value="'+x.spool_id+'" data-weight="'+x.current_weight_g+'">№'+x.spool_id+' · '+(x.diameter_hundredths_mm/100).toFixed(2)+' мм · '+kg(x.current_weight_g)+' кг</option>').join('')}catch(e){$('result').className='bad';$('result').textContent='Не удалось загрузить бухты.'}}$('spool').onchange=()=>{const o=$('spool').selectedOptions[0];if(o&&o.dataset.weight)$('before').value=kg(Number(o.dataset.weight))};$('form').onsubmit=async e=>{e.preventDefault();if(!repairId){$('result').className='bad';$('result').textContent='Ремонт не выбран.';return}const body=new URLSearchParams({repair_id:repairId,spool_id:$('spool').value,weight_before_g:String(grams($('before').value)),weight_after_g:String(grams($('after').value)),timestamp:new Date().toISOString(),comment:$('comment').value});try{const r=await fetch('/api/warehouse/write-offs',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');$('result').className='ok';$('result').textContent='Списано '+kg(j.consumed_g)+' кг. Остаток '+kg(j.current_weight_g)+' кг.';loadSpools()}catch(err){$('result').className='bad';$('result').textContent='Ошибка: '+err.message}};loadSpools();</script></body></html>
