<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Двигатели</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.item{padding:12px 0;border-bottom:1px solid #e5ebf0}.muted{color:#687580}.badge{display:inline-block;background:#e7eef5;border-radius:999px;padding:4px 8px;margin:5px 5px 0 0;font-size:13px}</style></head><body><header><a href="/mobile/repairs.html">← Ремонты</a><b style="float:right">⚙️ Двигатели</b></header><main><section class="card"><h2>Добавить двигатель</h2><form id="form"><input name="name" placeholder="Название двигателя" required><input name="model" placeholder="Модель"><input name="manufacturer" placeholder="Производитель"><input name="coil_program" placeholder="Программа витков: 140/100/80/40" required><input name="tags" placeholder="Теги: насос, 2.2 кВт, 24 паза"><textarea name="comment" placeholder="Комментарий"></textarea><button>Сохранить двигатель</button></form><p id="result" class="muted"></p></section><section class="card"><h2>Каталог</h2><input id="search" placeholder="Поиск по названию"><div id="items" class="muted">Загрузка…</div></section></main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id);function render(j){$('items').innerHTML='';j.items.forEach(x=>{const d=document.createElement('div');d.className='item';const tags=(x.tags||'').split(',').filter(Boolean).map(t=>'<span class="badge">'+t.trim()+'</span>').join('');d.innerHTML='<b>'+x.name+(x.model?' · '+x.model:'')+'</b><div class="muted">ID '+x.motor_id+(x.manufacturer?' · '+x.manufacturer:'')+'</div><div>Программа: '+x.coil_program+'</div><div>'+tags+'</div><button type="button" data-id="'+x.motor_id+'">Выбрать для ремонта</button>';d.querySelector('button').onclick=()=>{localStorage.setItem('cm-selected-motor',String(x.motor_id));location.href='/mobile/repairs.html?motor_id='+x.motor_id};$('items').appendChild(d)});if(!j.items.length)$('items').textContent='Двигатели не найдены.'}async function load(){const q=$('search').value.trim();const r=await fetch('/api/motors'+(q?'?name='+encodeURIComponent(q):''),j=await r.json();render(j)}$('search').oninput=()=>{clearTimeout(window.cmSearch);window.cmSearch=setTimeout(load,250)};$('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/motors',{method:'POST',body:new FormData(e.target)}),j=await r.json();if(r.ok){$('result').textContent='Двигатель сохранён, ID '+j.motor_id;e.target.reset();load()}else $('result').textContent=j.error||'Ошибка сохранения'};load();</script></body></html>
