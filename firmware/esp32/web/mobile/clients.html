<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Клиенты — CoilMaster</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{position:sticky;top:0;background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.toolbar a{padding:12px;border-radius:10px;background:#e8f1f8;color:#105b91;text-decoration:none;text-align:center;font-weight:bold}.toolbar a:first-child{background:#1769aa;color:#fff}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.item{padding:12px 0;border-bottom:1px solid #e5ebf0}.item:last-child{border:0}.muted{color:#687580}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.links a{padding:10px;border-radius:9px;background:#e8f1f8;color:#105b91;text-decoration:none;text-align:center;font-weight:bold}.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}.pager button{width:auto;margin:0}.pager span{min-width:120px;text-align:center}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}@media(max-width:390px){.toolbar,.links{grid-template-columns:1fr}}</style></head><body><header><a href="/mobile/repairs.html">← Ремонты</a><b style="float:right">👤 Клиенты</b></header><main><div class="toolbar"><a href="/mobile/client-new.html">+ Новый клиент</a><a href="/mobile/repair-new.html">+ Новый ремонт</a></div><section class="card"><h2>Поиск</h2><input id="search" inputmode="tel" placeholder="Телефон или его часть"><button id="find">Найти</button></section><section class="card"><h2>Клиенты</h2><div id="items" class="muted">Загрузка…</div><div class="pager"><button id="prevPage" type="button" disabled>← Назад</button><span id="pageInfo" class="muted">Страница 1</span><button id="nextPage" type="button" disabled>Далее →</button></div></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function choose(id){localStorage.setItem('cm-selected-client',String(id))}let cursor=0,next=0,more=false,history=[],phone='',page=1;function pager(n){$('prevPage').disabled=!history.length;$('nextPage').disabled=!more;$('pageInfo').textContent='Страница '+page+' · '+n+' записей'}async function load(p=phone,c=0,reset=false){if(reset){history=[];page=1;phone=p;c=0}$('items').textContent='Загрузка…';try{const q=new URLSearchParams({limit:'20'});if(phone)q.set('phone',phone);if(c)q.set('cursor',String(c));const r=await fetch('/api/clients?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'client_catalog_unavailable');cursor=c;more=j.has_more===true;next=more?Number(j.next_cursor):0;if(more&&(!Number.isInteger(next)||next<=cursor))throw new Error('invalid_paging_cursor');$('items').innerHTML='';for(const x of j.items||[]){const d=document.createElement('div');d.className='item';d.innerHTML='<b>'+esc(x.name||'Клиент')+'</b><div>'+esc(x.phone||'без телефона')+'</div><div class="muted">ID '+esc(x.client_id)+(x.comment?' · '+esc(x.comment):'')+'</div><div class="links"><a href="/mobile/client-details.html?client_id='+encodeURIComponent(x.client_id)+'">Открыть карточку</a><a href="/mobile/repair-new.html?client_id='+encodeURIComponent(x.client_id)+'">Новый ремонт</a></div>';d.querySelectorAll('a').forEach(a=>a.onclick=()=>choose(x.client_id));$('items').appendChild(d)}if(!(j.items||[]).length)$('items').textContent='Клиенты не найдены.';pager((j.items||[]).length)}catch(e){$('items').textContent='Ошибка: '+(e.message||'unknown');$('prevPage').disabled=true;$('nextPage').disabled=true}}$('find').onclick=()=>load($('search').value.trim(),0,true);$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('find').click()}});$('prevPage').onclick=()=>{if(!history.length)return;const c=history.pop();page--;load(phone,c,false)};$('nextPage').onclick=()=>{if(!more)return;history.push(cursor);page++;load(phone,next,false)};load('',0,true);</script></body></html>
