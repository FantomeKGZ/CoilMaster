<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новый клиент — CoilMaster</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px 14px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:12px 14px;border-radius:9px}main{padding:22px;max-width:760px}.card{background:#fff;border-radius:14px;padding:20px}.action{display:inline-block;padding:11px 15px;border-radius:9px;text-decoration:none;background:#e7eef5;color:#17324b;font-weight:bold;margin-bottom:14px}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}textarea{min-height:100px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.muted{color:#687580}.ok{background:#e8f7ee;border:1px solid #82c99f;padding:12px;border-radius:9px}.bad{background:#fff0ee;border:1px solid #e6a19a;padding:12px;border-radius:9px}@media(max-width:850px){.layout{display:block}aside{display:none}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/clients.html">Клиенты</a><a href="/desktop/motors.html">Двигатели</a></aside><main><a class="action" href="/desktop/clients.html">← Каталог клиентов</a><h1>Новый клиент</h1><section class="card"><form id="form"><label>Имя клиента</label><input name="name" maxlength="96" required><label>Телефон</label><input name="phone" maxlength="48" required><label>Комментарий</label><textarea name="comment" maxlength="320"></textarea><button id="save">Сохранить клиента</button></form><div id="result" class="muted" style="margin-top:12px">Создание клиента не создаёт ремонт и не связывает двигатель. Связь клиента с двигателем фиксируется исторически через ремонт.</div></section></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id);let sending=false;$('form').onsubmit=async e=>{e.preventDefault();if(sending)return;sending=true;$('save').disabled=true;$('result').className='muted';$('result').textContent='Сохранение…';try{const r=await fetch('/api/clients',{method:'POST',body:new FormData(e.target)}),j=await r.json();if(!r.ok)throw new Error(j.error||'client_create_failed');if(!j.client_id)throw new Error('client_id_missing');localStorage.setItem('cm-selected-client',String(j.client_id));$('result').className='ok';$('result').innerHTML='Клиент создан. ID '+String(j.client_id)+'. <a href="/desktop/client-details.html?client_id='+encodeURIComponent(j.client_id)+'">Открыть карточку</a> · <a href="/desktop/repairs.html?client_id='+encodeURIComponent(j.client_id)+'">Создать ремонт</a>';e.target.reset()}catch(err){$('result').className='bad';$('result').textContent='Ошибка: '+(err.message||'unknown')}finally{sending=false;$('save').disabled=false}};</script></body></html>
