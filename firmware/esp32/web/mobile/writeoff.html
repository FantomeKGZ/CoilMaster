<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Списание провода</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b}main{padding:12px;max-width:720px;margin:auto}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}button:disabled{opacity:.55}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}.warning{background:#fff4d6;border:1px solid #e0bc55;padding:10px;border-radius:10px;margin-top:10px}.info{background:#f3f7fa;padding:10px;border-radius:10px;margin-top:10px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}.filters button{margin:0;padding:9px 4px;background:#e8eef4;color:#33414d}.filters button.active{background:#1769aa;color:#fff}.history-item{padding:12px 0;border-bottom:1px solid #e5ebf0}.history-item:last-child{border:0}.history-head{display:flex;justify-content:space-between;gap:8px}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#e8eef4;font-size:12px}.badge.unknown{background:#fff0d5;color:#8b5a00}.total{font-size:22px;font-weight:bold}a{color:#1769aa;text-decoration:none}</style></head><body><main><p><a href="/mobile/repairs.html">← Ремонты</a></p><h1>Списание провода</h1><section class="card"><p>Ремонт: <b id="repairLabel">не выбран</b></p><div class="filters"><button type="button" data-material="ALL" class="active">Все</button><button type="button" data-material="CU">Медь</button><button type="button" data-material="AL">Алюминий</button></div><form id="form"><label>Бухта</label><select id="spool" required><option value="">Загрузка…</option></select><div id="spoolInfo" class="info muted">Выберите бухту.</div><label>Вес до работы, кг</label><input id="before" inputmode="decimal" required><label>Вес после работы, кг</label><input id="after" inputmode="decimal" required><label>Комментарий</label><input id="comment"><button id="submitButton">Подтвердить списание</button></form><p id="result" class="muted"></p></section><section class="card"><h2>История ремонта</h2><div class="muted">Общий расход</div><div id="historyTotal" class="total">—</div><div id="history" class="muted">Загрузка…</div></section></main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),repairId=p.get('repair_id')||localStorage.getItem('cm-active-repair')||'';if(repairId){localStorage.setItem('cm-active-repair',repairId);$('repairLabel').textContent='№'+repairId}else $('result').textContent='Откройте списание из карточки ремонта.';const grams=v=>Math.round(Number(String(v).replace(',','.'))*1000),kg=v=>(v/1000).toFixed(3).replace('.',','),diameter=v=>(v/100).toFixed(2).replace('.',','),materialLabel=v=>v==='CU'?'Медь':v==='AL'?'Алюминий':'Материал не указан',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dateLabel=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?String(v||''):d.toLocaleString('ru-RU')};let material='ALL',spools=[];function selectedSpool(){return spools.find(x=>String(x.spool_id)===$('spool').value)}function updateSelected(){const x=selectedSpool();if(!x){$('spoolInfo').className='info muted';$('spoolInfo').textContent='Выберите бухту.';return}$('before').value=kg(Number(x.current_weight_g));$('spoolInfo').className=x.material_class==='UNKNOWN'?'warning':'info';$('spoolInfo').textContent=materialLabel(x.material_class)+' · '+diameter(x.diameter_hundredths_mm)+' мм · текущий остаток '+kg(x.current_weight_g)+' кг.'+(x.material_class==='UNKNOWN'?' Сначала назначьте материал на странице склада.':'')}async function loadSpools(selectedId=''){try{const r=await fetch('/api/warehouse/spools?material='+material,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');spools=j.items||[];$('spool').innerHTML='<option value="">Выберите бухту</option>'+spools.map(x=>'<option value="'+x.spool_id+'">№'+x.spool_id+' · '+materialLabel(x.material_class)+' · '+diameter(x.diameter_hundredths_mm)+' мм · '+kg(x.current_weight_g)+' кг</option>').join('');if(selectedId&&spools.some(x=>String(x.spool_id)===String(selectedId)))$('spool').value=String(selectedId);updateSelected()}catch(e){$('result').className='bad';$('result').textContent='Не удалось загрузить бухты: '+e.message}}async function loadHistory(){if(!repairId){$('historyTotal').textContent='—';$('history').textContent='Ремонт не выбран.';return}try{const r=await fetch('/api/warehouse/write-offs?repair_id='+encodeURIComponent(repairId),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');$('historyTotal').textContent=kg(j.total_consumed_g||0)+' кг';const items=j.items||[];$('history').className='';$('history').innerHTML=items.length?items.slice().reverse().map(x=>`<div class="history-item"><div class="history-head"><b>Движение №${x.movement_id}</b><span>${kg(x.consumed_g)} кг</span></div><div>Бухта №${x.spool_id} · ${diameter(x.diameter_hundredths_mm)} мм</div><div><span class="badge ${x.legacy_unknown_material?'unknown':''}">${materialLabel(x.wire_type)}</span></div><div class="muted">${esc(dateLabel(x.timestamp))}</div>${x.comment?`<div>${esc(x.comment)}</div>`:''}</div>`).join(''):'Подтверждённых списаний пока нет.'}catch(e){$('historyTotal').textContent='—';$('history').className='bad';$('history').textContent='Не удалось загрузить историю: '+e.message}}$('spool').onchange=updateSelected;document.querySelectorAll('[data-material]').forEach(b=>b.onclick=()=>{material=b.dataset.material;document.querySelectorAll('[data-material]').forEach(x=>x.classList.toggle('active',x===b));loadSpools()});$('form').onsubmit=async e=>{e.preventDefault();if(!repairId){$('result').className='bad';$('result').textContent='Ремонт не выбран.';return}const spool=selectedSpool();if(!spool){$('result').className='bad';$('result').textContent='Выберите бухту.';return}if(spool.material_class==='UNKNOWN'){$('result').className='bad';$('result').textContent='У бухты не указан материал. Назначьте его на странице склада.';return}const before=grams($('before').value),after=grams($('after').value);if(!Number.isFinite(before)||!Number.isFinite(after)||before<=0||after<0||after>=before){$('result').className='bad';$('result').textContent='Проверьте вес: после работы он должен быть меньше веса до работы.';return}if(before!==Number(spool.current_weight_g)){$('result').className='bad';$('result').textContent='Вес до работы должен совпадать с текущим остатком бухты: '+kg(spool.current_weight_g)+' кг.';return}const body=new URLSearchParams({repair_id:repairId,spool_id:String(spool.spool_id),weight_before_g:String(before),weight_after_g:String(after),timestamp:new Date().toISOString(),comment:$('comment').value});$('submitButton').disabled=true;$('result').className='muted';$('result').textContent='Сохранение…';try{const r=await fetch('/api/warehouse/write-offs',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');const used=j.wire_type?materialLabel(j.wire_type):'Материал не указан';$('result').className='ok';$('result').textContent='Списано '+kg(j.consumed_g)+' кг. '+used+'. Остаток '+kg(j.current_weight_g)+' кг.';$('after').value='';$('comment').value='';await loadSpools(spool.spool_id);await loadHistory()}catch(err){$('result').className='bad';$('result').textContent='Ошибка: '+err.message}finally{$('submitButton').disabled=false}};loadSpools();loadHistory();</script></body></html>
