<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Изменить материал — CoilMaster</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px}.kv{background:#f3f7fa;padding:11px;border-radius:9px;margin-bottom:8px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}</style></head><body><header><a href="/mobile/material-catalog.html">← Материалы</a><b style="float:right">✏️ Изменение</b></header><main><section class="card"><div id="info" class="muted">Загрузка…</div><form id="form" hidden><input name="add" inputmode="decimal" placeholder="Пополнение (0 — без изменения)" value="0"><input name="price" inputmode="decimal" placeholder="Новая цена, сом" required><input name="comment" placeholder="Причина изменения"><button>Сохранить изменения</button></form><p id="result" class="muted"></p></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('material_id'),num=v=>Number(String(v).replace(',','.')),qty=v=>(v/1000).toLocaleString('ru-RU',{maximumFractionDigits:3}),money=v=>(v/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});let item=null;async function find(){if(!/^[1-9]\d*$/.test(String(id||'')))throw new Error('invalid_material_id');let cursor=0;for(let page=0;page<100;page++){const q=new URLSearchParams({limit:'32'});if(cursor)q.set('cursor',String(cursor));const r=await fetch('/api/materials?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'materials_unavailable');const hit=(j.items||[]).find(x=>String(x.material_id)===String(id));if(hit)return hit;if(j.has_more!==true)return null;const next=Number(j.next_cursor);if(!Number.isInteger(next)||next<=cursor)throw new Error('invalid_paging_cursor');cursor=next}throw new Error('material_search_limit')}async function load(){try{item=await find();if(!item)throw new Error('material_not_found');$('info').innerHTML='<div class="kv"><b>'+item.name+'</b></div><div class="kv">Остаток: '+qty(item.stock_quantity_milli)+'</div><div class="kv">Цена: '+money(item.price_per_unit_minor)+' '+(item.currency||'KGS')+'</div>';$('form').hidden=false;$('form').elements.price.value=(item.price_per_unit_minor/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})}catch(e){$('info').textContent='Ошибка: '+e.message}}$('form').onsubmit=async e=>{e.preventDefault();if(!item)return;const add=num(e.target.elements.add.value||0),price=num(e.target.elements.price.value);if(!Number.isFinite(add)||!Number.isFinite(price)||price<0){$('result').className='bad';$('result').textContent='Проверьте значения.';return}const body=new URLSearchParams({material_id:String(item.material_id),add_quantity_milli:String(Math.round(add*1000)),new_price_per_unit_minor:String(Math.round(price*100)),currency:item.currency||'KGS',timestamp:new Date().toISOString(),comment:e.target.elements.comment.value});const r=await fetch('/api/materials/adjust',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();$('result').className=r.ok?'ok':'bad';$('result').textContent=r.ok?'Изменения сохранены.':j.error||'Ошибка';if(r.ok)location.href='/mobile/material-catalog.html'};load();</script></body></html>
