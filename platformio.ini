[platformio]
default_envs = uno
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

lib_deps =
    chris--a/Keypad @ ^3.1.1
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

build_src_filter =
    -<*>
    +<Core/*.cpp>
    +<Arduino/*.cpp>
    +<firmware/arduino/src/main.cpp>

build_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
    -flto
    -D_SS_MAX_RX_BUFF=32
    -DSERIAL_RX_BUFFER_SIZE=16
    -DSERIAL_TX_BUFFER_SIZE=16

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
extra_scripts = pre:scripts/platformio_build_id.py

build_src_filter =
    -<*>
    +<firmware/esp32/src/*.cpp>

build_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
