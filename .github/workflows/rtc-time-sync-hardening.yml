name: RTC time sync hardening

on:
  push:
    branches: [cmp-protocol-v1]
    paths:
      - .github/workflows/rtc-time-sync-hardening.yml

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
          fetch-depth: 0

      - name: Patch RTC manual set and Bishkek NTP sync
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('firmware/esp32/src/main.cpp')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '#include <Wire.h>\n#include <esp_heap_caps.h>',
              '#include <Wire.h>\n#include <time.h>\n#include <esp_heap_caps.h>',
              'time include')

          replace_once(
              'constexpr int8_t RtcSdaPin = 21;\nconstexpr int8_t RtcSclPin = 22;\nconstexpr char AccessPointName[] = "CoilMaster";',
              'constexpr int8_t RtcSdaPin = 21;\nconstexpr int8_t RtcSclPin = 22;\nconstexpr char BishkekTimezoneName[] = "Asia/Bishkek";\nconstexpr char BishkekPosixTimezone[] = "KGT-6";\nconstexpr char NtpServer1[] = "pool.ntp.org";\nconstexpr char NtpServer2[] = "time.google.com";\nconstexpr char NtpServer3[] = "time.cloudflare.com";\nconstexpr uint32_t NtpInitialWaitMs = 2000UL;\nconstexpr uint32_t NtpRetryIntervalMs = 30000UL;\nconstexpr uint32_t NtpRefreshIntervalMs = 21600000UL;\nconstexpr char AccessPointName[] = "CoilMaster";',
              'RTC/NTP constants')

          replace_once(
              'bool webRecoveryRequired = false;\nbool mdnsReady = false;\nesp_reset_reason_t bootResetReason = ESP_RST_UNKNOWN;',
              'bool webRecoveryRequired = false;\nbool mdnsReady = false;\nbool ntpConfigured = false;\nbool ntpSyncedThisConnection = false;\nuint32_t lastNtpAttemptMs = 0UL;\nuint32_t lastNtpSyncMs = 0UL;\nconst char* lastNtpSyncResult = "NOT_CONNECTED";\nesp_reset_reason_t bootResetReason = ESP_RST_UNKNOWN;',
              'NTP state')

          old_parser = '''bool parseCanonicalUint32(const String& source, uint32_t& value)\n{\n    value = 0UL;\n    if (source.length() == 0U) return false;\n    if (source.length() > 1U && source[0] == '0') return false;\n\n    uint32_t parsed = 0UL;\n    for (size_t index = 0U; index < source.length(); ++index)\n    {\n        const char ch = source[index];\n        if (!isDigit(ch)) return false;\n        const uint8_t digit = static_cast<uint8_t>(ch - '0');\n        if (parsed > (0xFFFFFFFFUL - digit) / 10UL) return false;\n        parsed = parsed * 10UL + digit;\n    }\n\n    value = parsed;\n    return true;\n}\n'''
          new_parser = old_parser + '''\nbool parseRtcDecimal(const String& source, uint32_t& value)\n{\n    // RTC form fields are normally zero-padded (08, 05, 00). IDs elsewhere\n    // intentionally keep the stricter canonical parser, so only RTC parsing\n    // accepts leading zeroes.\n    value = 0UL;\n    if (source.length() == 0U) return false;\n    uint32_t parsed = 0UL;\n    for (size_t index = 0U; index < source.length(); ++index)\n    {\n        const char ch = source[index];\n        if (!isDigit(ch)) return false;\n        const uint8_t digit = static_cast<uint8_t>(ch - '0');\n        if (parsed > (0xFFFFFFFFUL - digit) / 10UL) return false;\n        parsed = parsed * 10UL + digit;\n    }\n    value = parsed;\n    return true;\n}\n'''
          replace_once(old_parser, new_parser, 'RTC decimal parser')

          marker = '''bool sameProgram(const CM::OutgoingWindingJob& left,\n                 const CM::OutgoingWindingJob& right)\n{\n    if (left.coilCount != right.coilCount) return false;\n    for (uint8_t index = 0U; index < left.coilCount; ++index)\n    {\n        if (left.turns[index] != right.turns[index]) return false;\n    }\n    return true;\n}\n'''
          ntp_code = marker + '''\nvoid updateBishkekTimeSync(uint32_t nowMs)\n{\n    if (WiFi.status() != WL_CONNECTED)\n    {\n        ntpConfigured = false;\n        ntpSyncedThisConnection = false;\n        lastNtpAttemptMs = 0UL;\n        lastNtpSyncResult = "NOT_CONNECTED";\n        return;\n    }\n\n    if (!ntpConfigured)\n    {\n        // POSIX TZ signs are reversed: KGT-6 means local time = UTC+6.\n        configTzTime(BishkekPosixTimezone, NtpServer1, NtpServer2, NtpServer3);\n        ntpConfigured = true;\n        ntpSyncedThisConnection = false;\n        lastNtpAttemptMs = nowMs;\n        lastNtpSyncResult = "WAITING_NTP";\n        Serial.println(F("NTP: configured Asia/Bishkek (UTC+6), waiting for network time"));\n        return;\n    }\n\n    const uint32_t interval = ntpSyncedThisConnection\n        ? NtpRefreshIntervalMs : NtpRetryIntervalMs;\n    const uint32_t minimumWait = ntpSyncedThisConnection\n        ? interval : (lastNtpSyncResult == String("WAITING_NTP")\n                          ? NtpInitialWaitMs : interval);\n    if (static_cast<uint32_t>(nowMs - lastNtpAttemptMs) < minimumWait) return;\n    lastNtpAttemptMs = nowMs;\n\n    struct tm localTime = {};\n    if (!getLocalTime(&localTime, 75U))\n    {\n        lastNtpSyncResult = "NTP_UNAVAILABLE";\n        return;\n    }\n\n    const uint16_t year = static_cast<uint16_t>(localTime.tm_year + 1900);\n    if (year < 2024U || year > 2099U)\n    {\n        lastNtpSyncResult = "NTP_TIME_INVALID";\n        return;\n    }\n\n    // Avoid changing the persistent wall clock in the middle of a physical or\n    // otherwise uncertain operation. NTP stays configured and retry happens\n    // automatically once the system is safely idle.\n    if (backupRuntimeActivity() != CM::BackupActivityCheck::Safe)\n    {\n        lastNtpSyncResult = "WAITING_SAFE_IDLE";\n        return;\n    }\n\n    CM::RtcDateTime value;\n    value.year = year;\n    value.month = static_cast<uint8_t>(localTime.tm_mon + 1);\n    value.day = static_cast<uint8_t>(localTime.tm_mday);\n    value.hour = static_cast<uint8_t>(localTime.tm_hour);\n    value.minute = static_cast<uint8_t>(localTime.tm_min);\n    value.second = static_cast<uint8_t>(localTime.tm_sec);\n\n    if (!rtcClock.set(value))\n    {\n        lastNtpSyncResult = rtcClock.detected()\n            ? "RTC_WRITE_VERIFY_FAILED" : "RTC_NOT_DETECTED";\n        Serial.print(F("NTP: DS3231 sync failed: "));\n        Serial.println(lastNtpSyncResult);\n        return;\n    }\n\n    ntpSyncedThisConnection = true;\n    lastNtpSyncMs = nowMs;\n    lastNtpSyncResult = "SYNCED";\n    Serial.printf("NTP: DS3231 synchronized to Bishkek %04u-%02u-%02u %02u:%02u:%02u\\n",\n                  static_cast<unsigned>(value.year),\n                  static_cast<unsigned>(value.month),\n                  static_cast<unsigned>(value.day),\n                  static_cast<unsigned>(value.hour),\n                  static_cast<unsigned>(value.minute),\n                  static_cast<unsigned>(value.second));\n}\n'''
          replace_once(marker, ntp_code, 'NTP updater')

          replace_once(
              '        response += F(",\\\"timezone_configured\\\":false,\\\"scheduling_ready\\\":false}");',
              '        response += F(",\\\"timezone\\\":\\\""); response += BishkekTimezoneName;\n        response += F("\\\",\\\"utc_offset_minutes\\\":360,\\\"timezone_configured\\\":true");\n        response += F(",\\\"ntp_enabled\\\":true,\\\"sta_connected\\\":");\n        response += WiFi.status() == WL_CONNECTED ? F("true") : F("false");\n        response += F(",\\\"ntp_synchronized\\\":");\n        response += ntpSyncedThisConnection ? F("true") : F("false");\n        response += F(",\\\"ntp_status\\\":\\\""); response += lastNtpSyncResult;\n        response += F("\\\",\\\"last_ntp_sync_uptime_ms\\\":"); response += lastNtpSyncMs;\n        response += F(",\\\"scheduling_ready\\\":false}");',
              'time GET status')

          replace_once(
              '!parseCanonicalUint32(webServer.arg(fields[i]), parsed[i]))',
              '!parseRtcDecimal(webServer.arg(fields[i]), parsed[i]))',
              'RTC POST parser use')

          replace_once(
              '    networkManager.update(nowMs);\n    webServer.handleClient();',
              '    networkManager.update(nowMs);\n    updateBishkekTimeSync(nowMs);\n    webServer.handleClient();',
              'loop time sync')

          path.write_text(text, encoding='utf-8')

          docs = Path('docs/HARDWARE_REFERENCE/04_RTC_TIME_SYNC.md')
          if docs.exists():
              raise SystemExit('04_RTC_TIME_SYNC.md already exists unexpectedly')
          docs.write_text('''# DS3231 — время и автоматическая синхронизация Бишкек\n\nДата: **2026-08-18**  \nSource of truth: `cmp-protocol-v1`\n\n## Подключение\n\nDS3231 подключен к ESP32 по I2C:\n\n```text\nDS3231 SDA -> ESP32 GPIO21\nDS3231 SCL -> ESP32 GPIO22\nGND        -> GND\nVCC        -> питание модуля согласно его плате\n```\n\nАдрес DS3231: `0x68`.\n\n## Локальное время\n\nCoilMaster использует местное время Кыргызстана / Бишкек:\n\n```text\nIANA zone: Asia/Bishkek\nUTC offset: +06:00\nESP32 POSIX TZ: KGT-6\n```\n\n## Автоматическая NTP-синхронизация\n\nПосле успешного подключения ESP32 к сохраненной Wi-Fi STA сети прошивка\nнастраивает NTP и получает время из сети. Используются несколько серверов:\n\n```text\npool.ntp.org\ntime.google.com\ntime.cloudflare.com\n```\n\nКогда валидное сетевое время получено, оно переводится в локальное время\nБишкека и записывается в DS3231.\n\nПравила:\n\n- при отсутствии интернета RTC продолжает работать автономно;\n- после появления интернета синхронизация повторяется автоматически;\n- при временной ошибке NTP выполняются повторные попытки;\n- после успешной синхронизации RTC периодически освежается;\n- запись DS3231 откладывается, пока CoilMaster не находится в безопасном idle-состоянии;\n- синхронизация времени не запускает двигатель, не управляет SSR и не меняет winding job state.\n\n## Ручная установка времени\n\nAPI:\n\n```text\nPOST /api/system/time\n```\n\nПоля:\n\n```text\nyear\nmonth\nday\nhour\nminute\nsecond\nconfirmed=true\n```\n\nПоля даты/времени допускают обычные ведущие нули, например `08`, `05`, `00`.\nЭто важно: прежний общий ID-парсер запрещал ведущие нули и мог возвращать\n`invalid_rtc_datetime_fields` для нормального времени из браузера. Для ID\nстрогий canonical parser сохранен; ослаблена только обработка RTC-полей.\n\nРучная запись по-прежнему допускается только при безопасном idle-состоянии.\n\n## Диагностика\n\n```text\nGET /api/system/time\n```\n\nВозвращает состояние DS3231 и NTP, включая:\n\n- `detected`;\n- `time_valid`;\n- `local_time`;\n- `timezone = Asia/Bishkek`;\n- `utc_offset_minutes = 360`;\n- `sta_connected`;\n- `ntp_synchronized`;\n- `ntp_status`;\n- `last_ntp_sync_uptime_ms`.\n\nОсновные `ntp_status`:\n\n```text\nNOT_CONNECTED\nWAITING_NTP\nNTP_UNAVAILABLE\nNTP_TIME_INVALID\nWAITING_SAFE_IDLE\nRTC_NOT_DETECTED\nRTC_WRITE_VERIFY_FAILED\nSYNCED\n```\n\nПосле прошивки проверить Serial ESP32. При успешной синхронизации ожидается\nсообщение `NTP: DS3231 synchronized to Bishkek ...`.\n''', encoding='utf-8')

          index_path = Path('docs/HARDWARE_REFERENCE/00_READ_FIRST.md')
          index = index_path.read_text(encoding='utf-8')
          anchor = '- `03_KEYS_AND_HIDDEN_COMMANDS.md` — клавиши 4×4, START и скрытые/аварийные команды.\n'
          if anchor not in index:
              raise SystemExit('hardware reference index anchor not found')
          index = index.replace(anchor, anchor + '- `04_RTC_TIME_SYNC.md` — DS3231, ручная установка и автоматическая NTP-синхронизация времени Бишкек.\n', 1)
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check platformio

      - name: Build ESP32 firmware
        run: pio run -e esp32

      - name: Run web contract checks
        run: |
          node Tests/Web/check_web_assets.js
          node Tests/Web/check_release_contracts.js
          node Tests/Web/check_final_acceptance_contracts.js

      - name: Commit verified change and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/rtc-time-sync-hardening.yml
          git add firmware/esp32/src/main.cpp docs/HARDWARE_REFERENCE/00_READ_FIRST.md docs/HARDWARE_REFERENCE/04_RTC_TIME_SYNC.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: synchronize DS3231 with Bishkek network time"
          git push origin HEAD:cmp-protocol-v1
