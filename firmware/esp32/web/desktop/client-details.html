<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Клиент — CoilMaster</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px 14px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:12px 14px;border-radius:9px}main{padding:22px;max-width:1100px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kv{background:#f3f7fa;border-radius:10px;padding:12px}.kv small{display:block;color:#687580;margin-bottom:4px}.action,button{display:inline-block;padding:10px 13px;border:0;border-radius:9px;text-decoration:none;background:#1769aa;color:#fff;font-weight:bold;margin:3px 7px 3px 0;cursor:pointer}.secondary{background:#e7eef5;color:#17324b}.muted{color:#687580}.ok{color:#17683a}.warn{color:#8a5300}.bad{color:#a4261d}.repair,.payment{padding:13px 0;border-bottom:1px solid #e4eaf0}.repair:last-child,.payment:last-child{border:0}.status{display:inline-block;padding:3px 7px;border-radius:999px;background:#e8f7ee;color:#17683a;font-size:12px;font-weight:bold}.status.closed{background:#e8edf2;color:#53606b}.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}.pager button{padding:9px 12px;border:0;border-radius:8px;background:#5b6874;color:#fff}.pager button:disabled{background:#b4bec7}.pager span{min-width:130px;text-align:center}.formgrid{display:grid;grid-template-columns:2fr 1.2fr 2fr auto;gap:10px;align-items:end;margin-top:14px}.field label{display:block;font-size:13px;color:#687580;margin-bottom:5px}.field input,.field select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5df;border-radius:8px;background:#fff}.notice{margin-top:8px}.prepay{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:10px;align-items:end;margin-top:14px}@media(max-width:900px){.layout{display:block}aside{display:none}.grid{grid-template-columns:1fr 1fr}.formgrid,.prepay{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.formgrid,.prepay{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/clients.html">Клиенты</a><a href="/desktop/motors.html">Двигатели</a><a href="/desktop/costing.html">Калькуляция</a></aside><main><div><a class="action secondary" href="/desktop/clients.html">← Клиенты</a><a id="newRepair" class="action" href="/desktop/repair-new.html">+ Новый ремонт</a><a id="cashLink" class="action" href="/desktop/cash.html">Касса клиента</a></div><h1 id="title">Клиент</h1><section class="card"><h2>Контакты</h2><div id="identity" class="grid"></div><p id="comment" class="muted"></p><h3>Редактировать клиента</h3><form id="editForm" class="formgrid"><div class="field"><label for="editName">Имя</label><input id="editName" required maxlength="120"></div><div class="field"><label for="editPhone">Телефон</label><input id="editPhone" required maxlength="40"></div><div class="field"><label for="editComment">Комментарий</label><input id="editComment" maxlength="500"></div><div><button id="saveClient" type="submit">Сохранить</button></div></form><div id="editStatus" class="notice muted"></div></section><section class="card"><h2>Баланс</h2><div id="balance" class="grid"><div class="muted">Загрузка…</div></div><p id="balanceHint" class="muted"></p><h3>Зачислить предоплату</h3><form id="prepayForm" class="prepay"><div class="field"><label for="prepayAmount">Сумма, сом</label><input id="prepayAmount" inputmode="decimal" placeholder="0.00" required></div><div class="field"><label for="prepayMethod">Способ</label><select id="prepayMethod"><option value="CASH">Наличные</option><option value="CARD">Карта</option><option value="TRANSFER">Перевод</option><option value="OTHER">Другое</option></select></div><div class="field"><label for="prepayComment">Комментарий</label><input id="prepayComment" maxlength="500" placeholder="Предоплата"></div><div><button id="prepayButton" type="submit">Зачислить предоплату</button></div></form><div id="prepayStatus" class="notice muted"></div></section><section class="card"><h2>Ремонты и двигатели</h2><div id="repairs" class="muted">Загрузка…</div><div class="pager"><button id="prevRepairs" disabled>← Назад</button><span id="repairPage">Страница 1</span><button id="nextRepairs" disabled>Далее →</button></div></section><section class="card"><h2>История платежей</h2><div id="payments" class="muted">Загрузка…</div><div class="pager"><button id="prevPayments" disabled>← Назад</button><span id="paymentPage">Страница 1</span><button id="nextPayments" disabled>Далее →</button></div></section><p id="error" class="bad"></p></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),clientId=params.get('client_id')||'';const canonical=v=>/^[1-9][0-9]*$/.test(String(v));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateLabel=v=>{if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('ru-RU')};const money=(minor,currency)=>{const n=Number(minor);return Number.isFinite(n)?(n/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+(currency||''): '—'};const toMinor=value=>{const normalized=String(value||'').trim().replace(',','.');if(!/^\d+(?:\.\d{1,2})?$/.test(normalized))return 0;const [whole,fraction='']=normalized.split('.');const result=Number(whole)*100+Number((fraction+'00').slice(0,2));return Number.isSafeInteger(result)&&result>0?result:0};function kv(label,value){return '<div class="kv"><small>'+esc(label)+'</small><b>'+esc(value??'—')+'</b></div>'}let repairCursor=0,repairNext=0,repairHistory=[],repairPage=1,paymentCursor=0,paymentNext=0,paymentHistory=[],paymentPage=1;async function loadClient(){if(!canonical(clientId))throw new Error('invalid_client_id');const r=await fetch('/api/clients/by-id?client_id='+encodeURIComponent(clientId),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'client_lookup_failed');const c=j.item;if(!c)throw new Error('client_not_found');localStorage.setItem('cm-selected-client',String(c.client_id));$('title').textContent=c.name||('Клиент '+c.client_id);$('identity').innerHTML=kv('ID',c.client_id)+kv('Имя',c.name||'—')+kv('Телефон',c.phone||'—');$('comment').textContent=c.comment||'Комментарий не указан.';$('editName').value=c.name||'';$('editPhone').value=c.phone||'';$('editComment').value=c.comment||'';$('newRepair').href='/desktop/repair-new.html?client_id='+encodeURIComponent(c.client_id);$('cashLink').href='/desktop/cash.html?client_id='+encodeURIComponent(c.client_id)}async function loadBalance(){try{const r=await fetch('/api/payments/balance?client_id='+encodeURIComponent(clientId),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'balance_unavailable');const b=j.item||j.balance||j;$('balance').innerHTML=kv('Начислено',money(b.charged_amount_minor??b.charged_minor,b.currency))+kv('Оплачено по ремонтам',money(b.paid_amount_minor??b.paid_minor,b.currency))+kv('Долг',money(b.debt_amount_minor??b.debt_minor,b.currency))+kv('Предоплата',money(b.prepayment_minor??0,b.currency));$('balanceHint').textContent='Предоплата хранится отдельно и автоматически не засчитывается в ремонт. Баланс ремонтов рассчитывается из authoritative стоимости и append-only журнала платежей.'}catch(e){$('balance').innerHTML='<div class="muted">Баланс недоступен: '+esc(e.message||'unknown')+'</div>'}}async function motorLabel(id){if(!canonical(id))return'Двигатель не указан';try{const r=await fetch('/api/motors/by-id?motor_id='+encodeURIComponent(id),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.item)return'Двигатель ID '+id;const m=j.item;return([m.manufacturer,m.model].filter(Boolean).join(' ').trim()||m.name||'Двигатель')+' · ID '+id}catch{return'Двигатель ID '+id}}async function deliveryLabel(repair){if((repair.current_status||repair.status)!=='CLOSED')return'<span class="status">В работе</span>';try{const r=await fetch('/api/repairs/delivery?repair_id='+encodeURIComponent(repair.repair_id),{cache:'no-store'}),j=await r.json();if(!r.ok)return'<span class="status closed">Закрыт</span>';const item=j.item||j.delivery||j;if(item&&item.delivered_at)return'<span class="status closed">Выдан '+esc(dateLabel(item.delivered_at))+'</span>';return'<span class="status closed">Закрыт, не выдан</span>'}catch{return'<span class="status closed">Закрыт</span>'}}async function renderRepairs(items){$('repairs').innerHTML='';for(const x of items){const d=document.createElement('div');d.className='repair';const motor=await motorLabel(x.motor_id),delivery=await deliveryLabel(x);d.innerHTML='<b>Ремонт №'+esc(x.repair_id)+'</b> '+delivery+'<div>'+esc(motor)+'</div><div class="muted">Принят: '+esc(dateLabel(x.received_at))+(x.complaint?' · '+esc(x.complaint):'')+'</div><div><a class="action secondary" href="/desktop/motor-details.html?motor_id='+encodeURIComponent(x.motor_id)+'">Двигатель</a><a class="action secondary" href="/desktop/winding-history.html?repair_id='+encodeURIComponent(x.repair_id)+'">Намотка</a><a class="action" href="/desktop/costing.html?repair_id='+encodeURIComponent(x.repair_id)+'">'+(((x.current_status||x.status)==='CLOSED')?'Итог':'Калькуляция')+'</a></div>';$('repairs').appendChild(d)}if(!items.length)$('repairs').textContent='Ремонтов у клиента ещё нет.'}async function loadRepairs(cursor=0,push=false){$('repairs').textContent='Загрузка…';try{const q=new URLSearchParams({client_id:String(clientId),limit:'12',status:'ALL'});if(cursor)q.set('cursor',String(cursor));const r=await fetch('/api/repairs?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'repair_history_unavailable');if(push)repairHistory.push(repairCursor);repairCursor=cursor;repairNext=j.has_more===true?Number(j.next_cursor):0;if(j.has_more===true&&(!Number.isInteger(repairNext)||repairNext<=repairCursor))throw new Error('invalid_repair_cursor');await renderRepairs(j.items||[]);$('prevRepairs').disabled=!repairHistory.length;$('nextRepairs').disabled=j.has_more!==true;$('repairPage').textContent='Страница '+repairPage}catch(e){$('repairs').textContent='История ремонтов недоступна: '+(e.message||'unknown');$('prevRepairs').disabled=true;$('nextRepairs').disabled=true}}function renderPayments(items){$('payments').innerHTML='';for(const x of items){const d=document.createElement('div');d.className='payment';const direction=x.direction||'ADD',sign=direction==='SUBTRACT'?'−':'+';const amount=x.amount_minor??x.amount_minor_units??x.amount??0;const kind=x.kind||x.event_type||x.type||'PAYMENT';const label=kind==='PREPAYMENT'?'Предоплата':kind;const scope=kind==='PREPAYMENT'?'Без привязки к ремонту':'Ремонт №'+(x.repair_id||'—');d.innerHTML='<b>'+esc(label)+' '+sign+esc(money(amount,x.currency||''))+'</b><div class="muted">'+esc(scope)+' · '+esc(dateLabel(x.occurred_at||x.paid_at||x.created_at))+'</div>'+(x.comment?'<div>'+esc(x.comment)+'</div>':'');$('payments').appendChild(d)}if(!items.length)$('payments').textContent='Платежей ещё нет.'}async function loadPayments(cursor=0,push=false){$('payments').textContent='Загрузка…';try{const q=new URLSearchParams({client_id:String(clientId),limit:'20'});if(cursor)q.set('cursor',String(cursor));const r=await fetch('/api/payments?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'payment_history_unavailable');if(push)paymentHistory.push(paymentCursor);paymentCursor=cursor;paymentNext=j.has_more===true?Number(j.next_cursor):0;if(j.has_more===true&&(!Number.isInteger(paymentNext)||paymentNext<=paymentCursor))throw new Error('invalid_payment_cursor');renderPayments(j.items||[]);$('prevPayments').disabled=!paymentHistory.length;$('nextPayments').disabled=j.has_more!==true;$('paymentPage').textContent='Страница '+paymentPage}catch(e){$('payments').textContent='История платежей недоступна: '+(e.message||'unknown');$('prevPayments').disabled=true;$('nextPayments').disabled=true}}$('editForm').onsubmit=async e=>{e.preventDefault();const button=$('saveClient');button.disabled=true;$('editStatus').className='notice muted';$('editStatus').textContent='Сохранение…';try{const body=new URLSearchParams({client_id:String(clientId),name:$('editName').value.trim(),phone:$('editPhone').value.trim(),comment:$('editComment').value.trim()});const r=await fetch('/api/clients/update',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body}),j=await r.json();if(!r.ok||j.updated!==true||j.write_performed!==true)throw new Error(j.error||'client_update_failed');$('editStatus').className='notice ok';$('editStatus').textContent='Изменения сохранены.';await loadClient()}catch(err){$('editStatus').className='notice bad';$('editStatus').textContent='Ошибка: '+(err.message||'unknown')}finally{button.disabled=false}};$('prepayForm').onsubmit=async e=>{e.preventDefault();const amount=toMinor($('prepayAmount').value);if(!amount){$('prepayStatus').className='notice bad';$('prepayStatus').textContent='Укажите корректную сумму больше нуля.';return}const button=$('prepayButton');button.disabled=true;$('prepayStatus').className='notice muted';$('prepayStatus').textContent='Зачисление…';try{const body=new URLSearchParams({confirmed:'true',kind:'PREPAYMENT',client_id:String(clientId),amount_minor:String(amount),currency:'KGS',occurred_at:new Date().toISOString(),method:$('prepayMethod').value,comment:$('prepayComment').value.trim()});const r=await fetch('/api/payments',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body}),j=await r.json();if(!r.ok||j.kind!=='PREPAYMENT'||Number(j.client_id)!==Number(clientId)||Number(j.repair_id)!==0)throw new Error(j.error||'prepayment_failed');$('prepayAmount').value='';$('prepayComment').value='';$('prepayStatus').className='notice ok';$('prepayStatus').textContent='Предоплата зачислена.';paymentCursor=0;paymentNext=0;paymentHistory=[];paymentPage=1;await Promise.all([loadBalance(),loadPayments(0,false)])}catch(err){$('prepayStatus').className='notice bad';$('prepayStatus').textContent='Ошибка: '+(err.message||'unknown')}finally{button.disabled=false}};$('nextRepairs').onclick=()=>{if(!repairNext)return;repairPage++;loadRepairs(repairNext,true)};$('prevRepairs').onclick=()=>{if(!repairHistory.length)return;const c=repairHistory.pop();repairPage=Math.max(1,repairPage-1);loadRepairs(c,false)};$('nextPayments').onclick=()=>{if(!paymentNext)return;paymentPage++;loadPayments(paymentNext,true)};$('prevPayments').onclick=()=>{if(!paymentHistory.length)return;const c=paymentHistory.pop();paymentPage=Math.max(1,paymentPage-1);loadPayments(c,false)};(async()=>{try{await loadClient();await Promise.all([loadBalance(),loadRepairs(0,false),loadPayments(0,false)])}catch(e){$('error').textContent='Не удалось открыть карточку клиента: '+(e.message||'unknown')}})();</script></body></html>
