<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Справочник обмоток</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:76px}header{position:sticky;top:0;background:#142536;color:#fff;padding:15px;z-index:2}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:15px;margin-bottom:12px}.notice{background:#fff3d8;border:1px solid #efc86a;border-radius:12px;padding:12px;margin-bottom:12px}input,select{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}.item{padding:14px 0;border-bottom:1px solid #e5ebf0}.item:last-child{border:0}.line{margin-top:5px}.muted{color:#687580}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8eef4;font-size:12px}.review{background:#fff1d8;color:#7a4b00}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}</style></head><body><header><a href="/mobile/more.html">← Разделы</a><b style="float:right">📚 Справочник</b></header><main><div class="notice"><b>Только справочные данные.</b><br>Записи не являются программами станка и не используются для запуска намотки.</div><section class="card"><input id="q" placeholder="Название или модель"><select id="series"><option value="">Все производители / серии</option></select><select id="rpm"><option value="">Все группы оборотов</option></select><select id="slots"><option value="">Все числа пазов</option></select><p id="count" class="muted">Загрузка…</p></section><section id="items" class="card"></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let records=[];const val=(v,s='—')=>v===null||v===undefined||v===''?s:String(v),rpmText=x=>x.speed_group_rpm?'≈ '+x.speed_group_rpm+' об/мин':(x.rated_speed_rpm?x.rated_speed_rpm+' об/мин':'—'),powerText=x=>x.power_kw===null||x.power_kw===undefined?'—':x.power_kw+' кВт';function opts(id,values,label){$(id).innerHTML='<option value="">'+label+'</option>'+values.filter(v=>v!==null&&v!==undefined&&v!=='').map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}function render(){const q=$('q').value.trim().toLowerCase(),series=$('series').value,rpm=$('rpm').value,slots=$('slots').value;const list=records.filter(x=>(!q||String(x.model??'').toLowerCase().includes(q)||String(x.manufacturer??'').toLowerCase().includes(q))&&(!series||x.series===series)&&(!rpm||String(x.speed_group_rpm)===rpm)&&(!slots||String(x.slot_count)===slots));$('count').textContent='Найдено: '+list.length+' из '+records.length;$('items').innerHTML=list.map(x=>'<div class="item"><b>'+esc(val(x.model))+'</b><div class="muted">'+esc(val(x.manufacturer))+' · '+esc(rpmText(x))+' · '+esc(val(x.slot_count))+' пазов</div><div class="line">'+esc(powerText(x))+' · N='+esc(val(x.source_n))+' · провод '+esc(val(x.wire))+(x.wire?' мм':'')+'</div><div class="line">Шаг: '+esc(val(x.pitch))+' · Di '+esc(val(x.bore_mm))+' мм · L '+esc(val(x.core_length_mm))+' мм</div><div class="line"><span class="badge '+(x.status==='REVIEW_REQUIRED'?'review':'')+'">'+esc(val(x.status))+'</span></div></div>').join('')||'<div class="muted">Записи не найдены.</div>'}async function load(){try{const r=await fetch('/reference/motor-reference.json',{cache:'no-store'}),j=await r.json();if(!r.ok||j.reference_only!==true||!Array.isArray(j.records))throw new Error();records=j.records.filter(x=>x.reference_only!==false);opts('series',[...new Set(records.map(x=>x.series))].sort(),'Все производители / серии');opts('rpm',[...new Set(records.map(x=>x.speed_group_rpm))].sort((a,b)=>(b||0)-(a||0)),'Все группы оборотов');opts('slots',[...new Set(records.map(x=>x.slot_count))].sort((a,b)=>(a||0)-(b||0)),'Все числа пазов');render()}catch(e){$('count').textContent='Статический справочник недоступен.';$('items').innerHTML='<div class="muted">Нет данных.</div>'}}['q','series','rpm','slots'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));load();</script></body></html>
