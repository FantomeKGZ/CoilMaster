<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Клиенты</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b;padding-bottom:80px}header{position:sticky;top:0;z-index:2;background:#142536;color:#fff;padding:15px}header a{color:#fff;text-decoration:none}main{padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}input,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.item{padding:12px 0;border-bottom:1px solid #e5ebf0}.item:last-child{border:0}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea;z-index:3}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px} .pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}.pager button{width:auto;margin:0}.pager span{min-width:120px;text-align:center}</style></head><body><header><a href="/mobile/repairs.html">← Ремонты</a><b style="float:right">👤 Клиенты</b></header><main><section class="card"><h2>Новый клиент</h2><form id="form"><input name="name" placeholder="Имя клиента" required><input name="phone" inputmode="tel" placeholder="Телефон" required><textarea name="comment" placeholder="Комментарий"></textarea><button>Сохранить клиента</button></form><p id="result" class="muted"></p></section><section class="card"><h2>Поиск</h2><input id="search" inputmode="tel" placeholder="Телефон или его часть"><button id="find">Найти</button></section><section class="card"><h2>Клиенты</h2><div id="items" class="muted">Загрузка…</div><div class="pager"><button id="prevPage" type="button" disabled>← Назад</button><span id="pageInfo" class="muted">Страница 1</span><button id="nextPage" type="button" disabled>Далее →</button></div></section></main><nav><a href="/mobile/"><b>🏠</b>Главная</a><a href="/mobile/repairs.html"><b>🧰</b>Ремонты</a><a href="/mobile/calculator.html"><b>🧮</b>Расчёт</a><a href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="/mobile/more.html"><b>☰</b>Ещё</a></nav><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id);function chooseClient(id){localStorage.setItem('cm-selected-client',String(id))}let currentCursor=0,nextCursor=0,hasMore=false,cursorHistory=[],currentPhone='',pageNumber=1;
function updatePager(count){$('prevPage').disabled=cursorHistory.length===0;$('nextPage').disabled=!hasMore;$('pageInfo').textContent='Страница '+pageNumber+' · '+count+' записей'}
async function load(phone=currentPhone,cursor=0,reset=false){if(reset){cursorHistory=[];pageNumber=1;currentPhone=phone;cursor=0}$('items').textContent='Загрузка…';try{const q=new URLSearchParams({limit:'20'});if(currentPhone)q.set('phone',currentPhone);if(cursor)q.set('cursor',String(cursor));const r=await fetch('/api/clients?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');currentCursor=cursor;hasMore=j.has_more===true;nextCursor=hasMore?Number(j.next_cursor):0;if(hasMore&&(!Number.isInteger(nextCursor)||nextCursor<=currentCursor))throw new Error('invalid_paging_cursor');const items=j.items||[];$('items').innerHTML='';items.forEach(c=>{const d=document.createElement('div');d.className='item';d.innerHTML='<b>'+c.name+'</b><div>'+c.phone+'</div><div class="muted">ID клиента: '+c.client_id+'</div><a data-id="'+c.client_id+'" href="/mobile/repairs.html?client_id='+c.client_id+'">Выбрать и открыть ремонты</a>';d.querySelector('a').onclick=()=>chooseClient(c.client_id);$('items').appendChild(d)});if(!items.length)$('items').textContent='Клиенты не найдены на этой странице.';updatePager(items.length)}catch(e){$('items').textContent=e.message;$('prevPage').disabled=true;$('nextPage').disabled=true}}
$('find').onclick=()=>load($('search').value.trim(),0,true);
$('prevPage').onclick=()=>{if(!cursorHistory.length)return;const cursor=cursorHistory.pop();pageNumber=Math.max(1,pageNumber-1);load(currentPhone,cursor,false)};
$('nextPage').onclick=()=>{if(!hasMore)return;cursorHistory.push(currentCursor);pageNumber+=1;load(currentPhone,nextCursor,false)};
$('form').onsubmit=async e=>{e.preventDefault();$('result').textContent='Сохранение…';try{const r=await fetch('/api/clients',{method:'POST',body:new FormData(e.target)}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');chooseClient(j.client_id);$('result').className='ok';$('result').textContent='Клиент создан и выбран. ID: '+j.client_id;e.target.reset();$('search').value='';load('',0,true)}catch(err){$('result').className='bad';$('result').textContent=err.message}};load('',0,true);</script></body></html>
