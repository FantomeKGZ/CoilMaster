name: Hall calibration runtime finalize

on:
  push:
    branches: [cmp-protocol-v1]
    paths:
      - '.github/workflows/hall-calibration-runtime-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cmp-protocol-v1
          fetch-depth: 0

      - name: Guard source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object firmware/arduino/src/main.cpp)" = '5061d627b5393033c5feca128c4ad4299199f66b'
          test "$(git hash-object firmware/esp32/src/CM_HardwareControlClient.h)" = '27f9b2f9d1c5520a345cd4deb43b16286d2be4d5'
          test "$(git hash-object firmware/esp32/src/CM_HardwareControlClient.cpp)" = '1d3d015418040955d6be5068834f7f670fe4b29d'
          test "$(git hash-object firmware/esp32/src/CM_UartEventReceiver.h)" = 'f9aa31372c08c04ccdb0c7b63275bf5f8941bd5c'
          test "$(git hash-object firmware/esp32/src/CM_UartEventReceiver.cpp)" = '986a3bf95e2e615af7c93ff233273c861683eee4'

      - name: Integrate Arduino calibration runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('firmware/arduino/src/main.cpp')
          t=p.read_text(encoding='utf-8')
          reps=[
            ('#include "../../../Arduino/CM_HallTelemetry.h"\n', '#include "../../../Arduino/CM_HallTelemetry.h"\n#include "../../../Arduino/CM_HallCalibrationService.h"\n'),
            ('CM::HallTelemetryService hallTelemetry(hall);\n', 'CM::HallTelemetryService hallTelemetry(hall);\nCM::HallCalibrationService hallCalibration(hall);\nCM::HallCalibrationResult lastHallCalibrationResult;\nbool hasHallCalibrationResult = false;\nCM::HallCalibrationState previousHallCalibrationState = CM::HallCalibrationState::Idle;\n'),
            ('bool simulationMode()\n{\n#if CM_FEATURE_SIMULATION\n    return true;\n#else\n    return false;\n#endif\n}\n', 'bool simulationMode()\n{\n#if CM_FEATURE_SIMULATION\n    return true;\n#else\n    return false;\n#endif\n}\n\nbool hallCalibrationEnvironmentSafe()\n{\n    return machine.state() == CM::MachineState::EnterCoilCount &&\n           !machine.job().isValid();\n}\n'),
            ('    const char key = keypad.getKey();\n    if (key == NO_KEY) return;\n    if (processEmergencyJobClearKey(key)) return;\n', '    const char key = keypad.getKey();\n    if (key == NO_KEY) return;\n    if (hallCalibration.active())\n    {\n        hallCalibration.abort();\n        ssr.forceOff();\n        Serial.println(F("CM_HALL_CAL abort=KEYPAD_INPUT"));\n        return;\n    }\n    if (processEmergencyJobClearKey(key)) return;\n'),
            ('void processExternalStart(uint32_t nowMs)\n{\n#if CM_FEATURE_EXTERNAL_START\n    if (startButton.pollPressed(nowMs))\n    {\n        CM::KeyEvent event;\n        event.action = CM::InputAction::StartOrResume;\n        input.handleEvent(event);\n    }\n#else\n    (void)nowMs;\n#endif\n}\n', 'void processExternalStart(uint32_t nowMs)\n{\n#if CM_FEATURE_EXTERNAL_START\n    if (startButton.pollPressed(nowMs))\n    {\n        if (hallCalibration.state() == CM::HallCalibrationState::ArmedWaitingPhysicalStart)\n        {\n            const bool started = hallCalibration.physicalStart(nowMs);\n            Serial.println(started ? F("CM_HALL_CAL physical_start=ACCEPTED")\n                                   : F("CM_HALL_CAL physical_start=BASELINE_NOT_READY"));\n            return;\n        }\n        if (hallCalibration.state() == CM::HallCalibrationState::Running)\n        {\n            hallCalibration.abort();\n            ssr.forceOff();\n            Serial.println(F("CM_HALL_CAL abort=PHYSICAL_START_PRESSED_AGAIN"));\n            return;\n        }\n        CM::KeyEvent event;\n        event.action = CM::InputAction::StartOrResume;\n        input.handleEvent(event);\n    }\n#else\n    (void)nowMs;\n#endif\n}\n'),
            ('    while (espTransport.takeRemoteJob(remoteJob))\n    {\n        const bool accepted = machine.loadRemoteJob(remoteJob);\n', '    while (espTransport.takeRemoteJob(remoteJob))\n    {\n        if (hallCalibration.active())\n        {\n            espTransport.sendJobResult(remoteJob.jobId, false, "BUSY_CALIBRATION");\n            continue;\n        }\n        const bool accepted = machine.loadRemoteJob(remoteJob);\n'),
            ('void processHardwareControlRequests(uint32_t nowMs)\n{\n', 'void processHallCalibrationCommands(uint32_t nowMs)\n{\n    CM::HallCalibrationCommand command;\n    while (espTransport.takeHallCalibrationCommand(command))\n    {\n        if (command == CM::HallCalibrationCommand::Arm)\n        {\n            if (!hallCalibrationEnvironmentSafe())\n            {\n                espTransport.sendHallCalibrationState(hallCalibration.state(),\n                                                      hallCalibration.baselineReady(),\n                                                      hallCalibration.motorPermit());\n                continue;\n            }\n            hallTelemetry.setEnabled(false, nowMs);\n            hallCalibration.reset();\n            hasHallCalibrationResult = false;\n            lastHallCalibrationResult = CM::HallCalibrationResult();\n            hallCalibration.arm(nowMs);\n            previousHallCalibrationState = hallCalibration.state();\n            espTransport.sendHallCalibrationState(hallCalibration.state(),\n                                                  hallCalibration.baselineReady(),\n                                                  hallCalibration.motorPermit());\n        }\n        else if (command == CM::HallCalibrationCommand::Abort)\n        {\n            hallCalibration.abort();\n            ssr.forceOff();\n            espTransport.sendHallCalibrationState(hallCalibration.state(),\n                                                  hallCalibration.baselineReady(),\n                                                  hallCalibration.motorPermit());\n        }\n        else if (command == CM::HallCalibrationCommand::Get)\n        {\n            espTransport.sendHallCalibrationState(hallCalibration.state(),\n                                                  hallCalibration.baselineReady(),\n                                                  hallCalibration.motorPermit());\n            if (hasHallCalibrationResult)\n                espTransport.sendHallCalibrationResult(lastHallCalibrationResult);\n        }\n    }\n}\n\nvoid processHardwareControlRequests(uint32_t nowMs)\n{\n'),
            ('    while (espTransport.takeHardwareControlRequest(request))\n    {\n        switch (request.type)\n', '    while (espTransport.takeHardwareControlRequest(request))\n    {\n        if (hallCalibration.active() &&\n            request.type != CM::HardwareControlRequestType::GetHallSettings &&\n            request.type != CM::HardwareControlRequestType::StopHallTelemetry)\n        {\n            espTransport.sendHardwareControlResult(CM::HardwareControlResult::Busy);\n            continue;\n        }\n        switch (request.type)\n'),
            ('    espTransport.update(nowMs);\n    processHardwareControlRequests(nowMs);\n', '    espTransport.update(nowMs);\n    processHallCalibrationCommands(nowMs);\n    processHardwareControlRequests(nowMs);\n'),
            ('void updateOutputs()\n{\n#if CM_FEATURE_SSR\n    ssr.update(machine.state(), simulationMode());\n#endif\n', 'void processHallCalibration(uint32_t nowMs)\n{\n    if (hallCalibration.active())\n    {\n        if (hallTelemetry.enabled()) hallTelemetry.setEnabled(false, nowMs);\n        hallCalibration.update(nowMs, hallCalibrationEnvironmentSafe());\n    }\n\n    CM::HallCalibrationResult result;\n    if (hallCalibration.takeResult(result))\n    {\n        lastHallCalibrationResult = result;\n        hasHallCalibrationResult = true;\n        espTransport.sendHallCalibrationResult(lastHallCalibrationResult);\n    }\n\n    if (hallCalibration.state() != previousHallCalibrationState)\n    {\n        previousHallCalibrationState = hallCalibration.state();\n        espTransport.sendHallCalibrationState(hallCalibration.state(),\n                                              hallCalibration.baselineReady(),\n                                              hallCalibration.motorPermit());\n    }\n\n    if (hallCalibration.state() == CM::HallCalibrationState::Completed ||\n        hallCalibration.state() == CM::HallCalibrationState::Aborted)\n        ssr.forceOff();\n}\n\nvoid updateOutputs()\n{\n#if CM_FEATURE_SSR\n    ssr.update(machine.state(), simulationMode(), hallCalibration.motorPermit());\n#endif\n'),
            ('    processUart(nowMs);\n    processHallTelemetry(nowMs);\n', '    processUart(nowMs);\n    processHallCalibration(nowMs);\n    processHallTelemetry(nowMs);\n'),
          ]
          for old,new in reps:
              c=t.count(old)
              if c != 1: raise SystemExit(f'main anchor count {c}: {old[:90]!r}')
              t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Integrate ESP32 calibration client
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          h=Path('firmware/esp32/src/CM_HardwareControlClient.h')
          t=h.read_text(encoding='utf-8')
          insert='''\nenum class HallCalibrationRemoteState : uint8_t\n{\n    Idle = 0U,\n    ArmedWaitingPhysicalStart,\n    Running,\n    Completed,\n    Aborted\n};\n\nstruct HallCalibrationRemoteStateSnapshot\n{\n    HallCalibrationRemoteState state;\n    bool baselineReady;\n    bool motorPermit;\n    bool valid;\n    uint32_t receivedAtMs;\n\n    HallCalibrationRemoteStateSnapshot();\n};\n\nstruct HallCalibrationRemoteResult\n{\n    bool recommendationValid;\n    uint16_t baselineAdc;\n    uint16_t minAdc;\n    uint16_t maxAdc;\n    uint16_t recommendedThreshold;\n    uint16_t recommendedHysteresis;\n    HallSignalDirectionRemote direction;\n    uint16_t sampleCount;\n    uint32_t durationMs;\n    bool valid;\n    uint32_t receivedAtMs;\n\n    HallCalibrationRemoteResult();\n};\n'''
          anchor='enum class HardwareControlReplyResult : uint8_t\n'
          if t.count(anchor)!=1: raise SystemExit('client h type anchor')
          t=t.replace(anchor,insert+'\n'+anchor,1)
          anchor='    bool setTelemetryEnabled(bool enabled);\n'
          repl=anchor+'    bool armHallCalibration();\n    bool abortHallCalibration();\n    bool requestHallCalibration();\n'
          if t.count(anchor)!=1: raise SystemExit('client h api anchor')
          t=t.replace(anchor,repl,1)
          anchor='    bool takeReply(HardwareControlReply& reply);\n'
          repl=anchor+'    bool takeHallCalibrationState(HallCalibrationRemoteStateSnapshot& state);\n    bool takeHallCalibrationResult(HallCalibrationRemoteResult& result);\n'
          if t.count(anchor)!=1: raise SystemExit('client h take anchor')
          t=t.replace(anchor,repl,1)
          anchor='        StopTelemetry\n'
          repl='        StopTelemetry,\n        ArmCalibration,\n        AbortCalibration,\n        GetCalibration\n'
          if t.count(anchor)!=1: raise SystemExit('client h enum anchor')
          t=t.replace(anchor,repl,1)
          anchor='    bool processTelemetryState(char* line, uint32_t nowMs);\n'
          repl=anchor+'    bool processCalibrationState(char* line, uint32_t nowMs);\n    bool processCalibrationResult(char* line, uint32_t nowMs);\n'
          if t.count(anchor)!=1: raise SystemExit('client h parser anchor')
          t=t.replace(anchor,repl,1)
          anchor='    bool m_hasTelemetry;\n'
          repl=anchor+'    HallCalibrationRemoteStateSnapshot m_calibrationState;\n    bool m_hasCalibrationState;\n    HallCalibrationRemoteResult m_calibrationResult;\n    bool m_hasCalibrationResult;\n'
          if t.count(anchor)!=1: raise SystemExit('client h members anchor')
          t=t.replace(anchor,repl,1)
          h.write_text(t,encoding='utf-8')

          c=Path('firmware/esp32/src/CM_HardwareControlClient.cpp')
          t=c.read_text(encoding='utf-8')
          anchor='HardwareControlReply::HardwareControlReply()\n'
          constructors='''HallCalibrationRemoteStateSnapshot::HallCalibrationRemoteStateSnapshot()\n    : state(HallCalibrationRemoteState::Idle), baselineReady(false),\n      motorPermit(false), valid(false), receivedAtMs(0UL)\n{\n}\n\nHallCalibrationRemoteResult::HallCalibrationRemoteResult()\n    : recommendationValid(false), baselineAdc(0U), minAdc(0U), maxAdc(0U),\n      recommendedThreshold(0U), recommendedHysteresis(0U),\n      direction(HallSignalDirectionRemote::Rising), sampleCount(0U),\n      durationMs(0UL), valid(false), receivedAtMs(0UL)\n{\n}\n\n'''
          if t.count(anchor)!=1: raise SystemExit('client cpp ctor anchor')
          t=t.replace(anchor,constructors+anchor,1)
          old='      m_settings(), m_hasSettings(false), m_telemetry(), m_hasTelemetry(false),\n      m_reply(), m_hasReply(false)\n'
          new='      m_settings(), m_hasSettings(false), m_telemetry(), m_hasTelemetry(false),\n      m_calibrationState(), m_hasCalibrationState(false),\n      m_calibrationResult(), m_hasCalibrationResult(false),\n      m_reply(), m_hasReply(false)\n'
          if t.count(old)!=1: raise SystemExit('client cpp init anchor')
          t=t.replace(old,new,1)
          old='    if (strncmp(line, "CMP1|HALL_STATE|", 16U) == 0)\n        return processTelemetryState(line, nowMs);\n\n    return false;\n'
          new='    if (strncmp(line, "CMP1|HALL_STATE|", 16U) == 0)\n        return processTelemetryState(line, nowMs);\n    if (strncmp(line, "CMP1|CAL_STATE|", 15U) == 0)\n        return processCalibrationState(line, nowMs);\n    if (strncmp(line, "CMP1|CAL_RESULT|", 16U) == 0)\n        return processCalibrationResult(line, nowMs);\n\n    return false;\n'
          if t.count(old)!=1: raise SystemExit('client cpp processLine anchor')
          t=t.replace(old,new,1)
          anchor='bool HardwareControlClient::requestPending() const\n'
          methods='''bool HardwareControlClient::armHallCalibration()\n{\n    return queueRequest(RequestType::ArmCalibration, "CMP1|CAL|ARM|C");\n}\n\nbool HardwareControlClient::abortHallCalibration()\n{\n    return queueRequest(RequestType::AbortCalibration, "CMP1|CAL|ABORT|C");\n}\n\nbool HardwareControlClient::requestHallCalibration()\n{\n    return queueRequest(RequestType::GetCalibration, "CMP1|CAL|GET|C");\n}\n\n'''
          if t.count(anchor)!=1: raise SystemExit('client cpp request anchor')
          t=t.replace(anchor,methods+anchor,1)
          anchor='bool HardwareControlClient::takeReply(HardwareControlReply& reply)\n'
          takes='''bool HardwareControlClient::takeHallCalibrationState(\n    HallCalibrationRemoteStateSnapshot& state)\n{\n    if (!m_hasCalibrationState) return false;\n    state = m_calibrationState;\n    m_hasCalibrationState = false;\n    return true;\n}\n\nbool HardwareControlClient::takeHallCalibrationResult(\n    HallCalibrationRemoteResult& result)\n{\n    if (!m_hasCalibrationResult) return false;\n    result = m_calibrationResult;\n    m_hasCalibrationResult = false;\n    return true;\n}\n\n'''
          if t.count(anchor)!=1: raise SystemExit('client cpp take anchor')
          t=t.replace(anchor,takes+anchor,1)
          anchor='void HardwareControlClient::finishRequest(HardwareControlReplyResult result)\n'
          parsers=r'''bool HardwareControlClient::processCalibrationState(char* line, uint32_t nowMs)\n{\n    if (!validateAndStripCrc(line)) return true;\n    char* save = nullptr;\n    char* version = strtok_r(line, "|", &save);\n    char* category = strtok_r(nullptr, "|", &save);\n    char* stateText = strtok_r(nullptr, "|", &save);\n    char* baselineText = strtok_r(nullptr, "|", &save);\n    char* permitText = strtok_r(nullptr, "|", &save);\n    char* capability = strtok_r(nullptr, "|", &save);\n    char* extra = strtok_r(nullptr, "|", &save);\n    if (version == nullptr || category == nullptr || stateText == nullptr ||\n        baselineText == nullptr || permitText == nullptr || capability == nullptr ||\n        extra != nullptr || strcmp(version, "CMP1") != 0 ||\n        strcmp(category, "CAL_STATE") != 0 || strcmp(capability, "C") != 0)\n        return true;\n\n    HallCalibrationRemoteStateSnapshot parsed;\n    if (strcmp(stateText, "IDLE") == 0) parsed.state = HallCalibrationRemoteState::Idle;\n    else if (strcmp(stateText, "ARMED_WAITING_START") == 0) parsed.state = HallCalibrationRemoteState::ArmedWaitingPhysicalStart;\n    else if (strcmp(stateText, "RUNNING") == 0) parsed.state = HallCalibrationRemoteState::Running;\n    else if (strcmp(stateText, "COMPLETED") == 0) parsed.state = HallCalibrationRemoteState::Completed;\n    else if (strcmp(stateText, "ABORTED") == 0) parsed.state = HallCalibrationRemoteState::Aborted;\n    else return true;\n\n    if (strcmp(baselineText, "0") == 0) parsed.baselineReady = false;\n    else if (strcmp(baselineText, "1") == 0) parsed.baselineReady = true;\n    else return true;\n    if (strcmp(permitText, "0") == 0) parsed.motorPermit = false;\n    else if (strcmp(permitText, "1") == 0) parsed.motorPermit = true;\n    else return true;\n\n    parsed.valid = true;\n    parsed.receivedAtMs = nowMs;\n    m_calibrationState = parsed;\n    m_hasCalibrationState = true;\n\n    if (m_requestType == RequestType::ArmCalibration ||\n        m_requestType == RequestType::AbortCalibration ||\n        m_requestType == RequestType::GetCalibration)\n    {\n        m_requestType = RequestType::None;\n        m_requestPayload[0] = '\\0';\n        m_waitingReply = false;\n        m_lastSendMs = 0UL;\n        m_sendAttempts = 0U;\n    }\n    return true;\n}\n\nbool HardwareControlClient::processCalibrationResult(char* line, uint32_t nowMs)\n{\n    if (!validateAndStripCrc(line)) return true;\n    char* save = nullptr;\n    char* version = strtok_r(line, "|", &save);\n    char* category = strtok_r(nullptr, "|", &save);\n    char* validityText = strtok_r(nullptr, "|", &save);\n    char* baselineText = strtok_r(nullptr, "|", &save);\n    char* minText = strtok_r(nullptr, "|", &save);\n    char* maxText = strtok_r(nullptr, "|", &save);\n    char* thresholdText = strtok_r(nullptr, "|", &save);\n    char* hysteresisText = strtok_r(nullptr, "|", &save);\n    char* directionText = strtok_r(nullptr, "|", &save);\n    char* samplesText = strtok_r(nullptr, "|", &save);\n    char* durationText = strtok_r(nullptr, "|", &save);\n    char* capability = strtok_r(nullptr, "|", &save);\n    char* extra = strtok_r(nullptr, "|", &save);\n    if (version == nullptr || category == nullptr || validityText == nullptr ||\n        baselineText == nullptr || minText == nullptr || maxText == nullptr ||\n        thresholdText == nullptr || hysteresisText == nullptr || directionText == nullptr ||\n        samplesText == nullptr || durationText == nullptr || capability == nullptr ||\n        extra != nullptr || strcmp(version, "CMP1") != 0 ||\n        strcmp(category, "CAL_RESULT") != 0 || strcmp(capability, "C") != 0)\n        return true;\n\n    HallCalibrationRemoteResult parsed;\n    if (strcmp(validityText, "VALID") == 0) parsed.recommendationValid = true;\n    else if (strcmp(validityText, "INVALID") == 0) parsed.recommendationValid = false;\n    else return true;\n    if (!parseDecimal16(baselineText, parsed.baselineAdc) ||\n        !parseDecimal16(minText, parsed.minAdc) || !parseDecimal16(maxText, parsed.maxAdc) ||\n        !parseDecimal16(thresholdText, parsed.recommendedThreshold) ||\n        !parseDecimal16(hysteresisText, parsed.recommendedHysteresis) ||\n        !parseDecimal16(samplesText, parsed.sampleCount) ||\n        !parseDecimal32(durationText, parsed.durationMs)) return true;\n    if (strcmp(directionText, "RISING") == 0) parsed.direction = HallSignalDirectionRemote::Rising;\n    else if (strcmp(directionText, "FALLING") == 0) parsed.direction = HallSignalDirectionRemote::Falling;\n    else return true;\n    parsed.valid = true;\n    parsed.receivedAtMs = nowMs;\n    m_calibrationResult = parsed;\n    m_hasCalibrationResult = true;\n    return true;\n}\n\n'''
          # Convert raw text escapes written for C++ newlines.
          parsers=parsers.replace('\\n','\n').replace('\\"','"')
          if t.count(anchor)!=1: raise SystemExit('client cpp parser insert anchor')
          t=t.replace(anchor,parsers+anchor,1)
          c.write_text(t,encoding='utf-8')
          PY

      - name: Expose calibration through ESP32 UART receiver
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          h=Path('firmware/esp32/src/CM_UartEventReceiver.h')
          t=h.read_text(encoding='utf-8')
          anchor='    bool takeHardwareControlReply(HardwareControlReply& reply);\n'
          repl=anchor+'    bool armHallCalibration();\n    bool abortHallCalibration();\n    bool requestHallCalibration();\n    bool takeHallCalibrationState(HallCalibrationRemoteStateSnapshot& state);\n    bool takeHallCalibrationResult(HallCalibrationRemoteResult& result);\n'
          if t.count(anchor)!=1: raise SystemExit('receiver h anchor')
          t=t.replace(anchor,repl,1)
          h.write_text(t,encoding='utf-8')

          c=Path('firmware/esp32/src/CM_UartEventReceiver.cpp')
          t=c.read_text(encoding='utf-8')
          anchor='void UartEventReceiver::rememberJobId(uint32_t jobId)\n'
          methods='''bool UartEventReceiver::armHallCalibration()\n{\n    return !controlLaneBusy() && m_hardwareControl.armHallCalibration();\n}\n\nbool UartEventReceiver::abortHallCalibration()\n{\n    return !controlLaneBusy() && m_hardwareControl.abortHallCalibration();\n}\n\nbool UartEventReceiver::requestHallCalibration()\n{\n    return !controlLaneBusy() && m_hardwareControl.requestHallCalibration();\n}\n\nbool UartEventReceiver::takeHallCalibrationState(\n    HallCalibrationRemoteStateSnapshot& state)\n{\n    return m_hardwareControl.takeHallCalibrationState(state);\n}\n\nbool UartEventReceiver::takeHallCalibrationResult(\n    HallCalibrationRemoteResult& result)\n{\n    return m_hardwareControl.takeHallCalibrationResult(result);\n}\n\n'''
          if t.count(anchor)!=1: raise SystemExit('receiver cpp anchor')
          t=t.replace(anchor,methods+anchor,1)
          c.write_text(t,encoding='utf-8')
          PY

      - name: Commit runtime integration locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/arduino/src/main.cpp firmware/esp32/src/CM_HardwareControlClient.h firmware/esp32/src/CM_HardwareControlClient.cpp firmware/esp32/src/CM_UartEventReceiver.h firmware/esp32/src/CM_UartEventReceiver.cpp
          git commit -m 'feat: integrate physical-start Hall calibration runtime'

      - name: Install PlatformIO
        run: pip install platformio
      - name: Build Arduino Uno
        run: pio run -e uno
      - name: Build ESP32
        run: pio run -e esp32

      - name: Finalize and remove stale verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hall-calibration-foundation-finalize.yml
          rm .github/workflows/hall-calibration-runtime-finalize.yml
          git add -A
          git commit -m 'chore: finalize verified Hall calibration runtime'
          git pull --rebase origin cmp-protocol-v1
          git push origin HEAD:cmp-protocol-v1
