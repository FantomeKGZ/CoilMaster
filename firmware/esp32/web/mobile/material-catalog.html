<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Каталог материалов</title><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17212b}main{padding:12px;max-width:760px;margin:auto}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}input,select,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:10px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.item{padding:14px 0;border-bottom:1px solid #e4eaf0}.muted{color:#687580}.ok{color:#18864b}.bad{color:#b42318}a{color:#1769aa;text-decoration:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body><main><p><a href="/mobile/more.html">← Ещё</a></p><h1>Каталог материалов</h1><section class="card"><h2>Новый материал</h2><form id="create"><input name="name" placeholder="Название" required><select name="unit"><option value="PIECE">Штуки</option><option value="GRAM">Граммы</option><option value="MILLILITRE">Миллилитры</option><option value="METRE">Метры</option><option value="SQUARE_METRE">Квадратные метры</option></select><div class="row"><input name="stock" inputmode="decimal" placeholder="Начальный остаток" required><input name="price" inputmode="decimal" placeholder="Цена за единицу, сом" required></div><textarea name="comment" placeholder="Комментарий"></textarea><button>Добавить материал</button></form><p id="createResult" class="muted"></p></section><section class="card"><h2>Материалы</h2><div id="items" class="muted">Загрузка…</div></section></main><script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id),num=v=>Number(String(v).replace(',','.')),units={PIECE:'шт',GRAM:'г',MILLILITRE:'мл',METRE:'м',SQUARE_METRE:'м²'},qty=v=>(v/1000).toLocaleString('ru-RU',{maximumFractionDigits:3}),money=v=>(v/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});async function load(){const r=await fetch('/api/materials',{cache:'no-store'}),j=await r.json();$('items').innerHTML='';j.items.forEach(x=>{const d=document.createElement('div');d.className='item';d.innerHTML='<b>'+x.name+'</b><div class="muted">Остаток: '+qty(x.stock_quantity_milli)+' '+units[x.unit]+' · Цена: '+money(x.price_per_unit_minor)+' '+x.currency+'</div><div class="row"><input class="add" inputmode="decimal" placeholder="Пополнение"><input class="price" inputmode="decimal" placeholder="Новая цена"></div><button>Сохранить изменения</button><p class="msg muted"></p>';d.querySelector('button').onclick=async()=>{const add=num(d.querySelector('.add').value||0),price=num(d.querySelector('.price').value||0),body=new URLSearchParams({material_id:x.material_id,add_quantity_milli:String(Math.round(add*1000)),new_price_per_unit_minor:String(Math.round(price*100)),currency:x.currency||'KGS'});const rr=await fetch('/api/materials/adjust',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),jj=await rr.json();d.querySelector('.msg').className=rr.ok?'ok':'bad';d.querySelector('.msg').textContent=rr.ok?'Изменения сохранены.':jj.error||'Ошибка';if(rr.ok)load()};$('items').appendChild(d)});if(!j.items.length)$('items').textContent='Материалов пока нет.'}$('create').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),stock=num(f.get('stock')),price=num(f.get('price'));f.delete('stock');f.delete('price');f.set('stock_quantity_milli',String(Math.round(stock*1000)));f.set('price_per_unit_minor',String(Math.round(price*100)));f.set('currency','KGS');const r=await fetch('/api/materials',{method:'POST',body:f}),j=await r.json();$('createResult').className=r.ok?'ok':'bad';$('createResult').textContent=r.ok?'Материал №'+j.material_id+' добавлен.':j.error||'Ошибка';if(r.ok){e.target.reset();load()}};load();</script></body></html>
