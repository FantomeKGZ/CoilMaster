<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Склад — CoilMaster</title>
<style>:root{--bg:#eef2f6;--card:#fff;--text:#17212b;--muted:#687580;--blue:#1769aa;--green:#18864b;--warn:#b86d00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text);padding-bottom:78px}header{position:sticky;top:0;background:#142536;color:#fff;padding:14px 16px}main{padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #17212b14}.metric strong{display:block;font-size:23px;margin-top:6px}.muted{color:var(--muted)}.wire{display:grid;grid-template-columns:1fr auto;gap:8px;padding:13px 0;border-bottom:1px solid #edf1f4}.wire:last-child{border:0}.wire b{font-size:20px}.right{text-align:right}.empty{padding:16px;border-radius:10px;background:#f3f7fa}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe3ea}nav a{padding:10px 3px;text-align:center;text-decoration:none;color:#45515c;font-size:12px}nav a b{display:block;font-size:20px}nav a.active{color:var(--blue);font-weight:bold}</style></head>
<body><header><b>📦 Склад провода</b></header><main>
<div class="grid"><section class="card metric"><span class="muted">Общий остаток</span><strong id="remaining">—</strong></section><section class="card metric"><span class="muted">Диаметров</span><strong id="diameters">—</strong></section><section class="card metric"><span class="muted">За месяц</span><strong id="monthUse">—</strong></section><section class="card metric"><span class="muted">За всё время</span><strong id="allUse">—</strong></section></div>
<section class="card"><h2>Остатки по диаметрам</h2><div id="list" class="empty">Загрузка…</div></section>
<section class="card"><b>Учёт по бухтам</b><p class="muted">Остаток равен сумме веса всех активных бухт. Фактический расход подтверждается повторным взвешиванием.</p></section>
</main><nav><a href="/mobile/"><b>⚙️</b>Намотка</a><a href="#"><b>🏠</b>Главная</a><a href="#"><b>🔎</b>Поиск</a><a class="active" href="/mobile/warehouse.html"><b>📦</b>Склад</a><a href="#"><b>☰</b>Ещё</a></nav>
<script>localStorage.setItem('cm-ui-version','mobile');const $=id=>document.getElementById(id);const kg=g=>(g/1000).toLocaleString('ru-RU',{minimumFractionDigits:3,maximumFractionDigits:3})+' кг';const diameter=v=>(v/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' мм';async function load(){const d=new Date(),month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');try{const r=await fetch('/api/warehouse/summary?month='+month,{cache:'no-store'}),s=await r.json();if(!r.ok)throw new Error(s.error);$('remaining').textContent=kg(s.total_remaining_g);$('diameters').textContent=s.diameter_count;$('monthUse').textContent=kg(s.total_consumed_month_g);$('allUse').textContent=kg(s.total_consumed_all_time_g);$('list').className='';$('list').innerHTML=s.items.length?s.items.map(x=>`<div class="wire"><div><b>${diameter(x.diameter_hundredths_mm)}</b><div class="muted">Бухт: ${x.active_spools}</div></div><div class="right"><b>${kg(x.remaining_g)}</b><div class="muted">За месяц: ${kg(x.consumed_month_g)}</div></div></div>`).join(''):'Пока нет данных о бухтах.';}catch(e){$('list').textContent='Склад недоступен: '+e.message;}}load();</script></body></html>
