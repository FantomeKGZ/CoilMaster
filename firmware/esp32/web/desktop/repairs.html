<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ремонты</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:22px}.grid{display:grid;grid-template-columns:430px 1fr;gap:14px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px}input,select,button,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.secondary{background:#5b6874}.item{padding:14px 0;border-bottom:1px solid #e4eaf0}.muted{color:#687580}.links a{display:inline-block;margin:7px 12px 0 0}.note{background:#f3f7fa;padding:11px;border-radius:9px;margin-top:10px}.catalog-link{display:inline-block;margin-top:10px}@media(max-width:900px){.layout{display:block}aside{display:none}.grid{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/clients.html">Клиенты</a><a href="/desktop/motors.html">Двигатели</a><a href="/desktop/costing.html">Калькуляция</a></aside><main><h1>Ремонты</h1><div class="grid"><div><section class="card"><h2>Новый ремонт</h2><form id="form"><label>Клиент</label><select id="clientId" name="client_id" required><option value="">Загрузка клиентов…</option></select><a class="catalog-link" href="/desktop/clients.html">Открыть каталог клиентов</a><label>Двигатель</label><select id="motorId" name="motor_id" required><option value="">Загрузка двигателей…</option></select><a class="catalog-link" href="/desktop/motors.html">Открыть каталог двигателей</a><input id="received" name="received_at" type="datetime-local" required><textarea name="complaint" placeholder="Жалоба клиента"></textarea><textarea name="comment" placeholder="Комментарий"></textarea><button>Создать ремонт</button></form><p id="result" class="muted"></p></section><section class="card"><h2>Добавить клиента</h2><form id="clientForm"><input name="name" placeholder="Имя клиента" required><input name="phone" placeholder="Телефон" required><textarea name="comment" placeholder="Комментарий"></textarea><button class="secondary">Добавить клиента</button></form><div id="clientResult" class="note muted">После добавления клиент автоматически выбирается.</div></section><section class="card"><h2>Добавить двигатель</h2><form id="motorForm"><input name="name" placeholder="Название двигателя" required><input name="coil_program" placeholder="Программа витков, например 140/100/80/40" required><input name="manufacturer" placeholder="Производитель"><input name="model" placeholder="Модель"><input name="tags" placeholder="Теги через запятую"><textarea name="comment" placeholder="Комментарий"></textarea><button class="secondary">Добавить в каталог</button></form><div id="motorResult" class="note muted">После добавления двигатель автоматически выбирается.</div></section></div><section class="card"><h2>Список ремонтов</h2><div id="items" class="muted">Загрузка…</div></section></div></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),requestedClient=params.get('client_id')||localStorage.getItem('cm-selected-client')||'',requestedMotor=params.get('motor_id')||localStorage.getItem('cm-selected-motor')||'';$('received').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);let clients=[],motors=[];function selectRepair(id){localStorage.setItem('cm-active-repair',String(id))}function clientLabel(x){return(x.name||'Клиент')+' · '+(x.phone||'без телефона')}function motorLabel(x){return(x.name||'Двигатель')+(x.model?' · '+x.model:'')+(x.manufacturer?' · '+x.manufacturer:'')+' · '+(x.coil_program||'без программы')}async function loadClients(selected){try{const r=await fetch('/api/clients',{cache:'no-store'}),j=await r.json();clients=j.items||[];$('clientId').innerHTML='<option value="">Выберите клиента</option>';clients.forEach(x=>{const o=document.createElement('option');o.value=x.client_id;o.textContent=clientLabel(x);$('clientId').appendChild(o)});const chosen=selected||requestedClient;if(chosen&&clients.some(x=>String(x.client_id)===String(chosen))){$('clientId').value=String(chosen);localStorage.setItem('cm-selected-client',String(chosen))}if(!clients.length)$('clientId').innerHTML='<option value="">Сначала добавьте клиента</option>'}catch(e){$('clientId').innerHTML='<option value="">Каталог клиентов недоступен</option>'}}async function loadMotors(selected){try{const r=await fetch('/api/motors',{cache:'no-store'}),j=await r.json();motors=j.items||[];$('motorId').innerHTML='<option value="">Выберите двигатель</option>';motors.forEach(x=>{const o=document.createElement('option');o.value=x.motor_id;o.textContent=motorLabel(x);$('motorId').appendChild(o)});const chosen=selected||requestedMotor;if(chosen&&motors.some(x=>String(x.motor_id)===String(chosen))){$('motorId').value=String(chosen);localStorage.setItem('cm-selected-motor',String(chosen))}if(!motors.length)$('motorId').innerHTML='<option value="">Сначала добавьте двигатель</option>'}catch(e){$('motorId').innerHTML='<option value="">Каталог двигателей недоступен</option>'}}$('clientId').onchange=()=>{$('clientId').value?localStorage.setItem('cm-selected-client',$('clientId').value):localStorage.removeItem('cm-selected-client')};$('motorId').onchange=()=>{$('motorId').value?localStorage.setItem('cm-selected-motor',$('motorId').value):localStorage.removeItem('cm-selected-motor')};async function load(){const q=params.get('client_id')?'?client_id='+encodeURIComponent(params.get('client_id')):'';const r=await fetch('/api/repairs'+q,{cache:'no-store'}),j=await r.json();$('items').innerHTML='';(j.items||[]).forEach(x=>{const motor=motors.find(m=>Number(m.motor_id)===Number(x.motor_id)),client=clients.find(c=>Number(c.client_id)===Number(x.client_id)),d=document.createElement('div');d.className='item';d.innerHTML='<b>№'+x.repair_id+' — '+(motor?motorLabel(motor):'Двигатель ID '+x.motor_id)+'</b><div>'+(client?clientLabel(client):'Клиент ID '+x.client_id)+'</div><div class="muted">'+x.status+' · '+x.received_at+'</div><div class="links"><a data-id="'+x.repair_id+'" href="/desktop/costing.html?repair_id='+x.repair_id+'">Калькуляция</a><a data-id="'+x.repair_id+'" href="/desktop/writeoff.html?repair_id='+x.repair_id+'">Списание провода</a><a data-id="'+x.repair_id+'" href="/desktop/winding-history.html?repair_id='+x.repair_id+'">История намотки</a></div>';d.querySelectorAll('a[data-id]').forEach(a=>a.onclick=()=>selectRepair(a.dataset.id));$('items').appendChild(d)});if(!(j.items||[]).length)$('items').textContent='Ремонтов пока нет.'}$('clientForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/clients',{method:'POST',body:new FormData(e.target)}),j=await r.json();if(r.ok){$('clientResult').textContent='Клиент добавлен, ID '+j.client_id;localStorage.setItem('cm-selected-client',String(j.client_id));await loadClients(j.client_id);e.target.reset()}else $('clientResult').textContent=j.error||'Ошибка добавления клиента'};$('motorForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/motors',{method:'POST',body:new FormData(e.target)}),j=await r.json();if(r.ok){$('motorResult').textContent='Двигатель добавлен, ID '+j.motor_id;localStorage.setItem('cm-selected-motor',String(j.motor_id));await loadMotors(j.motor_id);e.target.reset()}else $('motorResult').textContent=j.error||'Ошибка добавления двигателя'};$('form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);fd.set('received_at',new Date($('received').value).toISOString());const r=await fetch('/api/repairs',{method:'POST',body:fd}),j=await r.json();if(r.ok){selectRepair(j.repair_id);localStorage.setItem('cm-selected-client',String(j.client_id));localStorage.setItem('cm-selected-motor',String(j.motor_id));location.href='/desktop/costing.html?repair_id='+j.repair_id}else $('result').textContent=j.error||'Ошибка'};(async()=>{await loadClients();await loadMotors();await load()})();</script></body></html>
