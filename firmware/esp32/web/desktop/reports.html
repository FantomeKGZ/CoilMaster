<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отчёт по ремонтам</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:11px 0}main{padding:22px;max-width:1400px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.metric{background:#fff;border-radius:14px;padding:18px}.metric span{display:block;color:#687580}.metric b{display:block;font-size:24px;margin-top:8px}.controls{display:flex;gap:12px;align-items:end}.controls label{flex:1}.controls button{max-width:180px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.muted{color:#687580}.ok{background:#e8f7ee;border:1px solid #82c99f;padding:10px;border-radius:9px}.warning{background:#fff4d6;border:1px solid #e0bc55;padding:10px;border-radius:9px}.bad{color:#b42318}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf1f4}th{color:#687580}.num{text-align:right}.links a{margin-right:10px;color:#1769aa;font-weight:bold;text-decoration:none}@media(max-width:1000px){.layout{display:block}aside{display:none}.grid{grid-template-columns:repeat(2,1fr)}.controls{display:block}table{display:block;overflow:auto}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/clients.html">Клиенты</a><a href="/desktop/motors.html">Двигатели</a><a href="/desktop/warehouse.html">Склад</a><a href="/desktop/costing.html">Калькуляция</a><a href="/desktop/reports.html">📈 Отчёты</a></aside><main><h1>Отчёт по закрытым ремонтам</h1><section class="card"><div class="controls"><label>Месяц закрытия<input id="month" type="month"></label><button id="load">Обновить</button></div><p id="state" class="muted">Загрузка…</p><div id="trust" class="warning">Итог ещё не подтверждён.</div></section><div class="grid"><div class="metric"><span>Закрыто</span><b id="count">—</b></div><div class="metric"><span>Выручка</span><b id="revenue">—</b></div><div class="metric"><span>Себестоимость</span><b id="cost">—</b></div><div class="metric"><span>Маржа</span><b id="margin">—</b></div><div class="metric"><span>Убыток</span><b id="loss">—</b></div></div><section class="card" style="margin-top:14px"><h2>Ремонты</h2><div id="items" class="muted">Загрузка…</div></section></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id),money=v=>(Number(v)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' сом',dateLabel=v=>{if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('ru-RU')},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=new Date(),defaultMonth=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');$('month').value=localStorage.getItem('cm-report-month')||defaultMonth;function safeMinor(v){const n=Number(v);return Number.isSafeInteger(n)&&n>=0?n:null}function addSafe(a,b){if(a===null||b===null||!Number.isSafeInteger(a+b))return null;return a+b}async function load(){const month=$('month').value;if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)){$('state').className='bad';$('state').textContent='Выберите корректный месяц.';return}localStorage.setItem('cm-report-month',month);$('state').className='muted';$('state').textContent='Загрузка реестров…';$('items').textContent='Загрузка…';$('count').textContent='—';$('revenue').textContent=$('cost').textContent=$('margin').textContent=$('loss').textContent='—';$('trust').className='warning';$('trust').textContent='Итог ещё не подтверждён.';try{const [rr,cr,mr]=await Promise.all([fetch('/api/repairs',{cache:'no-store'}),fetch('/api/clients',{cache:'no-store'}),fetch('/api/motors',{cache:'no-store'})]),[rj,cj,mj]=await Promise.all([rr.json(),cr.json(),mr.json()]);if(!rr.ok||!cr.ok||!mr.ok)throw new Error((!rr.ok&&rj.error)||(!cr.ok&&cj.error)||(!mr.ok&&mj.error)||'registry_unavailable');const clients=cj.items||[],motors=mj.items||[],repairs=(rj.items||[]).filter(x=>(x.current_status||x.status)==='CLOSED'&&String(x.closed_at||'').startsWith(month));$('count').textContent=repairs.length;let revenue=0,cost=0,margin=0,loss=0,trusted=true,rows=[];for(let i=0;i<repairs.length;i++){const repair=repairs[i];$('state').textContent='Проверка калькуляций: '+(i+1)+' / '+repairs.length;let costing=null,error='';try{const r=await fetch('/api/repairs/costing?repair_id='+encodeURIComponent(repair.repair_id),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'costing_read_failed');costing=j}catch(e){trusted=false;error=e.message||'costing_read_failed'}const client=clients.find(x=>Number(x.client_id)===Number(repair.client_id)),motor=motors.find(x=>Number(x.motor_id)===Number(repair.motor_id));if(costing){const r=safeMinor(costing.client_price_minor),c=safeMinor(costing.total_cost_minor),m=safeMinor(costing.margin_minor),l=safeMinor(costing.loss_minor);if(r===null||c===null||m===null||l===null){trusted=false;error='unsafe_money_value'}else{revenue=addSafe(revenue,r);cost=addSafe(cost,c);margin=addSafe(margin,m);loss=addSafe(loss,l);if(revenue===null||cost===null||margin===null||loss===null){trusted=false;error='aggregate_overflow'}}}rows.push('<tr><td><b>№'+esc(repair.repair_id)+'</b><div class="muted">'+esc(dateLabel(repair.closed_at))+'</div></td><td>'+esc(client?.name||('ID '+repair.client_id))+(client?.phone?'<div class="muted">'+esc(client.phone)+'</div>':'')+'</td><td>'+esc(motor?.name||('ID '+repair.motor_id))+(motor?.model?'<div class="muted">'+esc(motor.model)+'</div>':'')+'</td>'+(costing&&!error?'<td class="num">'+money(costing.total_cost_minor)+'</td><td class="num">'+money(costing.client_price_minor)+'</td><td class="num">'+money(costing.margin_minor)+'</td><td class="num">'+money(costing.loss_minor)+'</td>':'<td colspan="4" class="bad">Итог не подтверждён: '+esc(error||'unknown')+'</td>')+'<td class="links"><a href="/desktop/costing.html?repair_id='+encodeURIComponent(repair.repair_id)+'">Итог</a><a href="/desktop/winding-history.html?repair_id='+encodeURIComponent(repair.repair_id)+'">Намотка</a></td></tr>')}if(rows.length)$('items').innerHTML='<table><thead><tr><th>Ремонт</th><th>Клиент</th><th>Двигатель</th><th class="num">Себестоимость</th><th class="num">Цена</th><th class="num">Маржа</th><th class="num">Убыток</th><th>Действия</th></tr></thead><tbody>'+rows.join('')+'</tbody></table>';else $('items').textContent='В выбранном месяце закрытых ремонтов нет.';if(trusted&&revenue!==null&&cost!==null&&margin!==null&&loss!==null){$('revenue').textContent=money(revenue);$('cost').textContent=money(cost);$('margin').textContent=money(margin);$('loss').textContent=money(loss);$('trust').className='ok';$('trust').textContent='Финансовый итог подтверждён: все закрытые ремонты выборки успешно прочитаны сервером.';$('state').className='muted';$('state').textContent='Отчёт загружен полностью.'}else{$('revenue').textContent=$('cost').textContent=$('margin').textContent=$('loss').textContent='не подтверждено';$('trust').className='warning';$('trust').textContent='Общий финансовый итог не показан: хотя бы один ремонт не прошёл полную проверку калькуляции.';$('state').className='bad';$('state').textContent='Отчёт загружен не полностью.'}}catch(e){$('state').className='bad';$('state').textContent='Отчёт недоступен: '+(e.message||'unknown');$('items').textContent='Нет подтверждённых данных.'}}$('load').onclick=load;$('month').onchange=load;load();</script></body></html>
