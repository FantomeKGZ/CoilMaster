<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Клиенты — CoilMaster</title><style>body{margin:0;background:#edf2f6;font-family:Arial;color:#17212b}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#142536;color:#fff;padding:22px 14px}aside a{display:block;color:#d9e5ee;text-decoration:none;padding:12px 14px;border-radius:9px}main{padding:22px;max-width:1100px}.card{background:#fff;border-radius:14px;padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.action{display:inline-block;padding:11px 15px;border-radius:9px;text-decoration:none;background:#1769aa;color:#fff;font-weight:bold}.secondary{background:#e7eef5;color:#17324b}input,button{box-sizing:border-box;padding:12px;border:1px solid #cbd5df;border-radius:9px;font-size:16px}input{width:min(440px,100%)}button{background:#1769aa;color:#fff;border:0;font-weight:bold}.search-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #e4eaf0}.item:last-child{border:0}.muted{color:#687580}.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}.pager button{width:auto}.pager span{min-width:140px;text-align:center}@media(max-width:850px){.layout{display:block}aside{display:none}.item{grid-template-columns:1fr}.search-row>*{width:100%}}</style></head><body><div class="layout"><aside><h2>CoilMaster</h2><a href="/desktop/">Главная</a><a href="/desktop/repairs.html">Ремонты</a><a href="/desktop/clients.html">Клиенты</a><a href="/desktop/motors.html">Двигатели</a><a href="/desktop/costing.html">Калькуляция</a></aside><main><div class="toolbar"><a class="action" href="/desktop/client-new.html">+ Новый клиент</a><a class="action secondary" href="/desktop/repairs.html">Ремонты</a></div><h1>Клиенты</h1><section class="card"><div class="search-row"><input id="search" placeholder="Поиск по телефону"><button id="find" type="button">Найти</button></div><div id="items" class="muted">Загрузка…</div><div class="pager"><button id="prevPage" type="button" disabled>← Назад</button><span id="pageInfo" class="muted">Страница 1</span><button id="nextPage" type="button" disabled>Далее →</button></div></section></main></div><script>localStorage.setItem('cm-ui-version','desktop');const $=id=>document.getElementById(id);let currentCursor=0,nextCursor=0,hasMore=false,cursorHistory=[],currentPhone='',pageNumber=1;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function chooseClient(id){localStorage.setItem('cm-selected-client',String(id))}function updatePager(count){$('prevPage').disabled=cursorHistory.length===0;$('nextPage').disabled=!hasMore;$('pageInfo').textContent='Страница '+pageNumber+' · '+count+' записей'}async function load(phone=currentPhone,cursor=0,reset=false){if(reset){cursorHistory=[];pageNumber=1;currentPhone=phone;cursor=0}$('items').textContent='Загрузка…';try{const q=new URLSearchParams({limit:'20'});if(currentPhone)q.set('phone',currentPhone);if(cursor)q.set('cursor',String(cursor));const r=await fetch('/api/clients?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.error||'client_catalog_unavailable');currentCursor=cursor;hasMore=j.has_more===true;nextCursor=hasMore?Number(j.next_cursor):0;if(hasMore&&(!Number.isInteger(nextCursor)||nextCursor<=currentCursor))throw new Error('invalid_paging_cursor');const items=j.items||[];$('items').innerHTML='';for(const c of items){const d=document.createElement('div');d.className='item';d.innerHTML='<div><b>'+esc(c.name||'Клиент')+'</b><div>'+esc(c.phone||'без телефона')+'</div><div class="muted">ID '+esc(c.client_id)+(c.comment?' · '+esc(c.comment):'')+'</div></div><div><a class="action secondary" href="/desktop/client-details.html?client_id='+encodeURIComponent(c.client_id)+'">Открыть карточку</a> <a class="action" href="/desktop/repairs.html?client_id='+encodeURIComponent(c.client_id)+'">Новый ремонт</a></div>';d.querySelectorAll('a').forEach(a=>a.onclick=()=>chooseClient(c.client_id));$('items').appendChild(d)}if(!items.length)$('items').textContent='Клиенты не найдены.';updatePager(items.length)}catch(e){$('items').textContent='Ошибка: '+(e.message||'unknown');$('prevPage').disabled=true;$('nextPage').disabled=true}}$('find').onclick=()=>load($('search').value.trim(),0,true);$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('find').click()}});$('prevPage').onclick=()=>{if(!cursorHistory.length)return;const cursor=cursorHistory.pop();pageNumber=Math.max(1,pageNumber-1);load(currentPhone,cursor,false)};$('nextPage').onclick=()=>{if(!hasMore)return;cursorHistory.push(currentCursor);pageNumber+=1;load(currentPhone,nextCursor,false)};load('',0,true);</script></body></html>
