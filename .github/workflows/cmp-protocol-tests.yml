name: CMP Protocol Tests

on:
  workflow_dispatch:
  push:
    branches:
      - cmp-protocol-v1
  pull_request:
    paths:
      - "Shared/Protocol/**"
      - "Tests/Protocol/**"
      - "Tests/Web/**"
      - "Arduino/**"
      - "Core/**"
      - "firmware/arduino/**"
      - "firmware/esp32/src/**"
      - "firmware/esp32/web/**"
      - ".github/workflows/cmp-protocol-tests.yml"

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S Tests/Protocol -B build/cmp-protocol

      - name: Build
        run: cmake --build build/cmp-protocol --parallel

      - name: Test
        run: ctest --test-dir build/cmp-protocol --output-on-failure

      - name: Audit Arduino JOB parser contracts
        if: always()
        run: node Tests/Protocol/check_arduino_job_parser_contracts.js

      - name: Audit web JavaScript and navigation
        if: always()
        run: node Tests/Web/check_web_assets.js

      - name: Audit shared app shell contracts
        if: always()
        run: node Tests/Web/check_shared_app_shell_contracts.js

      - name: Audit repeat target UI contracts
        if: always()
        run: node Tests/Web/check_repeat_target_ui.js

      - name: Audit motor schema UI contracts
        if: always()
        run: node Tests/Web/check_motor_schema_ui.js

      - name: Audit motor details and repair history contracts
        if: always()
        run: node Tests/Web/check_motor_details_ui.js

      - name: Audit Arduino archive UI contracts
        if: always()
        run: node Tests/Web/check_arduino_archive_ui.js

      - name: Audit release safety contracts
        if: always()
        run: node Tests/Web/check_release_contracts.js

      - name: Audit job cancel recovery contracts
        if: always()
        run: node Tests/Web/check_job_cancel_recovery_contracts.js

      - name: Audit restore mutation interlock contracts
        if: always()
        run: node Tests/Web/check_restore_mutation_interlock.js

      - name: Audit job state atomic replacement contracts
        if: always()
        run: node Tests/Web/check_job_state_atomic_replace.js

      - name: Audit network profile atomic recovery contracts
        if: always()
        run: node Tests/Web/check_network_profile_atomic_recovery.js

      - name: Audit final acceptance contracts
        if: always()
        run: node Tests/Web/check_final_acceptance_contracts.js

      - name: Audit kg-first material contracts
        if: always()
        run: node Tests/Web/check_kg_first_material_contracts.js

      - name: Audit write-off fault contracts
        if: always()
        run: node Tests/Web/check_writeoff_fault_contracts.js

      - name: Audit NDJSON growth diagnostics
        if: always()
        run: node Tests/Web/check_ndjson_growth_diagnostics.js

      - name: Audit Hall calibration safety contracts
        if: always()
        run: node Tests/Web/check_hall_calibration_contracts.js
